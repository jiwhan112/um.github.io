name: React migration verification
on:
  push:
    branches: [migration/react-workspace]
    paths: ['web/**', '.migration/**', '.github/workflows/react-migration-check.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: react-migration-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/react-workspace
      - name: Apply the reviewed source-only link-base correction once
        shell: python
        run: |
          import pathlib,json,subprocess
          patch=pathlib.Path('.migration/link-base.json')
          if patch.exists():
            for edit in json.loads(patch.read_text()):
              assert edit['path']=='web/scripts/content.ts'
              p=pathlib.Path(edit['path']);s=p.read_text();assert s.count(edit['find'])==1
              p.write_text(s.replace(edit['find'],edit['replace']),encoding='utf-8')
            patch.unlink()
            subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
            subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
            subprocess.run(['git','add','web/scripts/content.ts','.migration/link-base.json'],check=True)
            subprocess.run(['git','commit','-m','fix: resolve Markdown resource links relative to their authoring files'],check=True)
            subprocess.run(['git','push','origin','HEAD:migration/react-workspace'],check=True)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact toolchain and build
        working-directory: web
        run: |
          npm ci
          npm run test:unit
          npm run build
          node scripts/check-publication.mjs
          npm audit --audit-level=high
      - name: Retrieve reviewed candidate screenshots once
        if: hashFiles('web/tests/visual.spec.ts-snapshots/*.png') == ''
        uses: actions/download-artifact@v4
        with:
          name: atlas-react-verification
          run-id: 38211899633
          github-token: ${{ github.token }}
          path: /tmp/reviewed-baselines
      - name: Import inspected baselines, never regenerate them in tests
        working-directory: web
        shell: python
        run: |
          import pathlib,json,shutil
          dst=pathlib.Path('tests/visual.spec.ts-snapshots')
          if not dst.exists():
            src=pathlib.Path('/tmp/reviewed-baselines/tmp/react-delivery/visual.spec.ts-snapshots')
            assert len(list(src.glob('*.png')))==12
            shutil.copytree(src,dst)
          p=pathlib.Path('tests/fixtures');p.mkdir(exist_ok=True)
          if not (p/'catalog.json').exists():
            c=json.load(open('public/data/atlas/catalog.json'));a=json.load(open('public/data/atlas/articles.json'))
            assert c['revision']=='bb93d0c3652c', 'Reviewed content changed; review new fixtures explicitly'
            a=[x for x in a if x['date']==c['dates'][0]][:4]
            (p/'catalog.json').write_text(json.dumps(c,ensure_ascii=False,separators=(',',':')))
            (p/'articles.json').write_text(json.dumps(a,ensure_ascii=False,separators=(',',':')))
      - name: Install Chromium and Korean glyph coverage
        working-directory: web
        timeout-minutes: 4
        run: |
          npx playwright install chromium
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends fonts-noto-cjk
      - name: Strict functional, offline PWA and screenshot tests
        working-directory: web
        run: npm run test:e2e
      - name: Commit inspected baselines on staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/tests/fixtures web/tests/visual.spec.ts-snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'test: pin reviewed React desktop and mobile screenshots'
            git push origin HEAD:migration/react-workspace
          fi
      - name: Archive verified source and distribution
        if: always()
        run: |
          mkdir -p /tmp/react-delivery
          git archive --format=tar.gz HEAD > /tmp/react-delivery/react-source.tar.gz
          if [ -d web/dist ]; then tar -czf /tmp/react-delivery/react-dist.tar.gz -C web/dist .; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-react-verification
          path: |
            /tmp/react-delivery
            web/playwright-report
            web/test-results
          retention-days: 5
