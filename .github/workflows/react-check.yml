name: React validation
on:
  pull_request:
    branches: [master]
  push:
    branches: ['maintenance/**', 'feature/**', 'migration/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: react-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate repository, content and production build
        working-directory: web
        run: |
          npm ci
          npm run check:repo
          npm run check:publishing
          npm run test:unit
          npm run build
          node scripts/check-publication.mjs
          npm audit --audit-level=high
      - name: Restore locked browser and OS package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/atlas-apt/*.deb
          key: atlas-browser-${{ runner.os }}-${{ runner.arch }}-ubuntu24-v1-${{ hashFiles('web/package-lock.json', 'web/scripts/install-browser.sh') }}
      - name: Install the fixed browser and font environment
        working-directory: web
        timeout-minutes: 15
        run: bash scripts/install-browser.sh
      - name: Functional, offline and approved screenshot regression gate
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-validation
          path: |
            web/playwright-report
            web/test-results
            web/render-environment
          retention-days: 7
