name: React Pages validation and publication
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/react-pages.yml'
      - 'daily-briefing/data/**'
      - 'language-study/data/catalog.json'
      - 'language-study/data/progress.json'
      - 'automation/**'
      - 'thinking-lab/**'
      - 'game-design/**'
      - 'knowledge/**'
      - 'opensource-lab/**'
      - 'ai-asset-lab/**'
      - '_maintenance/**'
      - 'AGENTS.md'
  workflow_dispatch:
  workflow_run:
    workflows: [Reconcile language lessons]
    types: [completed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: atlas-react-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact dependencies
        working-directory: web
        run: npm ci
      - name: Validate source content and types, then build React
        working-directory: web
        run: |
          npm run check:repo
          npm run check:publishing
          npm run test:unit
          npm run build
          node scripts/check-publication.mjs
          npm audit --audit-level=high
      - name: Restore locked browser and OS package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            /tmp/atlas-apt/*.deb
          key: atlas-browser-${{ runner.os }}-${{ runner.arch }}-ubuntu24-v1-${{ hashFiles('web/package-lock.json', 'web/scripts/install-browser.sh') }}
      - name: Restore the reviewed Chromium and font environment
        working-directory: web
        timeout-minutes: 22
        run: bash scripts/install-browser.sh
      - name: Regression gate (never update snapshots automatically)
        working-directory: web
        run: npm run test:e2e
      - name: Preserve focused thinking prototype diagrams
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thinking-first-prototype-visuals
          path: web/test-results/**/thinking-1-1-diagram-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve paired thinking worked diagrams
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thinking-pairs-visuals
          path: |
            web/test-results/**/thinking-pair-diagram-*.png
            web/test-results/**/thinking-pair-page-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve compact regression diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-regression-diagnostics
          path: |
            web/test-results/results.json
            web/test-results/**/error-context.md
            web/test-results/**/paired-error-state.json
            web/test-results/visual-visual-problem-*/problem-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Package tested distribution
        run: tar -czf /tmp/atlas-react-dist.tar.gz -C web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: tested-react-distribution
          path: /tmp/atlas-react-dist.tar.gz
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-regression-report
          path: |
            web/playwright-report
            web/test-results
            web/render-environment
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: tested-react-distribution
          path: /tmp/atlas-react-tested
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Extract only the distribution from the successful build job
        run: |
          mkdir -p web/dist
          tar -xzf /tmp/atlas-react-tested/atlas-react-dist.tar.gz -C web/dist
      - name: Restore locked browser and OS package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            /tmp/atlas-apt/*.deb
          key: atlas-browser-${{ runner.os }}-${{ runner.arch }}-ubuntu24-v1-${{ hashFiles('web/package-lock.json', 'web/scripts/install-browser.sh') }}
      - name: Install live-check browser
        working-directory: web
        timeout-minutes: 22
        run: |
          npm ci
          bash scripts/install-browser.sh
      - name: Publish to the existing master-root Pages source
        id: publish
        working-directory: web
        run: node scripts/publish.mjs
      - name: Request Pages build explicitly (bot commits do not trigger push workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${GITHUB_REPOSITORY}/pages/builds > /tmp/pages-request.json
          cat /tmp/pages-request.json
      - name: Verify the published React app on the real Pages URL
        working-directory: web
        env:
          EXPECTED_SOURCE: ${{ needs.build.outputs.source }}
        run: node scripts/live-smoke.mjs
      - name: Verify public game-design image URLs, media types and SHA-256
        working-directory: web
        run: node scripts/check-game-design-live-assets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-live-verification
          path: |
            web/live-check
            web/render-environment
            /tmp/pages-request.json
          retention-days: 7
