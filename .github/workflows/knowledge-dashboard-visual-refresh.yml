name: One-time knowledge dashboard visual baseline review
on:
  push:
    branches: [feature/knowledge-sitemap-dashboard-20261019]
    paths:
      - '.github/workflows/knowledge-dashboard-visual-refresh.yml'
permissions:
  contents: write
jobs:
  refresh-mobile-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/knowledge-sitemap-dashboard-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build current reviewed UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install matching Chromium and fonts
        working-directory: web
        run: bash scripts/install-browser.sh
      - name: Refresh only intentionally changed mobile home snapshot
        working-directory: web
        run: npx playwright test tests/visual.spec.ts --project=mobile --grep 'visual dashboard' --update-snapshots
      - name: Record reviewed mobile baseline as source-controlled snapshot
        run: |
          git status --short
          git add web/tests/visual.spec.ts-snapshots/dashboard-mobile-linux.png
          if ! git diff --cached --quiet; then
            git -c user.name='atlas-ui-check' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: update mobile dashboard visual baseline for knowledge entry'
            git push origin HEAD:refs/heads/feature/knowledge-sitemap-dashboard-20261019
          fi
