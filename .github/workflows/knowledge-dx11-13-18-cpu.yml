name: Knowledge DX11 13-18 CPU lab validation
on:
  pull_request:
    branches: [master]
    paths:
      - 'knowledge/dx11-frustum/CMakeLists.txt'
      - 'knowledge/shared/dx11-13/**'
      - 'knowledge/shared/dx11-13b/**'
      - 'knowledge/shared/dx11-14/**'
      - 'knowledge/shared/dx11-16/**'
      - 'knowledge/shared/dx11-17/**'
      - 'knowledge/shared/dx11-18/**'
      - '.github/workflows/knowledge-dx11-13-18-cpu.yml'
  push:
    branches: [master, 'feature/dx11-*']
    paths:
      - 'knowledge/dx11-frustum/CMakeLists.txt'
      - 'knowledge/shared/dx11-13/**'
      - 'knowledge/shared/dx11-13b/**'
      - 'knowledge/shared/dx11-14/**'
      - 'knowledge/shared/dx11-16/**'
      - 'knowledge/shared/dx11-17/**'
      - 'knowledge/shared/dx11-18/**'
      - '.github/workflows/knowledge-dx11-13-18-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowledge-dx11-13-18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc20
            compiler: g++
            cpp_standard: 20
            flags: ''
          - id: gcc11
            compiler: g++
            cpp_standard: 11
            flags: ''
          - id: clangsan
            compiler: clang++
            cpp_standard: 20
            flags: '-fsanitize=address,undefined -fno-omit-frame-pointer'
    steps:
      - uses: actions/checkout@v4
      - name: Check current 13A instancing source byte identity
        shell: bash
        run: |
          echo 'ef9b0cfe2e764adc896a45451f5607fd751ab0c8b523e6477339994ba758a4b8  knowledge/shared/dx11-13/main.cpp' | sha256sum -c -
          wc -c knowledge/shared/dx11-13/main.cpp

      - name: Configure, build and execute seven CPU labs including existing Frustum
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          for lab in dx11-13 dx11-13b dx11-14 dx11-15 dx11-16 dx11-17 dx11-18; do
            build="/tmp/atlas-${{ matrix.id }}-${lab}"
            echo "::group::${lab} ${{ matrix.id }}"
            source="knowledge/shared/${lab}"
            if [ "${lab}" = "dx11-15" ]; then source="knowledge/dx11-frustum"; fi
            cmake -S "${source}" -B "${build}" -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" -DLAB_CXX_STANDARD="${{ matrix.cpp_standard }}" -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DCMAKE_BUILD_TYPE=Debug
            cmake --build "${build}" --parallel 2
            ctest --test-dir "${build}" -V --output-on-failure
            echo "::endgroup::"
          done
      - name: Save entire original GitHub Actions runner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dx11-13-18-${{ matrix.id }}-metadata
          path: knowledge/shared/DX11_13_18_NATIVE_LEDGER_20261020.md
          retention-days: 14
