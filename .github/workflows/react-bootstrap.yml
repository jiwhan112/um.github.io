name: React migration bootstrap
on:
  push:
    branches: [migration/react-workspace]
    paths: [.github/workflows/react-bootstrap.yml]
permissions:
  contents: read
  pages: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot authoring sources
        run: git archive --format=tar.gz HEAD > /tmp/atlas-source.tar.gz
      - name: Resolve and pin React toolchain
        run: |
          mkdir -p web
          cd web
          npm init -y
          npm pkg set type=module private=true name=atlas-note
          npm install --save-exact react@19 react-dom@19 react-router-dom@7 @radix-ui/react-tabs @radix-ui/react-dialog @radix-ui/react-slot class-variance-authority clsx tailwind-merge lucide-react zod
          npm install --save-dev --save-exact typescript@5 vite@7 @vitejs/plugin-react@5 tailwindcss@4 @tailwindcss/vite@4 @types/react@19 @types/react-dom@19 @types/node@22 @playwright/test cheerio marked tsx
          npm ls --depth=0 > dependency-versions.txt
          npm audit --json > npm-audit.json || true
          tar -czf /tmp/atlas-toolchain.tar.gz node_modules package.json package-lock.json dependency-versions.txt npm-audit.json
      - name: Read deployment configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages --jq '{build_type,source,html_url}' > /tmp/pages-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-migration-toolchain
          path: |
            /tmp/atlas-toolchain.tar.gz
            /tmp/atlas-source.tar.gz
            /tmp/pages-info.json
          retention-days: 2
