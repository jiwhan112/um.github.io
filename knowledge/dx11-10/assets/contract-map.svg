<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">시간 샘플링과 부모 회전을 순서대로 추적한다</title><desc id="d">상단은 10 ticks 기간에서 1.5초가 tick 5로 반복되는 경로, 하단은 부모 90도 회전이 자식 이동에도 적용되는 독립 사례입니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">시간 샘플링과 부모 회전을 순서대로 추적한다</text><rect x="25" y="85" width="270" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="115" font-size="18" fill="#e2e8f0">1.5초 × 10 ticks/s</text><text x="39" y="142" font-size="18" fill="#e2e8f0">15 ticks</text><text x="39" y="169" font-size="18" fill="#e2e8f0">기간 = 10 ticks</text><path d="M295 135H345" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="345" y="85" width="270" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="359" y="115" font-size="18" fill="#e2e8f0">fmod(15,10)=5</text><text x="359" y="142" font-size="18" fill="#e2e8f0">키 구간 [0,10]</text><text x="359" y="169" font-size="18" fill="#e2e8f0">보간 비율 = .5</text><path d="M615 135H665" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="665" y="85" width="270" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="679" y="115" font-size="18" fill="#e2e8f0">위치 x = 5</text><text x="679" y="142" font-size="18" fill="#e2e8f0">회전은 slerp</text><text x="679" y="169" font-size="18" fill="#e2e8f0">GPU palette 아님</text><rect x="25" y="275" width="400" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="305" font-size="18" fill="#e2e8f0">부모 위치 (10,0,0)</text><text x="39" y="332" font-size="18" fill="#e2e8f0">부모 Z 회전 +90도</text><text x="39" y="359" font-size="18" fill="#e2e8f0">자식 로컬 이동 (1,0,0)</text><path d="M425 330H485" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="485" y="275" width="450" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="499" y="305" font-size="18" fill="#e2e8f0">자식 이동 회전 → (0,1,0)</text><text x="499" y="332" font-size="18" fill="#e2e8f0">부모 위치 더하기 → (10,1,0)</text><text x="499" y="359" font-size="18" fill="#e2e8f0">단순 위치 더하기만 하면 잘못됨</text></g></svg>
