<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>05A 회귀: 음수 잔여 시간</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">05A 회귀: 음수 잔여 시간</text><rect x="40" y="110" width="260" height="90" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="54" y="140" font-size="18" fill="#e2e8f0"><tspan x="54" dy="0">accumulator = st</tspan><tspan x="54" dy="27">ep − 5e−13</tspan></text><rect x="350" y="110" width="260" height="90" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="364" y="140" font-size="18" fill="#e2e8f0"><tspan x="364" dy="0">오차 허용으로 Tick 1회</tspan></text><rect x="660" y="110" width="260" height="90" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="674" y="140" font-size="18" fill="#e2e8f0"><tspan x="674" dy="0">max(0, accumulat</tspan><tspan x="674" dy="27">or−step)</tspan></text><path d="M300 155 L340 155" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M610 155 L650 155" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="60" y="310" font-size="22" fill="#e2e8f0">실패 원인 → 기존 동작의 문제 → 수정본의 입력/상태 계약</text><text x="60" y="380" font-size="21" fill="#e2e8f0">원본 코드·수정 기록·과거 검증 로그는 아래 자료실에 보존</text></g></svg>
