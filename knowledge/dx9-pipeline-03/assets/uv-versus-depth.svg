<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">같은 λ라도 UV와 깊이의 보간식은 다르다</title><desc id="desc">UV에는1/w를 사용하는 원근 보정, 기본 z-buffer 깊이에는 이미 나눈z/w의 화면 선형 보간을 적용하는 두 독립 경로입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="400" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">같은 λ라도 UV와 깊이의 보간식은 다르다</text><rect x="30" y="90" width="280" height="145" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="118" font-size="19" fill="#67e8f9">같은 화면 가중치</text><text x="44" y="143" font-size="17" fill="#e2e8f0">λ = (.5, .25, .25)</text><text x="44" y="168" font-size="17" fill="#e2e8f0">UV = (0,0),(1,0),(0,1)</text><text x="44" y="193" font-size="17" fill="#e2e8f0">w = (1,2,4)</text><path d="M310 130H365" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="365" y="75" width="560" height="95" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="379" y="103" font-size="19" fill="#67e8f9">UV: 원근 보정</text><text x="379" y="128" font-size="17" fill="#e2e8f0">Σ(λ·UV/w) ÷ Σ(λ/w) = (2/11, 1/11)</text><path d="M310 195H365" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="365" y="205" width="560" height="95" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="379" y="233" font-size="19" fill="#67e8f9">이미 나눈 깊이: 화면 선형</text><text x="379" y="258" font-size="17" fill="#e2e8f0">Σ(λ·z/w) = .5×.2 + .25×.6 + .25×.9 = .475</text><text x="30" y="360" font-size="17" fill="#e2e8f0">UV를 그냥 선형 보간하면 (.25,.25). 깊이에 UV용 분수를 다시 적용하지 않습니다.</text></g></svg>
