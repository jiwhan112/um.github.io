<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">공유 경계의 샘플은 한 번만 칠한다</title><desc id="desc">0..4 사각형에서 x,y가0..3인 정수 중심16개가 포함됩니다. 색 있는 점은 합집합이며 대각선 소속은 한쪽에만 배정합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="440" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">공유 경계의 샘플은 한 번만 칠한다</text><path d="M90 100H370V380H90Z" fill="#164e63" stroke="#94a3b8"/><path d="M90 100L370 380" stroke="#fbbf24" stroke-width="3"/><circle cx="90" cy="100" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="160" cy="100" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="230" cy="100" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="300" cy="100" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="370" cy="100" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="90" cy="170" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="160" cy="170" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="230" cy="170" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="300" cy="170" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="370" cy="170" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="90" cy="240" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="160" cy="240" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="230" cy="240" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="300" cy="240" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="370" cy="240" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="90" cy="310" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="160" cy="310" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="230" cy="310" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="300" cy="310" r="7" fill="#67e8f9" stroke="#cbd5e1"/><circle cx="370" cy="310" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="90" cy="380" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="160" cy="380" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="230" cy="380" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="300" cy="380" r="7" fill="#0f172a" stroke="#cbd5e1"/><circle cx="370" cy="380" r="7" fill="#0f172a" stroke="#cbd5e1"/><text x="75" y="84" font-size="15" fill="#e2e8f0">(0,0)</text><text x="340" y="410" font-size="15" fill="#e2e8f0">(4,4)</text><rect x="440" y="100" width="480" height="115" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="454" y="128" font-size="19" fill="#67e8f9">정수 중심 16개만 포함</text><text x="454" y="153" font-size="17" fill="#e2e8f0">오른쪽·아래쪽 끝 경계 제외</text><text x="454" y="178" font-size="17" fill="#e2e8f0">공유 대각선도 한 삼각형만 소유</text><rect x="440" y="250" width="480" height="105" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="454" y="278" font-size="19" fill="#67e8f9">삼각형 방향 정규화 ≠ 후면 컬링</text><text x="454" y="303" font-size="17" fill="#e2e8f0">Covers는 부호를 맞춰 포함 여부 계산</text><text x="454" y="328" font-size="17" fill="#e2e8f0">실제 컬링 상태를 구현한 함수가 아님</text></g></svg>
