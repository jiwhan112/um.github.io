<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">PMR 실습: 한정된 자원에서 실패 재현</title><desc id="desc">실제 시스템 OOM·vector의 정확한 소비량·성능을 측정한 실험이 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">PMR 실습: 한정된 자원에서 실패 재현</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">고정 arena</text><text x="46" y="145" fill="#f8fafc" font-size="17">1024바이트</text><text x="46" y="179" fill="#cbd5e1" font-size="15">resource보다 오래 생존</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">monotonic resource</text><text x="356" y="145" fill="#f8fafc" font-size="17">upstream = null 자원</text><text x="356" y="179" fill="#cbd5e1" font-size="15">vector가 먼저 파괴됨</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">4096바이트 요청</text><text x="666" y="145" fill="#f8fafc" font-size="17">처음부터 arena보다 큼</text><text x="666" y="179" fill="#cbd5e1" font-size="15">bad_alloc 관찰</text><text x="30" y="255" fill="#cbd5e1" font-size="17">실제 시스템 OOM·vector의 정확한 소비량·성능을 측정한 실험이 아닙니다.</text></g></svg>
