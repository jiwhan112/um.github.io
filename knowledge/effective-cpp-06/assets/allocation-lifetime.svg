<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">공간 확보 후 생성 결과에 따라 정리 경로가 갈린다</title><desc id="desc">Pool::Allocate 후 생성자가 실패하면 matching placement delete로 공간을 반환한다. 생성에 성공하면 owner가 사용하고 custom deleter가 destroy_at 후 Free를 호출한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="420" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">공간 확보 후 생성 결과에 따라 정리 경로가 갈린다</text><rect x="30" y="155" width="230" height="100" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="185" font-size="18" fill="#67e8f9">Pool::Allocate</text><text x="46" y="213" font-size="16" fill="#e2e8f0">공간 확보 성공</text><path d="M260 205H310" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="310" y="155" width="230" height="100" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="326" y="185" font-size="18" fill="#67e8f9">Widget 생성자</text><text x="326" y="213" font-size="16" fill="#e2e8f0">객체 구성 시도</text><path d="M540 205H575V105H620" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><text x="562" y="85" font-size="15" fill="#e2e8f0">예외</text><rect x="620" y="60" width="310" height="110" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="636" y="90" font-size="18" fill="#67e8f9">matching placement delete</text><text x="636" y="118" font-size="16" fill="#e2e8f0">공간 반환 후 예외 전파</text><text x="636" y="146" font-size="16" fill="#e2e8f0">Widget 소멸자는 호출 안 됨</text><path d="M540 205H575V295H620" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="335" font-size="15" fill="#e2e8f0">성공</text><rect x="620" y="220" width="310" height="140" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="636" y="250" font-size="18" fill="#67e8f9">unique_ptr owner → 사용</text><text x="636" y="278" font-size="16" fill="#e2e8f0">custom deleter 실행</text><text x="636" y="306" font-size="16" fill="#e2e8f0">destroy_at → Pool::Free</text><text x="636" y="334" font-size="16" fill="#e2e8f0">Pool은 owner보다 오래 생존</text><text x="30" y="390" font-size="17" fill="#e2e8f0">실패 시 대응 delete와 정상 수명 종료 시 deleter는 서로 다른 정리 경로입니다.</text></g></svg>
