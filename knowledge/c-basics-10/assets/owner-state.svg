<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">소유자 하나가 수명과 유효 길이를 관리한다</title><desc id="desc">capacity는 저장 가능한 개수, count는 초기화하여 사용할 수 있는 개수입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">소유자 하나가 수명과 유효 길이를 관리한다</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">빈 상태</text><text x="46" y="145" fill="#f8fafc" font-size="17">data = NULL</text><text x="46" y="179" fill="#cbd5e1" font-size="15">count = 0, capacity = 0</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">할당 상태</text><text x="356" y="145" fill="#f8fafc" font-size="17">data → 저장 공간</text><text x="356" y="179" fill="#cbd5e1" font-size="15">0 ≤ count ≤ capacity</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">해제 후</text><text x="666" y="145" fill="#f8fafc" font-size="17">free(data), 소유자 초기화</text><text x="666" y="179" fill="#cbd5e1" font-size="15">별칭의 수명도 끝남</text><text x="30" y="255" fill="#cbd5e1" font-size="17">capacity는 저장 가능한 개수, count는 초기화하여 사용할 수 있는 개수입니다.</text></g></svg>
