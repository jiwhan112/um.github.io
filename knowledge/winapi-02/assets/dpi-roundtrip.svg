<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">좌표 변환 · 출력과 입력은 서로 역방향</title><desc id="desc">데모의 y 아래쪽 논리 좌표와 Camera2D의 y 위쪽 월드를 혼합하지 않는다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">좌표 변환 · 출력과 입력은 서로 역방향</text><rect x="30" y="110" width="330" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="140" font-size="20" fill="#64d8cb">App 논리 좌표</text><text x="46" y="170" font-size="18" fill="#e5edf7">DPI 144 예: (100, 80)</text><text x="46" y="200" font-size="18" fill="#e5edf7">클라이언트 좌표 기준</text><rect x="600" y="110" width="330" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="616" y="140" font-size="20" fill="#64d8cb">클라이언트 픽셀</text><text x="616" y="170" font-size="18" fill="#e5edf7">DPI/96 = 1.5</text><text x="616" y="200" font-size="18" fill="#e5edf7">표시 위치: (150, 120)</text><path d="M360 145 H593" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="395" y="126" font-size="16" fill="#f5c36b">그리기: × 1.5</text><path d="M600 225 H367" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="395" y="210" font-size="16" fill="#f5c36b">클릭: ÷ 1.5</text><text x="35" y="320" font-size="19" fill="#e5edf7">화면 좌표를 받았다면 먼저 ScreenToClient 등으로 기준을 맞춘다.</text><text x="35" y="365" font-size="18" fill="#e5edf7">픽셀 반올림이 있어 정수 화면 좌표의 왕복은 완전한 실수 역함수가 아니다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">데모의 y 아래쪽 논리 좌표와 Camera2D의 y 위쪽 월드를 혼합하지 않는다.</text></g></svg>
