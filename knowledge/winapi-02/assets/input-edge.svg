<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">눌린 상태와 한 번의 에지를 따로 보관</title><desc id="desc">업데이트가 없는 프레임에서도 pressed를 다음 업데이트까지 유지한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">눌린 상태와 한 번의 에지를 따로 보관</text><rect x="30" y="90" width="280" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="120" font-size="20" fill="#64d8cb">Key(down=true)</text><text x="46" y="150" font-size="18" fill="#e5edf7">held가 false였는가?</text><text x="46" y="180" font-size="18" fill="#e5edf7">새 에지일 때 pressed=true</text><rect x="345" y="90" width="280" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="120" font-size="20" fill="#64d8cb">Update에서 소비</text><text x="361" y="150" font-size="18" fill="#e5edf7">ConsumePressed → 값 반환</text><text x="361" y="180" font-size="18" fill="#e5edf7">pressed=false로 변경</text><rect x="660" y="90" width="270" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="120" font-size="20" fill="#64d8cb">계속 누르는 이동</text><text x="676" y="150" font-size="18" fill="#e5edf7">held는 true 유지</text><text x="676" y="180" font-size="18" fill="#e5edf7">key-up이면 held=false</text><path d="M310 150 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="270" font-size="20" fill="#e5edf7">반복 key-down: held=true이면 새 pressed를 만들지 않음</text><text x="35" y="315" font-size="20" fill="#e5edf7">포커스 상실: held와 pressed를 함께 Clear</text><text x="35" y="360" font-size="18" fill="#e5edf7">bool 에지는 여러 번의 빠른 누름을 횟수별로 저장하지 못함</text><text x="30" y="428" font-size="17" fill="#bdcde2">업데이트가 없는 프레임에서도 pressed를 다음 업데이트까지 유지한다.</text></g></svg>
