<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">메시 공유와 인스턴스 변환을 따로 보관한다</title><desc id="d">root와 child가 Mesh 0을 함께 참조하며 Material 2도 공유합니다. 정점 원본은 변하지 않고 각 Draw의 원점만 달라집니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">메시 공유와 인스턴스 변환을 따로 보관한다</text><rect x="25" y="90" width="260" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="120" font-size="18" fill="#e2e8f0">root: (10,0,0)</text><text x="39" y="147" font-size="18" fill="#e2e8f0">mesh index = 0</text><text x="39" y="174" font-size="18" fill="#e2e8f0">draw origin=(10,0,0)</text><rect x="25" y="270" width="260" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="300" font-size="18" fill="#e2e8f0">child local=(0,5,0)</text><text x="39" y="327" font-size="18" fill="#e2e8f0">mesh index = 0</text><text x="39" y="354" font-size="18" fill="#e2e8f0">draw origin=(10,5,0)</text><path d="M285 140L365 220" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><path d="M285 320L365 250" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="365" y="175" width="250" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="379" y="205" font-size="18" fill="#e2e8f0">Mesh 0 (공유)</text><text x="379" y="232" font-size="18" fill="#e2e8f0">원본 정점 유지</text><text x="379" y="259" font-size="18" fill="#e2e8f0">material index = 2</text><path d="M615 230H670" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="670" y="175" width="265" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="684" y="205" font-size="18" fill="#e2e8f0">Material 2 (wood)</text><text x="684" y="232" font-size="18" fill="#e2e8f0">Mesh 번호와 별개</text><text x="684" y="259" font-size="18" fill="#e2e8f0">두 Draw가 같은 재질</text></g></svg>
