<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">이름의 범위 ≠ 객체의 생존 시간</title><desc id="desc">중첩 블록과 정적 지역 객체를 함께 비교한다.</desc><rect width="960" height="440" rx="22" fill="#101c2c"/><g font-family="sans-serif"><text x="34" y="54" font-size="30" font-weight="700" fill="#f0f6ff">이름의 범위 ≠ 객체의 생존 시간</text><text x="34" y="90" font-size="20" fill="#c9d8e9">중첩 블록과 정적 지역 객체를 함께 비교한다.</text><rect x="32" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="52" y="172" font-size="26" font-weight="700" fill="#7dd3fc">바깥 블록</text><text x="52" y="219" font-size="21" fill="#f1f6fe">outer = 5</text><text x="52" y="256" font-size="21" fill="#f1f6fe">inside 이름 불가</text><path d="M 310 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="344" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="364" y="172" font-size="26" font-weight="700" fill="#7dd3fc">안쪽 블록</text><text x="364" y="219" font-size="21" fill="#f1f6fe">outer 사용 가능</text><text x="364" y="256" font-size="21" fill="#f1f6fe">inside = 6</text><path d="M 622 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="656" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="676" y="172" font-size="26" font-weight="700" fill="#7dd3fc">정적 지역</text><text x="676" y="219" font-size="21" fill="#f1f6fe">issued 한 개</text><text x="676" y="256" font-size="21" fill="#f1f6fe">호출 간 값 유지</text><text x="34" y="407" font-size="20" fill="#fbbf24">이름의 가시성과 객체의 저장 기간을 나눠 판단한다.</text></g></svg>
