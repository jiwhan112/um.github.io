<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">함수 호출과 반환</title><desc id="desc">정수 값 전달은 호출자 변수와 매개변수를 구분한다.</desc><rect width="960" height="440" rx="22" fill="#101c2c"/><g font-family="sans-serif"><text x="34" y="54" font-size="30" font-weight="700" fill="#f0f6ff">함수 호출과 반환</text><text x="34" y="90" font-size="20" fill="#c9d8e9">정수 값 전달은 호출자 변수와 매개변수를 구분한다.</text><rect x="32" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="52" y="172" font-size="26" font-weight="700" fill="#7dd3fc">호출자</text><text x="52" y="219" font-size="21" fill="#f1f6fe">original = 120</text><text x="52" y="256" font-size="21" fill="#f1f6fe">값 전달</text><path d="M 310 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="344" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="364" y="172" font-size="26" font-weight="700" fill="#7dd3fc">매개변수</text><text x="364" y="219" font-size="21" fill="#f1f6fe">value = 120</text><text x="364" y="256" font-size="21" fill="#f1f6fe">0 ~ 100 범위 제한</text><path d="M 622 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="656" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="676" y="172" font-size="26" font-weight="700" fill="#7dd3fc">반환 후</text><text x="676" y="219" font-size="21" fill="#f1f6fe">clamped = 100</text><text x="676" y="256" font-size="21" fill="#f1f6fe">original은 120</text><text x="34" y="407" font-size="20" fill="#fbbf24">인자의 정수 값이 복사되는 예시이며 포인터·배열 전달은 다르다.</text></g></svg>
