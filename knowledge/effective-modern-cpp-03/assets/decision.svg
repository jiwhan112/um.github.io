<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">표현을 고를 때 분리할 책임</title><desc id="desc">소유권 그래프와 약한 관찰자: unique_ptr / 단독 책임 / 이동으로 소유자 변경; shared_ptr / 공동 생존 책임 / 마지막 강한 소유자 종료; weak_ptr / 수명 연장 없는 관찰 / lock 성공 때만 임시 보유</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76c7b7"/></marker></defs><rect width="960" height="440" fill="#0c1420"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="36" y="49" fill="#eaf1ff" font-size="28" font-weight="700">03 · 표현을 고를 때 분리할 책임</text><rect x="30" y="98" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="132" fill="#76c7b7" font-size="24">unique_ptr</text><text x="300" y="132" fill="#eaf1ff" font-size="23">단독 책임</text><text x="300" y="165" fill="#b9c9df" font-size="21">이동으로 소유자 변경</text><rect x="30" y="202" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="236" fill="#76c7b7" font-size="24">shared_ptr</text><text x="300" y="236" fill="#eaf1ff" font-size="23">공동 생존 책임</text><text x="300" y="269" fill="#b9c9df" font-size="21">마지막 강한 소유자 종료</text><rect x="30" y="306" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="340" fill="#76c7b7" font-size="24">weak_ptr</text><text x="300" y="340" fill="#eaf1ff" font-size="23">수명 연장 없는 관찰</text><text x="300" y="373" fill="#b9c9df" font-size="21">lock 성공 때만 임시 보유</text></g></svg>