<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">표현을 고를 때 분리할 책임</title><desc id="desc">이동은 호출 계약이고 forward는 보존이다: std::move(x) / 소비 가능 표현으로 변환 / const는 제거하지 않음; std::forward&lt;T&gt;(x) / 추론한 입력 범주 보존 / 래퍼의 T와 연결 필요; Packet&amp;&amp; x / 선언 타입 / 이름 x 표현식은 lvalue</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76c7b7"/></marker></defs><rect width="960" height="440" fill="#0c1420"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="36" y="49" fill="#eaf1ff" font-size="28" font-weight="700">04 · 표현을 고를 때 분리할 책임</text><rect x="30" y="98" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="132" fill="#76c7b7" font-size="24">std::move(x)</text><text x="300" y="132" fill="#eaf1ff" font-size="23">소비 가능 표현으로 변환</text><text x="300" y="165" fill="#b9c9df" font-size="21">const는 제거하지 않음</text><rect x="30" y="202" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="236" fill="#76c7b7" font-size="24">std::forward&lt;T&gt;(x)</text><text x="300" y="236" fill="#eaf1ff" font-size="23">추론한 입력 범주 보존</text><text x="300" y="269" fill="#b9c9df" font-size="21">래퍼의 T와 연결 필요</text><rect x="30" y="306" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="340" fill="#76c7b7" font-size="24">Packet&amp;&amp; x</text><text x="300" y="340" fill="#eaf1ff" font-size="23">선언 타입</text><text x="300" y="373" fill="#b9c9df" font-size="21">이름 x 표현식은 lvalue</text></g></svg>