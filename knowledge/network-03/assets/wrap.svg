<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><title>16비트 번호는 65535 다음 0으로 감긴다</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="1000" height="460" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="35" y="45" font-size="27" fill="#e2e8f0">16비트 번호는 65535 다음 0으로 감긴다</text><circle cx="260" cy="250" r="130" fill="none" stroke="#38bdf8" stroke-width="4"/><text x="220" y="105" font-size="24" fill="#e2e8f0">0</text><text x="155" y="420" font-size="23" fill="#fca5a5">32768: 반바퀴</text><text x="72" y="157" font-size="21" fill="#e2e8f0">65535</text><path d="M145 140 L220 112" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="445" y="150" font-size="24" fill="#e2e8f0">last=65535 → candidate=0</text><text x="445" y="200" font-size="25" fill="#7dd3fc">delta=1: newer</text><text x="445" y="270" font-size="23" fill="#e2e8f0">delta=0: same</text><text x="445" y="315" font-size="23" fill="#fca5a5">delta=32768: ambiguous</text><text x="445" y="365" font-size="21" fill="#e2e8f0">그 외: 반범위 전제에서 old/new</text><text x="40" y="455" font-size="21" fill="#e2e8f0">순서번호는 인증·세션·재전송 기능이 아니다.</text></g></svg>
