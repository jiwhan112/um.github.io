<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><title>앱 데이터그램의 필드와 바이트 경계</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="1000" height="460" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="35" y="45" font-size="27" fill="#e2e8f0">앱 데이터그램의 필드와 바이트 경계</text><rect x="40" y="120" width="180" height="75" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="48" y="150" font-size="18" fill="#e2e8f0">seq16: 2 B</text><rect x="220" y="120" width="180" height="75" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="228" y="150" font-size="18" fill="#e2e8f0">length16: 2 B</text><rect x="400" y="120" width="140" height="75" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="408" y="150" font-size="18" fill="#e2e8f0">type8: 1 B</text><rect x="540" y="120" width="420" height="75" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="548" y="150" font-size="18" fill="#e2e8f0">payload: 0..1200 B</text><text x="45" y="240" font-size="25" fill="#e2e8f0">예: 12 34 | 00 02 | 02 | 00 FF</text><path d="M500 260 L500 310" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="330" width="640" height="60" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="188" y="360" font-size="18" fill="#e2e8f0">총 7 B = 앱 헤더 5 B + payload 2 B</text><text x="45" y="430" font-size="20" fill="#e2e8f0">UDP 자체 헤더는 여기에 포함하지 않는다. 선언 길이와 실제 길이를 먼저 비교.</text></g></svg>
