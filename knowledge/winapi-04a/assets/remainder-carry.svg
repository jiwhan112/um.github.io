<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">6ns 다음에 7ns · 프레임을 넘는 누적</title><desc id="desc">step=10ns인 CPU 모델이다. 실제 QPC 단위나 모니터 주사율을 뜻하지 않는다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">6ns 다음에 7ns · 프레임을 넘는 누적</text><rect x="30" y="115" width="270" height="135" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="145" font-size="20" fill="#64d8cb">첫 tick(6)</text><text x="46" y="175" font-size="18" fill="#e5edf7">업데이트 0회</text><text x="46" y="205" font-size="18" fill="#e5edf7">pending=6, alpha=0.6</text><rect x="345" y="115" width="270" height="135" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="145" font-size="20" fill="#64d8cb">다음 tick(7)</text><text x="361" y="175" font-size="18" fill="#e5edf7">available = 6 + 7 = 13</text><text x="361" y="205" font-size="18" fill="#e5edf7">고정 step 10을 1회 소비</text><rect x="660" y="115" width="270" height="135" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="145" font-size="20" fill="#64d8cb">결과</text><text x="676" y="175" font-size="18" fill="#e5edf7">업데이트 1회 · 드롭 0</text><text x="676" y="205" font-size="18" fill="#e5edf7">pending=3, alpha=0.3</text><path d="M300 180 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 180 H653" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="325" font-size="19" fill="#e5edf7">alpha를 계산한 것과 이전·현재 상태 보간 렌더링을 구현한 것은 다르다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">step=10ns인 CPU 모델이다. 실제 QPC 단위나 모니터 주사율을 뜻하지 않는다.</text></g></svg>
