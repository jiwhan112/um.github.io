<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">55ns 입력을 어디에 사용하고 버리는가</title><desc id="desc">step=10ns, clamp=30ns, budget=2, 이전 나머지=0인 정확한 정수 예다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">55ns 입력을 어디에 사용하고 버리는가</text><rect x="30" y="105" width="270" height="145" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="135" font-size="20" fill="#64d8cb">입력 55ns</text><text x="46" y="165" font-size="18" fill="#e5edf7">허용 30ns</text><text x="46" y="195" font-size="18" fill="#e5edf7">클램프에서 25ns 버림</text><rect x="345" y="105" width="270" height="145" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="135" font-size="20" fill="#64d8cb">2회 Update</text><text x="361" y="165" font-size="18" fill="#e5edf7">2 × 10ns = 20ns 소비</text><text x="361" y="195" font-size="18" fill="#e5edf7">남은 10ns는 예산 초과</text><rect x="660" y="105" width="270" height="145" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="135" font-size="20" fill="#64d8cb">결과</text><text x="676" y="165" font-size="18" fill="#e5edf7">35ns 드롭 · 나머지 0</text><text x="676" y="195" font-size="18" fill="#e5edf7">alpha = 0 / 10 = 0</text><path d="M300 175 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 175 H653" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="320" font-size="19" fill="#e5edf7">보존식: 이전 나머지 + 입력 = 소비 시간 + 버린 시간 + 새 나머지</text><text x="35" y="365" font-size="22" fill="#f5c36b">0 + 55 = 20 + (25 + 10) + 0</text><text x="30" y="428" font-size="17" fill="#bdcde2">step=10ns, clamp=30ns, budget=2, 이전 나머지=0인 정확한 정수 예다.</text></g></svg>
