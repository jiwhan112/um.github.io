<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>두 잠금의 수명과 잔액 변경의 경계를 맞춘다</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#67e8f9"/></marker></defs><rect width="1000" height="540" rx="20" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e2e8f0"><text x="30" y="46" font-size="26">두 잠금의 수명과 잔액 변경의 경계를 맞춘다</text><rect x="30" y="115" width="210" height="100" rx="12" fill="#162538" stroke="#64748b"/><text x="46" y="150" font-size="21">defer_lock × 2</text><rect x="275" y="115" width="200" height="100" rx="12" fill="#162538" stroke="#64748b"/><text x="291" y="150" font-size="21">std::lock</text><rect x="510" y="115" width="220" height="100" rx="12" fill="#162538" stroke="#64748b"/><text x="526" y="150" font-size="21">잔액 읽기·이동</text><rect x="765" y="115" width="205" height="100" rx="12" fill="#162538" stroke="#64748b"/><text x="781" y="150" font-size="21">스코프 종료</text><path d="M242 165 L270 165" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M477 165 L505 165" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M732 165 L760 165" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="47" y="260" font-size="19">아직 잠금 없음</text><text x="290" y="260" font-size="19">두 잠금 취득</text><text x="523" y="260" font-size="19">둘 다 소유 중</text><text x="783" y="260" font-size="19">RAII로 해제</text><rect x="40" y="330" width="920" height="80" rx="12" fill="#155e75" stroke="#64748b"/><text x="56" y="365" font-size="21">예제 총액: 4 × 10000 = 40000 / 4스레드 × 1500 × 왕복 2 = 12000</text><text x="45" y="460" font-size="21">RAII는 잠금 해제 책임이다. 임의 데이터 변경의 자동 롤백은 아니다.</text><text x="45" y="503" font-size="19">std::lock은 교착 회피 취득을 제공하지만 공정성·완료 시한을 약속하지 않는다.</text></g></svg>
