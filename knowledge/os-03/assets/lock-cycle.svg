<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>C → A를 넣기 전에 A → C 경로가 있는지 본다</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#67e8f9"/></marker></defs><rect width="1000" height="540" rx="20" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e2e8f0"><text x="30" y="46" font-size="26">C → A를 넣기 전에 A → C 경로가 있는지 본다</text><rect x="65" y="130" width="210" height="100" rx="12" fill="#162538" stroke="#64748b"/><text x="81" y="165" font-size="21">A 보유 → B 요청</text><rect x="395" y="130" width="210" height="100" rx="12" fill="#162538" stroke="#64748b"/><text x="411" y="165" font-size="21">B 보유 → C 요청</text><rect x="725" y="130" width="210" height="100" rx="12" fill="#4c1d95" stroke="#64748b"/><text x="741" y="165" font-size="21">C 보유 → A 요청</text><path d="M280 180 L385 180" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M610 180 L715 180" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M825 245 L825 330 L170 330 L170 245" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 6"/><text x="275" y="375" font-size="24">이미 A → B → C : 새 C → A는 거부</text><text x="60" y="445" font-size="19">간선은 가능한 취득 순서다. 지금 어떤 스레드가 기다리는지는 기록하지 않는다.</text><text x="60" y="494" font-size="24">사이클 위험 신호 ≠ 실제 교착 발생 관측</text></g></svg>
