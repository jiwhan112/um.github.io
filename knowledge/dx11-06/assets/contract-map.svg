<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">좌표 변환과 저장 레이아웃은 다른 축이다</title><desc id="desc">행 벡터 규약에서 Local→World→View→Clip을 만든 뒤 w로 나눠 NDC를 얻습니다. 이후 Viewport 원점과 Y 반전이 픽셀 좌표를 결정합니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c47a"/></marker></defs><rect width="960" height="430" rx="18" fill="#0c1929"/><g font-family="sans-serif"><text x="28" y="43" font-size="25" fill="#edf4ff">좌표 변환과 저장 레이아웃은 다른 축이다</text><rect x="30" y="90" width="260" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="44" y="122" font-size="21" fill="#edf4ff">Local → World</text><text x="44" y="154" font-size="16" fill="#b7d3e6">p × World</text><rect x="350" y="90" width="260" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="364" y="122" font-size="21" fill="#edf4ff">View → Clip</text><text x="364" y="154" font-size="16" fill="#b7d3e6">× View × Projection</text><rect x="670" y="90" width="260" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="684" y="122" font-size="21" fill="#edf4ff">NDC</text><text x="684" y="154" font-size="16" fill="#b7d3e6">clip.xyz / clip.w</text><path d="M290 133 H343" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><path d="M610 133 H663" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><rect x="350" y="260" width="370" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="364" y="292" font-size="21" fill="#edf4ff">Viewport (100,50,800,600)</text><text x="364" y="324" font-size="16" fill="#b7d3e6">NDC 중심(0,0) → 화면(500,350)</text><path d="M800 176 V303 H727" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><text x="30" y="390" font-size="18" fill="#edf4ff">위 수식과 HLSL row_major/column_major 저장 패킹을 따로 대조합니다.</text></g></svg>
