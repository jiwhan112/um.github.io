<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">atomic 정확성과 캐시 배치는 서로 다른 계약이다</title><desc id="d">인접한두atomic이같은일관성단위에놓일가능성과64바이트정렬슬롯두개를비교한가정그림이다.실제라인크기나공유여부를측정한그림이아니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f3c477"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1a29"/><g font-family="sans-serif"><text x="28" y="42" font-size="25" fill="#edf4ff">atomic 정확성과 캐시 배치는 서로 다른 계약이다</text><text x="30" y="85" font-size="22" fill="#edf4ff">가정 그림: 일관성 단위가64B인 경우</text><rect x="35" y="115" width="390" height="95" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="47" y="145" font-size="20" fill="#edf4ff">인접 배치: a.n | b.n</text><text x="47" y="174" font-size="16" fill="#bbd3e4">같은 단위에 들어갈 가능성</text><rect x="520" y="115" width="390" height="95" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="532" y="145" font-size="20" fill="#edf4ff">Far: 64B 정렬 슬롯 두 개</text><text x="532" y="174" font-size="16" fill="#bbd3e4">서로 다른 슬롯에 배치하려는 의도</text><rect x="520" y="245" width="175" height="75" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="532" y="275" font-size="20" fill="#edf4ff">a.n</text><text x="532" y="304" font-size="16" fill="#bbd3e4">64B 슬롯</text><rect x="730" y="245" width="175" height="75" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="742" y="275" font-size="20" fill="#edf4ff">b.n</text><text x="742" y="304" font-size="16" fill="#bbd3e4">64B 슬롯</text><path d="M625 210 V238" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><path d="M810 210 V238" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><text x="30" y="365" font-size="19" fill="#edf4ff">64B는 실습의 정렬 가정이다. 실제 일관성 단위·주소·lock-free 여부는 측정하지 않는다.</text><text x="30" y="410" font-size="19" fill="#edf4ff">값의 정확성 ≠ 배치 비용. 서로 다른 객체라도 같은 하드웨어 단위를 공유할 수 있다.</text></g></svg>
