<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">완료를 기다린 뒤 읽는 이유</title><desc id="d">두워커각각의종료는그워커에대한성공한join반환과동기화된다.두join뒤에카운터를읽는다.두워커사이순서를정하거나relaxed로다른데이터를게시하는그림이아니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f3c477"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1a29"/><g font-family="sans-serif"><text x="28" y="42" font-size="25" fill="#edf4ff">완료를 기다린 뒤 읽는 이유</text><rect x="30" y="95" width="310" height="85" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="42" y="125" font-size="20" fill="#edf4ff">Worker A · a.fetch_add</text><text x="42" y="154" font-size="16" fill="#bbd3e4">relaxed · a의원자적증가</text><rect x="30" y="245" width="310" height="85" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="42" y="275" font-size="20" fill="#edf4ff">Worker B · b.fetch_add</text><text x="42" y="304" font-size="16" fill="#bbd3e4">relaxed · b의원자적증가</text><rect x="440" y="95" width="200" height="85" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="452" y="125" font-size="20" fill="#edf4ff">a.join 반환</text><text x="452" y="154" font-size="16" fill="#bbd3e4">A 종료와동기화</text><rect x="440" y="245" width="200" height="85" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="452" y="275" font-size="20" fill="#edf4ff">b.join 반환</text><text x="452" y="304" font-size="16" fill="#bbd3e4">B 종료와동기화</text><path d="M340 137 H433" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><path d="M340 287 H433" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><rect x="720" y="170" width="210" height="95" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="732" y="200" font-size="20" fill="#edf4ff">둘 다join한 뒤</text><text x="732" y="229" font-size="16" fill="#bbd3e4">a,b의최종값읽기</text><path d="M640 137 H682 V199 H713" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><path d="M640 287 H682 V235 H713" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><text x="30" y="410" font-size="19" fill="#edf4ff">relaxed 자체가 다른 데이터를 게시하는 것은 아니다. 여기서는 join으로 종료를 기다린다.</text></g></svg>
