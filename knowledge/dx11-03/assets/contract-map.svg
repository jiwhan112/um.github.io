<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">DrawIndexed는 인덱스 값에 BaseVertex를 더한다</title><desc id="desc">예시 IB의 0,2,1에 BaseVertex=3을 더하면 VB의 3,5,4를 참조합니다. IndexCount는 삼각형 개수가 아니라 읽는 인덱스 수입니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c47a"/></marker></defs><rect width="960" height="430" rx="18" fill="#0c1929"/><g font-family="sans-serif"><text x="28" y="43" font-size="25" fill="#edf4ff">DrawIndexed는 인덱스 값에 BaseVertex를 더한다</text><rect x="30" y="100" width="260" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="44" y="132" font-size="21" fill="#edf4ff">IB 엔트리 0, 2, 1</text><text x="44" y="164" font-size="16" fill="#b7d3e6">StartIndex부터 3개 읽기</text><rect x="350" y="100" width="250" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="364" y="132" font-size="21" fill="#edf4ff">BaseVertex = 3</text><text x="364" y="164" font-size="16" fill="#b7d3e6">각 인덱스 값에 더함</text><rect x="660" y="100" width="270" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="674" y="132" font-size="21" fill="#edf4ff">VB 인덱스 3, 5, 4</text><text x="674" y="164" font-size="16" fill="#b7d3e6">각 접근이 범위 안인지 확인</text><path d="M290 143 H343" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><path d="M600 143 H653" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><text x="30" y="270" font-size="23" fill="#edf4ff">IndexCount=3 / TriangleList라면 삼각형 1개</text><text x="30" y="325" font-size="18" fill="#edf4ff">StartIndex는 IB에서 읽을 위치, BaseVertex는 읽은 값에 더할 보정입니다.</text><text x="30" y="377" font-size="18" fill="#edf4ff">그림의 숫자는 설명 예시이며 새 CPU 실행 결과가 아닙니다.</text></g></svg>
