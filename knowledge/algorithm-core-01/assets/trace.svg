<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>비용 모델·복잡도·루프 불변식 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">비용 모델·복잡도·루프 불변식 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. n=0</text><text x="340" y="105" font-size="19">sum=0, visits=0</text><text x="340" y="137" font-size="17" fill="#a7f3d0">빈 입력의 항등값</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. n=8</text><text x="340" y="213" font-size="19">scan=8, pairs=28</text><text x="340" y="245" font-size="17" fill="#a7f3d0">8×7÷2</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. n=16</text><text x="340" y="321" font-size="19">scan=16, pairs=120</text><text x="340" y="353" font-size="17" fill="#a7f3d0">합산은2배, 쌍은약4배</text></g></svg>