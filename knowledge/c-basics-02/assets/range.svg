<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" role="img" aria-labelledby="title desc"><title id="title">크기와 값 범위를 구분하기</title><desc id="desc">sizeof(char) = 1, 하지만 CHAR_BIT는 별도입니다.</desc><rect width="640" height="485" rx="20" fill="#101c2c"/><g font-family="sans-serif"><text x="30" y="48" font-size="26" fill="#f0f6ff">크기와 값 범위를 구분하기</text><rect x="30" y="78" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="110" font-size="24" fill="#7dd3fc">sizeof(int)</text><text x="48" y="142" font-size="21" fill="#f0f6ff">int 객체가 차지하는 C 바이트 수</text><path d="M320 168v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="188" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="220" font-size="24" fill="#7dd3fc">CHAR_BIT</text><text x="48" y="252" font-size="21" fill="#f0f6ff">C의 1바이트를 이루는 비트 수</text><path d="M320 278v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="298" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="330" font-size="24" fill="#7dd3fc">INT_MIN / INT_MAX</text><text x="48" y="362" font-size="21" fill="#f0f6ff">int가 표현할 수 있는 최소·최대 값</text><text x="30" y="457" font-size="18" fill="#c0cedd">sizeof(char) = 1, 하지만 CHAR_BIT는 별도입니다.</text></g></svg>
