<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" role="img" aria-labelledby="title desc"><title id="title">변수는 타입을 가진 저장 공간</title><desc id="desc">이름·타입·현재 값을 따로 추적해 봅니다.</desc><rect width="640" height="485" rx="20" fill="#101c2c"/><g font-family="sans-serif"><text x="30" y="48" font-size="26" fill="#f0f6ff">변수는 타입을 가진 저장 공간</text><rect x="30" y="78" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="110" font-size="24" fill="#7dd3fc">선언과 초기화  int score = 80;</text><text x="48" y="142" font-size="21" fill="#f0f6ff">이름 score · 타입 int · 시작 값 80</text><path d="M320 168v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="188" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="220" font-size="24" fill="#7dd3fc">대입  score = score + 5;</text><text x="48" y="252" font-size="21" fill="#f0f6ff">오른쪽 계산 85 → 같은 객체에 저장</text><path d="M320 278v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="298" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="330" font-size="24" fill="#7dd3fc">출력  printf(&quot;%d&quot;, score);</text><text x="48" y="362" font-size="21" fill="#f0f6ff">객체의 현재 값 85를 읽어 전달</text><text x="30" y="457" font-size="18" fill="#c0cedd">이름·타입·현재 값을 따로 추적해 봅니다.</text></g></svg>
