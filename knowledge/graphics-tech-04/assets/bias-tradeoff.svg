<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Bias는 오차를 줄이지만 너무 크면 빛이 샌다</title><desc id="desc">같은stored깊이0.2에작은오차를보정하는경우와큰bias로가림을놓치는경우를깊이축에표시한다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">Bias는 오차를 줄이지만 너무 크면 빛이 샌다</text><line x1="80" y1="290" x2="880" y2="290" stroke="#a7b8d0" stroke-width="2" /><text x="80" y="340" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">0 가까움</text><text x="770" y="340" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">1 멂</text><circle cx="240.0" cy="290" r="6" stroke="#6ee7c8" fill="#6ee7c8" stroke-width="3"/><line x1="240.0" y1="290" x2="240.0" y2="160" stroke="#6ee7c8" stroke-width="2" /><text x="180.0" y="150" fill="#6ee7c8" font-size="19" font-family="Noto Sans CJK KR, sans-serif">stored 0.2</text><circle cx="240.08" cy="290" r="6" stroke="#f8b66c" fill="#f8b66c" stroke-width="3"/><line x1="240.08" y1="290" x2="240.08" y2="220" stroke="#f8b66c" stroke-width="2" /><text x="180.08" y="210" fill="#f8b66c" font-size="19" font-family="Noto Sans CJK KR, sans-serif">receiver 0.2001</text><circle cx="640.0" cy="290" r="6" stroke="#fb7185" fill="#fb7185" stroke-width="3"/><line x1="640.0" y1="290" x2="640.0" y2="410" stroke="#fb7185" stroke-width="2" /><text x="580.0" y="400" fill="#fb7185" font-size="19" font-family="Noto Sans CJK KR, sans-serif">receiver 0.7</text><circle cx="160.0" cy="290" r="6" stroke="#fb7185" fill="#fb7185" stroke-width="3"/><line x1="160.0" y1="290" x2="160.0" y2="450" stroke="#fb7185" stroke-width="2" /><text x="100.0" y="440" fill="#fb7185" font-size="19" font-family="Noto Sans CJK KR, sans-serif">0.7 - 큰 bias 0.6</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>