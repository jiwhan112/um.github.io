<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">PCF는 깊이가 아니라 비교 결과를 평균한다</title><desc id="desc">깊이0.2다섯개는어둡고0.8네개는밝다.결과visibility는4/9다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">PCF는 깊이가 아니라 비교 결과를 평균한다</text><text x="40" y="105" fill="#e7eef8" font-size="23" font-family="Noto Sans CJK KR, sans-serif">receiver = 0.5, bias = 0</text><rect x="60" y="140" width="86" height="76" rx="7" fill="#fb7185" stroke="#fb7185"/><text x="80" y="185" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.2</text><rect x="160" y="140" width="86" height="76" rx="7" fill="#fb7185" stroke="#fb7185"/><text x="180" y="185" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.2</text><rect x="260" y="140" width="86" height="76" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="280" y="185" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.8</text><rect x="60" y="230" width="86" height="76" rx="7" fill="#fb7185" stroke="#fb7185"/><text x="80" y="275" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.2</text><rect x="160" y="230" width="86" height="76" rx="7" fill="#fb7185" stroke="#fb7185"/><text x="180" y="275" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.2</text><rect x="260" y="230" width="86" height="76" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="280" y="275" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.8</text><rect x="60" y="320" width="86" height="76" rx="7" fill="#fb7185" stroke="#fb7185"/><text x="80" y="365" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.2</text><rect x="160" y="320" width="86" height="76" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="180" y="365" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.8</text><rect x="260" y="320" width="86" height="76" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="280" y="365" fill="#101827" font-size="24" font-family="Noto Sans CJK KR, sans-serif">0.8</text><text x="430" y="180" fill="#6ee7c8" font-size="28" font-family="Noto Sans CJK KR, sans-serif">밝음 4 / 전체 9</text><text x="430" y="240" fill="#6ee7c8" font-size="28" font-family="Noto Sans CJK KR, sans-serif">PCF = 0.444444</text><text x="430" y="320" fill="#fb7185" font-size="22" font-family="Noto Sans CJK KR, sans-serif">먼저 depth 평균 → 비교: 0</text><text x="430" y="370" fill="#e7eef8" font-size="23" font-family="Noto Sans CJK KR, sans-serif">비교와 평균은 교환 불가</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>