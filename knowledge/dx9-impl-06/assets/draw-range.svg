<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>정점·인덱스·삼각형의 단위</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">정점·인덱스·삼각형의 단위</text><rect x="45" y="110" width="250" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="59" y="146" font-size="22" fill="#e2e8f0">정점 4 × 20 = 80 B</text><rect x="355" y="110" width="250" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="369" y="146" font-size="22" fill="#e2e8f0">인덱스 6 × 2 = 12 B</text><rect x="665" y="110" width="250" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="679" y="146" font-size="22" fill="#e2e8f0">삼각형 2개</text><text x="70" y="280" font-size="22" fill="#e2e8f0">TriangleList: PrimitiveCount = 2 (인덱스 개수 6이 아님)</text><text x="70" y="350" font-size="24" fill="#e2e8f0">Base=-3, IB={3,4,5} → 실제 VB 위치={0,1,2}</text></g></svg>
