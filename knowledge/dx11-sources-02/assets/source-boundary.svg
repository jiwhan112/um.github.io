<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">리소스 · CPU 계약 모델의 검사 경계</title><desc id="desc">이 자료실의 main.cpp와 CMakeLists.txt는 CPU 계약 모델과 과거 CTest 기록으로 연결됩니다. Windows GUI·HLSL 파일은 이 자료실에 없으며 SDK 검증은 외부 영역입니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c47a"/></marker></defs><rect width="960" height="430" rx="18" fill="#0c1929"/><g font-family="sans-serif"><text x="28" y="43" font-size="25" fill="#edf4ff">리소스 · CPU 계약 모델의 검사 경계</text><rect x="25" y="95" width="270" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="39" y="127" font-size="21" fill="#edf4ff">main.cpp + CMake</text><text x="39" y="159" font-size="16" fill="#b7d3e6">복구 원장으로 출처 추적</text><rect x="345" y="95" width="270" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="359" y="127" font-size="21" fill="#edf4ff">CPU 계약 타깃</text><text x="359" y="159" font-size="16" fill="#b7d3e6">모델의 조건과 입력 확인</text><rect x="665" y="95" width="270" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="679" y="127" font-size="21" fill="#edf4ff">CTest · 과거 로그</text><text x="679" y="159" font-size="16" fill="#b7d3e6">실행 환경·날짜와 함께 읽기</text><path d="M295 138 H338" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><path d="M615 138 H658" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><rect x="345" y="275" width="480" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="359" y="307" font-size="21" fill="#edf4ff">외부 SDK 검증 영역</text><text x="359" y="339" font-size="16" fill="#b7d3e6">Windows GUI·HLSL: 이 자료실에 없음</text><text x="30" y="243" font-size="19" fill="#edf4ff">CPU 검사 경로에서 GPU 검증 완료로 이어지는 화살표는 없습니다.</text></g></svg>
