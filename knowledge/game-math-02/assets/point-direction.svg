<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>같은 이동행렬, 다른 w</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">같은 이동행렬, 다른 w</text><rect x="60" y="110" width="300" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="74" y="146" font-size="22" fill="#e2e8f0">점 (2,3,0,1)</text><rect x="570" y="110" width="320" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="584" y="146" font-size="22" fill="#e2e8f0">결과 (12,3,0,1)</text><path d="M360 150 L560 150" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="255" width="300" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="74" y="291" font-size="22" fill="#e2e8f0">방향 (2,3,0,0)</text><rect x="570" y="255" width="320" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="584" y="291" font-size="22" fill="#e2e8f0">결과 (2,3,0,0)</text><path d="M360 295 L560 295" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="380" y="220" font-size="20" fill="#fbbf24">T: x +10</text><text x="75" y="400" font-size="22" fill="#e2e8f0">이동 성분에 곱해지는 w가 0이면 방향에는 이동이 더해지지 않는다</text></g></svg>
