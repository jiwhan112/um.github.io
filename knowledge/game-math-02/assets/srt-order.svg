<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>행 벡터 pM: 왼쪽부터 적용한다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">행 벡터 pM: 왼쪽부터 적용한다</text><rect x="35" y="110" width="190" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="49" y="146" font-size="22" fill="#e2e8f0">p = (1,0)</text><rect x="270" y="110" width="190" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="284" y="146" font-size="22" fill="#e2e8f0">S: (2,0)</text><rect x="505" y="110" width="190" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="519" y="146" font-size="22" fill="#e2e8f0">R: (0,2)</text><rect x="740" y="110" width="190" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="754" y="146" font-size="22" fill="#e2e8f0">T: (10,2)</text><path d="M225 145 L265 145" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M460 145 L500 145" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M695 145 L735 145" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="70" y="250" font-size="22" fill="#e2e8f0">S = x축 2배 · R = +90° · T = (10,0)</text><text x="70" y="305" font-size="24" fill="#fbbf24">반대 예: pTSR → (11,0) → (22,0) → (0,22)</text><text x="70" y="375" font-size="22" fill="#e2e8f0">괄호를 바꾸는 결합법칙 ≠ 행렬의 순서를 바꾸는 교환법칙</text></g></svg>
