<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
  <title id="title">size와 capacity의 차이</title>
  <desc id="desc">reserve 뒤에는 원소가 없고 resize 뒤에는 초기화된 세 원소가 있다. 실제 용량은 네 개 이상이다.</desc>
  <rect width="640" height="660" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="32" y="48" font-size="28" fill="#e8f0ff" font-weight="700" text-anchor="start">빈자리와 실제 원소를 나눠 봅니다</text>
    <text x="32" y="87" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">기본 할당자를 쓰는 vector&lt;int&gt;의 예</text>
    <rect x="32" y="116" width="576" height="195" rx="12" fill="#1c2a41"/>
    <text x="52" y="153" font-size="27" fill="#93c5fd" font-weight="700" text-anchor="start">reserve(4)</text>
    <text x="52" y="188" font-size="24" fill="#e8f0ff" font-weight="400" text-anchor="start">size = 0 · capacity ≥ 4</text>
    <rect x="52" y="212" width="120" height="66" rx="12" fill="#162338" stroke="#b8c7dd" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="112" y="254" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="middle">빈자리</text>
    <rect x="188" y="212" width="120" height="66" rx="12" fill="#162338" stroke="#b8c7dd" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="248" y="254" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="middle">빈자리</text>
    <rect x="324" y="212" width="120" height="66" rx="12" fill="#162338" stroke="#b8c7dd" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="384" y="254" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="middle">빈자리</text>
    <rect x="460" y="212" width="120" height="66" rx="12" fill="#162338" stroke="#b8c7dd" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="520" y="254" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="middle">빈자리</text>
    <text x="52" y="300" font-size="22" fill="#fda4af" font-weight="400" text-anchor="start">아직 [0]에 쓰면 안 됩니다.</text>
    <rect x="32" y="337" width="576" height="205" rx="12" fill="#1c2a41"/>
    <text x="52" y="376" font-size="27" fill="#6ee7b7" font-weight="700" text-anchor="start">resize(3)</text>
    <text x="52" y="411" font-size="24" fill="#e8f0ff" font-weight="400" text-anchor="start">size = 3 · capacity ≥ 4</text>
    <rect x="52" y="431" width="120" height="66" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="112" y="474" font-size="32" fill="#6ee7b7" font-weight="700" text-anchor="middle">0</text>
    <text x="112" y="530" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[0]</text>
    <rect x="188" y="431" width="120" height="66" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="248" y="474" font-size="32" fill="#6ee7b7" font-weight="700" text-anchor="middle">0</text>
    <text x="248" y="530" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[1]</text>
    <rect x="324" y="431" width="120" height="66" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="384" y="474" font-size="32" fill="#6ee7b7" font-weight="700" text-anchor="middle">0</text>
    <text x="384" y="530" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[2]</text>
    <rect x="460" y="431" width="120" height="66" rx="12" fill="#162338" stroke="#b8c7dd" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="520" y="473" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="middle">빈자리</text>
    <text x="32" y="586" font-size="24" fill="#6ee7b7" font-weight="400" text-anchor="start">초록 칸만 현재 vector의 원소입니다.</text>
    <text x="32" y="625" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">실제 capacity는 4보다 클 수도 있습니다.</text>
  </g>
</svg>
