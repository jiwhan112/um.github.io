<svg xmlns="http://www.w3.org/2000/svg" width="640" height="697" viewBox="0 0 640 697" role="img" aria-labelledby="title desc">
  <title id="title">문자열의 코드 단위와 널 종료</title>
  <desc id="desc">UTF-8 가A는 EA B0 80 41 네 바이트이며 코드 포인트 두 개다. a 널 b를 길이 3으로 만든 string은 size가 3이고 strlen은 1이다.</desc>
  <rect width="640" height="697" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="32" y="48" font-size="28" fill="#e8f0ff" font-weight="700" text-anchor="start">문자열 길이에는 기준이 있습니다</text>
    <text x="32" y="87" font-size="24" fill="#93c5fd" font-weight="400" text-anchor="start">예: UTF-8로 표현한 “가A”</text>
    <rect x="32" y="116" width="576" height="205" rx="12" fill="#1c2a41"/>
    <text x="52" y="155" font-size="25" fill="#e8f0ff" font-weight="700" text-anchor="start">8비트 바이트 4개</text>
    <rect x="52" y="179" width="120" height="61" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="112" y="220" font-size="29" fill="#6ee7b7" font-weight="700" text-anchor="middle">EA</text>
    <rect x="188" y="179" width="120" height="61" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="248" y="220" font-size="29" fill="#6ee7b7" font-weight="700" text-anchor="middle">B0</text>
    <rect x="324" y="179" width="120" height="61" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="384" y="220" font-size="29" fill="#6ee7b7" font-weight="700" text-anchor="middle">80</text>
    <rect x="460" y="179" width="120" height="61" rx="12" fill="#1e3552" stroke="#93c5fd" stroke-width="2"/>
    <text x="520" y="220" font-size="29" fill="#93c5fd" font-weight="700" text-anchor="middle">41</text>
    <text x="248" y="280" font-size="24" fill="#6ee7b7" font-weight="400" text-anchor="middle">가 · U+AC00</text>
    <text x="520" y="280" font-size="22" fill="#93c5fd" font-weight="400" text-anchor="middle">A · U+0041</text>
    <text x="52" y="307" font-size="21" fill="#b8c7dd" font-weight="400" text-anchor="start">위 예시의 코드 포인트는 2개입니다.</text>
    <rect x="32" y="347" width="576" height="240" rx="12" fill="#1c2a41"/>
    <text x="52" y="389" font-size="25" fill="#e8f0ff" font-weight="700" text-anchor="start">별도 예: string{&quot;a\0b&quot;, 3}</text>
    <rect x="52" y="413" width="126" height="68" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="115" y="458" font-size="29" fill="#6ee7b7" font-weight="700" text-anchor="middle">a</text>
    <rect x="194" y="413" width="126" height="68" rx="12" fill="#312435" stroke="#fda4af" stroke-width="2"/>
    <text x="257" y="458" font-size="29" fill="#fda4af" font-weight="700" text-anchor="middle">\0</text>
    <rect x="336" y="413" width="126" height="68" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="399" y="458" font-size="29" fill="#6ee7b7" font-weight="700" text-anchor="middle">b</text>
    <text x="52" y="524" font-size="25" fill="#6ee7b7" font-weight="700" text-anchor="start">size() = 3</text>
    <text x="52" y="566" font-size="23" fill="#fda4af" font-weight="400" text-anchor="start">strlen(c_str()) = 1  ·  첫 널에서 멈춤</text>
    <text x="32" y="628" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">코드 포인트 수 ≠ 항상 화면의 글자소 수</text>
    <text x="32" y="665" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">원소 수와 인코딩 해석을 함께 확인하세요.</text>
  </g>
</svg>
