<svg xmlns="http://www.w3.org/2000/svg" width="640" height="725" viewBox="0 0 640 725" role="img" aria-labelledby="title desc">
  <title id="title">행 배열과 평탄한 인덱스</title>
  <desc id="desc">grid의 두 번째 행 세 번째 원소는 6이다. 행 배열을 가리키는 타입은 int (*)[3]이며 평탄한 vector에서는 인덱스 5로 같은 값을 읽는다.</desc>
  <rect width="640" height="725" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="32" y="48" font-size="28" fill="#e8f0ff" font-weight="700" text-anchor="start">행을 고른 뒤, 행 안에서 고릅니다</text>
    <text x="32" y="87" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">int grid[2][3] · 행 2개, 각 행에 int 3개</text>
    <text x="36" y="190" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="start">y=0</text>
    <rect x="110" y="125" width="146" height="90" rx="12" fill="#1c2a41" stroke="#526784" stroke-width="2"/>
    <text x="183" y="160" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[0][0]</text>
    <text x="183" y="196" font-size="30" fill="#e8f0ff" font-weight="700" text-anchor="middle">1</text>
    <rect x="276" y="125" width="146" height="90" rx="12" fill="#1c2a41" stroke="#526784" stroke-width="2"/>
    <text x="349" y="160" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[0][1]</text>
    <text x="349" y="196" font-size="30" fill="#e8f0ff" font-weight="700" text-anchor="middle">2</text>
    <rect x="442" y="125" width="146" height="90" rx="12" fill="#1c2a41" stroke="#526784" stroke-width="2"/>
    <text x="515" y="160" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[0][2]</text>
    <text x="515" y="196" font-size="30" fill="#e8f0ff" font-weight="700" text-anchor="middle">3</text>
    <text x="36" y="302" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="start">y=1</text>
    <rect x="110" y="237" width="146" height="90" rx="12" fill="#1c2a41" stroke="#526784" stroke-width="2"/>
    <text x="183" y="272" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[1][0]</text>
    <text x="183" y="308" font-size="30" fill="#e8f0ff" font-weight="700" text-anchor="middle">4</text>
    <rect x="276" y="237" width="146" height="90" rx="12" fill="#1c2a41" stroke="#526784" stroke-width="2"/>
    <text x="349" y="272" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[1][1]</text>
    <text x="349" y="308" font-size="30" fill="#e8f0ff" font-weight="700" text-anchor="middle">5</text>
    <rect x="442" y="237" width="146" height="90" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="515" y="272" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">[1][2]</text>
    <text x="515" y="308" font-size="30" fill="#6ee7b7" font-weight="700" text-anchor="middle">6</text>
    <text x="183" y="360" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">x=0</text>
    <text x="349" y="360" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="middle">x=1</text>
    <text x="515" y="360" font-size="22" fill="#6ee7b7" font-weight="400" text-anchor="middle">x=2</text>
    <rect x="32" y="391" width="576" height="120" rx="12" fill="#1c2a41"/>
    <text x="52" y="431" font-size="27" fill="#6ee7b7" font-weight="700" text-anchor="start">row[1][2] = 6</text>
    <text x="52" y="474" font-size="25" fill="#e8f0ff" font-weight="400" text-anchor="start">row의 타입: int (*)[3]</text>
    <rect x="32" y="535" width="576" height="120" rx="12" fill="#1c2a41"/>
    <text x="52" y="574" font-size="24" fill="#93c5fd" font-weight="400" text-anchor="start">같은 값의 평탄 vector라면</text>
    <text x="52" y="619" font-size="25" fill="#e8f0ff" font-weight="400" text-anchor="start">flat[(1 × 3) + 2] = flat[5] = 6</text>
    <text x="32" y="694" font-size="21" fill="#b8c7dd" font-weight="400" text-anchor="start">x·y 경계와 width × height 범위를 따로 검사</text>
  </g>
</svg>
