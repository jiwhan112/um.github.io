<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">값 복사 → 검증 → 반영</title><desc id="desc">구조체의 패딩·정렬은 논리 상태와 별개입니다. 원시 바이트를 파일 규격으로 쓰지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">값 복사 → 검증 → 반영</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">원본</text><text x="46" y="145" fill="#f8fafc" font-size="17">hero = {80, 0, 0}</text><text x="46" y="179" fill="#cbd5e1" font-size="15">멤버의 의미를 저장</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">임시 상태</text><text x="356" y="145" fill="#f8fafc" font-size="17">next = *actor</text><text x="356" y="179" fill="#cbd5e1" font-size="15">허용 범위인지 검사</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">커밋 또는 거부</text><text x="666" y="145" fill="#f8fafc" font-size="17">*actor = next / return 0</text><text x="666" y="179" fill="#cbd5e1" font-size="15">실패하면 hero 보존</text><text x="30" y="255" fill="#cbd5e1" font-size="17">구조체의 패딩·정렬은 논리 상태와 별개입니다. 원시 바이트를 파일 규격으로 쓰지 않습니다.</text></g></svg>
