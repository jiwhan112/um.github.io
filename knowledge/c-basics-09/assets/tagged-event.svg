<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">이벤트 태그가 읽을 멤버를 선택한다</title><desc id="desc">태그와 데이터의 일치는 생성자의 계약이며 enum이 자동으로 보장하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">이벤트 태그가 읽을 멤버를 선택한다</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">생성</text><text x="46" y="145" fill="#f8fafc" font-size="17">kind = EVENT_MOVE</text><text x="46" y="179" fill="#cbd5e1" font-size="15">data.move = {3, 4}</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">분기</text><text x="356" y="145" fill="#f8fafc" font-size="17">switch (kind)</text><text x="356" y="179" fill="#cbd5e1" font-size="15">MOVE 경로만 선택</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">사용</text><text x="666" y="145" fill="#f8fafc" font-size="17">data.move.x / y</text><text x="666" y="179" fill="#cbd5e1" font-size="15">damage 멤버는 읽지 않음</text><text x="30" y="255" fill="#cbd5e1" font-size="17">태그와 데이터의 일치는 생성자의 계약이며 enum이 자동으로 보장하지 않습니다.</text></g></svg>
