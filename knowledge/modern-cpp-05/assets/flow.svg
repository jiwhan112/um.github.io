<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><rect width="1000" height="380" rx="18" fill="#111827"/><style>text{font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif;fill:#e5e7eb;font-size:23px}.title{font-size:28px;font-weight:700}.note{font-size:18px;fill:#a5b4fc}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34d399"/></marker></defs><text x="35" y="50" class="title">부모·자식의 소유 그래프</text><rect x="90" y="135" width="260" height="80" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="108" y="175" class="">root (부모)</text><rect x="640" y="135" width="270" height="80" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="658" y="175" class="">child (자식)</text><path d="M350 155 H635" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/><text x="390" y="127" class="note">shared_ptr 소유</text><path d="M640 195 H355" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="398" y="238" class="note">weak_ptr 관찰</text><text x="85" y="290" class="">외부 child 해제: root가 자식 생존을 유지</text><text x="85" y="330" class="">root 해제: 두 객체 소멸 → observer.lock()은 빈 값</text></svg>