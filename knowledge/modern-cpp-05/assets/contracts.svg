<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="구별해야 할 계약"><rect width="1000" height="330" rx="18" fill="#111827"/><style>text{font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif;fill:#e5e7eb} .title{font-size:28px;font-weight:700} .label{font-size:22px} .note{font-size:18px;fill:#a5b4fc}</style><text x="35" y="50" class="title">구별해야 할 계약</text><rect x="35.0" y="92" width="293.3333333333333" height="140" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="47.0" y="137" class="label">root → child:</text><text x="47.0" y="168" class="label">소유</text><rect x="353.3333333333333" y="92" width="293.3333333333333" height="140" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="365.3333333333333" y="137" class="label">child ⇢ root:</text><text x="365.3333333333333" y="168" class="label">관찰</text><rect x="671.6666666666666" y="92" width="293.3333333333333" height="140" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/><text x="683.6666666666666" y="137" class="label">weak lock 실패:</text><text x="683.6666666666666" y="168" class="label">사용 중지</text><text x="35" y="290" class="note">같은 문법처럼 보여도 소유·수명·오류 계약이 다를 수 있습니다.</text></svg>