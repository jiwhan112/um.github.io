<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
<title>DirectX 12 02 · 실행 계약 시각화</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker></defs>
<rect width="1080" height="620" rx="18" fill="#0f172a"/>
<text x="36" y="53" fill="#f8fafc" font-family="sans-serif" font-size="29">Fence 값으로 allocator 재사용하기</text>
<text x="50" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="24">CPU</text>
<path d="M150 140 L1000 140" stroke="#475569" stroke-width="2"/>
<rect x="180" y="100" width="180" height="65" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="194" y="140.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">기록 / Close</text>
<rect x="410" y="100" width="190" height="65" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="424" y="140.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">Submit + 4</text>
<rect x="755" y="100" width="250" height="65" rx="9" fill="#14532d" stroke="#64748b"/>
<text x="769" y="140.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">완료4 뒤 Reset</text>
<text x="50" y="290" fill="#e2e8f0" font-family="sans-serif" font-size="24">GPU</text>
<path d="M150 300 L1000 300" stroke="#475569" stroke-width="2"/>
<rect x="420" y="260" width="300" height="80" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="434" y="308.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">명령 실행 중</text>
<rect x="760" y="260" width="240" height="80" rx="9" fill="#14532d" stroke="#64748b"/>
<text x="774" y="308.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">Signal(4) 완료</text>
<path d="M595 170 L595 250" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M875 250 L875 175" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="200" y="405" width="660" height="85" rx="9" fill="#7f1d1d" stroke="#64748b"/>
<text x="214" y="455.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">completed=3: allocator 메모리 보존</text>
<text x="200" y="535" fill="#e2e8f0" font-family="sans-serif" font-size="24">Close만으로 GPU 실행 완료를 증명하지 않는다.</text>
<text x="35" y="603" fill="#94a3b8" font-family="sans-serif" font-size="17">자체 제작 개념도 · 실제 GPU 캡처 또는 측정 결과가 아닙니다</text>
</svg>