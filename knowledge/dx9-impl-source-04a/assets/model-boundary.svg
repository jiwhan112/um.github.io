<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">04A CPU 모델이 확인하는 것과 확인하지 않는 것</title><desc id="desc">TextureAsset은 이름을 가진 C++ 객체다. shared_ptr 횟수는 COM 참조 횟수가 아니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">04A CPU 모델이 확인하는 것과 확인하지 않는 것</text><rect x="30" y="105" width="400" height="190" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="135" font-size="20" fill="#64d8cb">CPU 모델 · 실행 기록 있음</text><text x="46" y="165" font-size="18" fill="#e5edf7">Clone과 공유 자산 수명</text><text x="46" y="195" font-size="18" fill="#e5edf7">weak 요청·정렬·Transform</text><text x="46" y="225" font-size="18" fill="#e5edf7">확장 26조건 + 별도 미니 실행</text><rect x="530" y="105" width="400" height="190" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="546" y="135" font-size="20" fill="#64d8cb">실제 D3D9 · 미검증</text><text x="546" y="165" font-size="18" fill="#e5edf7">SetTexture·렌더 상태 복원</text><text x="546" y="195" font-size="18" fill="#e5edf7">투명 면 교차·GPU 프레임</text><text x="546" y="225" font-size="18" fill="#e5edf7">COM·Reset·Windows 드라이버</text><text x="35" y="355" font-size="21" fill="#f5c36b">왼쪽 성공을 오른쪽 성공으로 옮기는 화살표는 없다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">TextureAsset은 이름을 가진 C++ 객체다. shared_ptr 횟수는 COM 참조 횟수가 아니다.</text></g></svg>
