<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
<title>DirectX 12 03 · 실행 계약 시각화</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker></defs>
<rect width="1080" height="620" rx="18" fill="#0f172a"/>
<text x="36" y="53" fill="#f8fafc" font-family="sans-serif" font-size="29">Backbuffer 인덱스와 완료 표의 분리</text>
<rect x="65" y="130" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="79" y="188.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">backbuffer 0</text>
<path d="M325 180 L420 180" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="130" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="454" y="188.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">lastUse = 7</text>
<path d="M700 180 L785 180" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="800" y="130" width="220" height="100" rx="9" fill="#14532d" stroke="#64748b"/>
<text x="814" y="188.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">재사용 가능</text>
<rect x="65" y="300" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="79" y="358.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">backbuffer 1</text>
<path d="M325 350 L420 350" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="300" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="454" y="358.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">lastUse = 8</text>
<path d="M700 350 L785 350" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="800" y="300" width="220" height="100" rx="9" fill="#7f1d1d" stroke="#64748b"/>
<text x="814" y="358.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">아직 대기</text>
<text x="65" y="510" fill="#e2e8f0" font-family="sans-serif" font-size="25">현재 completed=7. 인덱스만 보지 말고 각 lastUse와 비교한다.</text>
<text x="35" y="603" fill="#94a3b8" font-family="sans-serif" font-size="17">자체 제작 개념도 · 실제 GPU 캡처 또는 측정 결과가 아닙니다</text>
</svg>