<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">공통 실습 팩 · 파일과 증거를 찾는 지도</title><desc id="desc">원본 파일의 바이트·해시는 보존한다. 웹 표현 재편은 새 CPU 실험이 아니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">공통 실습 팩 · 파일과 증거를 찾는 지도</text><rect x="30" y="95" width="280" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="125" font-size="20" fill="#64d8cb">include/</text><text x="46" y="155" font-size="18" fill="#e5edf7">math · loop · grid</text><text x="46" y="185" font-size="18" fill="#e5edf7">check: 검사 도우미</text><rect x="345" y="95" width="280" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="125" font-size="20" fill="#64d8cb">src/</text><text x="361" y="155" font-size="18" fill="#e5edf7">독립 CPU 프로그램 6개</text><text x="361" y="185" font-size="18" fill="#e5edf7">공통 헤더의 계약 관찰</text><rect x="660" y="95" width="270" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="125" font-size="20" fill="#64d8cb">windows/</text><text x="676" y="155" font-size="18" fill="#e5edf7">GUI · rc · manifest</text><text x="676" y="185" font-size="18" fill="#e5edf7">Windows 전용 구성</text><path d="M310 160 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="315" y="140" font-size="16" fill="#f5c36b">포함</text><text x="35" y="295" font-size="20" fill="#e5edf7">CMakeLists.txt: 타깃·include·링크·WIN32 조건을 함께 확인</text><text x="35" y="340" font-size="18" fill="#e5edf7">docs/validation.md: 과거 실행 범위  |  source_hashes.json: 원본 무결성</text><text x="35" y="385" font-size="18" fill="#e5edf7">GUI도 loop/math 헤더를 포함하지만 CPU 통과가 GUI 검증으로 이전되지는 않음</text><text x="30" y="428" font-size="17" fill="#bdcde2">원본 파일의 바이트·해시는 보존한다. 웹 표현 재편은 새 CPU 실험이 아니다.</text></g></svg>
