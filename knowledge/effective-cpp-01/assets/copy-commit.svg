<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">복사는 준비 뒤 두 결과로 나뉜다</title><desc id="desc">기존 버퍼는 아직 유지에서 후보 복사 준비 후 실패하면 기존 버퍼 그대로, 성공하면 새 버퍼로 확정. 두 결과 사이에는 화살표가 없습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#edbd72"/></marker></defs><rect width="900" height="500" rx="18" fill="#0d1828"/><g font-family="sans-serif"><text x="32" y="45" fill="#f1f5f9" font-size="25" font-weight="bold">복사는 준비 뒤 두 결과로 나뉜다</text><rect x="260" y="78" width="380" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="276" y="109" fill="#f1f5f9" font-size="21">현재 소유 상태</text><text x="276" y="138" fill="#acdce4" font-size="16">기존 버퍼는 아직 유지</text><path d="M450 158 V183" fill="none" stroke="#edbd72" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="188" width="380" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="276" y="219" fill="#f1f5f9" font-size="21">후보 복사 준비</text><text x="276" y="248" fill="#acdce4" font-size="16">할당·복사가 실패할 수 있음</text><path d="M450 268 V296 H230 V321" fill="none" stroke="#edbd72" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 296 H670 V321" fill="none" stroke="#edbd72" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="326" width="380" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="56" y="357" fill="#f1f5f9" font-size="21">실패: 후보 정리</text><text x="56" y="386" fill="#acdce4" font-size="16">기존 버퍼 그대로</text><rect x="480" y="326" width="380" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="496" y="357" fill="#f1f5f9" font-size="21">성공: noexcept swap</text><text x="496" y="386" fill="#acdce4" font-size="16">새 버퍼로 확정</text><text x="32" y="455" fill="#acdce4" font-size="17">실패와 성공은 대안 경로이며 순차 단계가 아닙니다.</text></g></svg>
