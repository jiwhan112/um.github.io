<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="title desc"><title id="title">완성되는 순서와 정리되는 순서</title><desc id="desc">기반 생성. 멤버 선언 순서. 생성자 본문. 완성 객체 사용. 중간 실패 → 이미 완성된 부분만 정리. 정상 소멸 → 본문, 멤버 역순, 기반 순서</desc><rect width="800" height="444" rx="18" fill="#0d1828"/><g font-family="sans-serif"><text x="38" y="55" fill="#f1f5f9" font-size="26" font-weight="bold">완성되는 순서와 정리되는 순서</text><rect x="38" y="104" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="56" y="150" fill="#f1f5f9" font-size="20">기반 생성</text><rect x="420" y="104" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="438" y="150" fill="#f1f5f9" font-size="20">멤버 선언 순서</text><rect x="38" y="226" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="56" y="272" fill="#f1f5f9" font-size="20">생성자 본문</text><rect x="420" y="226" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="438" y="272" fill="#f1f5f9" font-size="20">완성 객체 사용</text><path d="M384 145 H414 M402 137 L414 145 L402 153 M384 267 H414 M402 259 L414 267 L402 275" fill="none" stroke="#f3ba6a" stroke-width="3"/><text x="38" y="365" fill="#acdce4" font-size="18">중간 실패 → 이미 완성된 부분만 정리</text><text x="38" y="405" fill="#acdce4" font-size="18">정상 소멸 → 본문, 멤버 역순, 기반 순서</text></g></svg>
