<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>이진 탐색 트리·정렬 맵 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">이진 탐색 트리·정렬 맵 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. 삽입 4,2,6</text><text x="340" y="105" font-size="19">root4 / left2 / right6</text><text x="340" y="137" font-size="17" fill="#a7f3d0">높이2</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. 추가 1,3</text><text x="340" y="213" font-size="19">2의 왼쪽1·오른쪽3</text><text x="340" y="245" font-size="17" fill="#a7f3d0">중위 1,2,3,4,6</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. 삽입 0,1,2,3</text><text x="340" y="321" font-size="19">0→1→2→3</text><text x="340" y="353" font-size="17" fill="#a7f3d0">균형 없는 높이4</text></g></svg>