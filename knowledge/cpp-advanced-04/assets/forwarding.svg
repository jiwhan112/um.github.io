<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title desc">
  <title id="title">T의 추론과 std forward의 결과 범주</title>
  <desc id="desc">이름 있는 매개변수 value를 그대로 쓰면 세 경우 모두 lvalue다. std forward T를 쓰면 string lvalue에서 T는 string 참조로 추론되어 lvalue로 전달되고, const string lvalue는 const lvalue로 전달된다. 임시 string에서는 T가 string이고 forward 표현식은 xvalue여서 rvalue 참조 오버로드가 선택된다. 수명이나 소유권은 자동으로 늘어나지 않는다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6ee7b7"/></marker></defs>
  <rect width="640" height="650" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#e8f0ff">
    <text x="32" y="48" font-size="28" font-weight="700">추론한 타입대로 전달합니다</text>
    <rect x="32" y="75" width="576" height="64" rx="12" fill="#1b2640" stroke="#93c5fd" stroke-width="2"/>
    <text x="320" y="115" text-anchor="middle" font-size="24">이름 있는 value는 모두 lvalue</text>
    <text x="32" y="182" font-size="23" fill="#b8c7dd">들어온 인수 · 추론한 T</text>
    <text x="389" y="182" font-size="23" fill="#6ee7b7">forward 결과</text>
    <rect x="32" y="202" width="576" height="104" rx="14" fill="#172c3d" stroke="#6ee7b7" stroke-width="2"/>
    <text x="52" y="240" font-size="26" font-weight="700">text</text>
    <text x="52" y="280" font-size="23">T = std::string&amp;</text>
    <path d="M310 256H356" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="244" font-size="25">lvalue</text>
    <text x="380" y="281" font-size="23">변경 가능</text>
    <rect x="32" y="328" width="576" height="104" rx="14" fill="#172c3d" stroke="#6ee7b7" stroke-width="2"/>
    <text x="52" y="366" font-size="26" font-weight="700">fixed</text>
    <text x="52" y="406" font-size="23">T = const string&amp;</text>
    <path d="M310 382H356" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="370" font-size="25">const lvalue</text>
    <text x="380" y="407" font-size="23">const 유지</text>
    <rect x="32" y="454" width="576" height="104" rx="14" fill="#1b2640" stroke="#93c5fd" stroke-width="2"/>
    <text x="52" y="492" font-size="26" font-weight="700">임시 string</text>
    <text x="52" y="532" font-size="23">T = std::string</text>
    <path d="M310 508H356" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="496" font-size="25">xvalue</text>
    <text x="380" y="533" font-size="23">rvalue 오버로드</text>
    <text x="32" y="604" font-size="24" fill="#b8c7dd">수명·소유권을 자동으로 늘리지 않습니다.</text>
    <text x="32" y="635" font-size="21" fill="#b8c7dd">그림의 string은 std::string입니다.</text>
  </g>
</svg>
