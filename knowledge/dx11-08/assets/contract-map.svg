<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">같은 네 높이도 삼각형과 Bilinear는 다르다</title><desc id="d">b–c 대각선으로 나눈 셀에서 (.75,.75)는 b-d-c 삼각형 안입니다. 그 높이는 5이며 bilinear 5.625와 다릅니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="470" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">같은 네 높이도 삼각형과 Bilinear는 다르다</text><path d="M80 100H380V400H80Z M380 100L80 400" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="55" y="85" font-size="18" fill="#e2e8f0">a:0</text><text x="355" y="85" font-size="18" fill="#e2e8f0">b:0</text><text x="45" y="430" font-size="18" fill="#e2e8f0">c:0</text><text x="355" y="430" font-size="18" fill="#e2e8f0">d:10</text><circle cx="305" cy="325" r="7" fill="#fbbf24"/><text x="160" y="350" font-size="18" fill="#e2e8f0">(.75,.75)</text><rect x="460" y="100" width="460" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="474" y="130" font-size="18" fill="#e2e8f0">fx+fz=1.5 &gt; 1</text><text x="474" y="157" font-size="18" fill="#e2e8f0">b·.25 + c·.25 + d·.5</text><text x="474" y="184" font-size="18" fill="#e2e8f0">삼각형 높이 = 5</text><rect x="460" y="260" width="460" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="474" y="290" font-size="18" fill="#e2e8f0">Bilinear: d·fx·fz</text><text x="474" y="317" font-size="18" fill="#e2e8f0">10 × .75 × .75 = 5.625</text><text x="474" y="344" font-size="18" fill="#e2e8f0">CPU 충돌 높이는 메시 대각선과 일치시킬 것</text></g></svg>
