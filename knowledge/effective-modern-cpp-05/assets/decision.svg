<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">표현을 고를 때 분리할 책임</title><desc id="desc">완벽 전달의 불완전한 경계: 자기 타입 / 복사 / 이동 특수 멤버 / 범용 생성자에서 배제; 문자열 입력 / constructible 제약 / 지원 타입만 후보; 중괄호 / 비트 필드 / 이름 있는 값으로 변환 / 수명과 의미를 명시</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76c7b7"/></marker></defs><rect width="960" height="440" fill="#0c1420"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="36" y="49" fill="#eaf1ff" font-size="28" font-weight="700">05 · 표현을 고를 때 분리할 책임</text><rect x="30" y="98" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="132" fill="#76c7b7" font-size="24">자기 타입</text><text x="300" y="132" fill="#eaf1ff" font-size="23">복사 / 이동 특수 멤버</text><text x="300" y="165" fill="#b9c9df" font-size="21">범용 생성자에서 배제</text><rect x="30" y="202" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="236" fill="#76c7b7" font-size="24">문자열 입력</text><text x="300" y="236" fill="#eaf1ff" font-size="23">constructible 제약</text><text x="300" y="269" fill="#b9c9df" font-size="21">지원 타입만 후보</text><rect x="30" y="306" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="340" fill="#76c7b7" font-size="24">중괄호 / 비트 필드</text><text x="300" y="340" fill="#eaf1ff" font-size="23">이름 있는 값으로 변환</text><text x="300" y="373" fill="#b9c9df" font-size="21">수명과 의미를 명시</text></g></svg>