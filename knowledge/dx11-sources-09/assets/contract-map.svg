<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">메시·재질·노드의 독립 참조</title><desc id="d">왼쪽과 오른쪽 상자는 소스의 역할과 검증 경계를 구분합니다. 위에서 아래로 프로그램 실행을 모두 구현했다는 뜻이 아닙니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">메시·재질·노드의 독립 참조</text><rect x="25" y="100" width="910" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="130" font-size="18" fill="#e2e8f0">Scene의 두 배열: meshes / materials</text><text x="39" y="157" font-size="18" fill="#e2e8f0">Node → mesh index → material index</text><text x="39" y="184" font-size="18" fill="#e2e8f0">Draw에는 인스턴스별 origin 기록</text><rect x="25" y="270" width="910" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="300" font-size="18" fill="#e2e8f0">collect: 지역 Draw vector로 결과 구성</text><text x="39" y="327" font-size="18" fill="#e2e8f0">실패하면 예외, 부분 결과 반환 안 함</text><text x="39" y="354" font-size="18" fill="#e2e8f0">실제 Assimp SDK 호출 없음</text></g></svg>
