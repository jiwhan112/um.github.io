<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">표현을 고를 때 분리할 책임</title><desc id="desc">콜백이 기다리는 동안 누가 살아 있는가: 값 캡처 / 그 시점의 상태 보관 / 포인터 복사는 대상 소유 아님; 참조 캡처 / 기존 객체를 빌림 / 원본 종료 전에만 호출; 이동 캡처 / 자원을 closure로 이전 / 재호출·복사 가능성 결정</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76c7b7"/></marker></defs><rect width="960" height="440" fill="#0c1420"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="36" y="49" fill="#eaf1ff" font-size="28" font-weight="700">06 · 표현을 고를 때 분리할 책임</text><rect x="30" y="98" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="132" fill="#76c7b7" font-size="24">값 캡처</text><text x="300" y="132" fill="#eaf1ff" font-size="23">그 시점의 상태 보관</text><text x="300" y="165" fill="#b9c9df" font-size="21">포인터 복사는 대상 소유 아님</text><rect x="30" y="202" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="236" fill="#76c7b7" font-size="24">참조 캡처</text><text x="300" y="236" fill="#eaf1ff" font-size="23">기존 객체를 빌림</text><text x="300" y="269" fill="#b9c9df" font-size="21">원본 종료 전에만 호출</text><rect x="30" y="306" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="340" fill="#76c7b7" font-size="24">이동 캡처</text><text x="300" y="340" fill="#eaf1ff" font-size="23">자원을 closure로 이전</text><text x="300" y="373" fill="#b9c9df" font-size="21">재호출·복사 가능성 결정</text></g></svg>