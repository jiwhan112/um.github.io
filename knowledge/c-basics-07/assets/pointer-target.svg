<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-label="주소 값과 실제 객체"><rect width="1080" height="300" rx="24" fill="#10202d"/><text x="48" y="58" font-size="29" font-weight="700" fill="#d6f4ff">주소 값과 실제 객체</text><g><rect x="48" y="96" width="318.6666666666667" height="112" rx="14" fill="#16413f" stroke="#62b8c3" stroke-width="2"/><text x="207.33333333333334" y="161" font-size="25" fill="#f0fbff" font-weight="600" text-anchor="middle">int level = 21</text></g><g><rect x="380.6666666666667" y="96" width="318.6666666666667" height="112" rx="14" fill="#153750" stroke="#62b8c3" stroke-width="2"/><text x="540" y="161" font-size="25" fill="#f0fbff" font-weight="600" text-anchor="middle">int *p = &amp;level</text></g><g><rect x="713.3333333333334" y="96" width="318.6666666666667" height="112" rx="14" fill="#16413f" stroke="#62b8c3" stroke-width="2"/><text x="872.6666666666667" y="161" font-size="25" fill="#f0fbff" font-weight="600" text-anchor="middle">*p 는 level</text></g><text x="48" y="253" font-size="22" fill="#c7d9e6">포인터 객체 p의 값은 주소, *p는 유효한 대상 객체</text></svg>
