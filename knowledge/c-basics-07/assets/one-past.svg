<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-label="배열 내부와 one-past의 경계"><rect width="1080" height="300" rx="24" fill="#10202d"/><text x="48" y="58" font-size="29" font-weight="700" fill="#d6f4ff">배열 내부와 one-past의 경계</text><g><rect x="48" y="96" width="235.5" height="112" rx="14" fill="#16413f" stroke="#62b8c3" stroke-width="2"/><text x="165.75" y="161" font-size="25" fill="#f0fbff" font-weight="600" text-anchor="middle">samples[0] = 4</text></g><g><rect x="297.5" y="96" width="235.5" height="112" rx="14" fill="#153750" stroke="#62b8c3" stroke-width="2"/><text x="415.25" y="161" font-size="25" fill="#f0fbff" font-weight="600" text-anchor="middle">samples[1] = 8</text></g><g><rect x="547" y="96" width="235.5" height="112" rx="14" fill="#16413f" stroke="#62b8c3" stroke-width="2"/><text x="664.75" y="161" font-size="25" fill="#f0fbff" font-weight="600" text-anchor="middle">samples[2] = 12</text></g><g><rect x="796.5" y="96" width="235.5" height="112" rx="14" fill="#153750" stroke="#62b8c3" stroke-width="2"/><text x="914.25" y="161" font-size="25" fill="#f0fbff" font-weight="600" text-anchor="middle">end = begin + 3</text></g><text x="48" y="253" font-size="22" fill="#c7d9e6">마지막 end는 비교에는 사용하지만 절대 *end 하지 않음</text></svg>
