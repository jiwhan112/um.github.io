<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">PowerOfTwo: 서로 독립적인 두 관찰</title><desc id="desc">상수 평가 PowerOfTwo(10)과 런타임 PowerOfTwo(31)은 별도 경로다. 고정 상한 31과 실제 관찰한 unsigned 폭은 일반화 한계다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="420" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">PowerOfTwo: 서로 독립적인 두 관찰</text><rect x="30" y="75" width="280" height="90" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="105" font-size="18" fill="#67e8f9">상수 평가 문맥</text><text x="46" y="133" font-size="16" fill="#e2e8f0">static_assert 입력: 10</text><path d="M310 120H370" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="370" y="75" width="550" height="90" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="386" y="105" font-size="18" fill="#67e8f9">PowerOfTwo(10) == 1024</text><text x="386" y="133" font-size="16" fill="#e2e8f0">컴파일 시점 검사 · 런타임 횟수에 더하지 않음</text><rect x="30" y="195" width="280" height="90" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="225" font-size="18" fill="#67e8f9">런타임 예외 시험</text><text x="46" y="253" font-size="16" fill="#e2e8f0">호출 입력: 31</text><path d="M310 240H370" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="370" y="195" width="550" height="90" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="386" y="225" font-size="18" fill="#67e8f9">시프트 전에 out_of_range</text><text x="386" y="253" font-size="16" fill="#e2e8f0">실행 중 거부 경로 · 첫 번째 관찰과 순서 관계 없음</text><rect x="30" y="320" width="890" height="70" rx="10" fill="#172554"/><text x="48" y="348" font-size="17" fill="#e2e8f0">일반화 한계: 31은 소스의 고정 제한이며 비트 폭에서 계산한 상한이 아닙니다.</text><text x="48" y="375" font-size="16" fill="#e2e8f0">기존 검증 환경은 unsigned 값 비트 32. 16비트 구현·모든 지수의 안전성을 뜻하지 않습니다.</text></g></svg>
