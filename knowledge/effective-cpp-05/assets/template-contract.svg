<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">제네릭 호출의 계약은 한 번에 끝나지 않는다</title><desc id="desc">컴파일 성공은 수명·의미·비용의 완전한 증명이 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">제네릭 호출의 계약은 한 번에 끝나지 않는다</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">이름·타입 해석</text><text x="46" y="145" fill="#f8fafc" font-size="17">typename / this-&gt;</text><text x="46" y="179" fill="#cbd5e1" font-size="15">어떤 선언을 뜻하는가</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">표현식 제약</text><text x="356" y="145" fill="#f8fafc" font-size="17">concept / requires</text><text x="356" y="179" fill="#cbd5e1" font-size="15">이 연산이 형식상 가능한가</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">실행 의미</text><text x="666" y="145" fill="#f8fafc" font-size="17">빈 범위·수명·값 범위</text><text x="666" y="179" fill="#cbd5e1" font-size="15">정상 동작의 별도 조건</text><text x="30" y="255" fill="#cbd5e1" font-size="17">컴파일 성공은 수명·의미·비용의 완전한 증명이 아닙니다.</text></g></svg>
