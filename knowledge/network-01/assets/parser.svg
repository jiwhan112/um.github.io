<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><title>파서 상태와 길이별 분기</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="1000" height="460" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="35" y="45" font-size="27" fill="#e2e8f0">파서 상태와 길이별 분기</text><rect x="40" y="110" width="210" height="70" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="48" y="140" font-size="18" fill="#e2e8f0">헤더 4 B 모으기</text><rect x="390" y="110" width="220" height="70" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="398" y="140" font-size="18" fill="#e2e8f0">BE32 길이 검사</text><rect x="750" y="110" width="210" height="70" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="758" y="140" font-size="18" fill="#e2e8f0">본문 N B 모으기</text><path d="M250 145 L380 145" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M610 145 L740 145" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="650" y="120" font-size="18" fill="#e2e8f0">1..32</text><rect x="390" y="285" width="220" height="70" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="398" y="315" font-size="18" fill="#e2e8f0">빈 프레임 방출</text><path d="M500 180 L500 275" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="510" y="235" font-size="18" fill="#e2e8f0">0</text><rect x="750" y="285" width="210" height="70" rx="5" fill="#17334a" stroke="#38bdf8"/><text x="758" y="315" font-size="18" fill="#e2e8f0">완성 프레임 방출</text><path d="M850 180 L850 275" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="45" y="250" font-size="20" fill="#fca5a5">상한 초과 → terminal</text><text x="45" y="420" font-size="22" fill="#e2e8f0">Finish 시 미완성 헤더/본문은 오류. 빈 Feed와 EOF는 다르다.</text></g></svg>
