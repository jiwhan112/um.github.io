<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>Reset에서 자원과 상태는 같은 수명이 아니다</title><rect width="960" height="460" rx="18" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="26" fill="#e2e8f0">Reset에서 자원과 상태는 같은 수명이 아니다</text><rect x="35" y="95" width="420" height="225" rx="12" fill="#162538" stroke="#475569"/><text x="55" y="140" font-size="24" fill="#e2e8f0">DEFAULT · VB / IB</text><text x="55" y="195" font-size="20" fill="#e2e8f0">Reset 전 Release</text><text x="55" y="240" font-size="20" fill="#e2e8f0">Reset 성공 후 재생성</text><text x="55" y="285" font-size="20" fill="#e2e8f0">일부 생성 실패도 확보분 정리</text><rect x="505" y="95" width="420" height="225" rx="12" fill="#162538" stroke="#475569"/><text x="525" y="140" font-size="24" fill="#e2e8f0">MANAGED · 체커 텍스처</text><text x="525" y="195" font-size="20" fill="#e2e8f0">일반 Reset: 논리 데이터 유지</text><text x="525" y="240" font-size="20" fill="#e2e8f0">장치 자체 재생성: 다시 준비</text><text x="525" y="285" font-size="20" fill="#e2e8f0">D3D9Ex가 아닌 이 예제의 정책</text><text x="35" y="380" font-size="24" fill="#e2e8f0">공통: Reset 성공 후 필요한 상태·바인딩 재설정</text><text x="35" y="425" font-size="20" fill="#e2e8f0">Reset 실패 → 임의 Draw 금지 / 재진입 메시지 → 플래그만 변경</text></g></svg>
