<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>두 Draw의 범위와 단위를 분리한다</title><rect width="960" height="460" rx="18" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="26" fill="#e2e8f0">두 Draw의 범위와 단위를 분리한다</text><text x="35" y="100" font-size="23" fill="#e2e8f0">VB: 정점 7개 × stride 24B = 168B</text><rect x="35" y="125" width="115" height="65" rx="12" fill="#155e75" stroke="#475569"/><text x="70" y="166" font-size="24" fill="#e2e8f0">0</text><rect x="160" y="125" width="115" height="65" rx="12" fill="#155e75" stroke="#475569"/><text x="195" y="166" font-size="24" fill="#e2e8f0">1</text><rect x="285" y="125" width="115" height="65" rx="12" fill="#155e75" stroke="#475569"/><text x="320" y="166" font-size="24" fill="#e2e8f0">2</text><rect x="410" y="125" width="115" height="65" rx="12" fill="#4c1d95" stroke="#475569"/><text x="445" y="166" font-size="24" fill="#e2e8f0">3</text><rect x="535" y="125" width="115" height="65" rx="12" fill="#4c1d95" stroke="#475569"/><text x="570" y="166" font-size="24" fill="#e2e8f0">4</text><rect x="660" y="125" width="115" height="65" rx="12" fill="#4c1d95" stroke="#475569"/><text x="695" y="166" font-size="24" fill="#e2e8f0">5</text><rect x="785" y="125" width="115" height="65" rx="12" fill="#4c1d95" stroke="#475569"/><text x="820" y="166" font-size="24" fill="#e2e8f0">6</text><text x="35" y="240" font-size="20" fill="#e2e8f0">왼쪽 삼각형: 정점 범위 0–2 / index 0–2 / triangle 1개</text><text x="35" y="285" font-size="20" fill="#e2e8f0">오른쪽 사각형: 정점 범위 3–6 / index 3–8 / triangle 2개</text><text x="35" y="350" font-size="23" fill="#e2e8f0">IB: uint16 인덱스 9개 = 18B</text><text x="35" y="405" font-size="20" fill="#e2e8f0">StartIndex는 인덱스 단위, 스트림 stride는 바이트 단위입니다.</text></g></svg>
