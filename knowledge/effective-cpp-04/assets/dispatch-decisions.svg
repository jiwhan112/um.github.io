<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">한 호출에 두 선택 규칙이 만난다</title><desc id="desc">기본 인수 선택과 가상 함수 본체 선택을 하나의 동적 과정으로 설명하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">한 호출에 두 선택 규칙이 만난다</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">호출식의 정적 타입</text><text x="46" y="145" fill="#f8fafc" font-size="17">Effect&amp; → 기본값 2</text><text x="46" y="179" fill="#cbd5e1" font-size="15">Fire* → 기본값 3</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">객체의 동적 타입</text><text x="356" y="145" fill="#f8fafc" font-size="17">실제 객체는 Fire</text><text x="356" y="179" fill="#cbd5e1" font-size="15">Strength 본체는 Fire</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">관찰 결과</text><text x="666" y="145" fill="#f8fafc" font-size="17">2 × 10 = 20</text><text x="666" y="179" fill="#cbd5e1" font-size="15">3 × 10 = 30</text><text x="30" y="255" fill="#cbd5e1" font-size="17">기본 인수 선택과 가상 함수 본체 선택을 하나의 동적 과정으로 설명하지 않습니다.</text></g></svg>
