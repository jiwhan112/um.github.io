<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">NVI: 공개 검사에서 거부하거나 계산으로 진행</title><desc id="desc">Apply는 범위 밖 입력을 훅 호출 전에 거부한다. 유효한 입력만 ApplyImpl과 HalfDamage로 전달된다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="420" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">NVI: 공개 검사에서 거부하거나 계산으로 진행</text><rect x="30" y="150" width="240" height="100" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="180" font-size="18" fill="#67e8f9">공개 비가상 Apply</text><text x="46" y="208" font-size="16" fill="#e2e8f0">입력 범위: 0..1000</text><path d="M270 200H310V105H380" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="88" font-size="15" fill="#e2e8f0">범위 밖</text><rect x="380" y="70" width="540" height="80" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="396" y="100" font-size="18" fill="#67e8f9">invalid_argument</text><text x="396" y="128" font-size="16" fill="#e2e8f0">-1 → 예외: ApplyImpl은 호출되지 않음</text><path d="M270 200H330" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="235" font-size="15" fill="#e2e8f0">범위 안</text><rect x="330" y="170" width="260" height="100" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="346" y="200" font-size="18" fill="#67e8f9">private 가상 ApplyImpl</text><text x="346" y="228" font-size="16" fill="#e2e8f0">검사를 통과한 값만 전달</text><path d="M590 220H650" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="170" width="270" height="100" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="200" font-size="18" fill="#67e8f9">HalfDamage 계산</text><text x="666" y="228" font-size="16" fill="#e2e8f0">10 → 10 / 2 → 5</text><text x="30" y="330" font-size="17" fill="#e2e8f0">기존 시험은 10과 -1을 관찰합니다. 1000 초과 거부 분기는 실행하지 않았습니다.</text></g></svg>
