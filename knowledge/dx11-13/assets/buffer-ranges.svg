<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>NO_OVERWRITE: GPU 사용 범위를 건드리지 않는다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">NO_OVERWRITE: GPU 사용 범위를 건드리지 않는다</text><rect x="70" y="130" width="330" height="100" fill="#7f1d1d"/><rect x="400" y="130" width="230" height="100" fill="#164e63"/><rect x="630" y="130" width="260" height="100" fill="#334155"/><text x="100" y="190" font-size="22" fill="#e2e8f0">GPU in-flight</text><text x="430" y="190" font-size="22" fill="#e2e8f0">새 쓰기</text><text x="665" y="190" font-size="22" fill="#e2e8f0">남은 공간</text><text x="70" y="300" font-size="22" fill="#e2e8f0">NO_OVERWRITE는 동기화 자동 해결이나 += 연산이 아니다.</text><text x="70" y="365" font-size="21" fill="#e2e8f0">DISCARD와 범위 재사용 시점은 별도 업로드 정책으로 관리한다.</text></g></svg>
