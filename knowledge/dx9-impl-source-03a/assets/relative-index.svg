<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">v1.1 반례 · 상대 인덱스를 VB 위치로 바꾸기</title><desc id="desc">IB와 Min은 Base 기준의 상대 값이다. 넓은 CPU int64 계약과 D3D9 INT를 구별한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">v1.1 반례 · 상대 인덱스를 VB 위치로 바꾸기</text><rect x="30" y="105" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="135" font-size="20" fill="#64d8cb">선언된 상대 범위</text><text x="46" y="165" font-size="18" fill="#e5edf7">Min=3, NumVertices=3</text><text x="46" y="195" font-size="18" fill="#e5edf7">IB = {3,4,5}</text><rect x="345" y="105" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="135" font-size="20" fill="#64d8cb">Base=-3 적용</text><text x="361" y="165" font-size="18" fill="#e5edf7">각 IB 값 + (-3)</text><text x="361" y="195" font-size="18" fill="#e5edf7">→ {0,1,2}</text><rect x="660" y="105" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="135" font-size="20" fill="#64d8cb">실제 VB: 3정점</text><text x="676" y="165" font-size="18" fill="#e5edf7">위치 0,1,2 모두 유효</text><text x="676" y="195" font-size="18" fill="#e5edf7">원형의 거짓 거부를 교정</text><path d="M300 180 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 180 H653" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="330" font-size="19" fill="#e5edf7">큰 수는 더한 뒤 검사하지 않는다. 뺄셈·범위 비교로 연산 전에 제한한다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">IB와 Min은 Base 기준의 상대 값이다. 넓은 CPU int64 계약과 D3D9 INT를 구별한다.</text></g></svg>
