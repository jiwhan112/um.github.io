<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">2000바이트 게임 데이터를 16바이트 게임 헤더와 함께 분할</title><desc id="desc">IPv4 UDP MTU1500에서 UDP페이로드1472, 게임헤더16 차감 후 실제데이터1456. 2000은1456+544로 나누며 IP패킷은1500과588.</desc><rect width="960" height="430" rx="20" fill="#101827"/><style>text{font-family:system-ui,sans-serif;fill:#e6eef9;font-size:20px}.small{font-size:17px}.title{font-size:26px;font-weight:700}.green{fill:#8ce6b8}.muted{fill:#a8bbd2}</style><text x="32" y="46" class="title">2000 B 게임 데이터: UDP 예산에서 게임 헤더도 차감</text><text x="32" y="87" class="small muted">가정: MTU 1500 B, IPv4 20 B, UDP 8 B, 게임 헤더 16 B · 비례 축척 아님</text><text x="32" y="133" class="green">한 조각의 게임 데이터 한도 = 1500 − 20 − 8 − 16 = 1456 B</text><rect x="32" y="160" width="205" height="66" fill="#31557f"/><text x="45" y="199">IP+UDP 28 B</text><rect x="242" y="160" width="190" height="66" fill="#654580"/><text x="255" y="199">게임 헤더 16 B</text><rect x="437" y="160" width="470" height="66" fill="#23654d"/><text x="455" y="199">데이터 1456 B → 총 1500 B</text><rect x="32" y="246" width="205" height="66" fill="#31557f"/><text x="45" y="285">IP+UDP 28 B</text><rect x="242" y="246" width="190" height="66" fill="#654580"/><text x="255" y="285">게임 헤더 16 B</text><rect x="437" y="246" width="470" height="66" fill="#23654d"/><text x="455" y="285">데이터 544 B → 총 588 B</text><text x="32" y="360" class="small">각 게임 헤더: 메시지 ID · 조각 번호 등은 설계 필요. 예제는 필드 직렬화나 재조립을 구현하지 않음.</text><text x="32" y="395" class="small muted">앱이 만든 2개 데이터그램 ≠ IP 계층 조각 2개 · 성공 전달/순서/손실 복구를 보장하지 않음</text></svg>
