<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">같은 MTU에서 헤더별 페이로드 예산</title><desc id="desc">MTU 1500에서 IPv4 TCP 1460 UDP1472, IPv6 TCP1440 UDP1452. 헤더 너비는 설명용이며 비례 축척이 아니다.</desc><rect width="960" height="410" rx="20" fill="#101827"/><style>text{font-family:system-ui,sans-serif;fill:#e6eef9;font-size:20px}.small{font-size:17px}.title{font-size:26px;font-weight:700}.green{fill:#8ce6b8}.muted{fill:#a8bbd2}</style><text x="32" y="46" class="title">1500 B IP 패킷 예산 = IP 헤더 + 전송 헤더 + 페이로드</text><text x="32" y="85" class="small muted">옵션·확장헤더 없음 · 칸 너비는 비례 축척 아님 · 링크 프레임 헤더 제외</text><text x="32" y="143">IPv4 TCP</text><rect x="210" y="115" width="190" height="42" fill="#31557f"/><text x="225" y="143">IP 20 B</text><rect x="405" y="115" width="180" height="42" fill="#654580"/><text x="420" y="143">TCP 20 B</text><rect x="590" y="115" width="325" height="42" fill="#23654d"/><text x="615" y="143">1460 B</text><text x="32" y="203">IPv4 UDP</text><rect x="210" y="175" width="190" height="42" fill="#31557f"/><text x="225" y="203">IP 20 B</text><rect x="405" y="175" width="180" height="42" fill="#654580"/><text x="420" y="203">UDP 8 B</text><rect x="590" y="175" width="325" height="42" fill="#23654d"/><text x="615" y="203">1472 B</text><text x="32" y="263">IPv6 TCP</text><rect x="210" y="235" width="190" height="42" fill="#31557f"/><text x="225" y="263">IP 40 B</text><rect x="405" y="235" width="180" height="42" fill="#654580"/><text x="420" y="263">TCP 20 B</text><rect x="590" y="235" width="325" height="42" fill="#23654d"/><text x="615" y="263">1440 B</text><text x="32" y="323">IPv6 UDP</text><rect x="210" y="295" width="190" height="42" fill="#31557f"/><text x="225" y="323">IP 40 B</text><rect x="405" y="295" width="180" height="42" fill="#654580"/><text x="420" y="323">UDP 8 B</text><rect x="590" y="295" width="325" height="42" fill="#23654d"/><text x="615" y="323">1452 B</text><text x="32" y="377" class="small muted">페이로드 안의 게임 헤더·암호화 태그도 공간을 쓴다. 숫자는 경로 MTU 측정 결과가 아니다.</text></svg>
