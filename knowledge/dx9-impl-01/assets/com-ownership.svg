<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">주소의 복사와 소유 참조의 추가는 다르다</title><desc id="desc">ComOwner는 이미 확보된 참조 하나를 인수한다. 단순 포인터 복사는 AddRef가 아니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">주소의 복사와 소유 참조의 추가는 다르다</text><rect x="30" y="90" width="350" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="120" font-size="20" fill="#64d8cb">생성 API의 참조 1개</text><text x="46" y="150" font-size="18" fill="#e5edf7">owner A가 인수</text><text x="46" y="180" font-size="18" fill="#e5edf7">A 소멸 시 Release 1회</text><rect x="580" y="90" width="350" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="596" y="120" font-size="20" fill="#64d8cb">비소유 관찰 포인터</text><text x="596" y="150" font-size="18" fill="#e5edf7">get()으로 주소를 읽음</text><text x="596" y="180" font-size="18" fill="#e5edf7">별도 Release하지 않음</text><path d="M380 150 H573" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="435" y="132" font-size="16" fill="#f5c36b">빌림</text><rect x="30" y="285" width="350" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="315" font-size="20" fill="#64d8cb">별도 소유가 필요하면</text><text x="46" y="345" font-size="18" fill="#e5edf7">먼저 AddRef로 참조 추가</text><text x="46" y="375" font-size="18" fill="#e5edf7">그 참조를 owner B에 인계</text><rect x="580" y="285" width="350" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="596" y="315" font-size="20" fill="#64d8cb">각 소유자 독립 정리</text><text x="596" y="345" font-size="18" fill="#e5edf7">A: Release 1회</text><text x="596" y="375" font-size="18" fill="#e5edf7">B: Release 1회</text><path d="M380 340 H573" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="407" y="322" font-size="16" fill="#f5c36b">추가 참조의 수명</text><text x="30" y="428" font-size="17" fill="#bdcde2">ComOwner는 이미 확보된 참조 하나를 인수한다. 단순 포인터 복사는 AddRef가 아니다.</text></g></svg>
