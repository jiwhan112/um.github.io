<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">장치 생성은 반환 종류별로 검사한다</title><desc id="desc">실패한 출력 포인터를 사용하지 않는다. 창·COM 소유권을 획득 역순으로 정리한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">장치 생성은 반환 종류별로 검사한다</text><rect x="30" y="175" width="300" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="205" font-size="20" fill="#64d8cb">Direct3DCreate9</text><text x="46" y="235" font-size="18" fill="#e5edf7">null 여부 확인</text><text x="46" y="265" font-size="18" fill="#e5edf7">성공한 참조만 보관</text><rect x="585" y="80" width="345" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="110" font-size="20" fill="#64d8cb">CreateDevice 실패</text><text x="601" y="140" font-size="18" fill="#e5edf7">FAILED(hr) → 오류 기록</text><text x="601" y="170" font-size="18" fill="#e5edf7">획득한 자원만 정리</text><rect x="585" y="270" width="345" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="300" font-size="20" fill="#64d8cb">CreateDevice 성공</text><text x="601" y="330" font-size="18" fill="#e5edf7">SUCCEEDED(hr) + 장치</text><text x="601" y="360" font-size="18" fill="#e5edf7">Clear·Present 단계로 진행</text><path d="M330 230 H455 V135 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="352" y="210" font-size="16" fill="#f5c36b">CreateDevice</text><path d="M455 230 V325 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">실패한 출력 포인터를 사용하지 않는다. 창·COM 소유권을 획득 역순으로 정리한다.</text></g></svg>
