<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">배치의 두 번째 명령이 실패하면?</title><desc id="desc">첫 명령의 임시 성공은 배치 전체의 성공을 뜻하지 않는다.</desc>
<rect width="960" height="390" rx="20" fill="#101b2d"/>
<text x="40" y="48" fill="#f2f6ff" font-family="sans-serif" font-size="25">배치의 두 번째 명령이 실패하면?</text>
<rect x="40" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="60" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">원본 bag</text>
<text x="60" y="180" fill="#fff" font-family="sans-serif" font-size="17">아이템 0 = 5 / 1 = 0</text>
<text x="60" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">candidate로 값 복사</text>
<path d="M 316 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="345" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="365" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">임시 변경</text>
<text x="365" y="180" fill="#fff" font-family="sans-serif" font-size="17">add 1 4 → 성공</text>
<text x="365" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">use 0 6 → 재고 부족</text>
<path d="M 621 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="650" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="670" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">배치 거부</text>
<text x="670" y="180" fill="#fff" font-family="sans-serif" font-size="17">원본: 여전히 5 / 0</text>
<text x="670" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">failed_at = 1, 변경 없음</text>
<text x="40" y="335" fill="#f5c36b" font-family="sans-serif" font-size="18">첫 명령의 임시 성공은 배치 전체의 성공을 뜻하지 않는다.</text>
</svg>
