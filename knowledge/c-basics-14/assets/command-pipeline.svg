<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">문자열에서 상태 변경까지 · 세 경계</title><desc id="desc">문법 오류, 범위 오류, 재고 부족을 서로 다른 결과로 돌려준다.</desc>
<rect width="960" height="390" rx="20" fill="#101b2d"/>
<text x="40" y="48" fill="#f2f6ff" font-family="sans-serif" font-size="25">문자열에서 상태 변경까지 · 세 경계</text>
<rect x="40" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="60" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">parse_command</text>
<text x="60" y="180" fill="#fff" font-family="sans-serif" font-size="17">문자열 → Command</text>
<text x="60" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">문법·정수 범위 검증</text>
<path d="M 316 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="345" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="365" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">apply_command</text>
<text x="365" y="180" fill="#fff" font-family="sans-serif" font-size="17">Command → candidate</text>
<text x="365" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">아이템·재고·상한 검증</text>
<path d="M 621 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="650" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="670" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">run_batch</text>
<text x="670" y="180" fill="#fff" font-family="sans-serif" font-size="17">candidate → 실제 bag</text>
<text x="670" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">전부 성공한 경우만 커밋</text>
<text x="40" y="335" fill="#f5c36b" font-family="sans-serif" font-size="18">문법 오류, 범위 오류, 재고 부족을 서로 다른 결과로 돌려준다.</text>
</svg>
