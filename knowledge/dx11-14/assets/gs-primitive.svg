<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>GS 호출 단위는 Primitive다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">GS 호출 단위는 Primitive다</text><rect x="45" y="115" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="59" y="151" font-size="22" fill="#e2e8f0">VS: clip 위치</text><rect x="355" y="115" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="369" y="151" font-size="22" fill="#e2e8f0">GS: Point 1개 입력</text><rect x="665" y="115" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="679" y="151" font-size="22" fill="#e2e8f0">Strip: 정점 4개 출력</text><path d="M295 150 L345 150" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M605 150 L655 150" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="60" y="270" font-size="22" fill="#e2e8f0">출력 상한·UV·w·RestartStrip 계약을 함께 확인</text><text x="60" y="335" font-size="21" fill="#e2e8f0">CPU 수치 모델 통과 ≠ HLSL 컴파일 또는 GPU 출력 검증</text></g></svg>
