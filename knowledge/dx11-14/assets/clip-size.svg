<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>같은 화면 크기: clip 오프셋에 w를 곱한다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">같은 화면 크기: clip 오프셋에 w를 곱한다</text><rect x="50" y="100" width="360" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="64" y="136" font-size="22" fill="#e2e8f0">clip.w=2: Δclip.x=0.2</text><rect x="550" y="100" width="360" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="564" y="136" font-size="22" fill="#e2e8f0">clip.w=10: Δclip.x=1.0</text><text x="80" y="255" font-size="22" fill="#e2e8f0">0.2 / 2 = NDC 0.1</text><text x="580" y="255" font-size="22" fill="#e2e8f0">1.0 / 10 = NDC 0.1</text><text x="60" y="340" font-size="22" fill="#e2e8f0">halfExtentNdc = 0.1 · 원근 나눗셈 뒤 같은 크기</text><text x="60" y="400" font-size="20" fill="#e2e8f0">월드 크기를 원하면 월드 right/up으로 확장한 뒤 VP 변환한다.</text></g></svg>
