<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">미러 UV는 B 방향을 바꿀 수 있다</title><desc id="desc">T와N은같고handedness가바뀌면B가반전된다.초록normal성분의방향이달라진다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">미러 UV는 B 방향을 바꿀 수 있다</text><text x="130" y="105" fill="#e7eef8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">handedness = +1</text><line x1="250" y1="275" x2="370" y2="275" stroke="#6ee7c8" stroke-width="4" /><line x1="250" y1="275" x2="250" y2="165" stroke="#78aafa" stroke-width="4" /><circle cx="250" cy="275" r="11" stroke="#f8b66c" fill="none" stroke-width="3"/><text x="375" y="282" fill="#6ee7c8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">T</text><text x="262" y="160" fill="#78aafa" font-size="24" font-family="Noto Sans CJK KR, sans-serif">B</text><text x="130" y="445" fill="#f8b66c" font-size="20" font-family="Noto Sans CJK KR, sans-serif">N = 화면 밖 방향</text><text x="580" y="105" fill="#e7eef8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">handedness = -1</text><line x1="700" y1="275" x2="820" y2="275" stroke="#6ee7c8" stroke-width="4" /><line x1="700" y1="275" x2="700" y2="385" stroke="#78aafa" stroke-width="4" /><circle cx="700" cy="275" r="11" stroke="#f8b66c" fill="none" stroke-width="3"/><text x="825" y="282" fill="#6ee7c8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">T</text><text x="712" y="390" fill="#78aafa" font-size="24" font-family="Noto Sans CJK KR, sans-serif">B</text><text x="580" y="445" fill="#f8b66c" font-size="20" font-family="Noto Sans CJK KR, sans-serif">N = 화면 밖 방향</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>