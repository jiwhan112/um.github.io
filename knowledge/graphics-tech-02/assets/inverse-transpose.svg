<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">길이 정규화만으로 수직 관계를 복원할 수 없다</title><desc id="desc">비균일스케일뒤접선과올바른역전치법선은수직이지만같은스케일법선은수직이아니다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">길이 정규화만으로 수직 관계를 복원할 수 없다</text><text x="110" y="110" fill="#6ee7c8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">올바른 역전치</text><line x1="110" y1="235" x2="370" y2="365" stroke="#a7b8d0" stroke-width="4" /><line x1="240" y1="300" x2="302.58" y2="174.84" stroke="#6ee7c8" stroke-width="5" /><circle cx="240" cy="300" r="5" stroke="#6ee7c8" fill="#6ee7c8" stroke-width="3"/><text x="130" y="420" fill="#e7eef8" font-size="18" font-family="Noto Sans CJK KR, sans-serif">scale (2, 1) 뒤 접선</text><text x="140" y="455" fill="#6ee7c8" font-size="22" font-family="Noto Sans CJK KR, sans-serif">내적 = 0</text><text x="570" y="110" fill="#fb7185" font-size="24" font-family="Noto Sans CJK KR, sans-serif">잘못된 같은 scale</text><line x1="570" y1="235" x2="830" y2="365" stroke="#a7b8d0" stroke-width="4" /><line x1="700" y1="300" x2="825.16" y2="237.42000000000002" stroke="#fb7185" stroke-width="5" /><circle cx="700" cy="300" r="5" stroke="#fb7185" fill="#fb7185" stroke-width="3"/><text x="590" y="420" fill="#e7eef8" font-size="18" font-family="Noto Sans CJK KR, sans-serif">scale (2, 1) 뒤 접선</text><text x="600" y="455" fill="#fb7185" font-size="22" font-family="Noto Sans CJK KR, sans-serif">내적 = 0 아님</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>