<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">두 CPU 실행 파일의 책임을 나눈다</title><desc id="d">왼쪽과 오른쪽 상자는 소스의 역할과 검증 경계를 구분합니다. 위에서 아래로 프로그램 실행을 모두 구현했다는 뜻이 아닙니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">두 CPU 실행 파일의 책임을 나눈다</text><rect x="25" y="100" width="910" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="130" font-size="18" fill="#e2e8f0">11_collision: 형상 교차 bool / ray t</text><text x="39" y="157" font-size="18" fill="#e2e8f0">XZ OBB는 높이 분리를 검사 안 함</text><text x="39" y="184" font-size="18" fill="#e2e8f0">물리 응답·GPU 디버그 출력 없음</text><rect x="25" y="270" width="910" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="300" font-size="18" fill="#e2e8f0">12_navmesh: 공유 인덱스 → 셀 그래프</text><text x="39" y="327" font-size="18" fill="#e2e8f0">출력은 triangle index corridor</text><text x="39" y="354" font-size="18" fill="#e2e8f0">Funnel·Agent Radius·Recast 없음</text></g></svg>
