<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">좌표는 숫자보다 공간 이름과 순서가 먼저</title><desc id="desc">선택한 정점의 clip→클립검사→NDC→화면 경로와 경계 교차 다각형의 개념도. 아래 평면 그림은 좌표 비례가 아닌 모식도입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="440" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">좌표는 숫자보다 공간 이름과 순서가 먼저</text><rect x="30" y="80" width="265" height="90" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="108" font-size="19" fill="#67e8f9">클립 좌표</text><text x="44" y="133" font-size="17" fill="#e2e8f0">(1.5, 1, 4.4, 5)</text><path d="M295 125H345" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="345" y="80" width="265" height="90" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="359" y="108" font-size="19" fill="#67e8f9">나누기 전에 클립</text><text x="359" y="133" font-size="17" fill="#e2e8f0">-w≤x,y≤w / 0≤z≤w</text><path d="M610 125H660" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="660" y="80" width="270" height="90" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="674" y="108" font-size="19" fill="#67e8f9">w=5로 나눈 NDC</text><text x="674" y="133" font-size="17" fill="#e2e8f0">(0.3, 0.2, 0.88)</text><path d="M795 170V225" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="660" y="225" width="270" height="90" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="674" y="253" font-size="19" fill="#67e8f9">800×600 뷰포트</text><text x="674" y="278" font-size="17" fill="#e2e8f0">(520, 240), 깊이 .88</text><path d="M80 225L400 225L400 365Z" fill="#164e63" stroke="#67e8f9"/><path d="M210 195V380" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 5"/><polygon points="210,225 400,225 400,365 210,282" fill="#0d9488" opacity=".65"/><text x="30" y="205" font-size="16" fill="#e2e8f0">경계 교차 모식도: 안쪽 부분을 남김</text><text x="35" y="400" font-size="16" fill="#e2e8f0">밖 정점만 삭제하지 않고 교점을 생성합니다.</text></g></svg>
