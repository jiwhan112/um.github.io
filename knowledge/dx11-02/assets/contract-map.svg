<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">링 버퍼 예약: CPU가 약속할 안전 구간</title><desc id="desc">24바이트 모델에서 12바이트 기록 후 8바이트를 새 구간에 예약합니다. 남은 4바이트보다 큰 추가 요청은 거부합니다. 실제 GPU 완료 추적은 모델 밖입니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c47a"/></marker></defs><rect width="960" height="430" rx="18" fill="#0c1929"/><g font-family="sans-serif"><text x="28" y="43" font-size="25" fill="#edf4ff">링 버퍼 예약: CPU가 약속할 안전 구간</text><text x="30" y="95" font-size="22" fill="#edf4ff">용량 24 · 첫 DISCARD 예약 12 · 다음 NO_OVERWRITE 예약 8</text><rect x="40" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="75" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="110" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="145" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="180" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="215" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="250" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="285" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="320" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="355" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="390" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="425" y="135" width="34" height="92" fill="#256779" stroke="#a9c2d9"/><rect x="460" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="495" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="530" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="565" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="600" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="635" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="670" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="705" y="135" width="34" height="92" fill="#6b5f95" stroke="#a9c2d9"/><rect x="740" y="135" width="34" height="92" fill="#273546" stroke="#a9c2d9"/><rect x="775" y="135" width="34" height="92" fill="#273546" stroke="#a9c2d9"/><rect x="810" y="135" width="34" height="92" fill="#273546" stroke="#a9c2d9"/><rect x="845" y="135" width="34" height="92" fill="#273546" stroke="#a9c2d9"/><text x="60" y="270" font-size="21" fill="#edf4ff">[0,12) 이미 기록</text><text x="470" y="270" font-size="21" fill="#edf4ff">[12,20) 새 기록</text><text x="740" y="270" font-size="21" fill="#edf4ff">남은 4</text><text x="30" y="330" font-size="22" fill="#edf4ff">추가 8 요청 → 용량 부족으로 거부</text><text x="30" y="380" font-size="18" fill="#edf4ff">NO_OVERWRITE는 GPU 사용 중인 범위를 피한다는 호출자의 책임입니다.</text></g></svg>
