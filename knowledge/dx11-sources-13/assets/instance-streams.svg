<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>공유 메시와 인스턴스 스트림은 다른 차원</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">공유 메시와 인스턴스 스트림은 다른 차원</text><rect x="60" y="100" width="340" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="74" y="136" font-size="22" fill="#e2e8f0">Slot0: 공유 VB / 정점별</text><rect x="60" y="260" width="340" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="74" y="296" font-size="22" fill="#e2e8f0">Slot1: World / 인스턴스별</text><rect x="600" y="180" width="300" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="614" y="216" font-size="22" fill="#e2e8f0">하나의 Instanced Draw</text><path d="M400 135 L590 205" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M400 295 L590 225" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="65" y="220" font-size="22" fill="#e2e8f0">공유 IB: 같은 삼각형 인덱스</text><text x="60" y="400" font-size="20" fill="#e2e8f0">IndexCountPerInstance × InstanceCount: IB를 반복 복제하는 뜻이 아니다.</text></g></svg>
