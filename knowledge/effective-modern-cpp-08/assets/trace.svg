<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">실행 흐름에서 변하는 계약</title><desc id="desc">Pimpl·삽입·비용의 통합 판단: 헤더 → Impl 전방 선언; cpp → 컨테이너 실제 정의; Add → 검증 후 삽입; 이동 후 → 빈 상태·재생성</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76c7b7"/></marker></defs><rect width="960" height="500" fill="#0c1420"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="36" y="49" fill="#eaf1ff" font-size="28" font-weight="700">08 · 실행 흐름에서 변하는 계약</text><rect x="42" y="92" width="876" height="66" rx="12" fill="#172436" stroke="#496582"/><circle cx="76" cy="125" r="19" fill="#76c7b7"/><text x="76" y="132" text-anchor="middle" fill="#0c1420" font-size="22">1</text><text x="113" y="133" fill="#eaf1ff" font-size="25">헤더 → Impl 전방 선언</text><path d="M480 159v22" stroke="#76c7b7" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="184" width="876" height="66" rx="12" fill="#172436" stroke="#496582"/><circle cx="76" cy="217" r="19" fill="#76c7b7"/><text x="76" y="224" text-anchor="middle" fill="#0c1420" font-size="22">2</text><text x="113" y="225" fill="#eaf1ff" font-size="25">cpp → 컨테이너 실제 정의</text><path d="M480 251v22" stroke="#76c7b7" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="276" width="876" height="66" rx="12" fill="#172436" stroke="#496582"/><circle cx="76" cy="309" r="19" fill="#76c7b7"/><text x="76" y="316" text-anchor="middle" fill="#0c1420" font-size="22">3</text><text x="113" y="317" fill="#eaf1ff" font-size="25">Add → 검증 후 삽입</text><path d="M480 343v22" stroke="#76c7b7" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="368" width="876" height="66" rx="12" fill="#172436" stroke="#496582"/><circle cx="76" cy="401" r="19" fill="#76c7b7"/><text x="76" y="408" text-anchor="middle" fill="#0c1420" font-size="22">4</text><text x="113" y="409" fill="#eaf1ff" font-siz