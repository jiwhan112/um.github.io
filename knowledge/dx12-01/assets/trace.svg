<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
<title>DirectX 12 01 · 실행 계약 시각화</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker></defs>
<rect width="1080" height="620" rx="18" fill="#0f172a"/>
<text x="36" y="53" fill="#f8fafc" font-family="sans-serif" font-size="29">장치 선택: 정책과 실제 기능 검사</text>
<rect x="50" y="110" width="420" height="80" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="64" y="158.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">adapter 0: software</text>
<path d="M480 150 L560 150" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="575" y="110" width="450" height="80" rx="9" fill="#7f1d1d" stroke="#64748b"/>
<text x="589" y="158.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">기본 정책에서 제외</text>
<rect x="50" y="235" width="420" height="80" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="64" y="283.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">adapter 1: FL 생성 실패</text>
<path d="M480 275 L560 275" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="575" y="235" width="450" height="80" rx="9" fill="#7f1d1d" stroke="#64748b"/>
<text x="589" y="283.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">다음 후보 조사</text>
<rect x="50" y="360" width="420" height="80" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="64" y="408.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">adapter 2: 생성 성공</text>
<path d="M480 400 L560 400" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="575" y="360" width="450" height="80" rx="9" fill="#14532d" stroke="#64748b"/>
<text x="589" y="408.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">선택 기능은 별도 확인</text>
<text x="55" y="535" fill="#fbbf24" font-family="sans-serif" font-size="23">--warp를 명시한 경우만 소프트웨어 경로로 분기</text>
<text x="35" y="603" fill="#94a3b8" font-family="sans-serif" font-size="17">자체 제작 개념도 · 실제 GPU 캡처 또는 측정 결과가 아닙니다</text>
</svg>