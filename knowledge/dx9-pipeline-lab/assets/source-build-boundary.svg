<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">전체 소스가 있다는 것과 실행했다는 것은 다르다</title><desc id="desc">공통 헤더와5개CPU실행대상의 의존 관계, 빌드에서 제외된HLSL, 원본복원·실행로그 증거를 분리한 지도입니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="440" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">전체 소스가 있다는 것과 실행했다는 것은 다르다</text><rect x="30" y="90" width="270" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="118" font-size="19" fill="#67e8f9">공통 계산·검사</text><text x="44" y="143" font-size="17" fill="#e2e8f0">pipeline.hpp</text><text x="44" y="168" font-size="17" fill="#e2e8f0">check.hpp</text><path d="M300 140H365" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="365" y="75" width="560" height="140" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="379" y="103" font-size="19" fill="#67e8f9">CMake의 CPU 실행 대상 5개</text><text x="379" y="128" font-size="17" fill="#e2e8f0">vertex_input / transform_clip / raster_uv</text><text x="379" y="153" font-size="17" fill="#e2e8f0">depth_blend / pipeline_trace</text><text x="379" y="178" font-size="17" fill="#e2e8f0">각 main → 공통 계산 → 검사기 → 콘솔</text><rect x="30" y="270" width="430" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="298" font-size="19" fill="#67e8f9">별도 참고: texture_sm3.hlsl</text><text x="44" y="323" font-size="17" fill="#e2e8f0">CMake CPU 대상에 포함 안 됨</text><text x="44" y="348" font-size="17" fill="#e2e8f0">FXC·D3D9·GPU 실행 미검증</text><rect x="500" y="270" width="425" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="514" y="298" font-size="19" fill="#67e8f9">증거: source + logs</text><text x="514" y="323" font-size="17" fill="#e2e8f0">Markdown에서12개 원본 복원</text><text x="514" y="348" font-size="17" fill="#e2e8f0">원본 ZIP 바이트는 미확보</text></g></svg>
