<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>가장 안쪽 후보도 밖이면 AABB 전체를 제거</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">가장 안쪽 후보도 밖이면 AABB 전체를 제거</text><path d="M300 95 L300 340" stroke="#38bdf8" stroke-width="3"/><path d="M300 130 L470 130" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="210" width="130" height="100" fill="#7f1d1d" stroke="#fca5a5"/><circle cx="215" cy="210" r="7" fill="#fbbf24"/><text x="90" y="360" font-size="20" fill="#e2e8f0">상자 전체 x &lt; 0</text><text x="335" y="190" font-size="22" fill="#e2e8f0">평면 x≥0: 안쪽</text><text x="500" y="260" font-size="22" fill="#e2e8f0">n=(1,0,0), d=0</text><text x="500" y="310" font-size="22" fill="#e2e8f0">positive x = xmax &lt; 0</text><text x="500" y="360" font-size="22" fill="#e2e8f0">→ 전체 상자 Outside</text><text x="60" y="410" font-size="19" fill="#e2e8f0">6평면 모두 통과해도 정확한 교차 확정은 아니다: 보수적 후보 유지.</text></g></svg>
