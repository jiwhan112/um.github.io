<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>중심점이 아니라 경계 체적 전체를 검사한다</title><rect width="960" height="460" rx="18" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="26" fill="#e2e8f0">중심점이 아니라 경계 체적 전체를 검사한다</text><path d="M350 90 L350 190" fill="none" stroke="#94a3b8" stroke-width="3"/><circle cx="215" cy="140" r="48" fill="#0e7490" fill-opacity=".45" stroke="#67e8f9" stroke-width="3"/><text x="580" y="136" font-size="23" fill="#e2e8f0">Out</text><text x="580" y="169" font-size="18" fill="#e2e8f0">s + r &lt; 0 : 전체가 바깥</text><path d="M350 205 L350 305" fill="none" stroke="#94a3b8" stroke-width="3"/><circle cx="345" cy="255" r="48" fill="#0e7490" fill-opacity=".45" stroke="#67e8f9" stroke-width="3"/><text x="580" y="251" font-size="23" fill="#e2e8f0">Intersect 후보</text><text x="580" y="284" font-size="18" fill="#e2e8f0">경계에 닿거나 걸침</text><path d="M350 320 L350 420" fill="none" stroke="#94a3b8" stroke-width="3"/><circle cx="490" cy="370" r="48" fill="#0e7490" fill-opacity=".45" stroke="#67e8f9" stroke-width="3"/><text x="580" y="366" font-size="23" fill="#e2e8f0">이 평면 안쪽</text><text x="580" y="399" font-size="18" fill="#e2e8f0">다른 5평면도 계속 검사</text><text x="55" y="85" font-size="20" fill="#e2e8f0">바깥 (s&lt;0)</text><text x="355" y="85" font-size="20" fill="#e2e8f0">안쪽 법선 →</text></g></svg>
