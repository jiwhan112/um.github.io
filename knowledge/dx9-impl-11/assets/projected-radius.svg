<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>구와 AABB가 같은 평면 검사를 쓰는 이유</title><rect width="960" height="460" rx="18" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="26" fill="#e2e8f0">구와 AABB가 같은 평면 검사를 쓰는 이유</text><rect x="35" y="95" width="410" height="245" rx="12" fill="#162538" stroke="#475569"/><text x="55" y="135" font-size="24" fill="#e2e8f0">구</text><text x="55" y="190" font-size="20" fill="#e2e8f0">방향 반경 = r</text><text x="55" y="235" font-size="20" fill="#e2e8f0">정규화 평면: s = n·c + D</text><text x="55" y="280" font-size="20" fill="#e2e8f0">범위 [s − r, s + r]</text><rect x="485" y="95" width="440" height="245" rx="12" fill="#162538" stroke="#475569"/><text x="505" y="135" font-size="24" fill="#e2e8f0">월드 AABB</text><text x="505" y="190" font-size="20" fill="#e2e8f0">r = |nx|hx + |ny|hy + |nz|hz</text><text x="505" y="235" font-size="20" fill="#e2e8f0">축별 반길이를 평면 방향에 투영</text><text x="505" y="280" font-size="20" fill="#e2e8f0">법선과 D를 함께 정규화</text><text x="35" y="390" font-size="22" fill="#e2e8f0">여섯 평면에서 거부 못함 ≠ 정확한 교차 또는 화면 가시성 확정</text><text x="35" y="430" font-size="20" fill="#e2e8f0">경계 오차 정책은 사용 공간·스케일에 맞게 선택합니다.</text></g></svg>
