<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">먼저 유효성, 그다음 분기</title><desc id="desc">조건 판정 단계의 순서가 실행 경로를 결정한다.</desc><rect width="960" height="440" rx="22" fill="#101c2c"/><g font-family="sans-serif"><text x="34" y="54" font-size="30" font-weight="700" fill="#f0f6ff">먼저 유효성, 그다음 분기</text><text x="34" y="90" font-size="20" fill="#c9d8e9">조건 판정 단계의 순서가 실행 경로를 결정한다.</text><rect x="32" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="52" y="172" font-size="26" font-weight="700" fill="#7dd3fc">범위 검사</text><text x="52" y="219" font-size="21" fill="#f1f6fe">score: 0 ~ 100</text><text x="52" y="256" font-size="21" fill="#f1f6fe">아니면 invalid</text><path d="M 310 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="344" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="364" y="172" font-size="26" font-weight="700" fill="#7dd3fc">높은 구간부터</text><text x="364" y="219" font-size="21" fill="#f1f6fe">90 이상: excellent</text><text x="364" y="256" font-size="21" fill="#f1f6fe">60 이상: pass</text><path d="M 622 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="656" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="676" y="172" font-size="26" font-weight="700" fill="#7dd3fc">나머지</text><text x="676" y="219" font-size="21" fill="#f1f6fe">60 미만: retry</text><text x="676" y="256" font-size="21" fill="#f1f6fe">한 경로만 실행</text><text x="34" y="407" font-size="20" fill="#fbbf24">조건 검사와 본문 실행은 구별해서 추적한다.</text></g></svg>
