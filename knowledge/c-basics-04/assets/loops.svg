<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">반복 전후 조건 확인</title><desc id="desc">시작 상태가 종료 조건을 만족할 때 차이가 드러난다.</desc><rect width="960" height="440" rx="22" fill="#101c2c"/><g font-family="sans-serif"><text x="34" y="54" font-size="30" font-weight="700" fill="#f0f6ff">반복 전후 조건 확인</text><text x="34" y="90" font-size="20" fill="#c9d8e9">시작 상태가 종료 조건을 만족할 때 차이가 드러난다.</text><rect x="32" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="52" y="172" font-size="26" font-weight="700" fill="#7dd3fc">for</text><text x="52" y="219" font-size="21" fill="#f1f6fe">초기화 → 조건</text><text x="52" y="256" font-size="21" fill="#f1f6fe">본문 → 증감</text><path d="M 310 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="344" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="364" y="172" font-size="26" font-weight="700" fill="#7dd3fc">while</text><text x="364" y="219" font-size="21" fill="#f1f6fe">조건 → 본문</text><text x="364" y="256" font-size="21" fill="#f1f6fe">0회 실행 가능</text><path d="M 622 244 h29 m-8 -7 8 7 -8 7" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="656" y="129" width="274" height="225" rx="14" fill="#1f344a" stroke="#67809b" stroke-width="2"/><text x="676" y="172" font-size="26" font-weight="700" fill="#7dd3fc">do-while</text><text x="676" y="219" font-size="21" fill="#f1f6fe">본문 → 조건</text><text x="676" y="256" font-size="21" fill="#f1f6fe">적어도 1회 실행</text><text x="34" y="407" font-size="20" fill="#fbbf24">종료를 보장할 갱신 값과 유효 범위를 항상 확인한다.</text></g></svg>
