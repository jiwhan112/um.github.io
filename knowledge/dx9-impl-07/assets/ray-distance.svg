<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>near에서 시작한 레이의 t</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">near에서 시작한 레이의 t</text><path d="M100 210 L850 210" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="60" y="165" font-size="22" fill="#e2e8f0">Eye z=0</text><text x="245" y="165" font-size="22" fill="#e2e8f0">Near z=1</text><text x="510" y="165" font-size="22" fill="#e2e8f0">삼각형 z=5</text><text x="760" y="165" font-size="22" fill="#e2e8f0">Far z=100</text><text x="290" y="275" font-size="24" fill="#fbbf24">교차 t=4 (Eye부터 5가 아님)</text><text x="100" y="350" font-size="22" fill="#e2e8f0">RayOrigin=Near · 단위 D · maxT=99</text><text x="100" y="400" font-size="20" fill="#e2e8f0">월드 역변환 후 로컬 D를 재정규화하지 않으면 t가 유지된다.</text></g></svg>
