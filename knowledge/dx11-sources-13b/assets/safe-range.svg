<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>끝점을 더하기 전에 범위를 증명한다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">끝점을 더하기 전에 범위를 증명한다</text><rect x="50" y="105" width="260" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="64" y="141" font-size="22" fill="#e2e8f0">1. offset ≤ stride</text><rect x="350" y="105" width="260" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="364" y="141" font-size="22" fill="#e2e8f0">2. width ≤ stride−offset</text><rect x="650" y="105" width="260" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="664" y="141" font-size="22" fill="#e2e8f0">3. 안전한 끝점/겹침</text><path d="M310 145 L340 145" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M610 145 L640 145" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="60" y="280" font-size="22" fill="#e2e8f0">먼저 offset+width를 계산하면 unsigned wrap이 생길 수 있다.</text><text x="60" y="350" font-size="22" fill="#e2e8f0">두 단계 모델: 모든 요소 검증 → 같은 Slot의 겹침 검사</text></g></svg>
