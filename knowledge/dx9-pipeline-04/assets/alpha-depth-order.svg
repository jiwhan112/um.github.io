<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">알파·깊이 쓰기·혼합 순서는 별도 선택이다</title><desc id="desc">알파0이 깊이를 기록해 뒤 샘플을 거부하는 경로와, 깊이 쓰기를 끈 두 혼합 순서의 다른 RGB 결과를 분리했습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="440" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">알파·깊이 쓰기·혼합 순서는 별도 선택이다</text><rect x="30" y="80" width="270" height="115" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="108" font-size="19" fill="#67e8f9">알파 0인 앞 샘플</text><text x="44" y="133" font-size="17" fill="#e2e8f0">SRCALPHA 혼합: 색 그대로</text><text x="44" y="158" font-size="17" fill="#e2e8f0">깊이 쓰기 ON: z=.2 저장</text><path d="M300 137H355" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="355" y="80" width="260" height="115" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="369" y="108" font-size="19" fill="#67e8f9">뒤 샘플 z=.5</text><text x="369" y="133" font-size="17" fill="#e2e8f0">LESS_EQUAL 비교</text><text x="369" y="158" font-size="17" fill="#e2e8f0">.5 ≤ .2 는 거짓</text><path d="M615 137H670" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="670" y="80" width="260" height="115" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="684" y="108" font-size="19" fill="#67e8f9">깊이에서 탈락</text><text x="684" y="133" font-size="17" fill="#e2e8f0">앞 색이 안 보여도</text><text x="684" y="158" font-size="17" fill="#e2e8f0">뒤 샘플을 가릴 수 있음</text><rect x="30" y="245" width="430" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="273" font-size="19" fill="#67e8f9">순서 A: 파랑 .5 → 빨강 .5</text><text x="44" y="298" font-size="17" fill="#e2e8f0">검은 배경, 깊이 쓰기 OFF</text><text x="44" y="323" font-size="17" fill="#e2e8f0">RGB = (.5, 0, .25)</text><rect x="500" y="245" width="430" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="514" y="273" font-size="19" fill="#67e8f9">순서 B: 빨강 .5 → 파랑 .5</text><text x="514" y="298" font-size="17" fill="#e2e8f0">같은 입력 색, 순서만 반대</text><text x="514" y="323" font-size="17" fill="#e2e8f0">RGB = (.25, 0, .5)</text><text x="30" y="405" font-size="16" fill="#e2e8f0">위는 깊이의 영향, 아래는 혼합 순서의 영향입니다. 두 실험을 같은 연속 실행으로 보지 않습니다.</text></g></svg>
