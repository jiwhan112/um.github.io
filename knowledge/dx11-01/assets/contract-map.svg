<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">소유 참조가 남으면 Resize는 끝나지 않는다</title><desc id="desc">앱의 RTV와 Context 바인딩 모두 BackBuffer를 붙잡을 수 있습니다. 두 참조를 해제한 뒤 Resize하고 새 RTV를 만듭니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c47a"/></marker></defs><rect width="960" height="430" rx="18" fill="#0c1929"/><g font-family="sans-serif"><text x="28" y="43" font-size="25" fill="#edf4ff">소유 참조가 남으면 Resize는 끝나지 않는다</text><rect x="30" y="90" width="290" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="44" y="122" font-size="21" fill="#edf4ff">앱이 보관한 RTV</text><text x="44" y="154" font-size="16" fill="#b7d3e6">직접 소유 참조</text><rect x="30" y="230" width="290" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="44" y="262" font-size="21" fill="#edf4ff">Context의 바인딩</text><text x="44" y="294" font-size="16" fill="#b7d3e6">RTV를 통한 간접 참조</text><rect x="590" y="160" width="330" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="604" y="192" font-size="21" fill="#edf4ff">기존 BackBuffer</text><text x="604" y="224" font-size="16" fill="#b7d3e6">Resize 전 참조 제거 필요</text><path d="M320 133 H455 V190 H583" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><path d="M320 273 H455 V215 H583" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><text x="30" y="375" font-size="21" fill="#edf4ff">Unbind + 앱 참조 해제 → ResizeBuffers → 새 RTV 생성·바인딩</text></g></svg>
