<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">입력은 세 층으로 검증한다</title><desc id="desc">읽기에 성공했다고 숫자는 아니며, 숫자라고 게임 규칙에 맞는 것도 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">입력은 세 층으로 검증한다</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">줄 수집</text><text x="46" y="145" fill="#f8fafc" font-size="17">길이·NUL·EOF·I/O</text><text x="46" y="179" fill="#cbd5e1" font-size="15">문자열 경계 확보</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">숫자 해석</text><text x="356" y="145" fill="#f8fafc" font-size="17">strtol + end + errno</text><text x="356" y="179" fill="#cbd5e1" font-size="15">숫자와 나머지 분리</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">도메인 검사</text><text x="666" y="145" fill="#f8fafc" font-size="17">게임 인원 수 1..8</text><text x="666" y="179" fill="#cbd5e1" font-size="15">성공할 때만 출력 값 대입</text><text x="30" y="255" fill="#cbd5e1" font-size="17">읽기에 성공했다고 숫자는 아니며, 숫자라고 게임 규칙에 맞는 것도 아닙니다.</text></g></svg>
