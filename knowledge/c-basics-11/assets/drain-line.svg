<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">긴 줄을 버릴 때 줄 끝까지 소비한다</title><desc id="desc">잘린 문자열을 정상 입력으로 처리하지 않습니다. 오류 줄의 버퍼 내용도 사용하지 않습니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="30" y="42" fill="#f8fafc" font-size="23">긴 줄을 버릴 때 줄 끝까지 소비한다</text><rect x="30" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="46" y="108" fill="#67e8f9" font-size="18">입력: abcd\n2\n</text><text x="46" y="145" fill="#f8fafc" font-size="17">버퍼 크기 4 → abc</text><text x="46" y="179" fill="#cbd5e1" font-size="15">종료 NUL 한 칸 확보</text><path d="M312 140H337" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="356" y="108" fill="#67e8f9" font-size="18">d를 만나면</text><text x="356" y="145" fill="#f8fafc" font-size="17">LONG 표시, 계속 읽기</text><text x="356" y="179" fill="#cbd5e1" font-size="15">개행까지 나머지 소비</text><path d="M622 140H647" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="76" width="280" height="132" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="666" y="108" fill="#67e8f9" font-size="18">다음 호출</text><text x="666" y="145" fill="#f8fafc" font-size="17">2를 새 줄로 읽음</text><text x="666" y="179" fill="#cbd5e1" font-size="15">이전 줄의 꼬리와 분리</text><text x="30" y="255" fill="#cbd5e1" font-size="17">잘린 문자열을 정상 입력으로 처리하지 않습니다. 오류 줄의 버퍼 내용도 사용하지 않습니다.</text></g></svg>
