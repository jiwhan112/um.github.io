<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>예시 전략: 하늘을 먼저 그린다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">예시 전략: 하늘을 먼저 그린다</text><rect x="45" y="100" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="59" y="136" font-size="22" fill="#e2e8f0">Sky: Z검사/기록 OFF</text><rect x="355" y="100" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="369" y="136" font-size="22" fill="#e2e8f0">Opaque: 둘 다 ON</text><rect x="665" y="100" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="679" y="136" font-size="22" fill="#e2e8f0">HUD: 화면 좌표</text><path d="M295 135 L345 135" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M605 135 L655 135" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="55" y="250" font-size="22" fill="#e2e8f0">하늘은 색만 채움 → 불투명 물체가 깊이와 색을 갱신</text><text x="55" y="315" font-size="20" fill="#e2e8f0">패스 진입: 필요한 상태 설정 / 종료: 복원 또는 다음 패스 재설정</text><text x="55" y="385" font-size="21" fill="#e2e8f0">마지막 하늘 패스의 far-depth 전략과 섞지 않는다.</text></g></svg>
