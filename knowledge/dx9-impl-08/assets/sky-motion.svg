<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>하늘에서 없애는 것은 카메라 병진</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">하늘에서 없애는 것은 카메라 병진</text><rect x="60" y="115" width="350" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="74" y="151" font-size="22" fill="#e2e8f0">병진: 시차를 없앰</text><rect x="550" y="115" width="350" height="80" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="564" y="151" font-size="22" fill="#e2e8f0">회전: 환경 방향이 바뀜</text><text x="75" y="280" font-size="22" fill="#e2e8f0">위치 추종 또는 View 이동 제거</text><text x="565" y="280" font-size="22" fill="#e2e8f0">View 회전은 유지</text><text x="75" y="370" font-size="21" fill="#e2e8f0">컬링은 실제 큐브 winding에 맞춘다. CW를 무조건 고르지 않는다.</text></g></svg>
