<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>스택·큐·링 버퍼 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">스택·큐·링 버퍼 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. capacity=4</text><text x="340" y="105" font-size="19">push A,B,C → head=0,size=3</text><text x="340" y="137" font-size="17" fill="#a7f3d0">슬롯0,1,2 사용</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. pop A,B</text><text x="340" y="213" font-size="19">head=2,size=1</text><text x="340" y="245" font-size="17" fill="#a7f3d0">C는 슬롯2</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. push D,E</text><text x="340" y="321" font-size="19">head=2,size=3</text><text x="340" y="353" font-size="17" fill="#a7f3d0">순서 C,D,E / 슬롯2,3,0</text></g></svg>