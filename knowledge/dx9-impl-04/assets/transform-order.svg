<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">행 벡터 · p × S × R × T × Parent</title><desc id="desc">예제의 +Z 전방·왼손 좌표계 및 아핀 변환 규약이다. 원근 나눗셈은 없다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">행 벡터 · p × S × R × T × Parent</text><rect x="30" y="110" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="140" font-size="20" fill="#64d8cb">로컬 점 (1,0,0)</text><text x="46" y="170" font-size="18" fill="#e5edf7">Scale 2 → (2,0,0)</text><text x="46" y="200" font-size="18" fill="#e5edf7">Yaw +90° → (0,0,-2)</text><rect x="345" y="110" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="140" font-size="20" fill="#64d8cb">Local Translation</text><text x="361" y="170" font-size="18" fill="#e5edf7">+(1,2,3)</text><text x="361" y="200" font-size="18" fill="#e5edf7">→ (1,2,1)</text><rect x="660" y="110" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="140" font-size="20" fill="#64d8cb">Parent Translation</text><text x="676" y="170" font-size="18" fill="#e5edf7">+(10,0,0)</text><text x="676" y="200" font-size="18" fill="#e5edf7">→ (11,2,1)</text><path d="M300 185 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 185 H653" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="330" font-size="19" fill="#e5edf7">행렬 저장 배치, 벡터를 곱하는 쪽, 변환 순서를 한 묶음으로 명시한다.</text><text x="35" y="375" font-size="19" fill="#e5edf7">행렬 포인터를 float3*로 바꾸는 것이 규약 변환은 아니다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">예제의 +Z 전방·왼손 좌표계 및 아핀 변환 규약이다. 원근 나눗셈은 없다.</text></g></svg>
