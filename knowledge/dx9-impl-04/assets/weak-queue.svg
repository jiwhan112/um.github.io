<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">렌더 큐는 객체 수명을 자동으로 늘리지 않는다</title><desc id="desc">Flush에서 얻은 임시 shared_ptr는 해당 Flush 작업 동안만 대상을 유지한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">렌더 큐는 객체 수명을 자동으로 늘리지 않는다</text><rect x="30" y="175" width="300" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="205" font-size="20" fill="#64d8cb">프레임 요청: weak_ptr</text><text x="46" y="235" font-size="18" fill="#e5edf7">Flush에서 lock()</text><text x="46" y="265" font-size="18" fill="#e5edf7">생존 여부를 먼저 확인</text><rect x="585" y="80" width="345" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="110" font-size="20" fill="#64d8cb">lock 실패</text><text x="601" y="140" font-size="18" fill="#e5edf7">이미 소멸한 대상</text><text x="601" y="170" font-size="18" fill="#e5edf7">그리기 요청을 건너뜀</text><rect x="585" y="270" width="345" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="300" font-size="20" fill="#64d8cb">lock 성공</text><text x="601" y="330" font-size="18" fill="#e5edf7">임시 소유 참조 유지</text><text x="601" y="360" font-size="18" fill="#e5edf7">live 목록으로 정렬·처리</text><path d="M330 230 H455 V135 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M455 230 V325 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">Flush에서 얻은 임시 shared_ptr는 해당 Flush 작업 동안만 대상을 유지한다.</text></g></svg>
