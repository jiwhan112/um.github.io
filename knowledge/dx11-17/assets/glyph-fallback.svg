<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">UTF-8 해독과 글리프 존재는 별개</title><desc id="desc">유효한 Unicode scalar라도 아틀라스에 그림이 없을 수 있다. v2는 shaping을 하지 않는다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="480" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">UTF-8 해독과 글리프 존재는 별개</text><rect x="30" y="165" width="260" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="195" font-size="20" fill="#64d8cb">UTF-8 → scalar</text><text x="46" y="225" font-size="18" fill="#e5edf7">잘못된 바이트는 예외</text><text x="46" y="255" font-size="18" fill="#e5edf7">글리프 검색</text><rect x="575" y="75" width="350" height="80" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="591" y="105" font-size="20" fill="#64d8cb">등록되어 있음</text><text x="591" y="135" font-size="18" fill="#e5edf7">그 글리프의 metrics 사용</text><rect x="575" y="205" width="350" height="80" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="591" y="235" font-size="20" fill="#64d8cb">미등록 · ? 있음</text><text x="591" y="265" font-size="18" fill="#e5edf7">?의 metrics와 UV 사용</text><rect x="575" y="335" width="350" height="70" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="591" y="365" font-size="20" fill="#64d8cb">미등록 · ? 없음</text><text x="591" y="395" font-size="18" fill="#e5edf7">예외로 종료</text><path d="M290 220H420V115H568" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M420 220V245H568" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M420 245V370H568" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="458" font-size="17" fill="#bdcde2">유효한 Unicode scalar라도 아틀라스에 그림이 없을 수 있다. v2는 shaping을 하지 않는다.</text></g></svg>
