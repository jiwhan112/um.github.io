<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">그림 위치와 다음 펜 위치를 분리한다</title><desc id="desc">설명용 수치: penX=10, bearingX=2, atlas.w=6, advance=9, size=2.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">그림 위치와 다음 펜 위치를 분리한다</text><rect x="30" y="100" width="425" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="130" font-size="20" fill="#64d8cb">그려지는 quad의 가로 범위</text><text x="46" y="160" font-size="18" fill="#e5edf7">x0 = 10 + 2×2 = 14</text><text x="46" y="190" font-size="18" fill="#e5edf7">x1 = 10 + (2+6)×2 = 26</text><rect x="505" y="100" width="425" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="521" y="130" font-size="20" fill="#64d8cb">다음 글리프의 펜 위치</text><text x="521" y="160" font-size="18" fill="#e5edf7">penX = 10 + 9×2 = 28</text><text x="521" y="190" font-size="18" fill="#e5edf7">그림 너비와 advance는 다름</text><text x="35" y="300" font-size="20" fill="#e5edf7">UV는 atlas 픽셀 좌표 ÷ atlas 크기: 글자 출력 크기와 별개</text><text x="35" y="350" font-size="20" fill="#e5edf7">v2: pair kerning · 글꼴 래스터화 · 복잡 문자 shaping 없음</text><text x="30" y="428" font-size="17" fill="#bdcde2">설명용 수치: penX=10, bearingX=2, atlas.w=6, advance=9, size=2.</text></g></svg>
