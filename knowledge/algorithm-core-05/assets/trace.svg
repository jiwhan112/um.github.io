<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>해시 테이블·충돌·동등성 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">해시 테이블·충돌·동등성 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. Put(1,10)</text><text x="340" y="105" font-size="19">bucket1: (1,10)</text><text x="340" y="137" font-size="17" fill="#a7f3d0">새 키</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. Put(5,50)</text><text x="340" y="213" font-size="19">bucket1: (1,10),(5,50)</text><text x="340" y="245" font-size="17" fill="#a7f3d0">충돌은 오류가 아님</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. Put(5,55)</text><text x="340" y="321" font-size="19">bucket1: (1,10),(5,55)</text><text x="340" y="353" font-size="17" fill="#a7f3d0">동일 키의 값 갱신</text></g></svg>