<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">표현을 고를 때 분리할 책임</title><desc id="desc">작업·결과·원자성을 각각 설계하기: future / 결과 / 예외 전달 / 데이터 전체를 잠그지 않음; mutex / 복합 상태의 임계 구역 / 보호 대상 수명도 필요; atomic relaxed / 카운터 자체의 원자 갱신 / 다른 데이터 공개는 별도</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76c7b7"/></marker></defs><rect width="960" height="440" fill="#0c1420"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="36" y="49" fill="#eaf1ff" font-size="28" font-weight="700">07 · 표현을 고를 때 분리할 책임</text><rect x="30" y="98" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="132" fill="#76c7b7" font-size="24">future</text><text x="300" y="132" fill="#eaf1ff" font-size="23">결과 / 예외 전달</text><text x="300" y="165" fill="#b9c9df" font-size="21">데이터 전체를 잠그지 않음</text><rect x="30" y="202" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="236" fill="#76c7b7" font-size="24">mutex</text><text x="300" y="236" fill="#eaf1ff" font-size="23">복합 상태의 임계 구역</text><text x="300" y="269" fill="#b9c9df" font-size="21">보호 대상 수명도 필요</text><rect x="30" y="306" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="340" fill="#76c7b7" font-size="24">atomic relaxed</text><text x="300" y="340" fill="#eaf1ff" font-size="23">카운터 자체의 원자 갱신</text><text x="300" y="373" fill="#b9c9df" font-size="21">다른 데이터 공개는 별도</text></g></svg>