<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">BackBuffer 교체 · 성공 전까지 기존 자원 유지</title><desc id="desc">새 비트맵은 표시 DC를 기준으로 만들고, 기존 선택 객체를 복원한 뒤 삭제한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">BackBuffer 교체 · 성공 전까지 기존 자원 유지</text><rect x="30" y="170" width="300" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="200" font-size="20" fill="#64d8cb">새 DC·bitmap 준비</text><text x="46" y="230" font-size="18" fill="#e5edf7">SelectObject 결과까지 확인</text><text x="46" y="260" font-size="18" fill="#e5edf7">현재 버퍼는 아직 유지</text><rect x="585" y="80" width="345" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="110" font-size="20" fill="#64d8cb">실패</text><text x="601" y="140" font-size="18" fill="#e5edf7">새로 얻은 자원만 정리</text><text x="601" y="170" font-size="18" fill="#e5edf7">Paint는 화면 직접 그리기</text><rect x="585" y="270" width="345" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="300" font-size="20" fill="#64d8cb">성공</text><text x="601" y="330" font-size="18" fill="#e5edf7">이전 선택 복원 → 이전 정리</text><text x="601" y="360" font-size="18" fill="#e5edf7">새 DC·bitmap·previous 저장</text><path d="M330 230 H455 V135 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M455 230 V325 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">새 비트맵은 표시 DC를 기준으로 만들고, 기존 선택 객체를 복원한 뒤 삭제한다.</text></g></svg>
