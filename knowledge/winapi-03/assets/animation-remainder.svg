<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">애니메이션 · 지연을 프레임 수와 나머지로 분해</title><desc id="desc">간격 0.1초, 초기 index 0, 4프레임 순환이라는 전제의 계산 예다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">애니메이션 · 지연을 프레임 수와 나머지로 분해</text><rect x="30" y="115" width="270" height="145" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="145" font-size="20" fill="#64d8cb">입력 경과</text><text x="46" y="175" font-size="18" fill="#e5edf7">0.25초 + 기존 나머지 0</text><text x="46" y="205" font-size="18" fill="#e5edf7">한 번만 증가시키지 않음</text><rect x="345" y="115" width="270" height="145" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="145" font-size="20" fill="#64d8cb">몫: 2프레임</text><text x="361" y="175" font-size="18" fill="#e5edf7">index = (0 + 2) % 4</text><text x="361" y="205" font-size="18" fill="#e5edf7">새 index = 2</text><rect x="660" y="115" width="270" height="145" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="145" font-size="20" fill="#64d8cb">나머지: 0.05초</text><text x="676" y="175" font-size="18" fill="#e5edf7">다음 Advance에 이월</text><text x="676" y="205" font-size="18" fill="#e5edf7">매번 0으로 지우지 않음</text><path d="M300 185 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 185 H653" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="330" font-size="20" fill="#e5edf7">0.05초가 더 오면 약 0.10초 → 1프레임 추가 진행</text><text x="35" y="375" font-size="18" fill="#e5edf7">부동소수점 오차 정책과 dt·간격 입력 범위는 소스 계약을 함께 확인</text><text x="30" y="428" font-size="17" fill="#bdcde2">간격 0.1초, 초기 index 0, 4프레임 순환이라는 전제의 계산 예다.</text></g></svg>
