<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 595" role="img" aria-labelledby="title desc"><title id="title">텍스트에서 실행 파일까지</title><desc id="desc">GCC 드라이버가 단계별 도구 실행을 조정합니다.</desc><rect width="640" height="595" rx="20" fill="#101c2c"/><g font-family="sans-serif"><text x="30" y="48" font-size="26" fill="#f0f6ff">텍스트에서 실행 파일까지</text><rect x="30" y="78" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="110" font-size="24" fill="#7dd3fc">01  전처리 · -E</text><text x="48" y="142" font-size="21" fill="#f0f6ff">헤더 포함·매크로 처리 → hello.i</text><path d="M320 168v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="188" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="220" font-size="24" fill="#7dd3fc">02  컴파일 · -S</text><text x="48" y="252" font-size="21" fill="#f0f6ff">C 코드를 어셈블리로 → hello.s</text><path d="M320 278v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="298" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="330" font-size="24" fill="#7dd3fc">03  어셈블 · -c</text><text x="48" y="362" font-size="21" fill="#f0f6ff">기계어와 연결 정보 → hello.o</text><path d="M320 388v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="408" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="440" font-size="24" fill="#7dd3fc">04  링크</text><text x="48" y="472" font-size="21" fill="#f0f6ff">객체와 라이브러리 결합 → hello</text><text x="30" y="567" font-size="18" fill="#c0cedd">GCC 드라이버가 단계별 도구 실행을 조정합니다.</text></g></svg>
