<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" role="img" aria-labelledby="title desc"><title id="title">오류를 고치는 출발점</title><desc id="desc">명령의 종료 코드와 진단을 함께 확인합니다.</desc><rect width="640" height="485" rx="20" fill="#101c2c"/><g font-family="sans-serif"><text x="30" y="48" font-size="26" fill="#f0f6ff">오류를 고치는 출발점</text><rect x="30" y="78" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="110" font-size="24" fill="#7dd3fc">컴파일 실패</text><text x="48" y="142" font-size="21" fill="#f0f6ff">문법·이름·타입 → 첫 진단의 위치 확인</text><path d="M320 168v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="188" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="220" font-size="24" fill="#7dd3fc">링크 실패</text><text x="48" y="252" font-size="21" fill="#f0f6ff">정의 누락·중복 → 연결한 파일 확인</text><path d="M320 278v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="298" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="330" font-size="24" fill="#7dd3fc">실행 결과 오류</text><text x="48" y="362" font-size="21" fill="#f0f6ff">실제 출력과 기대값 → 입력·계산 확인</text><text x="30" y="457" font-size="18" fill="#c0cedd">명령의 종료 코드와 진단을 함께 확인합니다.</text></g></svg>
