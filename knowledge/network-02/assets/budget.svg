<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><title>Chunk별 오버헤드가 전체 예산에 더해진다</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="1000" height="460" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="35" y="45" font-size="27" fill="#e2e8f0">Chunk별 오버헤드가 전체 예산에 더해진다</text><text x="40" y="100" font-size="22" fill="#e2e8f0">1000 B / Chunk 100 B → 10개</text><rect x="40" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="48" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="112" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="120" y="150" font-size="18" fill="#e2e8f0"></text><rect x="131" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="139" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="203" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="211" y="150" font-size="18" fill="#e2e8f0"></text><rect x="222" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="230" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="294" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="302" y="150" font-size="18" fill="#e2e8f0"></text><rect x="313" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="321" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="385" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="393" y="150" font-size="18" fill="#e2e8f0"></text><rect x="404" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="412" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="476" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="484" y="150" font-size="18" fill="#e2e8f0"></text><rect x="495" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="503" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="567" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="575" y="150" font-size="18" fill="#e2e8f0"></text><rect x="586" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="594" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="658" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="666" y="150" font-size="18" fill="#e2e8f0"></text><rect x="677" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="685" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="749" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="757" y="150" font-size="18" fill="#e2e8f0"></text><rect x="768" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="776" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="840" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="848" y="150" font-size="18" fill="#e2e8f0"></text><rect x="859" y="120" width="72" height="65" rx="5" fill="#164e63" stroke="#38bdf8"/><text x="867" y="150" font-size="18" fill="#e2e8f0">100</text><rect x="931" y="120" width="18" height="65" rx="5" fill="#854d0e" stroke="#38bdf8"/><text x="939" y="150" font-size="18" fill="#e2e8f0"></text><text x="50" y="230" font-size="22" fill="#e2e8f0">파랑: payload 100 B × 10 = 1000 B</text><text x="50" y="275" font-size="22" fill="#fde68a">노랑: overhead 20 B × 10 = 200 B</text><path d="M500 295 L500 330" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="100" y="375" font-size="28" fill="#e2e8f0">총 1200 B × 8 / 8000 bit/s = 1.2초</text><text x="100" y="425" font-size="21" fill="#e2e8f0">앱 Chunk 모델의 직렬화 비용. 실제 TCP 세그먼트/RTT 아님.</text></g></svg>
