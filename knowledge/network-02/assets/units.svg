<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img"><title>bit/s → Byte/s: 단위부터 확인</title><rect width="1000" height="460" rx="18" fill="#0b1220"/><g font-family="sans-serif"><text x="36" y="48" fill="#f8fafc" font-size="28">bit/s → Byte/s: 단위부터 확인</text><rect x="36" y="85" width="928" height="88" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="56" y="116" fill="#7dd3fc" font-size="23">8,000,000 bit/s ÷ 8 = 1,000,000 Byte/s</text><text x="56" y="149" fill="#e2e8f0" font-size="21">8 Mbps는8 MB/s가 아니다. 대문자 B는Byte를 뜻한다고 명시한다.</text><rect x="36" y="200" width="928" height="88" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="56" y="231" fill="#7dd3fc" font-size="23">1 kB = 1000 B / 1 KiB = 1024 B</text><text x="56" y="264" fill="#e2e8f0" font-size="21">숫자만 비교하지 말고 십진 접두사와 이진 접두사를 구별한다.</text><rect x="36" y="315" width="928" height="88" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="56" y="346" fill="#7dd3fc" font-size="23">명목 전송 용량 ≠ 실제 앱 유효 처리량</text><text x="56" y="379" fill="#e2e8f0" font-size="21">위 나눗셈은 단위 변환이다. TCP·혼잡·재전송·RTT 측정이 아니다.</text></g></svg>
