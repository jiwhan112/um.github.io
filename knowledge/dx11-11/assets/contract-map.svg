<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">XZ 풋프린트가 겹쳐도 3D 충돌은 별도다</title><desc id="d">위에서 본 동일한 XZ 풋프린트는 ObbXZ에서 true지만 Y가 20 떨어진 상자의 3D 충돌을 증명하지 않습니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">XZ 풋프린트가 겹쳐도 3D 충돌은 별도다</text><rect x="30" y="85" width="420" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="115" font-size="18" fill="#e2e8f0">상자 A 중심 (0,0,0)</text><text x="44" y="142" font-size="18" fill="#e2e8f0">상자 B 중심 (0,20,0)</text><text x="44" y="169" font-size="18" fill="#e2e8f0">둘 다 XZ 반폭 (1,1), yaw=0</text><path d="M450 140H510" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="510" y="85" width="420" height="110" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="524" y="115" font-size="18" fill="#e2e8f0">현재 ObbXZ: true</text><text x="524" y="142" font-size="18" fill="#e2e8f0">축의 Y 성분은 모두 0</text><text x="524" y="169" font-size="18" fill="#e2e8f0">높이 분리를 검사하지 않음</text><rect x="95" y="270" width="170" height="120" fill="#164e63" stroke="#67e8f9"/><text x="110" y="315" font-size="18" fill="#e2e8f0">XZ 투영: 동일</text><text x="110" y="345" font-size="18" fill="#e2e8f0">A와 B 겹침</text><rect x="400" y="270" width="530" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="414" y="300" font-size="18" fill="#e2e8f0">완전한 3D 판정이 필요하면</text><text x="414" y="327" font-size="18" fill="#e2e8f0">Y 범위 / 3D 형상·SAT 등 별도 설계</text><text x="414" y="354" font-size="18" fill="#e2e8f0">충돌 응답·관통 해결도 이 bool과 다름</text></g></svg>
