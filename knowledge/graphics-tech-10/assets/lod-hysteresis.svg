<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">진입과 이탈의 문턱을 분리해 떨림을 줄인다</title><desc id="desc">51,49,51,49,44,46,54,56크기변화에서45미만전환과55초과복귀로2회만LOD전환한다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">진입과 이탈의 문턱을 분리해 떨림을 줄인다</text><line x1="100" y1="400" x2="860" y2="400" stroke="#a7b8d0" stroke-width="2" /><line x1="100" y1="400" x2="100" y2="100" stroke="#a7b8d0" stroke-width="2" /><line x1="100" y1="325" x2="860" y2="325" stroke="#f8b66c" stroke-width="2" stroke-dasharray="6 6"/><text x="30" y="330" fill="#f8b66c" font-size="21" font-family="Noto Sans CJK KR, sans-serif">45</text><line x1="100" y1="175" x2="860" y2="175" stroke="#6ee7c8" stroke-width="2" stroke-dasharray="6 6"/><text x="30" y="180" fill="#6ee7c8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">55</text><polyline points="120.00,235.00 220.00,265.00 320.00,235.00 420.00,265.00 520.00,340.00 620.00,310.00 720.00,190.00 820.00,160.00" fill="none" stroke="#78aafa" stroke-width="4"/><circle cx="120" cy="235" r="5" stroke="#78aafa" fill="#78aafa" stroke-width="3"/><text x="108" y="220" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">51</text><circle cx="220" cy="265" r="5" stroke="#78aafa" fill="#78aafa" stroke-width="3"/><text x="208" y="250" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">49</text><circle cx="320" cy="235" r="5" stroke="#78aafa" fill="#78aafa" stroke-width="3"/><text x="308" y="220" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">51</text><circle cx="420" cy="265" r="5" stroke="#78aafa" fill="#78aafa" stroke-width="3"/><text x="408" y="250" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">49</text><circle cx="520" cy="340" r="5" stroke="#78aafa" fill="#78aafa" stroke-width="3"/><text x="50