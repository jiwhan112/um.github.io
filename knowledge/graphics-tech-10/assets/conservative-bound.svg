<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">닿거나 걸친 물체는 후보에 남긴다</title><desc id="desc">상자평면에정확히닿은sphere는visible,완전히밖에있는sphere는제외한다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">닿거나 걸친 물체는 후보에 남긴다</text><rect x="150" y="140" width="340" height="260" rx="7" fill="#182c40" stroke="#78aafa"/><line x1="490" y1="90" x2="490" y2="450" stroke="#78aafa" stroke-width="4" /><circle cx="550" cy="270" r="60" stroke="#6ee7c8" fill="none" stroke-width="3"/><circle cx="720" cy="270" r="50" stroke="#fb7185" fill="none" stroke-width="3"/><text x="170" y="115" fill="#78aafa" font-size="23" font-family="Noto Sans CJK KR, sans-serif">안쪽 half-space</text><text x="500" y="365" fill="#6ee7c8" font-size="22" font-family="Noto Sans CJK KR, sans-serif">접촉: 남김</text><text x="670" y="365" fill="#fb7185" font-size="22" font-family="Noto Sans CJK KR, sans-serif">바깥: 제외</text><text x="140" y="455" fill="#e7eef8" font-size="25" font-family="Noto Sans CJK KR, sans-serif">dot(n,c)+d &lt; -r·|n| 일 때만 제외</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>