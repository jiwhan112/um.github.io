<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>정렬·안정성·비교자 계약 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">정렬·안정성·비교자 계약 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. 입력</text><text x="340" y="105" font-size="19">(2,A),(1,B),(2,C),(1,D)</text><text x="340" y="137" font-size="17" fill="#a7f3d0">arrival은A,B,C,D</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. 두 구간</text><text x="340" y="213" font-size="19">(1,B),(2,A) / (1,D),(2,C)</text><text x="340" y="245" font-size="17" fill="#a7f3d0">각 구간 안정 정렬</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. 병합</text><text x="340" y="321" font-size="19">(1,B),(1,D),(2,A),(2,C)</text><text x="340" y="353" font-size="17" fill="#a7f3d0">동점에서 왼쪽 우선</text></g></svg>