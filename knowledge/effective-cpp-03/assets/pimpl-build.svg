<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="title desc"><title id="title">선언과 정의, 컴파일과 링크</title><desc id="desc">pimpl.hpp 선언. main.cpp 사용. pimpl.cpp 정의. 링크 → 실행 파일. Impl 정의와 소멸 동작은 구현 cpp에서 만남. 헤더 가드 ≠ 여러 번역 단위의 ODR 해결</desc><rect width="800" height="444" rx="18" fill="#0d1828"/><g font-family="sans-serif"><text x="38" y="55" fill="#f1f5f9" font-size="26" font-weight="bold">선언과 정의, 컴파일과 링크</text><rect x="38" y="104" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="56" y="150" fill="#f1f5f9" font-size="20">pimpl.hpp 선언</text><rect x="420" y="104" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="438" y="150" fill="#f1f5f9" font-size="20">main.cpp 사용</text><rect x="38" y="226" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="56" y="272" fill="#f1f5f9" font-size="20">pimpl.cpp 정의</text><rect x="420" y="226" width="344" height="82" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="438" y="272" fill="#f1f5f9" font-size="20">링크 → 실행 파일</text><path d="M384 145 H414 M402 137 L414 145 L402 153 M384 267 H414 M402 259 L414 267 L402 275" fill="none" stroke="#f3ba6a" stroke-width="3"/><text x="38" y="365" fill="#acdce4" font-size="18">Impl 정의와 소멸 동작은 구현 cpp에서 만남</text><text x="38" y="405" fill="#acdce4" font-size="18">헤더 가드 ≠ 여러 번역 단위의 ODR 해결</text></g></svg>
