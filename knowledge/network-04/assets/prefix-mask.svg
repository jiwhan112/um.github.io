<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">/24: 상위 24비트만 비교</title><desc id="desc">10.2.3.77과 255.255.255.0을 AND하면 10.2.3.0이 된다. 마지막 8비트는 접두부 비교에서 제외된다.</desc><rect width="960" height="390" rx="20" fill="#101827"/><style>text{font-family:system-ui,sans-serif;fill:#e6eef9;font-size:20px}.small{font-size:17px}.title{font-size:26px;font-weight:700}.green{fill:#8ce6b8}.muted{fill:#a8bbd2}</style><text x="32" y="46" class="title">/24: 주소와 마스크를 같은 자리에서 AND</text><text x="32" y="91" class="small muted">각 칸은 8비트 · 문자열 순서를 정수 비트로 해석 · 메모리 바이트 순서와 구별</text><rect x="205" y="113" width="510" height="190" rx="12" fill="#16374a"/><rect x="725" y="113" width="190" height="190" rx="12" fill="#49324b"/><text x="32" y="153">주소</text><text x="225" y="153">00001010</text><text x="395" y="153">00000010</text><text x="565" y="153">00000011</text><text x="745" y="153">01001101</text><text x="32" y="211">AND 마스크</text><text x="225" y="211">11111111</text><text x="395" y="211">11111111</text><text x="565" y="211">11111111</text><text x="745" y="211">00000000</text><text x="32" y="271">결과</text><text x="225" y="271">10</text><text x="395" y="271">2</text><text x="565" y="271">3</text><text x="745" y="271">0</text><text x="225" y="337" class="green">비교하는 접두부 24비트</text><text x="730" y="337" class="small">호스트 8비트 제거</text></svg>
