<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">겹치는 경로 중 최장 접두부 선택</title><desc id="desc">10.2.3.77에는 /0 /16 /24 /32가 모두 일치한다. 막대는 비교 비트 수이며 /32가 최종 선택된다.</desc><rect width="960" height="410" rx="20" fill="#101827"/><style>text{font-family:system-ui,sans-serif;fill:#e6eef9;font-size:20px}.small{font-size:17px}.title{font-size:26px;font-weight:700}.green{fill:#8ce6b8}.muted{fill:#a8bbd2}</style><text x="32" y="46" class="title">목적지 10.2.3.77: 먼저 찾은 경로에서 멈추지 않기</text><text x="32" y="86" class="small muted">막대 길이 = 접두부 비트 수 · 거리/속도/우선순위 점수가 아님</text><text x="32" y="144">0.0.0.0/0</text><circle cx="300" cy="137" r="5" fill="#79bce8"/><text x="340" y="144">0비트 · 모든 주소와 일치</text><text x="32" y="204">10.2.0.0/16</text><rect x="300" y="178" width="280" height="36" fill="#35749a"/><text x="595" y="204">일치 · 더 긴 경로에 양보</text><text x="32" y="264">10.2.3.0/24</text><rect x="300" y="238" width="420" height="36" fill="#35749a"/><text x="735" y="264">일치</text><text x="32" y="324">10.2.3.77/32</text><rect x="300" y="298" width="560" height="36" fill="#247557"/><text x="315" y="324">일치 · 32비트 최장 → host 선택</text><text x="32" y="374" class="small muted">10.2.3.78이라면 /32는 불일치하므로 /24 선택 · 경로가 없으면 null</text></svg>
