<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="386" viewBox="0 0 1000 386" role="img" aria-labelledby="t d"><title id="t">정수 폭과 오버플로 비교</title><desc id="d">같은 int 두 수의 합에 대해 먼저 int64_t로 확장하는 C 사례와 int 범위 초과를 거절하는 C++ checkedAdd 사례를 대조한다.</desc>
<rect width="1000" height="386" rx="20" fill="#0d192a"/>
<text x="34" y="58" font-size="29" font-family="sans-serif" font-weight="700" fill="#f8fafc">같은 값, 다른 합계 계약</text><text x="34" y="93" font-size="20" font-family="sans-serif" fill="#cbd5e1">a = INT_MAX, b = 1  (이 실습은 int가 32비트인 환경을 전제로 합니다)</text>
<g font-family="sans-serif"><rect x="34" y="137" width="450" height="157" rx="16" fill="#123954" stroke="#38bdf8" stroke-width="3"/><text x="58" y="183" font-size="25" font-weight="700" fill="#e0f2fe">C11: 확장 후 계산</text><text x="58" y="221" font-size="19" fill="#bae6fd">int64_t(a) + int64_t(b)</text><text x="58" y="266" font-size="24" font-weight="700" fill="#fff">2147483648 출력</text>
<rect x="516" y="137" width="450" height="157" rx="16" fill="#4a262d" stroke="#fda4af" stroke-width="3"/><text x="542" y="183" font-size="25" font-weight="700" fill="#ffe4e6">C++11/20: int 결과를 검사</text><text x="542" y="221" font-size="19" fill="#fecdd3">a > INT_MAX - b</text><text x="542" y="266" font-size="24" font-weight="700" fill="#fff">더하지 않고 실패 반환</text></g>
<text x="35" y="346" font-family="sans-serif" font-size="19" fill="#cbd5e1">부호 있는 int 덧셈에서 범위를 넘긴 뒤 결과를 비교하면 이미 UB가 발생할 수 있습니다.</text></svg>