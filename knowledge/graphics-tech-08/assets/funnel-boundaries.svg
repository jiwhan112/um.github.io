<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">좌우 가시 경계가 교차하면 코너가 필요하다</title><desc id="desc">apex에서바라본좌우경계사이로범위를좁히다가새right가left를넘으면left를코너로확정한다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">좌우 가시 경계가 교차하면 코너가 필요하다</text><circle cx="130" cy="390" r="7" stroke="#6ee7c8" fill="#6ee7c8" stroke-width="3"/><line x1="130" y1="390" x2="790" y2="120" stroke="#78aafa" stroke-width="4" /><line x1="130" y1="390" x2="790" y2="330" stroke="#f8b66c" stroke-width="4" /><line x1="130" y1="390" x2="650" y2="100" stroke="#fb7185" stroke-width="3" /><text x="75" y="445" fill="#6ee7c8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">apex</text><text x="740" y="100" fill="#78aafa" font-size="23" font-family="Noto Sans CJK KR, sans-serif">left</text><text x="750" y="370" fill="#f8b66c" font-size="23" font-family="Noto Sans CJK KR, sans-serif">right</text><text x="380" y="85" fill="#fb7185" font-size="23" font-family="Noto Sans CJK KR, sans-serif">새 right가 left 경계를 넘음</text><text x="280" y="450" fill="#e7eef8" font-size="23" font-family="Noto Sans CJK KR, sans-serif">기존 left 코너 확정 → 새 apex에서 다시 검사</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>