<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc">
  <title id="title">세 원소 배열과 끝 다음 위치</title>
  <desc id="desc">values에는 10, 20, 30이라는 세 원소만 있다. values+1과 values+2는 배열 원소를 가리킨다. values+3은 끝 다음 위치로 만들 수 있지만 그 위치를 읽거나 쓸 수 없다.</desc>
  <rect width="640" height="450" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#e8f0ff">
    <text x="32" y="48" font-size="28" font-weight="700">끝 다음 위치에는 원소가 없습니다</text>
    <text x="32" y="86" font-size="22" fill="#b8c7dd">int values[]{10, 20, 30};</text>
    <rect x="32" y="128" width="132" height="130" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="176" y="128" width="132" height="130" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="320" y="128" width="132" height="130" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="464" y="128" width="144" height="130" rx="12" fill="#312435" stroke="#fda4af" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="98" y="165" text-anchor="middle" font-size="24">[0]</text>
    <text x="242" y="165" text-anchor="middle" font-size="24">[1]</text>
    <text x="386" y="165" text-anchor="middle" font-size="24">[2]</text>
    <text x="98" y="223" text-anchor="middle" font-size="36" fill="#6ee7b7">10</text>
    <text x="242" y="223" text-anchor="middle" font-size="36" fill="#6ee7b7">20</text>
    <text x="386" y="223" text-anchor="middle" font-size="36" fill="#6ee7b7">30</text>
    <text x="536" y="167" text-anchor="middle" font-size="23" fill="#fda4af">끝 다음</text>
    <text x="536" y="214" text-anchor="middle" font-size="22">원소 없음</text>
    <text x="98" y="294" text-anchor="middle" font-size="23">values</text>
    <text x="242" y="294" text-anchor="middle" font-size="23">values+1</text>
    <text x="386" y="294" text-anchor="middle" font-size="23">values+2</text>
    <text x="536" y="294" text-anchor="middle" font-size="23" fill="#fda4af">values+3</text>
    <rect x="32" y="326" width="576" height="95" rx="12" fill="#1c2a41"/>
    <text x="52" y="362" font-size="23">end = values + 3;  →  범위의 경계</text>
    <text x="52" y="399" font-size="23" fill="#fda4af">*end로 값을 읽거나 쓰면 안 됩니다.</text>
  </g>
</svg>

