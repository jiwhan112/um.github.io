<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
<title>DirectX 12 04 · 실행 계약 시각화</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker></defs>
<rect width="1080" height="620" rx="18" fill="#0f172a"/>
<text x="36" y="53" fill="#f8fafc" font-family="sans-serif" font-size="29">CPU와 GPU 사이의 세 가지 메모리 역할</text>
<rect x="50" y="120" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="64" y="178.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">CPU 원본</text>
<rect x="420" y="120" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="434" y="178.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">UPLOAD</text>
<rect x="790" y="120" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="804" y="178.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">DEFAULT</text>
<path d="M310 170 L410 170" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M680 170 L780 170" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<text x="420" y="260" fill="#e2e8f0" font-family="sans-serif" font-size="20">CPU write → GPU read</text>
<text x="790" y="260" fill="#e2e8f0" font-family="sans-serif" font-size="22">GPU 자원</text>
<rect x="790" y="360" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="804" y="418.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">GPU 계산 결과</text>
<rect x="420" y="360" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="434" y="418.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">READBACK</text>
<rect x="50" y="360" width="250" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="64" y="418.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">CPU 검사</text>
<path d="M780 410 L680 410" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M410 410 L310 410" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<text x="190" y="535" fill="#fbbf24" font-family="sans-serif" font-size="25">Copy fence 완료 후 CPU read. Map은 완료 대기가 아니다.</text>
<text x="35" y="603" fill="#94a3b8" font-family="sans-serif" font-size="17">자체 제작 개념도 · 실제 GPU 캡처 또는 측정 결과가 아닙니다</text>
</svg>