<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">경로의 출력은 이동 좌표가 아니라 셀 목록이다</title><desc id="d">2×1 영역의 네 삼각형은 공유 정점 인덱스의 변을 통해 0→1→2→3으로 연결됩니다. 중심 그래프 경로와 실제 캐릭터 이동은 다릅니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">경로의 출력은 이동 좌표가 아니라 셀 목록이다</text><path d="M60 110H460V310H60Z M260 110V310 M260 110L60 310 M460 110L260 310" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="110" y="175" font-size="18" fill="#e2e8f0">0</text><text x="200" y="260" font-size="18" fill="#e2e8f0">1</text><text x="310" y="175" font-size="18" fill="#e2e8f0">2</text><text x="405" y="260" font-size="18" fill="#e2e8f0">3</text><rect x="515" y="90" width="410" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="529" y="120" font-size="18" fill="#e2e8f0">start (.2,.2): cell 0</text><text x="529" y="147" font-size="18" fill="#e2e8f0">goal (1.8,.8): cell 3</text><text x="529" y="174" font-size="18" fill="#e2e8f0">결과 [0,1,2,3]</text><rect x="515" y="260" width="410" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="529" y="290" font-size="18" fill="#e2e8f0">미포함: Funnel / 반경 / 높이</text><text x="529" y="317" font-size="18" fill="#e2e8f0">Y가 다른 층도 표현 못 함</text><text x="529" y="344" font-size="18" fill="#e2e8f0">동적 충돌 처리는 별도 단계</text><text x="60" y="385" font-size="17" fill="#e2e8f0">연결 기준: 좌표 근접이 아닌 공유 vertex index 2개</text></g></svg>
