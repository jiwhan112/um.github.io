<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>피킹은 그릴 때의 변환을 되돌린다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">피킹은 그릴 때의 변환을 되돌린다</text><rect x="50" y="105" width="340" height="75" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="64" y="141" font-size="22" fill="#e2e8f0">월드 p=(12,8)</text><rect x="570" y="105" width="340" height="75" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="584" y="141" font-size="22" fill="#e2e8f0">화면 s=(104,94)</text><path d="M390 142 L560 142" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="405" y="120" font-size="18" fill="#e2e8f0">그리기</text><path d="M570 255 L400 255" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="420" y="290" font-size="18" fill="#e2e8f0">입력 역변환</text><text x="60" y="255" font-size="22" fill="#e2e8f0">카메라 c=(10,5), 줌 z=2</text><text x="60" y="305" font-size="22" fill="#e2e8f0">기준점 a=(100,100)</text><text x="570" y="245" font-size="20" fill="#e2e8f0">x = 10 + (104−100)/2 = 12</text><text x="570" y="295" font-size="20" fill="#e2e8f0">y = 5 − (94−100)/2 = 8</text><text x="60" y="390" font-size="20" fill="#e2e8f0">먼저 클라이언트/DPI/뷰 영역 규약을 맞춘다. 역변환을 중복 적용하지 않는다.</text></g></svg>
