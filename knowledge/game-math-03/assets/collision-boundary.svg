<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>접촉과 타일 소속: 경계 정책은 다르다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">접촉과 타일 소속: 경계 정책은 다르다</text><rect x="80" y="115" width="160" height="160" fill="#164e63" stroke="#38bdf8"/><rect x="240" y="115" width="160" height="160" fill="#334155" stroke="#fbbf24"/><text x="80" y="320" font-size="22" fill="#e2e8f0">AABB: 닿는 변 x=2도 충돌</text><text x="570" y="140" font-size="22" fill="#e2e8f0">타일 u=0: [−0.5, 0.5)</text><text x="570" y="195" font-size="22" fill="#e2e8f0">타일 u=1: [ 0.5, 1.5)</text><text x="570" y="270" font-size="20" fill="#fbbf24">u=0.5 → floor(u+0.5)=1</text><text x="70" y="390" font-size="22" fill="#e2e8f0">충돌: 두 영역이 닿아도 참 / 소속: 한 점은 한 타일에만 배정</text></g></svg>
