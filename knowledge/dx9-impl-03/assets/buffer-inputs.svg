<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">정점과 인덱스는 별도 입력에서 한 Draw로 모인다</title><desc id="desc">FVF/Declaration, stride, 상대 인덱스 범위가 실제 데이터와 일치해야 한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">정점과 인덱스는 별도 입력에서 한 Draw로 모인다</text><rect x="30" y="85" width="390" height="125" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="115" font-size="20" fill="#64d8cb">CPU 정점 → VertexBuffer</text><text x="46" y="145" font-size="18" fill="#e5edf7">Lock · 복사 · Unlock</text><text x="46" y="175" font-size="18" fill="#e5edf7">SetStreamSource와 Stride</text><rect x="30" y="275" width="390" height="125" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="305" font-size="20" fill="#64d8cb">CPU 인덱스 → IndexBuffer</text><text x="46" y="335" font-size="18" fill="#e5edf7">Lock · 복사 · Unlock</text><text x="46" y="365" font-size="18" fill="#e5edf7">SetIndices</text><rect x="640" y="185" width="290" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="656" y="215" font-size="20" fill="#64d8cb">DrawIndexedPrimitive</text><text x="656" y="245" font-size="18" fill="#e5edf7">Base + 상대 IB 값</text><text x="656" y="275" font-size="18" fill="#e5edf7">PrimitiveCount ≠ IB 수</text><path d="M420 148 H535 V225 H633" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M420 338 H535 V275 H633" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">FVF/Declaration, stride, 상대 인덱스 범위가 실제 데이터와 일치해야 한다.</text></g></svg>
