<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">Lost Device · 기다림과 Reset 가능 상태를 구별</title><desc id="desc">일반 D3D9 개념 흐름이다. D3D9Ex·실제 GPU·드라이버 검증을 대신하지 않는다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">Lost Device · 기다림과 Reset 가능 상태를 구별</text><rect x="30" y="165" width="300" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="195" font-size="20" fill="#64d8cb">TestCooperativeLevel</text><text x="46" y="225" font-size="18" fill="#e5edf7">반환 상태 확인</text><text x="46" y="255" font-size="18" fill="#e5edf7">렌더링 중단 상태</text><rect x="585" y="75" width="345" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="105" font-size="20" fill="#64d8cb">DEVICELOST</text><text x="601" y="135" font-size="18" fill="#e5edf7">렌더링하지 않고 대기</text><text x="601" y="165" font-size="18" fill="#e5edf7">Reset 가능 상태를 다시 확인</text><rect x="585" y="265" width="345" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="601" y="295" font-size="20" fill="#64d8cb">DEVICENOTRESET</text><text x="601" y="325" font-size="18" fill="#e5edf7">DEFAULT 소유 참조 정리</text><text x="601" y="355" font-size="18" fill="#e5edf7">Reset 성공 후 재생성·재바인딩</text><path d="M330 220 H455 V130 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M455 220 V325 H578" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="395" font-size="18" fill="#e5edf7">Reset 실패는 성공 경로로 진행하지 않고 상태를 다시 판단한다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">일반 D3D9 개념 흐름이다. D3D9Ex·실제 GPU·드라이버 검증을 대신하지 않는다.</text></g></svg>
