<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">ComOwner API · 참조를 얻는 방식마다 다른 책임</title><desc id="desc">put()은 기존 참조를 먼저 놓는다. 실패 시 기존 상태 보존을 약속하는 API가 아니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">ComOwner API · 참조를 얻는 방식마다 다른 책임</text><rect x="30" y="110" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="140" font-size="20" fill="#64d8cb">get()</text><text x="46" y="170" font-size="18" fill="#e5edf7">주소를 관찰</text><text x="46" y="200" font-size="18" fill="#e5edf7">소유권 이전 없음</text><rect x="345" y="110" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="140" font-size="20" fill="#64d8cb">detach()</text><text x="361" y="170" font-size="18" fill="#e5edf7">주소를 반환·owner 비움</text><text x="361" y="200" font-size="18" fill="#e5edf7">Release 책임을 호출자에게</text><rect x="660" y="110" width="270" height="150" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="140" font-size="20" fill="#64d8cb">put()</text><text x="676" y="170" font-size="18" fill="#e5edf7">기존 참조 Release</text><text x="676" y="200" font-size="18" fill="#e5edf7">새 COM 출력 인수 주소</text><text x="35" y="330" font-size="19" fill="#e5edf7">세 API는 순차 단계가 아니라 호출 목적에 따른 서로 다른 선택이다.</text><text x="35" y="375" font-size="17" fill="#e5edf7">reset(같은 주소)은 no-op: 추가 AddRef까지 소비하는 일반 API로 오해하지 않는다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">put()은 기존 참조를 먼저 놓는다. 실패 시 기존 상태 보존을 약속하는 API가 아니다.</text></g></svg>
