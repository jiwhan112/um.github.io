<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>위치와 이동량은 다른 값</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">위치와 이동량은 다른 값</text><path d="M90 350 L90 90" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M90 350 L550 350" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M180 305 L315 125" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M180 305 L234 233" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#a)"/><text x="135" y="330" font-size="22" fill="#e2e8f0">A=(2,1)</text><text x="320" y="115" font-size="22" fill="#e2e8f0">B=(5,5)</text><text x="245" y="240" font-size="20" fill="#fbbf24">새 위치 (3.2,2.6)</text><text x="570" y="130" font-size="22" fill="#e2e8f0">B−A = (3,4)</text><text x="570" y="180" font-size="22" fill="#e2e8f0">길이 5 → 방향 (0.6,0.8)</text><text x="570" y="230" font-size="22" fill="#e2e8f0">이동거리 = 10 × 0.2 = 2</text><text x="570" y="280" font-size="22" fill="#e2e8f0">이동량 = (1.2,1.6)</text><text x="110" y="398" font-size="22" fill="#e2e8f0">좌표축: x 오른쪽, y 위쪽 · 노란 화살표는 이번 프레임 이동</text></g></svg>
