<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>회전 방향에는 좌표축 규약이 필요하다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">회전 방향에는 좌표축 규약이 필요하다</text><path d="M160 285 L410 285" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M160 285 L160 100" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M160 285 L310 135" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="200" y="330" font-size="22" fill="#e2e8f0">수학 좌표: +y 위</text><text x="270" y="195" font-size="22" fill="#fbbf24">+45°</text><path d="M590 135 L840 135" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M590 135 L590 330" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M590 135 L740 285" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="620" y="365" font-size="22" fill="#e2e8f0">화면 좌표: +y 아래</text><text x="720" y="205" font-size="22" fill="#fbbf24">+45°</text><text x="70" y="405" font-size="22" fill="#e2e8f0">같은 (cosθ, sinθ)도 화면상 회전 방향은 y축 선택에 따라 달라진다</text></g></svg>
