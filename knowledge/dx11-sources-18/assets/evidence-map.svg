<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">소스 · 빌드 · 실행 기록을 따로 읽는다</title><desc id="desc">원본과 한국어 주석본의 대응은 무결성 기록으로 확인하며 GPU 실행으로 확대하지 않는다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">소스 · 빌드 · 실행 기록을 따로 읽는다</text><rect x="30" y="105" width="420" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="135" font-size="20" fill="#64d8cb">main.cpp + 예제 HLSL</text><text x="46" y="165" font-size="18" fill="#e5edf7">Graph + 41개 CPU 검사</text><text x="46" y="195" font-size="18" fill="#e5edf7">CMakeLists.txt: 빌드 타깃</text><rect x="510" y="105" width="420" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="526" y="135" font-size="20" fill="#64d8cb">보존된 CI 감사 기록</text><text x="526" y="165" font-size="18" fill="#e5edf7">실제 컴파일 옵션·출력 확인</text><text x="526" y="195" font-size="18" fill="#e5edf7">Windows / D3D11 GPU 미검증</text><text x="35" y="310" font-size="18" fill="#e5edf7">코드 블록: 전체 파일  |  다운로드: 동일 파일  |  역사: 당시 환경과 원시 로그</text><text x="35" y="355" font-size="20" fill="#e5edf7">HLSL·DirectXTK 설명은 CPU 프로그램의 실행 증거가 아니다.</text><text x="30" y="428" font-size="17" fill="#bdcde2">원본과 한국어 주석본의 대응은 무결성 기록으로 확인하며 GPU 실행으로 확대하지 않는다.</text></g></svg>
