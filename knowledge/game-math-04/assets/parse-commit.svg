<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>읽기 실패가 기존 맵을 망가뜨리지 않게 한다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">읽기 실패가 기존 맵을 망가뜨리지 않게 한다</text><rect x="30" y="100" width="230" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="44" y="136" font-size="22" fill="#e2e8f0">파일 → 임시 Grid</text><rect x="350" y="100" width="230" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="364" y="136" font-size="22" fill="#e2e8f0">크기·ID·개수 검증</text><path d="M260 135 L340 135" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><rect x="680" y="90" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="694" y="126" font-size="22" fill="#e2e8f0">성공: 문서 교체</text><rect x="680" y="260" width="250" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="694" y="296" font-size="22" fill="#e2e8f0">실패: 기존 맵 유지</text><path d="M580 120 L670 120" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M580 150 L670 290" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="600" y="100" font-size="18" fill="#e2e8f0">성공</text><text x="590" y="245" font-size="18" fill="#e2e8f0">실패</text><text x="50" y="300" font-size="22" fill="#e2e8f0">히스토리 초기화도 성공 후에만</text><text x="50" y="390" font-size="22" fill="#e2e8f0">텍스트 생성 성공 ≠ 디스크 원자적 저장·전원 장애 복구</text></g></svg>
