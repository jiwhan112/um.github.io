<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>문서는 하나, 뷰는 서로 다른 투영</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">문서는 하나, 뷰는 서로 다른 투영</text><rect x="330" y="90" width="300" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="344" y="126" font-size="22" fill="#e2e8f0">문서: 타일 + 개정 번호</text><rect x="80" y="275" width="300" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="94" y="311" font-size="22" fill="#e2e8f0">메인 뷰: 편집 입력</text><rect x="580" y="275" width="300" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="594" y="311" font-size="22" fill="#e2e8f0">미니맵 뷰: 전체 표시</text><path d="M420 160 L250 265" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M540 160 L720 265" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="70" y="215" font-size="19" fill="#e2e8f0">같은 모델을 읽고 각자 변환</text><text x="570" y="215" font-size="19" fill="#e2e8f0">변경 알림 후 다시 그리기</text><text x="80" y="400" font-size="22" fill="#e2e8f0">뷰마다 맵 복사본을 소유하면 다음 편집에서 다시 불일치한다</text></g></svg>
