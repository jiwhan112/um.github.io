<svg xmlns="http://www.w3.org/2000/svg" width="640" height="823" viewBox="0 0 640 823" role="img" aria-labelledby="title desc">
<title id="title">priority와 id에 따른 사전식 정렬</title><desc id="desc">세 Item의 priority,id는 처음에 2,3과 1,8과 2,1이다. priority가 작은 것이 먼저 오고 같은 priority에서는 id가 작은 것이 먼저 온다. 정렬 결과의 id는 8,1,3이며 실습은 앞 두 id만 직접 검사한다. Less(x,x)가 false인지는 세 원소에 대해 검사하지만 전체 엄격 약순서를 시험으로 증명한 것은 아니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#93c5fd"/></marker></defs>
<rect x="1" y="1" width="638" height="821" rx="20" fill="#0f172a" stroke="#2c394d" stroke-width="2"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
<text x="32" y="48" fill="#e5edff" font-size="28" font-weight="700" text-anchor="start">먼저 priority, 같으면 id</text>
<text x="32" y="87" fill="#b9c7dc" font-size="21" font-weight="400" text-anchor="start">실습의 세 Item을 작은 값부터 정렬합니다.</text>
<rect x="32" y="116" width="576" height="167" rx="14" fill="#1d2b41" stroke="none" stroke-width="2"/>
<text x="52" y="153" fill="#93c5fd" font-size="24" font-weight="700" text-anchor="start">정렬 전</text>
<rect x="52" y="176" width="168" height="81" rx="10" fill="#263b56" stroke="#93c5fd" stroke-width="2"/>
<text x="136" y="208" fill="#e5edff" font-size="21" font-weight="400" text-anchor="middle">priority 2</text>
<text x="136" y="239" fill="#93c5fd" font-size="24" font-weight="700" text-anchor="middle">id 3</text>
<rect x="236" y="176" width="168" height="81" rx="10" fill="#263b56" stroke="#93c5fd" stroke-width="2"/>
<text x="320" y="208" fill="#e5edff" font-size="21" font-weight="400" text-anchor="middle">priority 1</text>
<text x="320" y="239" fill="#93c5fd" font-size="24" font-weight="700" text-anchor="middle">id 8</text>
<rect x="420" y="176" width="168" height="81" rx="10" fill="#263b56" stroke="#93c5fd" stroke-width="2"/>
<text x="504" y="208" fill="#e5edff" font-size="21" font-weight="400" text-anchor="middle">priority 2</text>
<text x="504" y="239" fill="#93c5fd" font-size="24" font-weight="700" text-anchor="middle">id 1</text>
<text x="32" y="326" fill="#e5edff" font-size="21" font-weight="700" text-anchor="start">std::ranges::sort(items, Less{})</text>
<path d="M565 296 L565 346" stroke="#93c5fd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="32" y="365" width="576" height="213" rx="14" fill="#1d2b41" stroke="none" stroke-width="2"/>
<text x="52" y="404" fill="#6ee7b7" font-size="24" font-weight="700" text-anchor="start">정렬 후</text>
<rect x="52" y="430" width="168" height="84" rx="10" fill="#173c39" stroke="#6ee7b7" stroke-width="2"/>
<text x="136" y="463" fill="#e5edff" font-size="21" font-weight="400" text-anchor="middle">priority 1</text>
<text x="136" y="496" fill="#6ee7b7" font-size="24" font-weight="700" text-anchor="middle">id 8</text>
<rect x="236" y="430" width="168" height="84" rx="10" fill="#393221" stroke="#fde68a" stroke-width="2"/>
<text x="320" y="463" fill="#e5edff" font-size="21" font-weight="400" text-anchor="middle">priority 2</text>
<text x="320" y="496" fill="#fde68a" font-size="24" font-weight="700" text-anchor="middle">id 1</text>
<rect x="420" y="430" width="168" height="84" rx="10" fill="#393221" stroke="#fde68a" stroke-width="2"/>
<text x="504" y="463" fill="#e5edff" font-size="21" font-weight="400" text-anchor="middle">priority 2</text>
<text x="504" y="496" fill="#fde68a" font-size="24" font-weight="700" text-anchor="middle">id 3</text>
<text x="52" y="552" fill="#6ee7b7" font-size="21" font-weight="700" text-anchor="start">검사한 선두 두 id: 8, 1</text>
<text x="421" y="552" fill="#fde68a" font-size="20" font-weight="400" text-anchor="middle">같은 2 → id순</text>
<rect x="32" y="612" width="576" height="140" rx="14" fill="#1d2b41" stroke="none" stroke-width="2"/>
<text x="52" y="651" fill="#93c5fd" font-size="25" font-weight="700" text-anchor="start">Less(x, x)는 false</text>
<text x="52" y="691" fill="#e5edff" font-size="21" font-weight="400" text-anchor="start">세 원소에서 비반사성을 3회 확인합니다.</text>
<text x="52" y="726" fill="#b9c7dc" font-size="21" font-weight="400" text-anchor="start">모든 입력의 전이성 증명은 아닙니다.</text>
<text x="32" y="795" fill="#b9c7dc" font-size="21" font-weight="400" text-anchor="start">비교 규칙과 실행한 검사 범위를 함께 읽습니다.</text>
</g>
</svg>
