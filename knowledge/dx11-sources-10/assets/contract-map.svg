<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">시간·포즈·스키닝의 호출 경계</title><desc id="d">왼쪽과 오른쪽 상자는 소스의 역할과 검증 경계를 구분합니다. 위에서 아래로 프로그램 실행을 모두 구현했다는 뜻이 아닙니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">시간·포즈·스키닝의 호출 경계</text><rect x="25" y="100" width="910" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="130" font-size="18" fill="#e2e8f0">atSeconds: 초 → 반복 tick</text><text x="39" y="157" font-size="18" fill="#e2e8f0">sample: 키 사이 보간 / 끝 clamp</text><text x="39" y="184" font-size="18" fill="#e2e8f0">Pose: 위치 + Quaternion (Scale 없음)</text><rect x="25" y="270" width="910" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="39" y="300" font-size="18" fill="#e2e8f0">compose: 부모가 자식 위치도 회전</text><text x="39" y="327" font-size="18" fill="#e2e8f0">skin: inverseBind → boneWorld → 가중합</text><text x="39" y="354" font-size="18" fill="#e2e8f0">실제 GPU 행렬 palette 없음</text></g></svg>
