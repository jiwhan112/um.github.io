<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
<title>DirectX 12 09 · 실행 계약 시각화</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker></defs>
<rect width="1080" height="620" rx="18" fill="#0f172a"/>
<text x="36" y="53" fill="#f8fafc" font-family="sans-serif" font-size="29">두 upload 페이지의 안전한 회수</text>
<text x="50" y="115" fill="#e2e8f0" font-family="sans-serif" font-size="25">page 0 · base 0 · retire 3</text>
<rect x="50" y="145" width="230" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="64" y="203.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">64 bytes</text>
<rect x="280" y="145" width="690" height="100" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="294" y="203.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">192 bytes</text>
<text x="50" y="290" fill="#f87171" font-family="sans-serif" font-size="26">completed 2 → page 0 초기화 금지</text>
<text x="50" y="355" fill="#e2e8f0" font-family="sans-serif" font-size="25">page 1 · base 256 · 아직 비어 있음</text>
<rect x="50" y="385" width="920" height="90" rx="9" fill="#14532d" stroke="#64748b"/>
<text x="64" y="438.0" fill="#e2e8f0" font-family="sans-serif" font-size="23">다른 물리 구간에 기록 가능</text>
