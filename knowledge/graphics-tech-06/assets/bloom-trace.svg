<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Impulse 하나로 pass 순서를 확인한다</title><desc id="desc">중앙8에서threshold1을빼7,분리blur중앙1.75,합성9.75뒤톤매핑하는수치추적.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">Impulse 하나로 pass 순서를 확인한다</text><rect x="50" y="130" width="185" height="250" rx="7" fill="#1b263a" stroke="#a7b8d0"/><rect x="75" y="211" width="135" height="144" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="60" y="110" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">원본 HDR</text><text x="95" y="420" fill="#f8b66c" font-size="27" font-family="Noto Sans CJK KR, sans-serif">8</text><rect x="270" y="130" width="185" height="250" rx="7" fill="#1b263a" stroke="#a7b8d0"/><rect x="295" y="229" width="135" height="126" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="280" y="110" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">추출</text><text x="315" y="420" fill="#f8b66c" font-size="27" font-family="Noto Sans CJK KR, sans-serif">7</text><rect x="490" y="130" width="185" height="250" rx="7" fill="#1b263a" stroke="#a7b8d0"/><rect x="515" y="323.5" width="135" height="31.5" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="500" y="110" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">중앙 blur</text><text x="535" y="420" fill="#f8b66c" font-size="27" font-family="Noto Sans CJK KR, sans-serif">1.75</text><rect x="710" y="130" width="185" height="250" rx="7" fill="#1b263a" stroke="#a7b8d0"/><rect x="735" y="179.5" width="135" height="175.5" rx="7" fill="#6ee7c8" stroke="#6ee7c8"/><text x="720" y="110" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">합성 HDR</text><text x="755" y="420" fill="#f8b66c" font-size="27" font-family="Noto Sans CJK KR, sans-serif">9.75</text><text x="170" y="465" fill="#e7eef8" font-size="23" font-family="Noto Sans CJK KR, sans-serif">Tone(9.75)=0.906977 ≠ Tone(8)+Tone(1.75)</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>