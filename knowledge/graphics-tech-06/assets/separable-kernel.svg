<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">분리형 커널은 외적으로 2D 필터를 만든다</title><desc id="desc">1/4,1/2,1/4의외적3x3가중치와직접9탭대분리6탭을비교한다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">분리형 커널은 외적으로 2D 필터를 만든다</text><text x="50" y="100" fill="#e7eef8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">[1/4, 1/2, 1/4] × 세로 전치</text><rect x="80" y="140" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="95" y="187" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.0625</text><rect x="190" y="140" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="205" y="187" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.1250</text><rect x="300" y="140" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="315" y="187" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.0625</text><rect x="80" y="230" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="95" y="277" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.1250</text><rect x="190" y="230" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="205" y="277" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.2500</text><rect x="300" y="230" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="315" y="277" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.1250</text><rect x="80" y="320" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="95" y="367" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.0625</text><rect x="190" y="320" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="205" y="367" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.1250</text><rect x="300" y="320" width="100" height="80" rx="7" fill="#244b55" stroke="#6ee7c8"/><text x="315" y="367" fill="#e7eef8" font-size="21" font-family="Noto Sans CJK KR, sans-serif">0.0625</text><text x="470" y="200" fill="#f8b66c" font-size="25" font-family="Noto Sans CJK KR, sans-serif">3×3 직접: 9 taps</text><text x="470" y="260" fill="#6ee7c8" font-size="25" font-family="Noto Sans CJK KR, sans-serif">가로3 + 세로3: 6 taps</text><text x="470" y="340" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">같은 kernel, 별도 중간 버퍼</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>