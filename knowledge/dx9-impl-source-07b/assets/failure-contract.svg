<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>07B 회귀: NaN과 유한성 계약</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">07B 회귀: NaN과 유한성 계약</text><rect x="40" y="110" width="260" height="90" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="54" y="140" font-size="18" fill="#e2e8f0"><tspan x="54" dy="0">NaN 입력: 크기 비교 fa</tspan><tspan x="54" dy="27">lse</tspan></text><rect x="350" y="110" width="260" height="90" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="364" y="140" font-size="18" fill="#e2e8f0"><tspan x="364" dy="0">거부 조건을 통과할 수 있음</tspan></text><rect x="660" y="110" width="260" height="90" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="674" y="140" font-size="18" fill="#e2e8f0"><tspan x="674" dy="0">입력/중간결과 isfinite</tspan><tspan x="674" dy="27"> 검사</tspan></text><path d="M300 155 L340 155" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M610 155 L650 155" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="60" y="310" font-size="22" fill="#e2e8f0">실패 원인 → 기존 동작의 문제 → 수정본의 입력/상태 계약</text><text x="60" y="380" font-size="21" fill="#e2e8f0">원본 코드·수정 기록·과거 검증 로그는 아래 자료실에 보존</text></g></svg>
