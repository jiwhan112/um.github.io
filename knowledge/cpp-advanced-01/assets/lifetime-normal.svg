<svg xmlns="http://www.w3.org/2000/svg" width="640" height="788" viewBox="0 0 640 788" role="img" aria-labelledby="title desc">
  <title id="title">정상 생성과 소멸의 역순</title>
  <desc id="desc">생성 기록은 Base 1, first 2, second 3, Whole 본문 4다. 스코프를 나가면 Whole 소멸자 본문 -4, second -3, first -2, Base -1 순이다. 가상 상속 없는 실습의 순서다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#93c5fd"/></marker></defs>
  <rect width="640" height="788" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="32" y="48" font-size="27" fill="#e8f0ff" font-weight="700" text-anchor="start">정상 경로: 완성하고 되돌아갑니다</text>
    <text x="32" y="88" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">가상 상속이 없는 Whole 실습의 이벤트</text>
    <text x="170" y="126" font-size="24" fill="#6ee7b7" font-weight="700" text-anchor="middle">생성 이벤트</text>
    <text x="470" y="126" font-size="24" fill="#93c5fd" font-weight="700" text-anchor="middle">소멸 이벤트</text>
    <rect x="32" y="150" width="276" height="82" rx="12" fill="#173a38"/>
    <text x="50" y="184" font-size="25" fill="#6ee7b7" font-weight="700" text-anchor="start">Base 본문</text>
    <text x="50" y="216" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">+1 · 기반 객체</text>
    <path d="M170 236 L170 256" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="332" y="150" width="276" height="82" rx="12" fill="#1c2a41"/>
    <text x="350" y="184" font-size="25" fill="#93c5fd" font-weight="700" text-anchor="start">~Whole 본문</text>
    <text x="350" y="216" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">−4 · 멤버가 아직 존재</text>
    <path d="M470 236 L470 256" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="262" width="276" height="82" rx="12" fill="#173a38"/>
    <text x="50" y="296" font-size="25" fill="#6ee7b7" font-weight="700" text-anchor="start">first 본문</text>
    <text x="50" y="328" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">+2 · 먼저 선언한 멤버</text>
    <path d="M170 348 L170 368" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="332" y="262" width="276" height="82" rx="12" fill="#1c2a41"/>
    <text x="350" y="296" font-size="25" fill="#93c5fd" font-weight="700" text-anchor="start">second · ~Part</text>
    <text x="350" y="328" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">−3 · 나중 멤버 정리</text>
    <path d="M470 348 L470 368" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="374" width="276" height="82" rx="12" fill="#173a38"/>
    <text x="50" y="408" font-size="25" fill="#6ee7b7" font-weight="700" text-anchor="start">second 본문</text>
    <text x="50" y="440" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">+3 · 나중에 선언한 멤버</text>
    <path d="M170 460 L170 480" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="332" y="374" width="276" height="82" rx="12" fill="#1c2a41"/>
    <text x="350" y="408" font-size="25" fill="#93c5fd" font-weight="700" text-anchor="start">first · ~Part</text>
    <text x="350" y="440" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">−2 · 먼저 멤버 정리</text>
    <path d="M470 460 L470 480" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="486" width="276" height="82" rx="12" fill="#173a38"/>
    <text x="50" y="520" font-size="25" fill="#6ee7b7" font-weight="700" text-anchor="start">Whole 본문</text>
    <text x="50" y="552" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">+4 · 멤버 준비 뒤 실행</text>
    <rect x="332" y="486" width="276" height="82" rx="12" fill="#1c2a41"/>
    <text x="350" y="520" font-size="25" fill="#93c5fd" font-weight="700" text-anchor="start">~Base 본문</text>
    <text x="350" y="552" font-size="19" fill="#b8c7dd" font-weight="400" text-anchor="start">−1 · 기반 객체 정리</text>
    <rect x="32" y="622" width="576" height="93" rx="12" fill="#1c2a41"/>
    <text x="52" y="658" font-size="23" fill="#fde68a" font-weight="700" text-anchor="start">전체 기록</text>
    <text x="52" y="696" font-size="25" fill="#e8f0ff" font-weight="400" text-anchor="start">1, 2, 3, 4, −4, −3, −2, −1</text>
    <text x="32" y="754" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">소멸자 본문 뒤에 멤버·기반이 정리됩니다.</text>
  </g>
</svg>
