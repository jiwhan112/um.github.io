<svg xmlns="http://www.w3.org/2000/svg" width="640" height="825" viewBox="0 0 640 825" role="img" aria-labelledby="title desc">
  <title id="title">체력 불변식과 네 번의 연산</title>
  <desc id="desc">maximum은 100이고 current는 0부터 100까지다. 정상 생성 뒤 Damage 30으로 70, Heal 200으로 100, Damage 200으로 0, Damage -1은 거부해 0을 유지한다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#93c5fd"/></marker></defs>
  <rect width="640" height="825" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="32" y="48" font-size="28" fill="#e8f0ff" font-weight="700" text-anchor="start">체력의 유효 범위를 정합니다</text>
    <text x="32" y="88" font-size="24" fill="#b8c7dd" font-weight="400" text-anchor="start">예: maximum = 100, current = 70</text>
    <text x="54" y="136" font-size="24" fill="#6ee7b7" font-weight="700" text-anchor="start">현재 70</text>
    <text x="578" y="136" font-size="23" fill="#93c5fd" font-weight="400" text-anchor="end">남은 공간 30</text>
    <rect x="54" y="155" width="532" height="45" rx="6" fill="#1e3552"/>
    <rect x="54" y="155" width="372.4" height="45" rx="6" fill="#1c5c4c"/>
    <text x="54" y="233" font-size="24" fill="#b8c7dd" font-weight="400" text-anchor="start">0</text>
    <text x="586" y="233" font-size="24" fill="#b8c7dd" font-weight="400" text-anchor="end">100</text>
    <rect x="32" y="260" width="576" height="94" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
    <text x="52" y="300" font-size="26" fill="#6ee7b7" font-weight="700" text-anchor="start">0 ≤ current ≤ maximum</text>
    <text x="52" y="334" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="start">maximum은 0보다 커야 합니다.</text>
    <rect x="32" y="378" width="576" height="78" rx="12" fill="#1c2a41"/>
    <text x="52" y="410" font-size="24" fill="#6ee7b7" font-weight="700" text-anchor="start">Damage(30)</text>
    <text x="588" y="410" font-size="24" fill="#e8f0ff" font-weight="700" text-anchor="end">100 → 70</text>
    <text x="52" y="442" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">피해량만큼 감소</text>
    <rect x="32" y="472" width="576" height="78" rx="12" fill="#1c2a41"/>
    <text x="52" y="504" font-size="24" fill="#93c5fd" font-weight="700" text-anchor="start">Heal(200)</text>
    <text x="588" y="504" font-size="24" fill="#e8f0ff" font-weight="700" text-anchor="end">70 → 100</text>
    <text x="52" y="536" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">남은 공간 30만 더함</text>
    <rect x="32" y="566" width="576" height="78" rx="12" fill="#1c2a41"/>
    <text x="52" y="598" font-size="24" fill="#6ee7b7" font-weight="700" text-anchor="start">Damage(200)</text>
    <text x="588" y="598" font-size="24" fill="#e8f0ff" font-weight="700" text-anchor="end">100 → 0</text>
    <text x="52" y="630" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">현재보다 크면 0</text>
    <rect x="32" y="660" width="576" height="78" rx="12" fill="#1c2a41"/>
    <text x="52" y="692" font-size="24" fill="#fda4af" font-weight="700" text-anchor="start">Damage(-1)</text>
    <text x="588" y="692" font-size="24" fill="#e8f0ff" font-weight="700" text-anchor="end">0 → 0</text>
    <text x="52" y="724" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">입력 거부 · 상태 유지</text>
    <text x="32" y="793" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">위에서 아래로 같은 객체에 적용한 예입니다.</text>
  </g>
</svg>
