<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">표현을 고를 때 분리할 책임</title><desc id="desc">타입 추론은 저장 정책이다: auto value / 독립 값일 수 있음 / 프록시는 별도 확인; auto&amp; alias / 원본 변경을 관찰 / 원본 수명이 필요; bool snapshot / 비트 값을 물질화 / 이후 변경과 분리</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76c7b7"/></marker></defs><rect width="960" height="440" fill="#0c1420"/><g font-family="Noto Sans CJK KR, Noto Sans, sans-serif"><text x="36" y="49" fill="#eaf1ff" font-size="28" font-weight="700">01 · 표현을 고를 때 분리할 책임</text><rect x="30" y="98" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="132" fill="#76c7b7" font-size="24">auto value</text><text x="300" y="132" fill="#eaf1ff" font-size="23">독립 값일 수 있음</text><text x="300" y="165" fill="#b9c9df" font-size="21">프록시는 별도 확인</text><rect x="30" y="202" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="236" fill="#76c7b7" font-size="24">auto&amp; alias</text><text x="300" y="236" fill="#eaf1ff" font-size="23">원본 변경을 관찰</text><text x="300" y="269" fill="#b9c9df" font-size="21">원본 수명이 필요</text><rect x="30" y="306" width="900" height="88" rx="12" fill="#172436" stroke="#496582"/><text x="52" y="340" fill="#76c7b7" font-size="24">bool snapshot</text><text x="300" y="340" fill="#eaf1ff" font-size="23">비트 값을 물질화</text><text x="300" y="373" fill="#b9c9df" font-size="21">이후 변경과 분리</text></g></svg>