<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">두 입력 경로를 연결해야 텍스처 사각형이 된다</title><desc id="desc">VB·IB·InputLayout은 정점 경로, Texture·SRV·Sampler는 샘플링 경로입니다. 둘을 셰이더와 출력 상태에 연결한 뒤 인덱스6개를 그립니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4c47a"/></marker></defs><rect width="960" height="430" rx="18" fill="#0c1929"/><g font-family="sans-serif"><text x="28" y="43" font-size="25" fill="#edf4ff">두 입력 경로를 연결해야 텍스처 사각형이 된다</text><rect x="30" y="90" width="330" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="44" y="122" font-size="21" fill="#edf4ff">VB / IB / InputLayout</text><text x="44" y="154" font-size="16" fill="#b7d3e6">정점4개 · 인덱스6개</text><rect x="30" y="230" width="330" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="44" y="262" font-size="21" fill="#edf4ff">Texture / SRV / Sampler</text><text x="44" y="294" font-size="16" fill="#b7d3e6">PS t0 / s0 바인딩</text><rect x="610" y="155" width="320" height="86" rx="12" fill="#173049" stroke="#67d8d1"/><text x="624" y="187" font-size="21" fill="#edf4ff">Shader + 출력 상태</text><text x="624" y="219" font-size="16" fill="#b7d3e6">RTV · Viewport · DrawIndexed(6)</text><path d="M360 133 H490 V183 H603" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><path d="M360 273 H490 V212 H603" fill="none" stroke="#f4c47a" stroke-width="3" marker-end="url(#a)"/><text x="30" y="380" font-size="22" fill="#edf4ff">생성 완료 ≠ Context 상태 완료 ≠ 실제 Present 결과 확인</text></g></svg>
