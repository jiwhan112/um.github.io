<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">삼각형 전체와 샘플 하나의 증거를 분리한다</title><desc id="desc">8×8 뷰포트의 삼각형과 중심 샘플의 수치를 그린 개념도.25개 포함과105회 검사는 보존 CPU 코드의 관찰이며 GPU 화면이 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="480" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">삼각형 전체와 샘플 하나의 증거를 분리한다</text><path d="M100 100L420 100L260 420Z" fill="#164e63" stroke="#67e8f9"/><circle cx="260" cy="260" r="8" fill="#fbbf24"/><text x="275" y="265" font-size="17" fill="#e2e8f0">(4,4)</text><text x="70" y="85" font-size="16" fill="#e2e8f0">A=(.8,.8)</text><text x="360" y="85" font-size="16" fill="#e2e8f0">B=(7.2,.8)</text><text x="200" y="445" font-size="16" fill="#e2e8f0">C=(4,7.2)</text><rect x="500" y="90" width="430" height="125" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="514" y="118" font-size="19" fill="#67e8f9">관찰한 중심 샘플</text><text x="514" y="143" font-size="17" fill="#e2e8f0">UV=(.5,.5), z=.4</text><text x="514" y="168" font-size="17" fill="#e2e8f0">입력 clip.w는 모두 1</text><text x="514" y="193" font-size="17" fill="#e2e8f0">그림은 GPU 이미지가 아닌 개념도</text><rect x="500" y="255" width="430" height="125" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="514" y="283" font-size="19" fill="#67e8f9">관찰한 전체 경로</text><text x="514" y="308" font-size="17" fill="#e2e8f0">8×8 정수 샘플 중25개 포함</text><text x="514" y="333" font-size="17" fill="#e2e8f0">25×4 + 5 =105회 검사</text><text x="514" y="358" font-size="17" fill="#e2e8f0">픽셀마다 새 output으로 독립 검사</text></g></svg>
