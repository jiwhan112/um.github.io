<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>세 단계의 입력과 출력은 서로 다르다</title><rect width="960" height="460" rx="18" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="26" fill="#e2e8f0">세 단계의 입력과 출력은 서로 다르다</text><rect x="35" y="100" width="260" height="185" rx="12" fill="#162538" stroke="#475569"/><text x="53" y="140" font-size="22" fill="#e2e8f0">VS · 정점마다</text><text x="53" y="190" font-size="20" fill="#e2e8f0">입력 위치·UV</text><text x="53" y="226" font-size="20" fill="#e2e8f0">출력 clip.xyzw</text><rect x="350" y="100" width="260" height="185" rx="12" fill="#162538" stroke="#475569"/><text x="368" y="140" font-size="22" fill="#e2e8f0">래스터 단계</text><text x="368" y="190" font-size="20" fill="#e2e8f0">클립·투영 나눗셈</text><text x="368" y="226" font-size="20" fill="#e2e8f0">픽셀 후보·보간</text><rect x="665" y="100" width="260" height="185" rx="12" fill="#162538" stroke="#475569"/><text x="683" y="140" font-size="22" fill="#e2e8f0">PS · 후보마다</text><text x="683" y="190" font-size="20" fill="#e2e8f0">보간 UV·상수·텍스처</text><text x="683" y="226" font-size="20" fill="#e2e8f0">출력 색·안개</text><path d="M295 190 L345 190" fill="none" stroke="#67e8f9" stroke-width="3"/><path d="M610 190 L660 190" fill="none" stroke="#67e8f9" stroke-width="3"/><text x="35" y="350" font-size="24" fill="#e2e8f0">CPU 수치 모형 ≠ 셰이더 컴파일 ≠ 실제 래스터화</text><text x="35" y="395" font-size="20" fill="#e2e8f0">정점 선언·상수·텍스처·깊이/블렌딩 상태의 계약은 계속 필요합니다.</text></g></svg>
