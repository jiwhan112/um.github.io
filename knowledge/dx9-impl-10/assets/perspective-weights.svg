<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>원근 보정은 같은 화면 비중을 다시 가중한다</title><rect width="960" height="460" rx="18" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="26" fill="#e2e8f0">원근 보정은 같은 화면 비중을 다시 가중한다</text><text x="35" y="90" font-size="23" fill="#e2e8f0">같은 화면 가중치 λ = (1/3, 1/3, 1/3)</text><text x="35" y="161" font-size="20" fill="#e2e8f0">정점 0 · w=1 · U=0</text><rect x="315" y="135" width="360" height="44" rx="12" fill="#155e75" stroke="#475569"/><text x="715" y="163" font-size="20" fill="#e2e8f0">기여 4/7</text><text x="35" y="241" font-size="20" fill="#e2e8f0">정점 1 · w=2 · U=1</text><rect x="315" y="215" width="180.0" height="44" rx="12" fill="#155e75" stroke="#475569"/><text x="715" y="243" font-size="20" fill="#e2e8f0">기여 2/7</text><text x="35" y="321" font-size="20" fill="#e2e8f0">정점 2 · w=4 · U=0</text><rect x="315" y="295" width="90.0" height="44" rx="12" fill="#155e75" stroke="#475569"/><text x="715" y="323" font-size="20" fill="#e2e8f0">기여 1/7</text><text x="35" y="390" font-size="22" fill="#e2e8f0">정규화: (1, 1/2, 1/4) ÷ 7/4 → (4/7, 2/7, 1/7)</text><text x="35" y="430" font-size="20" fill="#e2e8f0">U = 0×4/7 + 1×2/7 + 0×1/7 = 2/7  (단순 평균 1/3 아님)</text></g></svg>
