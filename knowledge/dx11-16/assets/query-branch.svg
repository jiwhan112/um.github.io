<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">질의 가지치기와 후보 검사는 다른 단계</title><desc id="desc">노드 경계만 겹쳤다고 물체가 정답이 되지는 않는다. 물체별 Rect 검사가 필요하다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">질의 가지치기와 후보 검사는 다른 단계</text><rect x="30" y="175" width="280" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="205" font-size="20" fill="#64d8cb">query(Rect)</text><text x="46" y="235" font-size="18" fill="#e5edf7">노드와 겹치는가?</text><rect x="565" y="75" width="360" height="90" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="581" y="105" font-size="20" fill="#64d8cb">아니오</text><text x="581" y="135" font-size="18" fill="#e5edf7">이 하위 트리는 건너뜀</text><rect x="565" y="245" width="360" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="581" y="275" font-size="20" fill="#64d8cb">예</text><text x="581" y="305" font-size="18" fill="#e5edf7">현재 노드의 물체별 검사</text><text x="581" y="335" font-size="18" fill="#e5edf7">겹치는 자식에도 재귀 질의</text><path d="M310 225H435V120H558" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M435 225V300H558" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">노드 경계만 겹쳤다고 물체가 정답이 되지는 않는다. 물체별 Rect 검사가 필요하다.</text></g></svg>
