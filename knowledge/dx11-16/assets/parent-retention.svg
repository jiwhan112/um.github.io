<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">경계를 가르는 물체는 부모에 남는다</title><desc id="desc">닫힌 경계의 접촉도 겹침이다. 네 자식 중 하나로만 확정할 수 없으면 부모에 보관한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">경계를 가르는 물체는 부모에 남는다</text><rect x="40" y="90" width="370" height="280" fill="#20344d" stroke="#64d8cb"/><path d="M225 90V370M40 230H410" stroke="#64d8cb"/><text x="55" y="120" font-size="18" fill="#e5edf7">NW</text><text x="350" y="120" font-size="18" fill="#e5edf7">NE</text><text x="55" y="350" font-size="18" fill="#e5edf7">SW</text><text x="350" y="350" font-size="18" fill="#e5edf7">SE</text><rect x="175" y="180" width="100" height="100" fill="#f5c36b" fill-opacity="0.45" stroke="#f5c36b"/><rect x="490" y="100" width="430" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="506" y="130" font-size="20" fill="#64d8cb">중앙을 가로지르는 사각형</text><text x="506" y="160" font-size="18" fill="#e5edf7">여러 자식에 중복 삽입하지 않음</text><text x="506" y="190" font-size="18" fill="#e5edf7">현재 노드의 objects에 보관</text><rect x="490" y="255" width="430" height="110" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="506" y="285" font-size="20" fill="#64d8cb">질의할 때</text><text x="506" y="315" font-size="18" fill="#e5edf7">부모의 objects도 반드시 검사</text><text x="506" y="345" font-size="18" fill="#e5edf7">그 뒤 겹치는 자식으로 내려감</text><path d="M275 200H483" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">닫힌 경계의 접촉도 겹침이다. 네 자식 중 하나로만 확정할 수 없으면 부모에 보관한다.</text></g></svg>
