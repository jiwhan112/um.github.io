<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">하나의 저장소 · 서로 다른 실행 증거</title><desc id="desc">Linux CPU 통과에서 Windows GUI 통과로 향하는 화살표는 없다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">하나의 저장소 · 서로 다른 실행 증거</text><rect x="30" y="100" width="350" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="130" font-size="20" fill="#64d8cb">공통 C++20 소스</text><text x="46" y="160" font-size="18" fill="#e5edf7">헤더 + src의 6개 프로그램</text><text x="46" y="190" font-size="18" fill="#e5edf7">Linux CMake·CTest 기록</text><rect x="580" y="100" width="350" height="130" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="596" y="130" font-size="20" fill="#64d8cb">Windows 전용 소스</text><text x="596" y="160" font-size="18" fill="#e5edf7">winapi_demo + app.rc</text><text x="596" y="190" font-size="18" fill="#e5edf7">Windows SDK·user32·gdi32</text><rect x="30" y="290" width="350" height="90" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="320" font-size="20" fill="#64d8cb">보존된 CPU 결과</text><text x="46" y="350" font-size="18" fill="#e5edf7">실행 경로와 조건 수만 해석</text><rect x="580" y="290" width="350" height="90" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="596" y="320" font-size="20" fill="#64d8cb">아직 필요한 네이티브 검사</text><text x="596" y="350" font-size="18" fill="#e5edf7">창·DPI·GDI 자원·종료</text><path d="M205 230 V283" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M755 230 V283" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">Linux CPU 통과에서 Windows GUI 통과로 향하는 화살표는 없다.</text></g></svg>
