<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>비동기 결과는 제출 당시 버전을 가진다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">비동기 결과는 제출 당시 버전을 가진다</text><rect x="40" y="95" width="270" height="65" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="54" y="131" font-size="22" fill="#e2e8f0">UI: 문서 v7 복사</text><rect x="365" y="95" width="240" height="65" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="379" y="131" font-size="22" fill="#e2e8f0">작업: v7 탐색</text><rect x="665" y="95" width="250" height="65" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="679" y="131" font-size="22" fill="#e2e8f0">결과: 경로 + v7</text><path d="M310 127 L355 127" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M605 127 L655 127" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="260" width="270" height="65" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="54" y="296" font-size="22" fill="#e2e8f0">UI: 편집 → v8</text><rect x="500" y="260" width="415" height="65" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="514" y="296" font-size="22" fill="#e2e8f0">v7 ≠ 현재 v8 → 폐기/재요청</text><path d="M175 160 L175 250" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M790 160 L790 250" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="60" y="390" font-size="22" fill="#e2e8f0">작업은 값 스냅샷만 사용. 결과 반영 여부는 UI 소유자가 결정한다.</text></g></svg>
