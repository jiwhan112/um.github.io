<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>A*: 직선 거리가 아니라 실제 경로의 비용</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">A*: 직선 거리가 아니라 실제 경로의 비용</text><rect x="80" y="95" width="65" height="65" fill="#132d42" stroke="#64748b"/><rect x="145" y="95" width="65" height="65" fill="#475569" stroke="#64748b"/><rect x="210" y="95" width="65" height="65" fill="#132d42" stroke="#64748b"/><rect x="80" y="160" width="65" height="65" fill="#132d42" stroke="#64748b"/><rect x="145" y="160" width="65" height="65" fill="#475569" stroke="#64748b"/><rect x="210" y="160" width="65" height="65" fill="#132d42" stroke="#64748b"/><rect x="80" y="225" width="65" height="65" fill="#132d42" stroke="#64748b"/><rect x="145" y="225" width="65" height="65" fill="#132d42" stroke="#64748b"/><rect x="210" y="225" width="65" height="65" fill="#132d42" stroke="#64748b"/><text x="100" y="135" font-size="22" fill="#e2e8f0">S</text><text x="230" y="135" font-size="22" fill="#e2e8f0">G</text><path d="M112 150 L112 255" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M112 255 L242 255" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M242 255 L242 150" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="360" y="135" font-size="22" fill="#e2e8f0">네 방향 · 한 칸 비용 1</text><text x="360" y="195" font-size="22" fill="#e2e8f0">S의 h = |2−0| + |0−0| = 2</text><text x="360" y="255" font-size="22" fill="#e2e8f0">벽을 우회한 최단 이동 비용 = 6</text><text x="360" y="315" font-size="22" fill="#e2e8f0">경로 원소 수 = 이동 횟수 + 1 = 7</text><text x="70" y="400" font-size="22" fill="#e2e8f0">h는 남은 비용의 하한. g는 발견한 경로를 따라 실제 누적한 비용.</text></g></svg>
