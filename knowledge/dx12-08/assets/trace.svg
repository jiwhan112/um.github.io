<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
<title>DirectX 12 08 · 실행 계약 시각화</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker></defs>
<rect width="1080" height="620" rx="18" fill="#0f172a"/>
<text x="36" y="53" fill="#f8fafc" font-family="sans-serif" font-size="29">서로 다른 사용 사이의 상태 전환</text>
<rect x="35" y="170" width="300" height="110" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="49" y="233.0" fill="#e2e8f0" font-family="sans-serif" font-size="24">COPY_DEST</text>
<rect x="390" y="170" width="300" height="110" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="404" y="233.0" fill="#e2e8f0" font-family="sans-serif" font-size="24">PIXEL_READ</text>
<rect x="745" y="170" width="300" height="110" rx="9" fill="#1e3a5f" stroke="#64748b"/>
<text x="759" y="233.0" fill="#e2e8f0" font-family="sans-serif" font-size="24">RENDER_TARGET</text>
<path d="M340 225 L380 225" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M695 225 L735 225" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="340" fill="#e2e8f0" font-family="sans-serif" font-size="25">업로드 완료 뒤 읽기</text>
<text x="550" y="340" fill="#e2e8f0" font-family="sans-serif" font-size="25">다른 패스의 쓰기로 변경</text>
<rect x="60" y="405" width="950" height="85" rx="9" fill="#7f1d1d" stroke="#64748b"/>
<text x="74" y="455.5" fill="#e2e8f0" font-family="sans-serif" font-size="25">before 상태 불일치 → 추적 상태를 바꾸기 전에 거절</text>
<text x="60" y="555" fill="#e2e8f0" font-family="sans-serif" font-size="23">다른 queue의 실행 완료는 Signal / Wait로 별도 연결한다.</text>
<text x="35" y="603" fill="#94a3b8" font-family="sans-serif" font-size="17">자체 제작 개념도 · 실제 GPU 캡처 또는 측정 결과가 아닙니다</text>
</svg>