<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">미완료 작업만 준비 큐 뒤로 보낸다</title><desc id="d">burst 5,2,1과 quantum2. 시각0의 큐0,1,2는 시각2에1,2,0, 시각4에2,0, 시각5에0이 된다. 작업1과2는 완료되어 다시 들어가지 않는다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f3c477"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1a29"/><g font-family="sans-serif"><text x="28" y="42" font-size="25" fill="#edf4ff">미완료 작업만 준비 큐 뒤로 보낸다</text><rect x="25" y="90" width="200" height="90" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="37" y="120" font-size="20" fill="#edf4ff">t=0 · [0,1,2]</text><text x="37" y="149" font-size="16" fill="#bbd3e4">remaining=[5,2,1]</text><rect x="265" y="90" width="200" height="90" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="277" y="120" font-size="20" fill="#edf4ff">t=2 · [1,2,0]</text><text x="277" y="149" font-size="16" fill="#bbd3e4">Job0: 2 사용, 3 남음</text><rect x="505" y="90" width="200" height="90" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="517" y="120" font-size="20" fill="#edf4ff">t=4 · [2,0]</text><text x="517" y="149" font-size="16" fill="#bbd3e4">Job1 완료: C1=4</text><rect x="745" y="90" width="190" height="90" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="757" y="120" font-size="20" fill="#edf4ff">t=5 · [0]</text><text x="757" y="149" font-size="16" fill="#bbd3e4">Job2 완료: C2=5</text><path d="M225 135 H258" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><path d="M465 135 H498" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><path d="M705 135 H738" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="255" width="400" height="90" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="292" y="285" font-size="20" fill="#edf4ff">Job0만 남아 2틱 + 1틱</text><text x="292" y="314" font-size="16" fill="#bbd3e4">[5,7), [7,8) → C0=8</text><path d="M840 180 V220 H480 V248" fill="none" stroke="#f3c477" stroke-width="3" marker-end="url(#a)"/><text x="30" y="410" font-size="21" fill="#edf4ff">큐에 없는 완료 작업은 다시 실행하지 않는다. 모든 도착 시각은 0이다.</text></g></svg>
