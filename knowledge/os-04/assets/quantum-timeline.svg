<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Quantum은 실행 기회를 나누지만 비용 모델은 별개다</title><desc id="d">같은 작업5,2,1을 quantum2와8로 비교한다. quantum2에서 작업2는4틱에 시작하고 quantum8에서는7틱에 시작한다. 둘 다 전환 비용이 없는 모델의 총8틱이다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f3c477"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1a29"/><g font-family="sans-serif"><text x="28" y="42" font-size="25" fill="#edf4ff">Quantum은 실행 기회를 나누지만 비용 모델은 별개다</text><text x="28" y="137" font-size="23" fill="#edf4ff">Q=2</text><rect x="150" y="100" width="184" height="65" rx="10" fill="#245f75" stroke="#6bd5d1"/><text x="162" y="130" font-size="20" fill="#edf4ff">Job0</text><text x="150" y="191" font-size="16" fill="#edf4ff">0</text><rect x="338" y="100" width="184" height="65" rx="10" fill="#745737" stroke="#6bd5d1"/><text x="350" y="130" font-size="20" fill="#edf4ff">Job1</text><text x="338" y="191" font-size="16" fill="#edf4ff">2</text><rect x="526" y="100" width="90" height="65" rx="10" fill="#584e8a" stroke="#6bd5d1"/><text x="538" y="130" font-size="20" fill="#edf4ff">Job2</text><text x="526" y="191" font-size="16" fill="#edf4ff">4</text><rect x="620" y="100" width="184" height="65" rx="10" fill="#245f75" stroke="#6bd5d1"/><text x="632" y="130" font-size="20" fill="#edf4ff">Job0</text><text x="620" y="191" font-size="16" fill="#edf4ff">5</text><rect x="808" y="100" width="90" height="65" rx="10" fill="#245f75" stroke="#6bd5d1"/><text x="820" y="130" font-size="20" fill="#edf4ff">Job0</text><text x="808" y="191" font-size="16" fill="#edf4ff">7</text><text x="902" y="191" font-size="16" fill="#edf4ff">8</text><text x="28" y="287" font-size="23" fill="#edf4ff">Q=8</text><rect x="150" y="250" width="466" height="65" rx="10" fill="#245f75" stroke="#6bd5d1"/><text x="162" y="280" font-size="20" fill="#edf4ff">Job0</text><text x="150" y="341" font-size="16" fill="#edf4ff">0</text><rect x="620" y="250" width="184" height="65" rx="10" fill="#745737" stroke="#6bd5d1"/><text x="632" y="280" font-size="20" fill="#edf4ff">Job1</text><text x="620" y="341" font-size="16" fill="#edf4ff">5</text><rect x="808" y="250" width="90" height="65" rx="10" fill="#584e8a" stroke="#6bd5d1"/><text x="820" y="280" font-size="20" fill="#edf4ff">Job2</text><text x="808" y="341" font-size="16" fill="#edf4ff">7</text><text x="902" y="341" font-size="16" fill="#edf4ff">8</text><text x="28" y="410" font-size="20" fill="#edf4ff">Job2 첫 실행: 4틱 vs 7틱. 총 작업량은 둘 다8틱; 전환 비용은 모델에 없다.</text></g></svg>
