<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">소유자에서 선택하는 세 가지 다른 연산</title><desc id="desc">같은 소유 상태에서 get, 이동 생성, release 중 하나를 선택한다. get은 비소유 관찰이며 이동과 release는 서로 이어지는 단계가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#edbd72"/></marker></defs><rect width="900" height="570" rx="18" fill="#0d1828"/><g font-family="sans-serif"><text x="32" y="45" fill="#f1f5f9" font-size="25" font-weight="bold">소유자에서 선택하는 세 가지 다른 연산</text><rect x="290" y="78" width="320" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="306" y="109" fill="#f1f5f9" font-size="21">unique_ptr 소유자</text><text x="306" y="138" fill="#acdce4" font-size="16">대상 객체를 정리할 책임</text><path d="M450 158 V186 H160 V222" fill="none" stroke="#edbd72" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 186 V222" fill="none" stroke="#edbd72" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 186 H740 V222" fill="none" stroke="#edbd72" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="227" width="260" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="46" y="258" fill="#f1f5f9" font-size="21">get: 주소 관찰</text><text x="46" y="287" fill="#acdce4" font-size="16">원래 소유자 유지</text><rect x="320" y="227" width="260" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="336" y="258" fill="#f1f5f9" font-size="21">이동 생성: 소유 이전</text><text x="336" y="287" fill="#acdce4" font-size="16">새 unique_ptr가 정리</text><rect x="610" y="227" width="260" height="80" rx="12" fill="#172c46" stroke="#63c7cb"/><text x="626" y="258" fill="#f1f5f9" font-size="21">release: 주소 분리</text><text x="626" y="287" fill="#acdce4" font-size="16">호출자가 책임 인수</text><text x="32" y="365" fill="#acdce4" font-size="17">get 결과는 비소유 포인터입니다. 별도 소유자로 감싸지 않습니다.</text><text x="32" y="409" fill="#acdce4" font-size="17">이동 생성은 std::move 표현식을 받는 생성자가 소유권을 이전합니다.</text><text x="32" y="453" fill="#acdce4" font-size="17">release 뒤 원래 소유자는 비지만 반환 주소는 자동으로 정리되지 않습니다.</text><text x="32" y="515" fill="#acdce4" font-size="17">세 가지는 대안 연산입니다. get → 이동 → release 순서도가 아닙니다.</text></g></svg>
