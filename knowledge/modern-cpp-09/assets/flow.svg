<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img"><rect width="1000" height="380" rx="18" fill="#111827"/><style>text{font-family:"Noto Sans CJK KR","Malgun Gothic",sans-serif;fill:#e5e7eb;font-size:23px}.title{font-size:28px;font-weight:700}.note{font-size:18px;fill:#a5b4fc}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34d399"/></marker></defs><text x="35" y="50" class="title">소유 문자열과 길이 3의 빌린 범위</text><text x="35" y="103" class="">message:</text><rect x="170" y="75" width="80" height="65" fill="#373066" stroke="#818cf8"/><text x="200" y="118" class="">1</text><rect x="256" y="75" width="80" height="65" fill="#373066" stroke="#818cf8"/><text x="286" y="118" class="">2</text><rect x="342" y="75" width="80" height="65" fill="#373066" stroke="#818cf8"/><text x="372" y="118" class="">3</text><rect x="428" y="75" width="80" height="65" fill="#1e293b" stroke="#818cf8"/><text x="458" y="118" class="">,</text><rect x="514" y="75" width="80" height="65" fill="#1e293b" stroke="#818cf8"/><text x="544" y="118" class="">r</text><rect x="600" y="75" width="80" height="65" fill="#1e293b" stroke="#818cf8"/><text x="630" y="118" class="">e</text><rect x="686" y="75" width="80" height="65" fill="#1e293b" stroke="#818cf8"/><text x="716" y="118" class="">a</text><rect x="772" y="75" width="80" height="65" fill="#1e293b" stroke="#818cf8"/><text x="802" y="118" class="">d</text><rect x="858" y="75" width="80" height="65" fill="#1e293b" stroke="#818cf8"/><text x="888" y="118" class="">y</text><text x="170" y="182" class="note">[ data, data + 3 )</text><path d="M170 225 V150" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/><path d="M428 225 V150" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/><text x="170" y="260" class="">field는 123만 봅니다. 끝 주소는 쉼표의 위치입니다.</text><text x="170" y="300" class="">string_view는 저장소를 소유하거나 NUL을 추가하지 않습니다.</text><text x="35" y="350" class="note">장기 보관이 필요하면 string으로 복사하고, 원본 재할당 전에는 view 사용을 끝냅니다.</text></svg>