<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"><title>소스·빌드·증거가 각각 답하는 질문</title><rect width="960" height="460" rx="18" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="26" fill="#e2e8f0">소스·빌드·증거가 각각 답하는 질문</text><rect x="40" y="110" width="260" height="180" rx="12" fill="#162538" stroke="#475569"/><text x="60" y="155" font-size="25" fill="#e2e8f0">main.cpp</text><text x="60" y="200" font-size="20" fill="#e2e8f0">평면 추출·범위 검사</text><text x="60" y="245" font-size="20" fill="#e2e8f0">39 명명 조건</text><rect x="350" y="110" width="260" height="180" rx="12" fill="#162538" stroke="#475569"/><text x="370" y="155" font-size="23" fill="#e2e8f0">CMakeLists.txt</text><text x="370" y="200" font-size="20" fill="#e2e8f0">실행 파일 1개</text><text x="370" y="245" font-size="20" fill="#e2e8f0">CTest 등록 1개</text><rect x="660" y="110" width="260" height="180" rx="12" fill="#162538" stroke="#475569"/><text x="680" y="155" font-size="22" fill="#e2e8f0">VALIDATION.txt</text><text x="680" y="200" font-size="20" fill="#e2e8f0">과거 명령·출력</text><text x="680" y="245" font-size="20" fill="#e2e8f0">GPU 증거 아님</text><text x="40" y="365" font-size="22" fill="#e2e8f0">15,000 점 표본은 39 조건 중 속성 검사 하나의 내부 표본입니다.</text><text x="40" y="415" font-size="20" fill="#e2e8f0">파일 수 · 테스트 등록 수 · 명명 조건 수 · 표본 수를 합산하지 않습니다.</text></g></svg>
