<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">할당과 해제는 엔진 모듈의 계약 안에</title><desc id="desc">불투명 핸들은 유효 주소를 자동 판별하는 세대 번호 핸들이 아니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">할당과 해제는 엔진 모듈의 계약 안에</text><rect x="30" y="90" width="330" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="120" font-size="20" fill="#64d8cb">Client</text><text x="46" y="150" font-size="18" fill="#e5edf7">Engine_Create(&amp;handle)</text><text x="46" y="180" font-size="18" fill="#e5edf7">내부 크기·배치를 모름</text><rect x="600" y="90" width="330" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="616" y="120" font-size="20" fill="#64d8cb">Engine 라이브러리</text><text x="616" y="150" font-size="18" fill="#e5edf7">new로 내부 객체 생성</text><text x="616" y="180" font-size="18" fill="#e5edf7">결과 코드 + 핸들 반환</text><path d="M360 145 H593" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="125" font-size="16" fill="#f5c36b">생성 요청</text><rect x="30" y="280" width="330" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="310" font-size="20" fill="#64d8cb">Client</text><text x="46" y="340" font-size="18" fill="#e5edf7">Engine_Destroy(&amp;handle)</text><text x="46" y="370" font-size="18" fill="#e5edf7">이 변수는 null로 정리</text><rect x="600" y="280" width="330" height="115" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="616" y="310" font-size="20" fill="#64d8cb">Engine 라이브러리</text><text x="616" y="340" font-size="18" fill="#e5edf7">delete로 내부 객체 파괴</text><text x="616" y="370" font-size="18" fill="#e5edf7">복사해 둔 별칭은 무효</text><path d="M360 335 H593" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="315" font-size="16" fill="#f5c36b">해제 요청</text><text x="30" y="428" font-size="17" fill="#bdcde2">불투명 핸들은 유효 주소를 자동 판별하는 세대 번호 핸들이 아니다.</text></g></svg>
