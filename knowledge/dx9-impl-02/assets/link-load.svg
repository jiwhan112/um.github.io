<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">링크 성공과 실행 시 로딩 성공은 별개</title><desc id="desc">Import .lib는 DLL 구현 자체가 아니다. Linux 공유 라이브러리 결과와도 구별한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">링크 성공과 실행 시 로딩 성공은 별개</text><rect x="30" y="100" width="350" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="130" font-size="20" fill="#64d8cb">빌드 단계</text><text x="46" y="160" font-size="18" fill="#e5edf7">헤더: 선언·호출 계약</text><text x="46" y="190" font-size="18" fill="#e5edf7">Import .lib: 심볼 연결</text><rect x="580" y="100" width="350" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="596" y="130" font-size="20" fill="#64d8cb">실행 단계</text><text x="596" y="160" font-size="18" fill="#e5edf7">DLL·종속 DLL 탐색</text><text x="596" y="190" font-size="18" fill="#e5edf7">아키텍처·배포 경로 확인</text><path d="M380 160 H573" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="405" y="140" font-size="16" fill="#f5c36b">Client.exe 생성</text><rect x="30" y="290" width="350" height="90" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="320" font-size="20" fill="#64d8cb">실패: unresolved symbol</text><text x="46" y="350" font-size="18" fill="#e5edf7">export/import·링크 입력 점검</text><rect x="580" y="290" width="350" height="90" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="596" y="320" font-size="20" fill="#64d8cb">실패: 로더 오류</text><text x="596" y="350" font-size="18" fill="#e5edf7">실제 배포·검색 정책 점검</text><path d="M205 220 V283" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M755 220 V283" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">Import .lib는 DLL 구현 자체가 아니다. Linux 공유 라이브러리 결과와도 구별한다.</text></g></svg>
