<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>Close는 삭제가 아니라 입력 차단과 남은 작업 배출이다</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#67e8f9"/></marker></defs><rect width="1000" height="540" rx="20" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e2e8f0"><text x="30" y="46" font-size="26">Close는 삭제가 아니라 입력 차단과 남은 작업 배출이다</text><rect x="30" y="105" width="280" height="120" rx="12" fill="#162538" stroke="#64748b"/><text x="46" y="140" font-size="21">열림 · 작업 [7, −9]</text><text x="48" y="190" font-size="19">Push와 Pop 허용</text><rect x="365" y="105" width="280" height="120" rx="12" fill="#162538" stroke="#64748b"/><text x="381" y="140" font-size="21">닫힘 · 작업 [7, −9]</text><text x="383" y="190" font-size="19">Push 거절 / Pop 허용</text><rect x="700" y="105" width="270" height="120" rx="12" fill="#162538" stroke="#64748b"/><text x="716" y="140" font-size="21">닫힘 · 빈 큐 []</text><text x="716" y="190" font-size="19">Pop → false</text><path d="M312 155 L360 155" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M648 155 L696 155" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="318" y="99" font-size="17">Close</text><text x="661" y="99" font-size="17">Drain</text><rect x="35" y="300" width="930" height="100" rx="12" fill="#155e75" stroke="#64748b"/><text x="51" y="335" font-size="21">생산자 완료 → Close + notify_all → 소비자 Drain → join → 큐 파괴</text><text x="40" y="458" font-size="19">wait의 재검사 조건: Push = 닫힘 OR 빈자리 / Pop = 닫힘 OR 작업 존재</text><text x="40" y="502" font-size="19">통지는 작업 개수를 저장하지 않는다. 공유 상태가 참인지 mutex 아래 확인한다.</text></g></svg>
