<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>프로세스는 주소 공간을, 스레드는 실행 상태를 구분한다</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#67e8f9"/></marker></defs><rect width="1000" height="540" rx="20" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e2e8f0"><text x="30" y="46" font-size="26">프로세스는 주소 공간을, 스레드는 실행 상태를 구분한다</text><rect x="30" y="90" width="605" height="360" rx="12" fill="#162538" stroke="#64748b"/><text x="46" y="125" font-size="21">프로세스 A · 공유 주소 공간</text><rect x="660" y="90" width="310" height="360" rx="12" fill="#162538" stroke="#64748b"/><text x="676" y="125" font-size="21">프로세스 B · 다른 공간</text><rect x="55" y="155" width="165" height="130" rx="12" fill="#162538" stroke="#64748b"/><text x="71" y="190" font-size="21">스레드 1</text><rect x="245" y="155" width="165" height="130" rx="12" fill="#162538" stroke="#64748b"/><text x="261" y="190" font-size="21">스레드 2</text><rect x="435" y="155" width="175" height="130" rx="12" fill="#162538" stroke="#64748b"/><text x="451" y="190" font-size="21">스레드 3</text><text x="65" y="230" font-size="18">스택·레지스터</text><text x="255" y="230" font-size="18">스택·레지스터</text><text x="445" y="230" font-size="18">스택·레지스터</text><rect x="55" y="315" width="555" height="95" rx="12" fill="#155e75" stroke="#64748b"/><text x="71" y="350" font-size="21">코드·공유 객체·큐 → 접근을 동기화</text><rect x="685" y="170" width="255" height="180" rx="12" fill="#162538" stroke="#64748b"/><text x="701" y="205" font-size="21">다른 큐·다른 수명</text><text x="45" y="495" font-size="20">스레드 수 ≠ 코어 수  /  스레드를 만든다고 프로그램 전체가 빨라지지는 않는다.</text></g></svg>
