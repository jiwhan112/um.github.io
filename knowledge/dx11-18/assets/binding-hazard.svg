<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">같은 resource ID의 읽기·쓰기를 겹치지 않는다</title><desc id="desc">이 CPU 모델은 충돌을 예외로 거절한다. 실제 D3D11의 자동 NULL 처리와 동일한 구현은 아니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">같은 resource ID의 읽기·쓰기를 겹치지 않는다</text><rect x="30" y="165" width="280" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="195" font-size="20" fill="#64d8cb">bindPS(id)</text><text x="46" y="225" font-size="18" fill="#e5edf7">SR 플래그가 있고</text><text x="46" y="255" font-size="18" fill="#e5edf7">현재 쓰는 ID가 아닌가?</text><rect x="565" y="85" width="360" height="90" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="581" y="115" font-size="20" fill="#64d8cb">조건 실패</text><text x="581" y="145" font-size="18" fill="#e5edf7">예외 · 읽기 목록 변경 안 함</text><rect x="565" y="270" width="360" height="90" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="581" y="300" font-size="20" fill="#64d8cb">조건 통과</text><text x="581" y="330" font-size="18" fill="#e5edf7">읽기 목록에 ID를 추가</text><path d="M310 225H435V130H558" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M435 225V315H558" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">이 CPU 모델은 충돌을 예외로 거절한다. 실제 D3D11의 자동 NULL 처리와 동일한 구현은 아니다.</text></g></svg>
