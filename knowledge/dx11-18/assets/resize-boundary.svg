<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">resize()는 재생성이 아니라 사전조건 검사다</title><desc id="desc">현재 v2에는 새 텍스처 생성·generation 갱신·기존 ID 폐기가 구현되어 있지 않다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">resize()는 재생성이 아니라 사전조건 검사다</text><rect x="30" y="110" width="270" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="140" font-size="20" fill="#64d8cb">Geometry 쓰기</text><text x="46" y="170" font-size="18" fill="#e5edf7">bindOM(RTV IDs, depth)</text><text x="46" y="200" font-size="18" fill="#e5edf7">unbindOM()</text><rect x="345" y="110" width="270" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="140" font-size="20" fill="#64d8cb">Lighting 읽기</text><text x="361" y="170" font-size="18" fill="#e5edf7">bindPS(G-buffer IDs)</text><text x="361" y="200" font-size="18" fill="#e5edf7">unbindPS()</text><rect x="660" y="110" width="270" height="140" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="140" font-size="20" fill="#64d8cb">resize()</text><text x="676" y="170" font-size="18" fill="#e5edf7">읽기·쓰기 목록이 비었나?</text><text x="676" y="200" font-size="18" fill="#e5edf7">비었으면 반환</text><path d="M300 180H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 180H653" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="325" font-size="18" fill="#e5edf7">실제 GPU resize 설계: View 참조 해제와 자원 재생성은 별도 구현·검증 필요</text><text x="30" y="428" font-size="17" fill="#bdcde2">현재 v2에는 새 텍스처 생성·generation 갱신·기존 ID 폐기가 구현되어 있지 않다.</text></g></svg>
