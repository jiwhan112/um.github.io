<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">현재 이웃 범위로 과거 값을 제한한다</title><desc id="desc">history100을이웃범위0.4에서0.6사이로clamp한뒤current0.5와weight0.9로혼합해0.59를얻는다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">현재 이웃 범위로 과거 값을 제한한다</text><line x1="90" y1="310" x2="880" y2="310" stroke="#a7b8d0" stroke-width="2" /><text x="90" y="205" fill="#e7eef8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">현재 이웃의 색 범위</text><rect x="250" y="260" width="300" height="95" rx="7" fill="#22483f" stroke="#6ee7c8"/><text x="265" y="250" fill="#6ee7c8" font-size="23" font-family="Noto Sans CJK KR, sans-serif">0.4</text><text x="510" y="250" fill="#6ee7c8" font-size="23" font-family="Noto Sans CJK KR, sans-serif">0.6</text><circle cx="400" cy="310" r="7" stroke="#78aafa" fill="#78aafa" stroke-width="3"/><text x="340" y="405" fill="#78aafa" font-size="22" font-family="Noto Sans CJK KR, sans-serif">current=0.5</text><line x1="830" y1="210" x2="550" y2="260" stroke="#fb7185" stroke-width="4" /><text x="680" y="175" fill="#fb7185" font-size="24" font-family="Noto Sans CJK KR, sans-serif">history=100</text><text x="600" y="360" fill="#f8b66c" font-size="22" font-family="Noto Sans CJK KR, sans-serif">clip → 0.6</text><text x="110" y="450" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">0.1 × 0.5 + 0.9 × 0.6 = 0.59</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>