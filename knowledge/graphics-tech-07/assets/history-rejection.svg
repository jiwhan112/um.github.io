<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">재투영한 위치가 있어도 과거 색을 버릴 수 있다</title><desc id="desc">정상대응은history혼합,깊이불일치와카메라컷은current만사용한다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">재투영한 위치가 있어도 과거 색을 버릴 수 있다</text><rect x="45" y="140" width="260" height="245" rx="7" fill="#183a35" stroke="#6ee7c8"/><text x="65" y="190" fill="#e7eef8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">정상 대응</text><text x="65" y="255" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">depth 10 ↔ 10</text><text x="65" y="330" fill="#6ee7c8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">history 혼합</text><rect x="350" y="140" width="260" height="245" rx="7" fill="#472b38" stroke="#fb7185"/><text x="370" y="190" fill="#e7eef8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">새로 드러난 면</text><text x="370" y="255" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">depth 10 ↔ 9</text><text x="370" y="330" fill="#fb7185" font-size="24" font-family="Noto Sans CJK KR, sans-serif">current만 사용</text><rect x="655" y="140" width="260" height="245" rx="7" fill="#472b38" stroke="#fb7185"/><text x="675" y="190" fill="#e7eef8" font-size="24" font-family="Noto Sans CJK KR, sans-serif">카메라 컷</text><text x="675" y="255" fill="#e7eef8" font-size="20" font-family="Noto Sans CJK KR, sans-serif">이전 대응 없음</text><text x="675" y="330" fill="#fb7185" font-size="24" font-family="Noto Sans CJK KR, sans-serif">current만 사용</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>