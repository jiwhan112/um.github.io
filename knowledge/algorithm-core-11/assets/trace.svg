<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>다익스트라·A*·휴리스틱 계약 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">다익스트라·A*·휴리스틱 계약 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. 초기0</text><text x="340" y="105" font-size="19">1후보8, 2후보2</text><text x="340" y="137" font-size="17" fill="#a7f3d0">작은2 먼저 처리</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. 2 처리</text><text x="340" y="213" font-size="19">1후보4, 3후보12</text><text x="340" y="245" font-size="17" fill="#a7f3d0">1의 예전8은 남아 있음</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. 1 처리</text><text x="340" y="321" font-size="19">3후보5 → 목표</text><text x="340" y="353" font-size="17" fill="#a7f3d0">예전 후보는 최신값과 비교</text></g></svg>