<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">하늘 깊이와 표면 조명은 서로 다른 계약</title><desc id="d">상단은 깊이 1 하늘 샘플의 두 비교 결과, 하단은 표면에서 광원으로 향하는 방향의 Lambert 결과입니다. 두 실험은 독립입니다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="450" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#e2e8f0">하늘 깊이와 표면 조명은 서로 다른 계약</text><rect x="30" y="85" width="260" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="115" font-size="18" fill="#e2e8f0">하늘 sample z = 1</text><text x="44" y="142" font-size="18" fill="#e2e8f0">저장 깊이 = 1</text><text x="44" y="169" font-size="18" fill="#e2e8f0">깊이 쓰기 OFF</text><path d="M290 115H345" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="345" y="75" width="580" height="70" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="359" y="105" font-size="18" fill="#e2e8f0">LESS: 1 &lt; 1 거짓 → 거부</text><path d="M290 155H345" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="345" y="165" width="580" height="70" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="359" y="195" font-size="18" fill="#e2e8f0">LESS_EQUAL: 1 ≤ 1 참 → 허용</text><rect x="30" y="290" width="280" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="44" y="320" font-size="18" fill="#e2e8f0">N=(0,1,0)</text><text x="44" y="347" font-size="18" fill="#e2e8f0">빛 진행=(0,-1,0)</text><text x="44" y="374" font-size="18" fill="#e2e8f0">L = -빛 진행</text><path d="M310 340H355" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"/><rect x="355" y="290" width="570" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/><text x="369" y="320" font-size="18" fill="#e2e8f0">dot(N,L)=1 → diffuse=1</text><text x="369" y="347" font-size="18" fill="#e2e8f0">흰 재질·흰 빛·ambient=.1 → RGB=1.1</text><text x="369" y="374" font-size="18" fill="#e2e8f0">선형 수치이며 화면 색/톤 매핑 결과가 아님</text></g></svg>
