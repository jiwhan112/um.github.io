<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>이분 탐색·반열린 구간 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">이분 탐색·반열린 구간 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. 배열 [1,4,4,7], x=4</text><text x="340" y="105" font-size="19">lo=0,hi=4,mid=2</text><text x="340" y="137" font-size="17" fill="#a7f3d0">4&lt;4 거짓 → hi=2</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. 다음</text><text x="340" y="213" font-size="19">lo=0,hi=2,mid=1</text><text x="340" y="245" font-size="17" fill="#a7f3d0">4&lt;4 거짓 → hi=1</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. 마지막</text><text x="340" y="321" font-size="19">lo=0,hi=1,mid=0</text><text x="340" y="353" font-size="17" fill="#a7f3d0">1&lt;4 참 → lo=1 종료</text></g></svg>