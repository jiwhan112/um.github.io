<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>그래프·BFS·DFS 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">그래프·BFS·DFS · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. 시작0</text><text x="340" y="105" font-size="19">queue=[0], d0=0</text><text x="340" y="137" font-size="17" fill="#a7f3d0">0→1,2</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. 0 처리</text><text x="340" y="213" font-size="19">queue=[1,2], d1=d2=1</text><text x="340" y="245" font-size="17" fill="#a7f3d0">둘 다3으로 연결</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. 1 처리</text><text x="340" y="321" font-size="19">queue=[2,3], d3=2</text><text x="340" y="353" font-size="17" fill="#a7f3d0">2는3을 다시 넣지 않음</text></g></svg>