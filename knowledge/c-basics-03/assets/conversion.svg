<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" role="img" aria-labelledby="title desc"><title id="title">형 변환을 언제 하는가?</title><desc id="desc">나누기 전에 바꿔야 소수 부분을 유지합니다.</desc><rect width="640" height="485" rx="20" fill="#101c2c"/><g font-family="sans-serif"><text x="30" y="48" font-size="26" fill="#f0f6ff">형 변환을 언제 하는가?</text><rect x="30" y="78" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="110" font-size="24" fill="#7dd3fc">5 / 2 → 2</text><text x="48" y="142" font-size="21" fill="#f0f6ff">두 피연산자가 int: 정수 나눗셈</text><path d="M320 168v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="188" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="220" font-size="24" fill="#7dd3fc">(double)(5 / 2) → 2.0</text><text x="48" y="252" font-size="21" fill="#f0f6ff">계산이 끝난 2를 double로 변환</text><path d="M320 278v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="298" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="330" font-size="24" fill="#7dd3fc">(double)5 / 2 → 2.5</text><text x="48" y="362" font-size="21" fill="#f0f6ff">double 계산으로 나눈 뒤 결과를 저장</text><text x="30" y="457" font-size="18" fill="#c0cedd">나누기 전에 바꿔야 소수 부분을 유지합니다.</text></g></svg>
