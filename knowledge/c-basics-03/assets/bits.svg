<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 485" role="img" aria-labelledby="title desc"><title id="title">같은 4와 2, 다른 AND</title><desc id="desc">그림은 하위 4비트만 표시한 것입니다.</desc><rect width="640" height="485" rx="20" fill="#101c2c"/><g font-family="sans-serif"><text x="30" y="48" font-size="26" fill="#f0f6ff">같은 4와 2, 다른 AND</text><rect x="30" y="78" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="110" font-size="24" fill="#7dd3fc">4의 비트  0100 / 2의 비트  0010</text><text x="48" y="142" font-size="21" fill="#f0f6ff">비트 AND  &amp;  → 0000 = 0</text><path d="M320 168v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="188" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="220" font-size="24" fill="#7dd3fc">4는 참 / 2도 참</text><text x="48" y="252" font-size="21" fill="#f0f6ff">논리 AND  &amp;&amp; → 1</text><path d="M320 278v16m-5-5 5 5 5-5" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="30" y="298" width="580" height="88" rx="12" fill="#20344a" stroke="#597795"/><text x="48" y="330" font-size="24" fill="#7dd3fc">flags = 0, mask = 4</text><text x="48" y="362" font-size="21" fill="#f0f6ff">| 켜기 → 4 / &amp; ~ 끄기 → 0 / ^ 뒤집기</text><text x="30" y="457" font-size="18" fill="#c0cedd">그림은 하위 4비트만 표시한 것입니다.</text></g></svg>
