<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img">
<title>DirectX 12 12 · 실행 계약 시각화</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker></defs>
<rect width="1080" height="620" rx="18" fill="#0f172a"/>
<text x="36" y="53" fill="#f8fafc" font-family="sans-serif" font-size="29">검증 결과는 층마다 따로 기록한다</text>
<rect x="65.0" y="110" width="950" height="75" rx="9" fill="#14532d" stroke="#64748b"/>
<text x="79.0" y="155.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">실행 확인: CPU Release CTest + UBSan</text>
<rect x="130.0" y="210" width="820" height="75" rx="9" fill="#422d1d" stroke="#64748b"/>
<text x="144.0" y="255.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">미검증: Windows / SDK / HLSL 빌드</text>
<rect x="195.0" y="310" width="690" height="75" rx="9" fill="#422d1d" stroke="#64748b"/>
<text x="209.0" y="355.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">미검증: GPU / WARP / debug layer</text>
<rect x="260.0" y="410" width="560" height="75" rx="9" fill="#422d1d" stroke="#64748b"/>
<text x="274.0" y="455.5" fill="#e2e8f0" font-family="sans-serif" font-size="23">미검증: PIX / DRED / 성능</text>
<text x="60" y="555" fill="#fbbf24" font-family="sans-serif" font-size="23">먼저 통과한 층을 뒤의 층까지 성공했다고 확대하지 않는다.</text>
<text x="35" y="603" fill="#94a3b8" font-family="sans-serif" font-size="17">자체 제작 개념도 · 실제 GPU 캡처 또는 측정 결과가 아닙니다</text>
</svg>