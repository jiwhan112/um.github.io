<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">GetMessageW · BOOL 이름 뒤의 세 갈래</title><desc id="desc">설명용 GetMessage 루프와 실제 GUI의 PeekMessage 루프를 구별한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">GetMessageW · BOOL 이름 뒤의 세 갈래</text><rect x="30" y="175" width="280" height="100" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="205" font-size="20" fill="#64d8cb">GetMessageW 호출</text><text x="46" y="235" font-size="18" fill="#e5edf7">result를 먼저 검사</text><rect x="565" y="78" width="360" height="80" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="581" y="108" font-size="20" fill="#64d8cb">result &gt; 0</text><text x="581" y="138" font-size="18" fill="#e5edf7">Translate → Dispatch</text><rect x="565" y="190" width="360" height="80" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="581" y="220" font-size="20" fill="#64d8cb">result == 0</text><text x="581" y="250" font-size="18" fill="#e5edf7">WM_QUIT · 루프 종료</text><rect x="565" y="302" width="360" height="80" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="581" y="332" font-size="20" fill="#64d8cb">result == -1</text><text x="581" y="362" font-size="18" fill="#e5edf7">오류 처리 · 전달하지 않음</text><path d="M310 225 H435 V118 H558" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M435 225 H558" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M435 225 V342 H558" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">설명용 GetMessage 루프와 실제 GUI의 PeekMessage 루프를 구별한다.</text></g></svg>
