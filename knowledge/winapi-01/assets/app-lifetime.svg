<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">HWND는 App을 소유하지 않는다</title><desc id="desc">연결 포인터를 지운 뒤 창보다 오래 살아 있던 App의 수명을 끝낸다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f5c36b"/></marker></defs><rect width="960" height="450" rx="18" fill="#101b2d"/><g font-family="sans-serif"><text x="30" y="42" font-size="25" fill="#e5edf7">HWND는 App을 소유하지 않는다</text><rect x="30" y="90" width="900" height="75" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="120" font-size="20" fill="#64d8cb">wWinMain 지역 App의 수명</text><text x="46" y="150" font-size="18" fill="#e5edf7">창 생성 전 시작 ───────────────────────── 종료 정리 뒤 끝</text><rect x="30" y="215" width="270" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="46" y="245" font-size="20" fill="#64d8cb">WM_NCCREATE</text><text x="46" y="275" font-size="18" fill="#e5edf7">App*를 GWLP_USERDATA에</text><text x="46" y="305" font-size="18" fill="#e5edf7">생성 도중 콜백도 가능</text><rect x="345" y="215" width="270" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="361" y="245" font-size="20" fill="#64d8cb">창이 살아 있는 동안</text><text x="361" y="275" font-size="18" fill="#e5edf7">포인터를 빌려 사용</text><text x="361" y="305" font-size="18" fill="#e5edf7">주소 저장 ≠ 수명 연장</text><rect x="660" y="215" width="270" height="120" rx="10" fill="#20344d" stroke="#64d8cb"/><text x="676" y="245" font-size="20" fill="#64d8cb">WM_NCDESTROY</text><text x="676" y="275" font-size="18" fill="#e5edf7">연결 해제 · hwnd 초기화</text><text x="676" y="305" font-size="18" fill="#e5edf7">이후 App을 파괴</text><path d="M300 275 H338" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 275 H653" fill="none" stroke="#f5c36b" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="428" font-size="17" fill="#bdcde2">연결 포인터를 지운 뒤 창보다 오래 살아 있던 App의 수명을 끝낸다.</text></g></svg>
