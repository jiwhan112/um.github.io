<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">정점 선언은 바이트를 읽는 계약이다</title><desc id="desc">두 정점의 20바이트 간격과 각 정점의 위치12바이트·UV8바이트를 분리한 개념도. 실제 GPU 캡처가 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#67e8f9"/></marker></defs><rect width="960" height="440" rx="18" fill="#0f172a"/><g font-family="sans-serif"><text x="28" y="40" font-size="24" fill="#f8fafc">정점 선언은 바이트를 읽는 계약이다</text><text x="30" y="85" font-size="18" fill="#e2e8f0">한 정점: 20바이트 (이 실습이 static_assert로 확인한 전제)</text><rect x="40" y="115" width="110" height="58" fill="#164e63" stroke="#94a3b8"/><text x="80" y="140" font-size="18" fill="#e2e8f0">x</text><text x="52" y="163" font-size="15" fill="#e2e8f0">0..3</text><rect x="152" y="115" width="110" height="58" fill="#164e63" stroke="#94a3b8"/><text x="192" y="140" font-size="18" fill="#e2e8f0">y</text><text x="164" y="163" font-size="15" fill="#e2e8f0">4..7</text><rect x="264" y="115" width="110" height="58" fill="#164e63" stroke="#94a3b8"/><text x="304" y="140" font-size="18" fill="#e2e8f0">z</text><text x="276" y="163" font-size="15" fill="#e2e8f0">8..11</text><rect x="376" y="115" width="110" height="58" fill="#4c1d95" stroke="#94a3b8"/><text x="416" y="140" font-size="18" fill="#e2e8f0">u</text><text x="388" y="163" font-size="15" fill="#e2e8f0">12..15</text><rect x="488" y="115" width="110" height="58" fill="#4c1d95" stroke="#94a3b8"/><text x="528" y="140" font-size="18" fill="#e2e8f0">v</text><text x="500" y="163" font-size="15" fill="#e2e8f0">16..19</text><text x="630" y="145" font-size="18" fill="#e2e8f0">정점 0: 시작 0바이트</text><rect x="40" y="220" width="110" height="58" fill="#164e63" stroke="#94a3b8"/><text x="80" y="245" font-size="18" fill="#e2e8f0">x</text><text x="52" y="268" font-size="15" fill="#e2e8f0">20..23</text><rect x="152" y="220" width="110" height="58" fill="#164e63" stroke="#94a3b8"/><text x="192" y="245" font-size="18" fill="#e2e8f0">y</text><text x="164" y="268" font-size="15" fill="#e2e8f0">24..27</text><rect x="264" y="220" width="110" height="58" fill="#164e63" stroke="#94a3b8"/><text x="304" y="245" font-size="18" fill="#e2e8f0">z</text><text x="276" y="268" font-size="15" fill="#e2e8f0">28..31</text><rect x="376" y="220" width="110" height="58" fill="#4c1d95" stroke="#94a3b8"/><text x="416" y="245" font-size="18" fill="#e2e8f0">u</text><text x="388" y="268" font-size="15" fill="#e2e8f0">32..35</text><rect x="488" y="220" width="110" height="58" fill="#4c1d95" stroke="#94a3b8"/><text x="528" y="245" font-size="18" fill="#e2e8f0">v</text><text x="500" y="268" font-size="15" fill="#e2e8f0">36..39</text><text x="630" y="250" font-size="18" fill="#e2e8f0">정점 1: 시작 20바이트</text><path d="M605 144V249" stroke="#67e8f9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="630" y="200" font-size="17" fill="#e2e8f0">stride = 20</text><text x="30" y="350" font-size="18" fill="#e2e8f0">POSITION: offset 0 / 12바이트     TEXCOORD: offset 12 / 8바이트</text><text x="30" y="385" font-size="20" fill="#67e8f9">UV 주소 = 시작 + 최종 정점 인덱스 × 20 + 12</text><text x="30" y="415" font-size="16" fill="#e2e8f0">구조체 이름이 아니라 선언·stride·바이트 단위가 맞아야 같은 값을 읽습니다.</text></g></svg>
