<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>연결 리스트·링크·소유권 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">연결 리스트·링크·소유권 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. 초기</text><text x="340" y="105" font-size="19">head → 9 → 4 → 2 → 4</text><text x="340" y="137" font-size="17" fill="#a7f3d0">첫4의 소유 링크 탐색</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. 분리</text><text x="340" y="213" font-size="19">removed=4, next=2</text><text x="340" y="245" font-size="17" fill="#a7f3d0">삭제 노드의 next 이전</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. 완료</text><text x="340" y="321" font-size="19">head → 9 → 2 → 4</text><text x="340" y="353" font-size="17" fill="#a7f3d0">size 4→3</text></g></svg>