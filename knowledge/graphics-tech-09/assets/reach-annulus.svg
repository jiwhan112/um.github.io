<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">두 bone의 도달 영역은 고리일 수 있다</title><desc id="desc">길이2와1의끝점거리는1이상3이하이며root근처구멍은도달할수없다.</desc><rect width="960" height="520" fill="#101827"/><text x="32" y="45" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">두 bone의 도달 영역은 고리일 수 있다</text><circle cx="260" cy="280" r="160" stroke="#6ee7c8" fill="#1b3b36" stroke-width="3"/><circle cx="260" cy="280" r="53" stroke="#f8b66c" fill="#101827" stroke-width="3"/><circle cx="260" cy="280" r="5" stroke="#e7eef8" fill="#e7eef8" stroke-width="3"/><text x="110" y="100" fill="#e7eef8" font-size="27" font-family="Noto Sans CJK KR, sans-serif">a=2, b=1</text><text x="500" y="190" fill="#f8b66c" font-size="25" font-family="Noto Sans CJK KR, sans-serif">최소 거리 |a-b|=1</text><text x="500" y="250" fill="#6ee7c8" font-size="25" font-family="Noto Sans CJK KR, sans-serif">최대 거리 a+b=3</text><text x="500" y="330" fill="#fb7185" font-size="24" font-family="Noto Sans CJK KR, sans-serif">안쪽 구멍도 도달 불가</text><line x1="260" y1="280" x2="420" y2="280" stroke="#6ee7c8" stroke-width="2" /><text x="300" y="310" fill="#6ee7c8" font-size="23" font-family="Noto Sans CJK KR, sans-serif">3</text><text x="32" y="493" fill="#a7b8d0" font-size="17" font-family="Noto Sans CJK KR, sans-serif">자체 제작 개념도 · 실제 GPU 측정/화면 아님</text></svg>