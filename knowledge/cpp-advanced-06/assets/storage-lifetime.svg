<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">자동 저장 공간 안에서 int 수명 시작과 종료</title>
  <desc id="desc">같은 자동 byte 배열을 세 단계에서 본 개념도다. 먼저 int에 맞는 크기와 정렬의 bytes를 준비한다. 위치 지정 new로 그 공간에 값42인 int를 구성한다. destroy_at으로 int의 수명을 끝내도 bytes의 자동 저장 공간은 스코프가 끝날 때까지 남는다. 이 주소를 delete하지 않는다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6ee7b7"/></marker></defs>
  <rect width="640" height="720" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#e8f0ff">
    <text x="32" y="48" font-size="28" font-weight="700">객체 수명과 저장 공간은 별개</text>
    <text x="32" y="86" font-size="24" fill="#b8c7dd">같은 bytes를 세 시점에서 봅니다</text>
    <rect x="32" y="115" width="576" height="128" rx="14" fill="#1b2640" stroke="#93c5fd" stroke-width="2"/>
    <text x="52" y="153" font-size="25" font-weight="700">1. 정렬된 bytes 준비</text>
    <text x="52" y="195" font-size="24">sizeof(int) · alignas(int)</text>
    <text x="52" y="227" font-size="22" fill="#b8c7dd">자동 저장 공간 · 아직 42를 구성하기 전</text>
    <path d="M320 245V279" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="291" width="576" height="128" rx="14" fill="#172c3d" stroke="#6ee7b7" stroke-width="2"/>
    <text x="52" y="330" font-size="25" font-weight="700">2. 위치 지정 new</text>
    <text x="52" y="374" font-size="24">bytes 안에 int 구성</text>
    <rect x="447" y="323" width="133" height="67" rx="10" fill="#234738" stroke="#6ee7b7" stroke-width="2"/>
    <text x="513" y="368" text-anchor="middle" font-size="32" font-weight="700" fill="#6ee7b7">42</text>
    <path d="M320 421V455" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="467" width="576" height="128" rx="14" fill="#1b2640" stroke="#93c5fd" stroke-width="2"/>
    <text x="52" y="505" font-size="25" font-weight="700">3. std::destroy_at(value)</text>
    <text x="52" y="548" font-size="24" fill="#fda4af">int 수명 종료 · 값으로 읽지 않음</text>
    <text x="52" y="580" font-size="22" fill="#b8c7dd">bytes의 저장 공간은 여전히 남아 있음</text>
    <text x="32" y="646" font-size="24">bytes는 스코프 끝에 정리합니다.</text>
    <text x="32" y="683" font-size="24" fill="#fda4af">이 자동 저장 공간을 delete하지 않습니다.</text>
  </g>
</svg>
