<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">같은 총 용량이어도 한 집합의 수용력이 다르다</title><desc id="d">총4라인에서 직접 매핑은4집합1way, 2way는2집합2way다. 0과4의 반복은 첫구성에서계속충돌하지만 둘째구성의같은집합 두웨이에는 함께남는다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f3c477"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1a29"/><g font-family="sans-serif"><text x="28" y="42" font-size="25" fill="#edf4ff">같은 총 용량이어도 한 집합의 수용력이 다르다</text><text x="35" y="85" font-size="22" fill="#edf4ff">4라인·직접 매핑: 4집합 × 1way</text><text x="515" y="85" font-size="22" fill="#edf4ff">4라인·2-way: 2집합 × 2way</text><rect x="35" y="105" width="350" height="48" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="47" y="135" font-size="20" fill="#edf4ff">S0 : 0 ↔ 4 충돌</text><rect x="35" y="163" width="350" height="48" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="47" y="193" font-size="20" fill="#edf4ff">S1 : 비어 있음</text><rect x="35" y="221" width="350" height="48" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="47" y="251" font-size="20" fill="#edf4ff">S2 : 비어 있음</text><rect x="35" y="279" width="350" height="48" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="47" y="309" font-size="20" fill="#edf4ff">S3 : 비어 있음</text><rect x="515" y="105" width="390" height="90" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="527" y="135" font-size="20" fill="#edf4ff">S0 : [0] [4]</text><text x="527" y="164" font-size="16" fill="#bbd3e4">둘 다 block % 2 = 0</text><rect x="515" y="220" width="390" height="90" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="527" y="250" font-size="20" fill="#edf4ff">S1 : [ ] [ ]</text><text x="527" y="279" font-size="16" fill="#bbd3e4">총 용량은 여전히4라인</text><text x="35" y="380" font-size="20" fill="#edf4ff">접근열 0,4,0,4 → miss4 / hit0</text><text x="515" y="380" font-size="20" fill="#edf4ff">접근열 0,4,0,4 → miss2 / hit2</text><text x="35" y="425" font-size="20" fill="#edf4ff">두 구성은 집합 수도 다르다. 블록 번호와 바이트 주소를 섞지 않는다.</text></g></svg>
