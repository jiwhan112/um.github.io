<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">hit도 순서를 바꾼다: 10,11,10,12,11</title><desc id="d">두웨이를사용하는단일집합에서10을다시접근하면11이가장오래된다.12는11을퇴출하고,다음11은10을퇴출한다.최종hit1 miss4 eviction2.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f3c477"/></marker></defs><rect width="960" height="460" rx="16" fill="#0b1a29"/><g font-family="sans-serif"><text x="28" y="42" font-size="25" fill="#edf4ff">hit도 순서를 바꾼다: 10,11,10,12,11</text><text x="35" y="88" font-size="21" fill="#edf4ff">전체2라인 · 2-way · 1집합   |   왼쪽=LRU, 오른쪽=MRU</text><text x="35" y="140" font-size="20" fill="#edf4ff">접근 10</text><rect x="210" y="112" width="300" height="46" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="222" y="142" font-size="20" fill="#edf4ff">[10]</text><text x="555" y="140" font-size="20" fill="#edf4ff">miss · 빈 슬롯</text><text x="35" y="195" font-size="20" fill="#edf4ff">접근 11</text><rect x="210" y="167" width="300" height="46" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="222" y="197" font-size="20" fill="#edf4ff">[10,11]</text><text x="555" y="195" font-size="20" fill="#edf4ff">miss · 빈 슬롯</text><text x="35" y="250" font-size="20" fill="#edf4ff">접근 10</text><rect x="210" y="222" width="300" height="46" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="222" y="252" font-size="20" fill="#edf4ff">[11,10]</text><text x="555" y="250" font-size="20" fill="#edf4ff">hit · 최근 사용 갱신</text><text x="35" y="305" font-size="20" fill="#edf4ff">접근 12</text><rect x="210" y="277" width="300" height="46" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="222" y="307" font-size="20" fill="#edf4ff">[10,12]</text><text x="555" y="305" font-size="20" fill="#edf4ff">miss · 11 퇴출</text><text x="35" y="360" font-size="20" fill="#edf4ff">접근 11</text><rect x="210" y="332" width="300" height="46" rx="10" fill="#19374d" stroke="#6bd5d1"/><text x="222" y="362" font-size="20" fill="#edf4ff">[12,11]</text><text x="555" y="360" font-size="20" fill="#edf4ff">miss · 10 퇴출</text><text x="35" y="425" font-size="20" fill="#edf4ff">합계: hit1 + miss4 = 접근5; eviction2는 miss4의 부분집합이다.</text></g></svg>
