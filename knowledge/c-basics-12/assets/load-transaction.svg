<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">읽기 성공과 게임 상태 변경을 분리한다</title><desc id="desc">로드 실패는 저장된 게임 상태를 절반만 바꾸지 않는다.</desc>
<rect width="960" height="390" rx="20" fill="#101b2d"/>
<text x="40" y="48" fill="#f2f6ff" font-family="sans-serif" font-size="25">읽기 성공과 게임 상태 변경을 분리한다</text>
<rect x="40" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="60" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">입력 스트림</text>
<text x="60" y="180" fill="#fff" font-family="sans-serif" font-size="17">8바이트 + EOF 확인</text>
<text x="60" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">짧은 읽기 / 오류 구분</text>
<path d="M 316 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="345" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="365" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">임시 candidate</text>
<text x="365" y="180" fill="#fff" font-family="sans-serif" font-size="17">매직·버전·범위 검사</text>
<text x="365" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">실패 → 원본 보존</text>
<path d="M 621 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="650" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="670" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">출력 Save</text>
<text x="670" y="180" fill="#fff" font-family="sans-serif" font-size="17">*out = candidate</text>
<text x="670" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">성공한 경우만 한 번 대입</text>
<text x="40" y="335" fill="#f5c36b" font-family="sans-serif" font-size="18">로드 실패는 저장된 게임 상태를 절반만 바꾸지 않는다.</text>
</svg>
