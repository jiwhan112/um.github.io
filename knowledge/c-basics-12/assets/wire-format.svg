<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">저장 형식 v1 · 정확히 8바이트</title><desc id="desc">구조체 메모리 배치와 파일 형식은 서로 다른 계약이다.</desc>
<rect width="960" height="390" rx="20" fill="#101b2d"/>
<text x="40" y="48" fill="#f2f6ff" font-family="sans-serif" font-size="25">저장 형식 v1 · 정확히 8바이트</text>
<rect x="40" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="60" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">0–3: 매직</text>
<text x="60" y="180" fill="#fff" font-family="sans-serif" font-size="17">47 41 4D 45</text>
<text x="60" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">ASCII GAME 식별값</text>
<path d="M 316 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="345" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="365" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">4: 버전 / 5–6: 코인</text>
<text x="365" y="180" fill="#fff" font-family="sans-serif" font-size="17">01 / 상위 → 하위</text>
<text x="365" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">0..65535, 빅 엔디언</text>
<path d="M 621 180 h 22 l -7 -7 m 7 7 l -7 7" fill="none" stroke="#f5c36b" stroke-width="3"/>
<rect x="650" y="90" width="270" height="190" rx="12" fill="#20344d" stroke="#5bd4c7"/>
<text x="670" y="130" fill="#5bd4c7" font-family="sans-serif" font-size="19">7: 포션</text>
<text x="670" y="180" fill="#fff" font-family="sans-serif" font-size="17">00..63 (16진수)</text>
<text x="670" y="222" fill="#c6d4e8" font-family="sans-serif" font-size="16">0..99, 뒤쪽 데이터 금지</text>
<text x="40" y="335" fill="#f5c36b" font-family="sans-serif" font-size="18">구조체 메모리 배치와 파일 형식은 서로 다른 계약이다.</text>
</svg>
