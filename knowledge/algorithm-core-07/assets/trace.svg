<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>힙·우선순위 큐 상태 추적</title><rect width="1000" height="430" rx="20" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e5e7eb"><text x="30" y="43" font-size="24">힙·우선순위 큐 · 구체적 상태 추적</text><rect x="30" y="75" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="105" font-size="19" fill="#93c5fd">1. Push 7,3,5</text><text x="340" y="105" font-size="19">[3,7,5]</text><text x="340" y="137" font-size="17" fill="#a7f3d0">루트3은 최소</text><rect x="30" y="183" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="213" font-size="19" fill="#93c5fd">2. Push 1</text><text x="340" y="213" font-size="19">[1,3,5,7]</text><text x="340" y="245" font-size="17" fill="#a7f3d0">1이 부모 경로를 상승</text><rect x="30" y="291" width="940" height="88" rx="12" fill="#1f2937" stroke="#475569"/><text x="50" y="321" font-size="19" fill="#93c5fd">3. Pop</text><text x="340" y="321" font-size="19">반환1 → [3,7,5]</text><text x="340" y="353" font-size="17" fill="#a7f3d0">마지막7을 내려 복구</text></g></svg>