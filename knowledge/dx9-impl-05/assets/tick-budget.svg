<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>고정 Tick 횟수와 프레임 횟수는 다르다</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">고정 Tick 횟수와 프레임 횟수는 다르다</text><rect x="40" y="110" width="240" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="54" y="146" font-size="22" fill="#e2e8f0">dt 최대 0.25초</text><rect x="360" y="110" width="240" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="374" y="146" font-size="22" fill="#e2e8f0">Tick 최대 5회</text><rect x="680" y="110" width="240" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="694" y="146" font-size="22" fill="#e2e8f0">LateTick/Render 1회</text><path d="M280 145 L350 145" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M600 145 L670 145" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="70" y="270" font-size="22" fill="#e2e8f0">step = 1/60초 · 초과 누적 시간은 버리는 학습 정책</text><text x="70" y="335" font-size="21" fill="#e2e8f0">alpha는 계수만 계산한다. 실제 Transform 보간은 별도 구현.</text></g></svg>
