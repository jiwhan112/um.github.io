<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"><title>소유와 임시 참조를 구별</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#38bdf8"/></marker></defs><rect width="960" height="440" rx="16" fill="#0b1220"/><g font-family="sans-serif"><text x="30" y="45" font-size="28" fill="#e2e8f0">소유와 임시 참조를 구별</text><rect x="45" y="95" width="220" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="59" y="131" font-size="22" fill="#e2e8f0">Engine</text><rect x="360" y="95" width="220" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="374" y="131" font-size="22" fill="#e2e8f0">World</text><rect x="675" y="95" width="240" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="689" y="131" font-size="22" fill="#e2e8f0">Actor 소유</text><path d="M265 130 L350 130" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M580 130 L665 130" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><rect x="360" y="280" width="400" height="70" rx="10" fill="#17283f" stroke="#38bdf8"/><text x="374" y="316" font-size="22" fill="#e2e8f0">렌더 큐: 비소유 핸들</text><path d="M790 165 L650 270" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><text x="55" y="390" font-size="20" fill="#e2e8f0">삭제 요청 → 안전 지점 Commit → 더 이상 이전 객체를 사용하지 않음</text></g></svg>
