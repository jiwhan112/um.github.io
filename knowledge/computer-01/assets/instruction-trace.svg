<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">LOAD ADD STORE 명령별 레지스터와 메모리 변화</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#63d6c5"/></marker></defs><rect width="1000" height="650" fill="#101319"/><style>text{font-family:'Noto Sans CJK KR',Arial,sans-serif;fill:#e9edf5;font-size:24px}.small{font-size:21px;fill:#b7c4d9}.head{font-size:30px;font-weight:bold}.box{fill:#1c2636;stroke:#5a7498;stroke-width:2}.line{fill:none;stroke:#63d6c5;stroke-width:3;marker-end:url(#arrow)}</style><text x="38" y="48" class="head">같은 값도 저장 위치를 따라가야 한다</text><text x="40" y="94" class="small">가정: memory[2]=7, 나머지 셀·레지스터=0 · PC는 명령 인덱스</text><rect x="35" y="125" width="930" height="350" rx="12" class="box"/><text x="60" y="169">PC / 명령</text><text x="420" y="169">레지스터 결과</text><text x="725" y="169">memory[3]</text><path d="M50 190 H950" stroke="#5a7498"/><text x="60" y="235">0 · LOAD r0, [2]</text><text x="420" y="235">r0 = 7</text><text x="765" y="235">0</text><text x="60" y="305">1 · ADD r1, r0, r0</text><text x="420" y="305">r1 = 14</text><text x="765" y="305">0</text><text x="60" y="375">2 · STORE [3], r1</text><text x="420" y="375">r1 = 14 유지</text><text x="765" y="375">14</text><text x="60" y="445">3 · HALT</text><text x="420" y="445">4단계 후 종료</text><text x="765" y="445">14</text><path d="M780 315 L780 342" class="line"/><text x="40" y="530">ADD의 결과는 바로 RAM 전체에 복사되지 않는다.</text><text x="40" y="575" class="small">모델은 STORE에서 지정 셀만 바꾼다. 실제 캐시 쓰기 정책은 모델 밖이다.</text><text x="40" y="615" class="small">범위 밖 인덱스는 접근 전 거절한다. 실제 메모리 보호 예외 실험이 아니다.</text></svg>