<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">CPU 실행 상태와 메모리 접근의 역할 구분</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#63d6c5"/></marker></defs><rect width="1000" height="650" fill="#101319"/><style>text{font-family:'Noto Sans CJK KR',Arial,sans-serif;fill:#e9edf5;font-size:24px}.small{font-size:21px;fill:#b7c4d9}.head{font-size:30px;font-weight:bold}.box{fill:#1c2636;stroke:#5a7498;stroke-width:2}.line{fill:none;stroke:#63d6c5;stroke-width:3;marker-end:url(#arrow)}</style><text x="38" y="48" class="head">CPU 실행 상태와 메모리·I/O 역할</text><rect x="40" y="90" width="520" height="360" rx="18" class="box"/><text x="60" y="125">CPU 실행 역할</text><rect x="65" y="160" width="220" height="110" rx="10" class="box"/><text x="85" y="200">레지스터</text><text x="85" y="238" class="small">피연산자 · 결과 · PC</text><rect x="310" y="160" width="220" height="110" rx="10" class="box"/><text x="330" y="200">ALU</text><text x="330" y="238" class="small">연산 · 비교</text><path d="M285 215 L307 215" class="line"/><rect x="90" y="310" width="420" height="100" rx="10" class="box"/><text x="115" y="351">제어와 명령 실행</text><text x="115" y="387" class="small">가져오기 → 해석 → 상태 갱신</text><rect x="650" y="105" width="300" height="150" rx="12" class="box"/><text x="680" y="149">메모리 접근 역할</text><text x="680" y="190" class="small">캐시 · 주기억장치</text><text x="680" y="228" class="small">명령과 데이터</text><path d="M562 185 L645 185" class="line"/><text x="580" y="164" class="small">요청</text><path d="M648 220 L565 220" class="line"/><text x="580" y="250" class="small">응답</text><rect x="650" y="320" width="300" height="130" rx="12" class="box"/><text x="680" y="365">I/O 컨트롤러</text><text x="680" y="407" class="small">장치 요청 · 완료 통지</text><path d="M650 385 L565 385" class="line"/><text x="577" y="363" class="small">인터럽트</text><rect x="40" y="500" width="910" height="110" rx="12" class="box"/><text x="65" y="540">이 그림은 실제 칩 배치도가 아니다.</text><text x="65" y="581" class="small">캐시·컨트롤러의 물리 배치와 공유 구조는 CPU/SoC마다 다르다.</text></svg>