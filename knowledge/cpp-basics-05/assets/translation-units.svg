<svg xmlns="http://www.w3.org/2000/svg" width="640" height="610" viewBox="0 0 640 610" role="img" aria-labelledby="title desc">
  <title id="title">헤더 포함과 두 번역 단위의 링크</title>
  <desc id="desc">inventory.cpp와 inventory_main.cpp는 각각 inventory.hpp를 포함한 번역 단위로 컴파일된다. 두 오브젝트를 링커가 연결하여 실행 파일을 만든다. 헤더만 따로 실행 파일로 만드는 흐름이 아니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6ee7b7"/></marker></defs>
  <rect width="640" height="610" rx="20" fill="#0f172a"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#e8f0ff">
    <text x="32" y="48" font-size="28" font-weight="700">각 cpp를 컴파일한 뒤 연결합니다</text>
    <text x="32" y="84" font-size="21" fill="#b8c7dd">헤더 가드는 각 번역 단위 안에서 작동합니다.</text>
    <rect x="32" y="116" width="276" height="132" rx="14" fill="#172c3d" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="332" y="116" width="276" height="132" rx="14" fill="#172c3d" stroke="#6ee7b7" stroke-width="2"/>
    <text x="170" y="156" text-anchor="middle" font-size="24" font-weight="700">inventory.cpp</text>
    <text x="470" y="156" text-anchor="middle" font-size="22" font-weight="700">inventory_main.cpp</text>
    <text x="170" y="194" text-anchor="middle" font-size="21">inventory.hpp 포함</text>
    <text x="470" y="194" text-anchor="middle" font-size="21">inventory.hpp 포함</text>
    <text x="170" y="227" text-anchor="middle" font-size="20" fill="#b8c7dd">Save · Load 정의</text>
    <text x="470" y="227" text-anchor="middle" font-size="20" fill="#b8c7dd">main · 검사 코드</text>
    <path d="M170 250V295M470 250V295" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="32" y="310" width="276" height="64" rx="12" fill="#1b2640" stroke="#93c5fd" stroke-width="2"/>
    <rect x="332" y="310" width="276" height="64" rx="12" fill="#1b2640" stroke="#93c5fd" stroke-width="2"/>
    <text x="170" y="351" text-anchor="middle" font-size="23">오브젝트 A</text>
    <text x="470" y="351" text-anchor="middle" font-size="23">오브젝트 B</text>
    <path d="M170 377V402H260V422M470 377V402H380V422" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="160" y="436" width="320" height="60" rx="12" fill="#253248" stroke="#6ee7b7" stroke-width="2"/>
    <text x="320" y="475" text-anchor="middle" font-size="25" font-weight="700">링커 · 함수 정의 연결</text>
    <path d="M320 499V527" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="320" y="572" text-anchor="middle" font-size="26" fill="#6ee7b7">inventory 실행 파일</text>
  </g>
</svg>
