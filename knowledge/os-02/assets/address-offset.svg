<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>4097 = VPN 1 × 4096 + offset 1</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#67e8f9"/></marker></defs><rect width="1000" height="540" rx="20" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e2e8f0"><text x="30" y="46" font-size="26">4097 = VPN 1 × 4096 + offset 1</text><rect x="35" y="105" width="630" height="95" rx="12" fill="#155e75" stroke="#64748b"/><text x="51" y="140" font-size="21">가상 주소의 상위 부분: VPN = 1</text><rect x="670" y="105" width="295" height="95" rx="12" fill="#4c1d95" stroke="#64748b"/><text x="686" y="140" font-size="21">하위 12비트: 1</text><text x="40" y="238" font-size="19">4KiB 모델: 주소의 몫과 나머지 / 막대 길이는 비트 수 비례가 아님</text><path d="M250 210 L250 280" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="65" y="290" width="370" height="95" rx="12" fill="#162538" stroke="#64748b"/><text x="81" y="325" font-size="21">PageTable[1] → PFN 9</text><path d="M445 340 L555 340" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="565" y="290" width="400" height="95" rx="12" fill="#155e75" stroke="#64748b"/><text x="581" y="325" font-size="21">9 × 4096 + 1 = 36865</text><text x="45" y="450" font-size="23">offset은 그대로, 페이지 번호만 프레임 번호로 바꾼다.</text><text x="45" y="498" font-size="20">숫자 주소 계산이다. 이 값을 실제 포인터로 역참조하지 않는다.</text></g></svg>
