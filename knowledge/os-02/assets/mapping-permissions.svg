<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img"><title>매핑의 위치와 접근 권한은 서로 다른 질문이다</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#67e8f9"/></marker></defs><rect width="1000" height="540" rx="20" fill="#0b1423"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e2e8f0"><text x="30" y="46" font-size="26">매핑의 위치와 접근 권한은 서로 다른 질문이다</text><rect x="35" y="105" width="340" height="95" rx="12" fill="#162538" stroke="#64748b"/><text x="51" y="140" font-size="21">VPN 0 · PFN 7 · 읽기만</text><rect x="35" y="255" width="340" height="95" rx="12" fill="#162538" stroke="#64748b"/><text x="51" y="290" font-size="21">VPN 3 · PFN 7 · 읽기/쓰기</text><rect x="620" y="170" width="335" height="130" rx="12" fill="#155e75" stroke="#64748b"/><text x="636" y="205" font-size="21">물리 프레임 7</text><path d="M380 150 L610 210" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M380 300 L610 250" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="640" y="250" font-size="18">같은 offset → 같은 주소</text><rect x="35" y="400" width="920" height="80" rx="12" fill="#4c1d95" stroke="#64748b"/><text x="51" y="435" font-size="21">VPN 1 → present=false : 변환 거부 (디스크 접근은 수행하지 않음)</text><text x="40" y="523" font-size="19">공유 프레임(alias)이 가능해도 권한은 각 가상 매핑에서 따로 검사한다.</text></g></svg>
