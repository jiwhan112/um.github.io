<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">메모리 계층의 지연 대역폭 용량을 별도 축으로 읽기</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#63d6c5"/></marker></defs><rect width="1000" height="650" fill="#101319"/><style>text{font-family:'Noto Sans CJK KR',Arial,sans-serif;fill:#e9edf5;font-size:24px}.small{font-size:21px;fill:#b7c4d9}.head{font-size:30px;font-weight:bold}.box{fill:#1c2636;stroke:#5a7498;stroke-width:2}.line{fill:none;stroke:#63d6c5;stroke-width:3;marker-end:url(#arrow)}</style><text x="38" y="48" class="head">빠르다 한마디 대신 세 가지를 구분하자</text><rect x="330" y="100" width="340" height="85" rx="10" class="box"/><text x="430" y="152">레지스터</text><rect x="240" y="210" width="520" height="85" rx="10" class="box"/><text x="340" y="262">CPU 캐시 (L1/L2/…)</text><rect x="150" y="320" width="700" height="85" rx="10" class="box"/><text x="370" y="372">주기억장치 (RAM)</text><rect x="60" y="430" width="880" height="85" rx="10" class="box"/><text x="340" y="482">보조 저장장치 (SSD/HDD)</text><text x="45" y="145" class="small">지연: 결과까지의 시간</text><text x="45" y="180" class="small">대역폭: 시간당 전송량</text><text x="45" y="215" class="small">용량: 저장 가능한 양</text><text x="50" y="565">일반적 경향 ≠ 모든 접근의 고정 시간</text><text x="50" y="608" class="small">적중 단계 · 접근 패턴 · 병렬성 · 장치 상태를 함께 보아야 한다.</text></svg>