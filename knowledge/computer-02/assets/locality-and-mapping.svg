<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title"><title id="title">동일한 네 라인 용량에서 직접 매핑과 2-way 비교</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#63d6c5"/></marker></defs><rect width="1000" height="650" fill="#101319"/><style>text{font-family:'Noto Sans CJK KR',Arial,sans-serif;fill:#e9edf5;font-size:24px}.small{font-size:21px;fill:#b7c4d9}.head{font-size:30px;font-weight:bold}.box{fill:#1c2636;stroke:#5a7498;stroke-width:2}.line{fill:none;stroke:#63d6c5;stroke-width:3;marker-end:url(#arrow)}</style><text x="35" y="47" class="head">용량은 같아도 배치 제약이 다르다</text><text x="35" y="92" class="small">빈 캐시, 블록 번호 접근: 0 → 4 → 0 → 4 · 총 용량은 각각 4라인</text><rect x="35" y="125" width="450" height="355" rx="12" class="box"/><text x="60" y="171">직접 매핑: 4세트 × 1웨이</text><text x="60" y="216" class="small">set = block % 4</text><rect x="70" y="245" width="370" height="65" rx="8" class="box"/><text x="90" y="286">세트0: 0 ↔ 4 계속 교체</text><text x="70" y="355">접근 결과: M → M → M → M</text><text x="70" y="410">미스 4 · 히트 0</text><rect x="515" y="125" width="450" height="355" rx="12" class="box"/><text x="540" y="171">집합 연관: 2세트 × 2웨이</text><text x="540" y="216" class="small">set = block % 2</text><rect x="550" y="245" width="170" height="65" rx="8" class="box"/><rect x="745" y="245" width="170" height="65" rx="8" class="box"/><text x="580" y="286">웨이0: 0</text><text x="775" y="286">웨이1: 4</text><text x="550" y="355">접근 결과: M → M → H → H</text><text x="550" y="410">미스 2 · 히트 2</text><text x="35" y="535">OS05의 블록 번호 모델을 같은 조건으로 재사용한다.</text><text x="35" y="580" class="small">M/H는 모델 사건 수다. 2배 빠르다는 실행 시간 결론이 아니다.</text><text x="35" y="620" class="small">이 비교에는 OS 페이지 테이블·스와핑·실제 캐시 타이밍이 없다.</text></svg>