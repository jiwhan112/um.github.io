<svg xmlns="http://www.w3.org/2000/svg" width="640" height="891" viewBox="0 0 640 891" role="img" aria-labelledby="title desc">
<title id="title">생성 소멸 단계와 네 개의 가상 호출 기록</title>
<desc id="desc">Effect 생성 단계에서 Kind는 1, Fire 생성 단계에서 2다. 완성 후 Effect 참조를 통한 Kind는 2를 반환하지만 Events에 기록하지 않는다. Fire 소멸 단계에서 2, Effect 소멸 단계에서 1을 기록해 최종 배열은 1 2 2 1이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93c5fd"/></marker></defs>
<rect width="640" height="891" rx="20" fill="#0f172a"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
<text x="32" y="48" font-size="28" fill="#e8f0ff" font-weight="700" text-anchor="start">수명 단계에 따라 달라지는 호출</text>
<text x="32" y="88" font-size="23" fill="#b8c7dd" font-weight="400" text-anchor="start">각 단계에서 Kind()가 선택하는 구현</text>
<rect x="32" y="116" width="576" height="91" rx="12" fill="#1c2a41"/>
<text x="52" y="150" font-size="24" fill="#93c5fd" font-weight="700" text-anchor="start">Effect 생성자</text>
<text x="588" y="150" font-size="23" fill="#e8f0ff" font-weight="500" text-anchor="end">Kind() → 1</text>
<text x="52" y="186" font-size="21" fill="#b8c7dd" font-weight="400" text-anchor="start">Events[0] = 1</text>
<path d="M320 210 L320 227" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="232" width="576" height="91" rx="12" fill="#1c2a41"/>
<text x="52" y="266" font-size="24" fill="#6ee7b7" font-weight="700" text-anchor="start">Fire 생성자</text>
<text x="588" y="266" font-size="23" fill="#e8f0ff" font-weight="500" text-anchor="end">Kind() → 2</text>
<text x="52" y="302" font-size="21" fill="#b8c7dd" font-weight="400" text-anchor="start">Events[1] = 2</text>
<path d="M320 326 L320 343" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="348" width="576" height="91" rx="12" fill="#302c23"/>
<text x="52" y="382" font-size="24" fill="#fde68a" font-weight="700" text-anchor="start">완성 후 base.Kind()</text>
<text x="588" y="382" font-size="23" fill="#e8f0ff" font-weight="500" text-anchor="end">반환값 2</text>
<text x="52" y="418" font-size="21" fill="#b8c7dd" font-weight="400" text-anchor="start">결과만 검사 · Events에 추가하지 않음</text>
<path d="M320 442 L320 459" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="464" width="576" height="91" rx="12" fill="#1c2a41"/>
<text x="52" y="498" font-size="24" fill="#6ee7b7" font-weight="700" text-anchor="start">Fire 소멸자</text>
<text x="588" y="498" font-size="23" fill="#e8f0ff" font-weight="500" text-anchor="end">Kind() → 2</text>
<text x="52" y="534" font-size="21" fill="#b8c7dd" font-weight="400" text-anchor="start">Events[2] = 2</text>
<path d="M320 558 L320 575" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="580" width="576" height="91" rx="12" fill="#1c2a41"/>
<text x="52" y="614" font-size="24" fill="#93c5fd" font-weight="700" text-anchor="start">Effect 소멸자</text>
<text x="588" y="614" font-size="23" fill="#e8f0ff" font-weight="500" text-anchor="end">Kind() → 1</text>
<text x="52" y="650" font-size="21" fill="#b8c7dd" font-weight="400" text-anchor="start">Events[3] = 1</text>
<rect x="32" y="719" width="576" height="96" rx="12" fill="#173a38" stroke="#6ee7b7" stroke-width="2"/>
<text x="52" y="757" font-size="24" fill="#6ee7b7" font-weight="700" text-anchor="start">실제로 남는 기록은 4개</text>
<text x="52" y="797" font-size="27" fill="#e8f0ff" font-weight="400" text-anchor="start">Events = [1, 2, 2, 1]</text>
<text x="32" y="856" font-size="22" fill="#b8c7dd" font-weight="400" text-anchor="start">생성·소멸 중에는 그 단계의 구현을 씁니다.</text>
</g>
</svg>
