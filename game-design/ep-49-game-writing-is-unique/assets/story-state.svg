<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">게임 문장은 현재 상태와 플레이어 행동을 만난다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">서사 의도</text><text x="60" y="195" font-size="22" fill="#e7edf8">무엇을 느끼게 하나</text><text x="60" y="240" font-size="22" fill="#e7edf8">어떤 정보를 주나</text><text x="60" y="285" font-size="22" fill="#e7edf8">무슨 선택을 여나</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">실행 조건</text><text x="415" y="195" font-size="22" fill="#e7edf8">이미 만난 인물인가</text><text x="415" y="240" font-size="22" fill="#e7edf8">목표를 완료했는가</text><text x="415" y="285" font-size="22" fill="#e7edf8">순서가 바뀌었는가</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">표현과 복구</text><text x="770" y="195" font-size="22" fill="#e7edf8">현재에 맞는 문장</text><text x="770" y="240" font-size="22" fill="#e7edf8">중단 후 다시 듣기</text><text x="770" y="285" font-size="22" fill="#e7edf8">행동 결과와 일치</text><text x="40" y="433" font-size="22" fill="#bdcce1">대사 한 줄도 조건·순서·반복·중단 정책을 가진다.</text></g></svg>