<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상 구조 요청 — 조건을 명시하면 모순을 찾기 쉽다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">처음 만남</text><text x="60" y="195" font-size="22" fill="#e7edf8">아직 구조 전</text><text x="60" y="240" font-size="22" fill="#e7edf8">요청과 위험 소개</text><text x="60" y="285" font-size="22" fill="#e7edf8">수락 또는 보류</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">구조 완료</text><text x="415" y="195" font-size="22" fill="#e7edf8">요청 미수락 가능</text><text x="415" y="240" font-size="22" fill="#e7edf8">이미 한 행동 인정</text><text x="415" y="285" font-size="22" fill="#e7edf8">중복 임무 금지</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">다시 방문</text><text x="770" y="195" font-size="22" fill="#e7edf8">완료 사실 유지</text><text x="770" y="240" font-size="22" fill="#e7edf8">새 정보만 제공</text><text x="770" y="285" font-size="22" fill="#e7edf8">같은 부탁 반복 금지</text><text x="40" y="433" font-size="22" fill="#bdcce1">플레이어가 작가의 예상 순서를 따르지 않을 때도 이야기는 이어져야 한다.</text></g></svg>