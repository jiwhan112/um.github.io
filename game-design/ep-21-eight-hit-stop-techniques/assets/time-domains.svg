<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>같은 한 tick, 서로 다른 시계</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">같은 한 tick, 서로 다른 시계</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">물리·애니메이션</text><text x="72" y="203" font-size="23">정지 잔여 &gt; 0이면 멈춤</text><text x="72" y="240" font-size="23">접촉의 순간을 유지한다.</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">UI·메뉴</text><text x="642" y="203" font-size="23">항상 한 tick 진행</text><text x="642" y="240" font-size="23">설정 조작을 막지 않는다.</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">입력</text><text x="72" y="443" font-size="23">저장·폐기 정책을 별도 정의</text><text x="72" y="480" font-size="23">이 예제는 구현하지 않는다.</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">중첩</text><text x="642" y="443" font-size="23">새 요청과 잔여의 최댓값</text><text x="642" y="480" font-size="23">합산과 결과가 다르다.</text><text x="50" y="665" fill="#b5c8df" font-size="23">원작의 여덟 기법 목록을 재현한 도식이 아닙니다.</text></g></svg>