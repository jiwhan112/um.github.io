<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>버튼 하나, 상태는 분명하게</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">버튼 하나, 상태는 분명하게</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">누르지 않음</text><text x="72" y="203" font-size="23">None</text><text x="72" y="240" font-size="23">기다림도 선택의 일부</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">누름 유지</text><text x="642" y="203" font-size="23">charge 1 → 2 → 3</text><text x="642" y="240" font-size="23">행동은 아직 실행하지 않음</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">해제</text><text x="72" y="443" font-size="23">1이면 Tap / 2 이상 Charged</text><text x="72" y="480" font-size="23">결과 한 번 후 상태 초기화</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">취소</text><text x="642" y="443" font-size="23">메뉴·포커스 전환 등</text><text x="642" y="480" font-size="23">누적된 입력을 폐기</text><text x="50" y="665" fill="#b5c8df" font-size="23">방향 입력 없는 자체 제작 충전 모델입니다.</text></g></svg>