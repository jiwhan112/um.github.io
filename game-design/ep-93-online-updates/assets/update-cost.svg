<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">업데이트의 가치와 비용을 같은 표에서 본다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">이용자 가치</text><text x="60" y="195" font-size="22" fill="#e7edf8">오류 복구</text><text x="60" y="240" font-size="22" fill="#e7edf8">규칙 개선</text><text x="60" y="285" font-size="22" fill="#e7edf8">새 경험 제공</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">제작 비용</text><text x="415" y="195" font-size="22" fill="#e7edf8">수정·검증·배포</text><text x="415" y="240" font-size="22" fill="#e7edf8">저장·버전 호환</text><text x="415" y="285" font-size="22" fill="#e7edf8">다른 작업의 기회비용</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">판단</text><text x="770" y="195" font-size="22" fill="#e7edf8">위험과 우선순위</text><text x="770" y="240" font-size="22" fill="#e7edf8">최소 안전 범위</text><text x="770" y="285" font-size="22" fill="#e7edf8">완료의 증거</text><text x="40" y="433" font-size="22" fill="#bdcce1">패치가 가능하다는 이유로 최초 품질과 검증을 뒤로 미루지 않는다.</text></g></svg>