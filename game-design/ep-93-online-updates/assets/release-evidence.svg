<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">원고·커밋·빌드·공개 확인은 다른 단계다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">변경 준비</text><text x="60" y="195" font-size="22" fill="#e7edf8">원인과 범위 기록</text><text x="60" y="240" font-size="22" fill="#e7edf8">최신 상태 확인</text><text x="60" y="285" font-size="22" fill="#e7edf8">되돌릴 방법 검토</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">검증과 배포</text><text x="415" y="195" font-size="22" fill="#e7edf8">재현·회귀 검사</text><text x="415" y="240" font-size="22" fill="#e7edf8">정확한 버전 산출물</text><text x="415" y="285" font-size="22" fill="#e7edf8">승인된 배포 경로</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">실제 확인</text><text x="770" y="195" font-size="22" fill="#e7edf8">공개 버전 대조</text><text x="770" y="240" font-size="22" fill="#e7edf8">핵심 흐름 확인</text><text x="770" y="285" font-size="22" fill="#e7edf8">오류와 재개점 기록</text><text x="40" y="433" font-size="22" fill="#bdcce1">중간 단계 성공을 전체 게시 성공으로 보고하지 않는다.</text></g></svg>