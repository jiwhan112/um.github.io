<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">강조는 차이를 남겨 둘 때 작동한다</title><desc id="desc">가상 대화 UI. 필수 정보와 감정 표현을 서로 다른 책임으로 다룬다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">강조는 차이를 남겨 둘 때 작동한다</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상 대화 UI. 필수 정보와 감정 표현을 서로 다른 책임으로 다룬다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 기본 문장</text><text x="85" y="292" font-size="25" fill="#dceaf6">평범한 대사는 안정적인 기준선</text><text x="85" y="334" font-size="25" fill="#dceaf6">기본 글꼴·대비·속도를 먼저 검증</text><text x="85" y="376" font-size="25" fill="#dceaf6">강조가 없어도 뜻은 이해 가능</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 의미의 강조</text><text x="775" y="292" font-size="25" fill="#dceaf6">중요한 단어·선택 결과를 구별</text><text x="775" y="334" font-size="25" fill="#dceaf6">색 하나에만 의존하지 않는다</text><text x="775" y="376" font-size="25" fill="#dceaf6">줄바꿈 뒤에도 연결 관계 유지</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 감정의 강조</text><text x="85" y="552" font-size="25" fill="#dceaf6">짧은 움직임·간격·표시 리듬</text><text x="85" y="594" font-size="25" fill="#dceaf6">과하면 읽기 자체를 방해한다</text><text x="85" y="636" font-size="25" fill="#dceaf6">움직임을 줄이는 선택을 준비</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 사용자의 제어</text><text x="775" y="552" font-size="25" fill="#dceaf6">일괄 표시·건너뛰기·지난 대사</text><text x="775" y="594" font-size="25" fill="#dceaf6">효과 제거 후에도 핵심 정보 보존</text><text x="775" y="636" font-size="25" fill="#dceaf6">문자열과 연출 데이터를 분리</text><text x="60" y="790" font-size="26" fill="#e7d4a2">전부 흔들고 전부 키우면, 무엇이 중요한지 다시 알 수 없어진다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">감정 효과가 문장 읽기나 필수 정보 접근을 막지 않도록 한다.</text></g></svg>