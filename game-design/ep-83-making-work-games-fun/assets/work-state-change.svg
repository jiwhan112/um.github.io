<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">작업의 결과가 눈앞에서 읽히는 작은 반복</text><text x="65" y="110" fill="#e2e8f0" font-size="27">정리 전</text><text x="610" y="110" fill="#e2e8f0" font-size="27">정리 후</text><rect x="90" y="160" width="80" height="65" rx="12" fill="#fbbf24"/><rect x="240" y="270" width="80" height="65" rx="12" fill="#67e8f9"/><rect x="160" y="380" width="80" height="65" rx="12" fill="#a5b4fc"/><rect x="350" y="190" width="80" height="65" rx="12" fill="#67e8f9"/><rect x="330" y="400" width="80" height="65" rx="12" fill="#fbbf24"/><rect x="600" y="150" width="430" height="85" rx="12" fill="#1e293b"/><rect x="625" y="160" width="80" height="65" rx="12" fill="#fbbf24"/><rect x="725" y="160" width="80" height="65" rx="12" fill="#fbbf24"/><rect x="600" y="260" width="430" height="85" rx="12" fill="#1e293b"/><rect x="625" y="270" width="80" height="65" rx="12" fill="#67e8f9"/><rect x="725" y="270" width="80" height="65" rx="12" fill="#67e8f9"/><rect x="600" y="370" width="430" height="85" rx="12" fill="#1e293b"/><rect x="625" y="380" width="80" height="65" rx="12" fill="#a5b4fc"/><text x="485" y="300" fill="#e2e8f0" font-size="48">→</text><text x="65" y="535" fill="#a5b4fc" font-size="24">선택 → 이동 → 놓기 → 달라진 상태 확인 → 다음 선택</text><text x="65" y="580" fill="#e2e8f0" font-size="21">색 분류는 가상 정리 규칙. 정답 강요·시간제한은 별도 선택이다.</text></g></svg>