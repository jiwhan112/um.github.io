<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">같은 높이, 달라지는 앞쪽 시야</title><desc id="desc">세로 세계 범위 18미터를 고정한 직교 카메라. 16대9는 수평32미터, 4대3은24미터로 중앙 캐릭터의 전방 시야가16미터에서12미터로 줄어든다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" fill="#fff" font-size="38" font-weight="700">같은 높이, 달라지는 앞쪽 시야</text><text x="60" y="132" fill="#bfd2e3" font-size="26">가상 직교 카메라 · 세로 범위 18m 고정 · 플레이어는 화면 중앙</text><rect x="180" y="210" width="960" height="540" fill="#23465c" stroke="#67c6e0" stroke-width="4"/><rect x="300" y="210" width="720" height="540" fill="#22524f" stroke="#f3d17c" stroke-width="4"/><line x1="660" y1="210" x2="660" y2="750" stroke="#bfd2e3" stroke-width="2" stroke-dasharray="12 10"/><circle cx="660" cy="480" r="27" fill="#fff"/><text x="600" y="542" fill="#fff" font-size="26">플레이어</text><line x1="660" y1="320" x2="1140" y2="320" stroke="#67c6e0" stroke-width="5"/><text x="765" y="300" fill="#b1edff" font-size="28">16:9 · 전방 16m</text><line x1="660" y1="395" x2="1020" y2="395" stroke="#f3d17c" stroke-width="5"/><text x="710" y="375" fill="#ffe3a0" font-size="28">4:3 · 전방 12m</text><text x="340" y="650" fill="#ffe3a0" font-size="28">4:3 수평 범위 24m</text><text x="340" y="700" fill="#b1edff" font-size="28">16:9 수평 범위 32m</text><text x="60" y="810" fill="#e7d4a2" font-size="27">초속 8m로 경계의 정지 목표에 접근: 2초 → 1.5초</text><text x="60" y="855" fill="#bfd2e3" font-size="25">단순 거리/속도 계산이다. 실제 인지·제동·회피 시간을 보장하지 않는다.</text></g></svg>