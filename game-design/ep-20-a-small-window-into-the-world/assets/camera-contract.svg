<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">화면 밖의 사건도 플레이어의 문제다</title><desc id="desc">가상 횡스크롤 액션의 관찰 계약. 실제 영상 장면이나 특정 게임 사양이 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">화면 밖의 사건도 플레이어의 문제다</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상 횡스크롤 액션의 관찰 계약. 실제 영상 장면이나 특정 게임 사양이 아니다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 세계의 사건</text><text x="85" y="292" font-size="25" fill="#dceaf6">적이 접근하고 공격을 준비한다</text><text x="85" y="334" font-size="25" fill="#dceaf6">세계 좌표와 시뮬레이션은 존재한다</text><text x="85" y="376" font-size="25" fill="#dceaf6">카메라에 보인다는 보장은 없다</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 화면으로 전달</text><text x="775" y="292" font-size="25" fill="#dceaf6">카메라 위치·줌·화면비가 범위를 결정</text><text x="775" y="334" font-size="25" fill="#dceaf6">경고·소리·실루엣으로 보완 가능</text><text x="775" y="376" font-size="25" fill="#dceaf6">HUD가 가리는 영역도 확인</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 판단 가능한 시간</text><text x="85" y="552" font-size="25" fill="#dceaf6">위험을 알아챈 순간부터 센다</text><text x="85" y="594" font-size="25" fill="#dceaf6">시뮬레이션 시작 시점과 다를 수 있다</text><text x="85" y="636" font-size="25" fill="#dceaf6">이동·입력 지연·회피 준비를 포함</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 검증하기</text><text x="775" y="552" font-size="25" fill="#dceaf6">가장 좁은 지원 화면비를 시험</text><text x="775" y="594" font-size="25" fill="#dceaf6">보이지 않는 공격 원인을 기록</text><text x="775" y="636" font-size="25" fill="#dceaf6">연출 뒤에도 규칙 신호를 남긴다</text><text x="60" y="790" font-size="26" fill="#e7d4a2">세계에 정보가 있다 ≠ 플레이어가 그 정보를 받았다</text><text x="60" y="835" font-size="26" fill="#e7d4a2">그리는 범위, 판정 범위, 경고를 주는 범위를 따로 설계한다.</text></g></svg>