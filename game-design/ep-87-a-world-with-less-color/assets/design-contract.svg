<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">색이 적은 세계</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">색이 적은 세계</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 의미 찾기</text><text x="85" y="292" font-size="25" fill="#dceaf6">색이 어떤 행동을 지시하는가?</text><text x="85" y="334" font-size="25" fill="#dceaf6">팀·위험·등급·선택을 분리</text><text x="85" y="376" font-size="25" fill="#dceaf6">없어지면 틀릴 정보를 우선</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 다른 시각 단서</text><text x="775" y="292" font-size="25" fill="#dceaf6">모양·문구·패턴·윤곽을 병행</text><text x="775" y="334" font-size="25" fill="#dceaf6">작은 크기에서도 서로 구별</text><text x="775" y="376" font-size="25" fill="#dceaf6">색 이름 대신 상태 이름 사용</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 일관된 매핑</text><text x="85" y="552" font-size="25" fill="#dceaf6">세계·지도·메뉴에 같은 의미</text><text x="85" y="594" font-size="25" fill="#dceaf6">사용자 설정을 함께 반영</text><text x="85" y="636" font-size="25" fill="#dceaf6">고정 색 안내 문구를 점검</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 실제 검증</text><text x="775" y="552" font-size="25" fill="#dceaf6">흑백은 진단 도구일 뿐</text><text x="775" y="594" font-size="25" fill="#dceaf6">움직임·배경·겹침도 확인</text><text x="775" y="636" font-size="25" fill="#dceaf6">당사자의 사용 경험을 존중</text><text x="60" y="790" font-size="26" fill="#e7d4a2">색은 풍부하게 써도 된다. 필수 의미를 색 하나에만 맡기지 않는다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">도구의 화면 변환 결과와 실제 플레이 가능성을 같은 증거로 취급하지 않는다.</text></g></svg>