<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">색 차이가 없어도 남는 잠김과 통과 표시</title><desc id="desc">위쪽은 색만 다른 두 원으로 상태를 표시한다. 아래쪽은 같은 회색에서도 사각형 안 X와 잠김 문구, 원 안 체크와 통과 문구로 구별된다. 색각 경험의 시뮬레이션이 아닌 설계 비교다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#edf3fa"><text x="60" y="80" font-size="38" font-weight="700">색 차이가 없어도 어떤 문인지 알 수 있는가?</text><text x="60" y="135" font-size="25">가상 문 상태 표시 · 아래는 색각 시뮬레이션이 아니라 단서 설계 예제</text><rect x="60" y="180" width="1320" height="250" rx="20" fill="#22334a"/><text x="90" y="230" font-size="29">색만 전달</text><circle cx="620" cy="300" r="58" fill="#c56868"/><circle cx="1060" cy="300" r="58" fill="#6bb49a"/><text x="420" y="400" font-size="25">색을 구별하지 못하면 상태의 차이를 놓칠 수 있다</text><rect x="60" y="470" width="1320" height="300" rx="20" fill="#22334a"/><text x="90" y="520" font-size="29">모양과 문구도 전달</text><rect x="562" y="550" width="116" height="116" rx="8" fill="#b5beca"/><path d="M590 578 L650 638 M650 578 L590 638" stroke="#152236" stroke-width="12"/><circle cx="1060" cy="608" r="58" fill="#b5beca"/><path d="M1027 609 L1051 632 L1095 582" stroke="#152236" stroke-width="12" fill="none"/><text x="582" y="725" font-size="32">잠김</text><text x="1022" y="725" font-size="32">통과</text><text x="60" y="835" font-size="26">실제 게임에서는 크기·배경·효과 겹침·사용자 이해를 별도로 검증한다.</text></g></svg>