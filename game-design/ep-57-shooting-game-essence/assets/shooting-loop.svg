<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">슈팅의 밀고 당김 — 공격 기회와 안전 공간</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">공격 기회</text><text x="60" y="195" font-size="22" fill="#e7edf8">목표에 가까이 가기</text><text x="60" y="240" font-size="22" fill="#e7edf8">발사 각도 확보</text><text x="60" y="285" font-size="22" fill="#e7edf8">빠른 제거의 이득</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">노출 비용</text><text x="415" y="195" font-size="22" fill="#e7edf8">회피 공간 감소</text><text x="415" y="240" font-size="22" fill="#e7edf8">탄 경로와 교차</text><text x="415" y="285" font-size="22" fill="#e7edf8">다음 움직임 제한</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">선택 결과</text><text x="770" y="195" font-size="22" fill="#e7edf8">지금 공격할까</text><text x="770" y="240" font-size="22" fill="#e7edf8">먼저 피할까</text><text x="770" y="285" font-size="22" fill="#e7edf8">위협부터 줄일까</text><text x="40" y="433" font-size="22" fill="#bdcce1">공격과 회피가 항상 동시에 쉬우면 선택의 긴장이 약해질 수 있다.</text></g></svg>