<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상2D 슈팅 — 점수보다 먼저 줄일 위협</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">적 A</text><text x="60" y="195" font-size="22" fill="#e7edf8">점수 100</text><text x="60" y="240" font-size="22" fill="#e7edf8">화면에 탄 1줄</text><text x="60" y="285" font-size="22" fill="#e7edf8">오래 남아도 단순</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">적 B</text><text x="415" y="195" font-size="22" fill="#e7edf8">점수 40</text><text x="415" y="240" font-size="22" fill="#e7edf8">회피 경로 봉쇄</text><text x="415" y="285" font-size="22" fill="#e7edf8">빨리 제거하면 공간 확보</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">판단</text><text x="770" y="195" font-size="22" fill="#e7edf8">점수 우선인가</text><text x="770" y="240" font-size="22" fill="#e7edf8">생존 공간 우선인가</text><text x="770" y="285" font-size="22" fill="#e7edf8">목표에 따라 우선순위</text><text x="40" y="433" font-size="22" fill="#bdcce1">낮은 점수의 적이 더 중요한 목표가 될 수 있다.</text></g></svg>