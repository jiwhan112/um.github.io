<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">컷신의 목적을 정하면 길이와 제어를 판단할 수 있다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">목적</text><text x="60" y="195" font-size="22" fill="#e7edf8">행동 뒤의 휴식</text><text x="60" y="240" font-size="22" fill="#e7edf8">인물·사건 전달</text><text x="60" y="285" font-size="22" fill="#e7edf8">다음 목표 안내</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">표현 선택</text><text x="415" y="195" font-size="22" fill="#e7edf8">시점과 구도</text><text x="415" y="240" font-size="22" fill="#e7edf8">대사·행동·환경</text><text x="415" y="285" font-size="22" fill="#e7edf8">조작 허용 범위</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">연결</text><text x="770" y="195" font-size="22" fill="#e7edf8">시작 조건</text><text x="770" y="240" font-size="22" fill="#e7edf8">종료 상태</text><text x="770" y="285" font-size="22" fill="#e7edf8">플레이로 복귀</text><text x="40" y="433" font-size="22" fill="#bdcce1">영상의 완성도와 게임 흐름에 맞는가는 서로 다른 검토 질문이다.</text></g></svg>