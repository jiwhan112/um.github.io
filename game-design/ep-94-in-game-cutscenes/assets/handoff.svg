<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">플레이와 연출 사이의 제어권 인계</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">진입 전</text><text x="60" y="195" font-size="22" fill="#e7edf8">전투·이동 상태</text><text x="60" y="240" font-size="22" fill="#e7edf8">카메라·입력 보관</text><text x="60" y="285" font-size="22" fill="#e7edf8">진입 조건 확인</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">연출 중</text><text x="415" y="195" font-size="22" fill="#e7edf8">이동 허용 여부</text><text x="415" y="240" font-size="22" fill="#e7edf8">위험·시간 정책</text><text x="415" y="285" font-size="22" fill="#e7edf8">재생 제어 안내</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">복귀 후</text><text x="770" y="195" font-size="22" fill="#e7edf8">일관된 위치·목표</text><text x="770" y="240" font-size="22" fill="#e7edf8">입력·카메라 복원</text><text x="770" y="285" font-size="22" fill="#e7edf8">남은 콜백 정리</text><text x="40" y="433" font-size="22" fill="#bdcce1">중간에 멈추거나 건너뛰어도 제어권이 사라진 채 남지 않아야 한다.</text></g></svg>