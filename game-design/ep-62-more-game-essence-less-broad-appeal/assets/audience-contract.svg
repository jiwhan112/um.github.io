<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">깊게 만들수록 누구에게 어떤 부담이 생기는가?</text><text x="70" y="115" fill="#e2e8f0" font-size="26">같은 회피 과제, 다른 부담</text><rect x="65" y="150" width="290" height="310" rx="12" fill="#164e63"/><text x="85" y="205" fill="#e2e8f0" font-size="26">입문</text><text x="85" y="270" fill="#e2e8f0" font-size="22">예고 길게</text><text x="85" y="330" fill="#e2e8f0" font-size="22">실패 시 바로 재시도</text><text x="85" y="390" fill="#e2e8f0" font-size="22">한 가지 판단</text><rect x="390" y="150" width="290" height="310" rx="12" fill="#3730a3"/><text x="410" y="205" fill="#e2e8f0" font-size="26">숙련</text><text x="410" y="270" fill="#e2e8f0" font-size="22">예고 짧게</text><text x="410" y="330" fill="#e2e8f0" font-size="22">여러 선택 비교</text><text x="410" y="390" fill="#e2e8f0" font-size="22">작은 실수도 비용</text><rect x="715" y="150" width="290" height="310" rx="12" fill="#065f46"/><text x="735" y="205" fill="#e2e8f0" font-size="26">선택 가능한 도전</text><text x="735" y="270" fill="#e2e8f0" font-size="22">기본 경험 유지</text><text x="735" y="330" fill="#e2e8f0" font-size="22">추가 목표 선택</text><text x="735" y="390" fill="#e2e8f0" font-size="22">보상과 기대 명시</text><text x="60" y="530" fill="#a5b4fc" font-size="22">깊이·부담·대상은 같은 축이 아니다. 목표 이용자를 먼저 정한다.</text><text x="60" y="575" fill="#e2e8f0" font-size="21">이 비교는 개념 모형이며 인기도·이탈률의 측정 그래프가 아니다.</text></g></svg>