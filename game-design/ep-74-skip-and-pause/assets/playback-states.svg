<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="1100" height="600" rx="20" fill="#101c30"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#91b6ff"/></marker></defs><g font-family="Noto Sans CJK KR, sans-serif" fill="#e7edf8"><text x="40" y="55" font-size="29">재생 상태 전이 — 종료 결과는 한 번만 확정</text><rect x="100" y="150" width="300" height="100" rx="16" fill="#1b2b43" stroke="#63d9d0"/><text x="180" y="190" font-size="27">재생 중</text><text x="160" y="225" font-size="22">시간만큼 진행</text><rect x="700" y="150" width="300" height="100" rx="16" fill="#1b2b43" stroke="#efc879"/><text x="780" y="190" font-size="27">일시정지</text><text x="760" y="225" font-size="22">재생 위치 유지</text><rect x="400" y="400" width="300" height="100" rx="16" fill="#1b2b43" stroke="#91b6ff"/><text x="500" y="440" font-size="27">종료</text><text x="440" y="475" font-size="22">필수 결과 1회 확정</text><g fill="none" stroke="#91b6ff" stroke-width="3" marker-end="url(#arrow)"><path d="M400 175H700"/><path d="M700 230H400"/><path d="M250 250V350H470V400"/><path d="M850 250V350H630V400"/></g><text x="510" y="160" font-size="22">정지</text><text x="510" y="265" font-size="22">재개</text><text x="275" y="320" font-size="22">자연 종료 또는 건너뛰기</text><text x="875" y="320" font-size="22">건너뛰기</text><text x="40" y="555" font-size="22">종료 뒤 반복 입력은 결과를 다시 확정하지 않는다. 이 모델은 되감기를 구현하지 않는다.</text></g></svg>