<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">연출 재생과 게임 진행의 확정을 분리한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">연출 상태</text><text x="60" y="195" font-size="22" fill="#e7edf8">재생·일시정지</text><text x="60" y="240" font-size="22" fill="#e7edf8">현재 재생 위치</text><text x="60" y="285" font-size="22" fill="#e7edf8">자막·음성 동기</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">사용자 선택</text><text x="415" y="195" font-size="22" fill="#e7edf8">계속 보기</text><text x="415" y="240" font-size="22" fill="#e7edf8">일시정지·재개</text><text x="415" y="285" font-size="22" fill="#e7edf8">건너뛰기</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">진행 상태</text><text x="770" y="195" font-size="22" fill="#e7edf8">필수 결과 한 번 반영</text><text x="770" y="240" font-size="22" fill="#e7edf8">중복 보상 금지</text><text x="770" y="285" font-size="22" fill="#e7edf8">종료 후 조작 복원</text><text x="40" y="433" font-size="22" fill="#bdcce1">영상을 생략해도 게임 상태가 빠지거나 두 번 적용되면 안 된다.</text></g></svg>