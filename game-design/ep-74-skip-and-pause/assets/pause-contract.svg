<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">일시정지와 건너뛰기는 서로 다른 계약이다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">일시정지</text><text x="60" y="195" font-size="22" fill="#e7edf8">재생 위치 유지</text><text x="60" y="240" font-size="22" fill="#e7edf8">재개 가능</text><text x="60" y="285" font-size="22" fill="#e7edf8">정지 범위 명시</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">건너뛰기</text><text x="415" y="195" font-size="22" fill="#e7edf8">연출을 끝냄</text><text x="415" y="240" font-size="22" fill="#e7edf8">필수 진행 확정</text><text x="415" y="285" font-size="22" fill="#e7edf8">필요 정보 다시 보기</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">복구</text><text x="770" y="195" font-size="22" fill="#e7edf8">메뉴·포커스 복원</text><text x="770" y="240" font-size="22" fill="#e7edf8">끊김 뒤 상태 확인</text><text x="770" y="285" font-size="22" fill="#e7edf8">재입력 중복 방지</text><text x="40" y="433" font-size="22" fill="#bdcce1">게임 전체를 멈출 수 없는 환경에서는 실제로 멈추는 범위를 정직하게 알린다.</text></g></svg>