<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">장기 캠페인과 옴니버스 모드 비교</title><desc id="desc">하나의 긴 진행 바와 완주 체크가 가능한 세 개의 독립 모드를 대비</desc><rect width="1080" height="600" fill="#101b33"/><style>text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;fill:#eaf4ff} .sub{fill:#a9c2df;font-size:22px} .main{font-weight:700;font-size:34px}.label{font-size:26px;font-weight:650}.tiny{font-size:20px} .box{fill:#20365a;stroke:#5284ad;stroke-width:2} .accent{fill:#24baa7}</style>
<text x="55" y="72" class="main">긴 여정 한 개 vs 짧은 완주 경험 여러 개</text>
<text x="55" y="107" class="sub">옴니버스 기획이 주는 완주감과 선택지의 차이</text>
<rect x="50" y="150" width="446" height="367" rx="18" class="box"/>
<text x="77" y="201" class="label">A. 단일 장기 캠페인</text>
<rect x="89" y="264" width="365" height="56" rx="13" fill="#456079"/>
<rect x="89" y="264" width="235" height="56" rx="13" fill="#a0a9b8"/>
<text x="116" y="301" class="tiny">진행 중...</text>
<text x="89" y="384" class="sub">• 같은 줄기의 긴 여정</text><text x="89" y="424" class="sub">• 완주 체감이 늦어질 수 있음</text>
<rect x="536" y="150" width="494" height="367" rx="18" class="box"/>
<text x="563" y="201" class="label">B. 옴니버스: 모드별 독립 완주</text>
<rect x="563" y="228" width="438" height="69" rx="12" fill="#235d68"/>
<text x="581" y="271" class="label">입문 모드</text><text x="846" y="271" class="tiny">시작 → 완료 ✓</text>
<rect x="563" y="311" width="438" height="69" rx="12" fill="#3c486f"/>
<text x="581" y="354" class="label">탐색 모드</text><text x="846" y="354" class="tiny">시작 → 완료 ✓</text>
<rect x="563" y="394" width="438" height="69" rx="12" fill="#74523c"/>
<text x="581" y="437" class="label">도전 모드</text><text x="846" y="437" class="tiny">시작 → 완료 ✓</text>
<text x="55" y="562" class="sub">기획 질문: 한 번의 긴 몰입 대신 서로 다른 성취를 여러 번 제공할 수 있는가?</text>
</svg>
