<text x="385" y="194" class="label">협동 게임 상태</text><text x="385" y="225" class="tiny">헬퍼: AI ↔ 사람</text>
<rect x="766" y="156" width="257" height="90" rx="14" class="box"/>
<text x="790" y="194" class="label">전투 · 카메라</text><text x="790" y="225" class="tiny">리더 중심 화면</text>
