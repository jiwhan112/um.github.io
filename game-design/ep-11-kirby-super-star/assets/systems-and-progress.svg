<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">협동 게임 상태와 시나리오 저장 모델</title><desc id="desc">1P/2P 입력, 헬퍼 AI, 카메라·전투, 모드 매니저와 세이브의 관계를 구분한 시스템 도식</desc><rect width="1080" height="600" fill="#101b33"/><style>text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;fill:#eaf4ff} .sub{fill:#a9c2df;font-size:22px} .main{font-weight:700;font-size:34px}.label{font-size:26px;font-weight:650}.tiny{font-size:20px} .box{fill:#20365a;stroke:#5284ad;stroke-width:2} .accent{fill:#24baa7}</style>
<text x="55" y="65" class="main">C++11 클라이언트 설계: 협동과 시나리오를 분리</text>
<text x="55" y="103" class="sub">게임 실제 소스 구조가 아닌 역할 분리 실습 예시</text>
