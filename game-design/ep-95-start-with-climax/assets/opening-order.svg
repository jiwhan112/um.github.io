<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>첫 선택까지 무엇을 먼저 요구하는가</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">첫 선택까지 무엇을 먼저 요구하는가</text><text x="50" y="150" font-size="27" fill="#edf4ff">A안</text><rect x="170" y="110" width="400" height="90" rx="12" fill="#20324a" stroke="#5798b8"/><text x="188" y="155" font-size="24" fill="#edf4ff">설명 3분</text><rect x="580" y="110" width="300" height="90" rx="12" fill="#20324a" stroke="#5798b8"/><text x="598" y="155" font-size="24" fill="#edf4ff">연습 2분</text><text x="890" y="165" font-size="25" fill="#86ddbc">선택</text><text x="50" y="360" font-size="27" fill="#edf4ff">B안</text><rect x="170" y="320" width="300" height="90" rx="12" fill="#20324a" stroke="#5798b8"/><text x="188" y="365" font-size="24" fill="#edf4ff">30초 안에 첫 선택</text><rect x="500" y="320" width="480" height="90" rx="12" fill="#20324a" stroke="#5798b8"/><text x="518" y="365" font-size="24" fill="#edf4ff">결과를 통해 배경과 규칙 설명</text><text x="50" y="500" font-size="24" fill="#edf4ff">비례 시간축이 아닌 순서 비교: 필요한 정보의 배치를 바꾼다.</text><text x="50" y="580" font-size="23" fill="#b5c8df">시간은 가상 목표값이며 실제 이탈률·몰입 측정이 아닙니다.</text></g></svg>