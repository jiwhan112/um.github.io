<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>처음에 보여 줄 약속을 좁힌다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">처음에 보여 줄 약속을 좁힌다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">목표</text><text x="72" y="203" font-size="23">누구를 왜 구하는가</text><text x="72" y="240" font-size="23">긴 역사 설명은 나중에</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">행동</text><text x="642" y="203" font-size="23">이동과 한 상호작용</text><text x="642" y="240" font-size="23">규칙을 한꺼번에 가르치지 않기</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">위험</text><text x="72" y="443" font-size="23">보이는 단서와 안전한 재시도</text><text x="72" y="480" font-size="23">규모와 난도를 분리</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">결과</text><text x="642" y="443" font-size="23">선택에 대한 짧은 반응</text><text x="642" y="480" font-size="23">이후 핵심 경험과 연결</text><text x="50" y="665" fill="#b5c8df" font-size="23">가상 도입 설계이며 특정 장르의 보편적 정답이 아닙니다.</text></g></svg>