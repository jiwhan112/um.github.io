<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>평균 점수와 목표 달성은 다른 질문</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">평균 점수와 목표 달성은 다른 질문</text><rect x="60" y="150" width="430" height="90" rx="12" fill="#20324a" stroke="#5798b8"/><text x="78" y="195" font-size="24" fill="#edf4ff">A: 확실히 4점</text><rect x="610" y="150" width="430" height="90" rx="12" fill="#20324a" stroke="#5798b8"/><text x="628" y="195" font-size="24" fill="#edf4ff">B: 50% 10점 / 50% 0점</text><text x="60" y="320" font-size="28" fill="#8dd7ff">평균: 4점</text><text x="610" y="320" font-size="28" fill="#8dd7ff">평균: 5점</text><text x="60" y="410" font-size="26" fill="#edf4ff">최소1점: 100%</text><text x="610" y="410" font-size="26" fill="#edf4ff">최소1점: 50%</text><text x="60" y="475" font-size="26" fill="#edf4ff">최소5점: 0%</text><text x="610" y="475" font-size="26" fill="#edf4ff">최소5점: 50%</text><text x="60" y="580" font-size="23" fill="#b5c8df">가상 확률과 점수 · 실제 플레이어 평가나 확률 추정이 아님</text></g></svg>