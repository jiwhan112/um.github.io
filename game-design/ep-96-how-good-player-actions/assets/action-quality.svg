<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>결과 이전의 행동을 읽는 네 층</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">결과 이전의 행동을 읽는 네 층</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">정보</text><text x="72" y="203" font-size="23">그때 알 수 있었던 것</text><text x="72" y="240" font-size="23">사후 지식과 구분</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">판단</text><text x="642" y="203" font-size="23">목표·위험·대안 비교</text><text x="642" y="240" font-size="23">평균만 보지 않기</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">실행</text><text x="72" y="443" font-size="23">의도한 행동 수행 여부</text><text x="72" y="480" font-size="23">입력·전략 실패 분리</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">결과</text><text x="642" y="443" font-size="23">실제 상태 변화</text><text x="642" y="480" font-size="23">한 번으로 능력 단정 금지</text><text x="50" y="665" fill="#b5c8df" font-size="23">가상 선택 분석이며 실제 이용자 실력 분류가 아닙니다.</text></g></svg>