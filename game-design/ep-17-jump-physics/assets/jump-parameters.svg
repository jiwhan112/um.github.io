<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">점프를 높이와 정점 시간으로 설계하기</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">원하는 경험</text><text x="70" y="173" fill="#e2e8f0" font-size="21">높이 H = 2m / 정점 시간 T = 0.4s</text><text x="70" y="202" fill="#cbd5e1" font-size="19">좌표는 위쪽이 +, 평평한 바닥에서 시작하고 같은 높이에 착지한다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">계산한 파라미터</text><text x="70" y="308" fill="#e2e8f0" font-size="21">중력 크기 g = 2H / T² = 25m/s²</text><text x="70" y="337" fill="#cbd5e1" font-size="19">초기 수직 속도 v₀ = 2H / T = 10m/s</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">예측 가능한 결과</text><text x="70" y="443" fill="#e2e8f0" font-size="21">같은 높이까지 총 비행 시간 = 2T = 0.8s</text><text x="70" y="472" fill="#cbd5e1" font-size="19">수평 속도 4m/s를 유지하면 이동 거리 = 3.2m</text><text x="50" y="590" fill="#a5b4fc" font-size="20">공기 저항·충돌·가변 점프를 제외한 독립 학습 모델</text></g></svg>