<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">높이는 같아도 점프의 성격은 달라진다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">빠른 정점: H=2, T=0.4</text><text x="70" y="173" fill="#e2e8f0" font-size="21">g=25, v₀=10 / 총 비행 0.8초</text><text x="70" y="202" fill="#cbd5e1" font-size="19">빠른 상승·하강. 수평 속도 4이면 총 이동 3.2m.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">느린 정점: H=2, T=0.6</text><text x="70" y="308" fill="#e2e8f0" font-size="21">g≈11.11, v₀≈6.67 / 총 비행 1.2초</text><text x="70" y="337" fill="#cbd5e1" font-size="19">같은 높이지만 오래 공중에 남음. 수평 이동 4.8m.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">레벨 디자인과 함께 검토</text><text x="70" y="443" fill="#e2e8f0" font-size="21">발판 높이뿐 아니라 간격·입력 여유·착지 폭을 비교</text><text x="70" y="472" fill="#cbd5e1" font-size="19">수치만으로 조작감의 우열을 판정하지 말고 실제 플레이로 확인한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">낙하 중 중력을 다르게 바꾸면 2T 공식부터 다시 계산해야 한다.</text></g></svg>