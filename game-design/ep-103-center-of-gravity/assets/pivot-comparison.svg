<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">기준점을 바꾸면 같은 회전도 다른 궤적을 만든다</text><text x="65" y="110" fill="#e2e8f0" font-size="26">회전 기준점 O=(0,0)</text><text x="605" y="110" fill="#e2e8f0" font-size="26">회전 기준점 P=(1,0)</text><line x1="90" y1="460" x2="420" y2="460" stroke="#64748b"/><line x1="120" y1="160" x2="120" y2="490" stroke="#64748b"/><line x1="120" y1="460" x2="360" y2="460" stroke="#67e8f9" stroke-width="6"/><line x1="120" y1="460" x2="120" y2="220" stroke="#fbbf24" stroke-width="6"/><circle cx="120" cy="460" r="9" fill="#f8fafc"/><circle cx="360" cy="460" r="9" fill="#67e8f9"/><circle cx="120" cy="220" r="9" fill="#fbbf24"/><line x1="620" y1="460" x2="950" y2="460" stroke="#64748b"/><line x1="650" y1="160" x2="650" y2="490" stroke="#64748b"/><line x1="770" y1="460" x2="890" y2="460" stroke="#67e8f9" stroke-width="6"/><line x1="770" y1="460" x2="770" y2="340" stroke="#fbbf24" stroke-width="6"/><circle cx="770" cy="460" r="9" fill="#f8fafc"/><circle cx="890" cy="460" r="9" fill="#67e8f9"/><circle cx="770" cy="340" r="9" fill="#fbbf24"/><text x="70" y="545" fill="#a5b4fc" font-size="23">동일한 점(2,0)을 반시계90° 회전: (0,2) / (1,1)</text><text x="70" y="585" fill="#e2e8f0" font-size="21">회전 피벗 실습이다. 물리적 질량 중심을 계산한 그림이 아니다.</text></g></svg>