<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">플레이어가 준 시간을 무엇에 쓰고 있는가?</text><text x="60" y="110" fill="#e2e8f0" font-size="27">가상 30분 세션</text><rect x="60" y="160" width="420" height="100" rx="12" fill="#0e7490"/><text x="72" y="220" fill="#e2e8f0" font-size="21">의미 있는 플레이 14분</text><rect x="480" y="160" width="240" height="100" rx="12" fill="#3730a3"/><text x="492" y="220" fill="#e2e8f0" font-size="21">학습·탐색 8분</text><rect x="720" y="160" width="240" height="100" rx="12" fill="#7f1d1d"/><text x="732" y="220" fill="#e2e8f0" font-size="21">반복 대기 8분</text><text x="60" y="310" fill="#e2e8f0" font-size="25">같은 30분이라도 각 시간의 역할을 묻는다.</text><text x="80" y="375" fill="#e2e8f0" font-size="23">• 다음 행동을 이해하는 시간인가?</text><text x="80" y="440" fill="#e2e8f0" font-size="23">• 의도한 긴장·감상의 시간인가?</text><text x="80" y="505" fill="#e2e8f0" font-size="23">• 이미 아는 절차를 강제로 반복하는 시간인가?</text><text x="60" y="590" fill="#a5b4fc" font-size="21">시간 비율은 자체 예시이며 실제 플레이 로그가 아니다.</text></g></svg>