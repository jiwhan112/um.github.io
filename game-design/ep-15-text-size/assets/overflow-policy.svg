<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">번역이 길어졌을 때: 무조건 축소하지 않는다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">1. 측정</text><text x="70" y="173" fill="#e2e8f0" font-size="21">실제 글꼴·셰이핑·줄바꿈 결과로 내용 경계를 계산</text><text x="70" y="202" fill="#cbd5e1" font-size="19">고정 버튼 폭보다 글자 크기와 의미를 먼저 지킬 수 있는지 확인한다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">2. 정책</text><text x="70" y="308" fill="#e2e8f0" font-size="21">줄바꿈 → 컨테이너 확장 → 문구 재검토 → 보조 설명</text><text x="70" y="337" fill="#cbd5e1" font-size="19">우선순위는 화면 역할에 맞게 정한다. 행동 이름을 임의로 자르지 않는다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">3. 판정</text><text x="70" y="443" fill="#e2e8f0" font-size="21">최소 허용 크기 아래로 내려가면 성공이 아니라 검토 요청</text><text x="70" y="472" fill="#cbd5e1" font-size="19">모든 내용이 안 보이는 상태를 “칸 안에 들어갔다”로 처리하지 않는다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">텍스트가 잘리지 않는 것과 읽을 수 있는 것은 다른 검사다.</text></g></svg>