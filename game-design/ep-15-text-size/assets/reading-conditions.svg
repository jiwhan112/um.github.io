<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">같은 20px이어도 읽는 조건은 같지 않다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">언어와 글꼴</text><text x="70" y="173" fill="#e2e8f0" font-size="21">한글·가나·한자·라틴 문자: 획과 실제 글리프 모양이 다르다</text><text x="70" y="202" fill="#cbd5e1" font-size="19">문자 수와 UTF-8 바이트 수는 표시 폭의 측정값이 아니다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">화면과 거리</text><text x="70" y="308" fill="#e2e8f0" font-size="21">책상 모니터 / 거실 TV / 휴대 화면</text><text x="70" y="337" fill="#cbd5e1" font-size="19">해상도 숫자만 보지 말고 실제 표시 크기와 관찰 거리를 함께 본다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">상황과 시간</text><text x="70" y="443" fill="#e2e8f0" font-size="21">멈춘 메뉴 / 이동 중 HUD / 짧게 뜨는 전투 안내</text><text x="70" y="472" fill="#cbd5e1" font-size="19">같은 문장도 노출 시간과 배경 복잡도에 따라 읽기 부담이 달라진다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">기획 산출물: 언어 × 화면 × 상황별 테스트 표</text></g></svg>