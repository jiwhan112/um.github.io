<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>원작다움을 행동 기준으로 번역한다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">원작다움을 행동 기준으로 번역한다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">동기</text><text x="72" y="203" font-size="23">누구를 위해 무엇을 하는가</text><text x="72" y="240" font-size="23">주요 플레이 행동과 연결</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">세계 규칙</text><text x="642" y="203" font-size="23">무엇이 가능하고 불가능한가</text><text x="642" y="240" font-size="23">성공·실패에도 일관 적용</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">관계</text><text x="72" y="443" font-size="23">인물 사이의 태도와 변화</text><text x="72" y="480" font-size="23">보상 체계가 배반하지 않기</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">검토 경계</text><text x="642" y="443" font-size="23">확정 브리프 / 제안 구분</text><text x="642" y="480" font-size="23">법률·권리 판단은 별도</text><text x="50" y="665" fill="#b5c8df" font-size="23">가상 창작 브리프이며 실제 라이선스 허가를 판단하지 않습니다.</text></g></svg>