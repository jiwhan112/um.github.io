<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>같은 인물, 서로 다른 행동 제안</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">같은 인물, 서로 다른 행동 제안</text><rect x="70" y="140" width="960" height="80" rx="12" fill="#20324a" stroke="#5798b8"/><text x="88" y="185" font-size="24" fill="#edf4ff">가상 브리프: 길 잃은 생물을 안전하게 안내하는 탐험가</text><rect x="70" y="310" width="440" height="110" rx="12" fill="#634844" stroke="#5798b8"/><text x="88" y="355" font-size="24" fill="#edf4ff">A: 공격해 점수 얻기</text><rect x="590" y="310" width="440" height="110" rx="12" fill="#245448" stroke="#5798b8"/><text x="608" y="355" font-size="24" fill="#edf4ff">B: 안전한 길로 안내</text><text x="70" y="470" font-size="26" fill="#ffaf8c">주요 동기와 충돌 가능</text><text x="590" y="470" font-size="26" fill="#86ddbc">동기·세계 규칙과 연결</text><text x="70" y="570" font-size="23" fill="#b5c8df">재미 평가와 창작 기준 검토를 분리 · 실제 권리 판단은 아님</text></g></svg>