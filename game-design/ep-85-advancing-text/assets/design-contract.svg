<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">대사 넘기기</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">대사 넘기기</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 표시 중</text><text x="85" y="292" font-size="25" fill="#dceaf6">첫 입력은 전체 글자 표시</text><text x="85" y="334" font-size="25" fill="#dceaf6">같은 입력으로 다음 줄까지 안 감</text><text x="85" y="376" font-size="25" fill="#dceaf6">음성 처리 정책은 별도로 정함</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 읽기 대기</text><text x="775" y="292" font-size="25" fill="#dceaf6">다음 입력은 다음 대사로</text><text x="775" y="334" font-size="25" fill="#dceaf6">자동 진행과 수동 진행 구분</text><text x="775" y="376" font-size="25" fill="#dceaf6">지난 대사로 내용 복구 가능</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 선택 대기</text><text x="85" y="552" font-size="25" fill="#dceaf6">선택 진입과 확정을 분리</text><text x="85" y="594" font-size="25" fill="#dceaf6">이전 입력이 자동 확정하지 않음</text><text x="85" y="636" font-size="25" fill="#dceaf6">분기 변경은 한 번만 적용</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 종료</text><text x="775" y="552" font-size="25" fill="#dceaf6">늦게 도착한 이벤트는 무시</text><text x="775" y="594" font-size="25" fill="#dceaf6">끝난 대화에서 중복 실행 금지</text><text x="775" y="636" font-size="25" fill="#dceaf6">읽기 기록과 되감기는 다름</text><text x="60" y="790" font-size="26" fill="#e7d4a2">한 번의 입력에는 한 번의 의도된 전이만 대응시킨다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">듣기·읽기·넘기기·선택하기를 하나의 완료 신호로 뭉치지 않는다.</text></g></svg>