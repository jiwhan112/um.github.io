<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">얻는 보상에서 사용하는 순간까지 잇기</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">획득</text><text x="70" y="173" fill="#e2e8f0" font-size="21">임무 완료 → 재료3개</text><text x="70" y="202" fill="#cbd5e1" font-size="19">무엇을 얻었는지와 현재 보유량을 명확히 표시한다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">선택과 사용</text><text x="70" y="308" fill="#e2e8f0" font-size="21">다리 수리 비용6 / 도구 제작 비용9</text><text x="70" y="337" fill="#cbd5e1" font-size="19">서로 다른 경험으로 이어지는 사용처를 비교한다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">경험 변화</text><text x="70" y="443" fill="#e2e8f0" font-size="21">새 경로 개방 / 다른 채집 행동 가능</text><text x="70" y="472" fill="#cbd5e1" font-size="19">숫자 증가만이 아니라 다음 플레이의 변화를 확인한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">재료와 비용은 자체 제작 사례이며 실제 게임 경제 데이터가 아니다.</text></g></svg>