<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">같은3개 보상도 맥락에 따라 다르다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">초기: 보유0, 목표비용6</text><text x="70" y="173" fill="#e2e8f0" font-size="21">임무2번으로 도달할 수 있는 가까운 목표</text><text x="70" y="202" fill="#cbd5e1" font-size="19">획득과 사용의 관계를 배우기 쉬운가?</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">중기: 보유6, 선택비용6 또는9</text><text x="70" y="308" fill="#e2e8f0" font-size="21">지금 쓰기와 한 번 더 모으기 사이의 판단</text><text x="70" y="337" fill="#cbd5e1" font-size="19">선택이 의미 있는 다른 플레이로 이어지는가?</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">후기: 모든 사용처 소진</text><text x="70" y="443" fill="#e2e8f0" font-size="21">재료만 계속 쌓이면 보상의 의미가 약해질 수 있음</text><text x="70" y="472" fill="#cbd5e1" font-size="19">무한 소모처를 억지로 넣기보다 목표의 종료도 검토한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">사용처의 존재와 사용하고 싶은 이유는 별개의 설계 질문이다.</text></g></svg>