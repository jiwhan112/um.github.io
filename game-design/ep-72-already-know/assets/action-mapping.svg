<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">키 이름이 아니라 행동을 중심으로 연결한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">입력 장치</text><text x="60" y="195" font-size="22" fill="#e7edf8">키보드·패드</text><text x="60" y="240" font-size="22" fill="#e7edf8">물리 버튼 입력</text><text x="60" y="285" font-size="22" fill="#e7edf8">장치 전환</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">행동 매핑</text><text x="415" y="195" font-size="22" fill="#e7edf8">확정·취소·이동</text><text x="415" y="240" font-size="22" fill="#e7edf8">사용자 지정 값</text><text x="415" y="285" font-size="22" fill="#e7edf8">충돌·예약 입력 검사</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">게임과 안내</text><text x="770" y="195" font-size="22" fill="#e7edf8">행동 실행</text><text x="770" y="240" font-size="22" fill="#e7edf8">현재 버튼 표시</text><text x="770" y="285" font-size="22" fill="#e7edf8">튜토리얼도 같은 참조</text><text x="40" y="433" font-size="22" fill="#bdcce1">표시와 실제 동작이 다른 순간 익숙함은 혼란으로 바뀐다.</text></g></svg>