<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">익숙한 관례를 출발점으로, 조정 가능성을 남긴다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">기존 기대</text><text x="60" y="195" font-size="22" fill="#e7edf8">확정·취소 의미</text><text x="60" y="240" font-size="22" fill="#e7edf8">이동·시선 관계</text><text x="60" y="285" font-size="22" fill="#e7edf8">메뉴 탐색 방식</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">새 게임의 목적</text><text x="415" y="195" font-size="22" fill="#e7edf8">유지할 약속</text><text x="415" y="240" font-size="22" fill="#e7edf8">바꿔야 할 이유</text><text x="415" y="285" font-size="22" fill="#e7edf8">혼동될 장면</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">사용자 조정</text><text x="770" y="195" font-size="22" fill="#e7edf8">재매핑·반전</text><text x="770" y="240" font-size="22" fill="#e7edf8">현재 설정 안내</text><text x="770" y="285" font-size="22" fill="#e7edf8">초기화·복원</text><text x="40" y="433" font-size="22" fill="#bdcce1">관례는 학습 비용을 줄이는 출발점이지 모든 이용자에게 강제할 정답이 아니다.</text></g></svg>