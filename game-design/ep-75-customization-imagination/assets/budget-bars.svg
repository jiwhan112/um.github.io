<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>예산6 안에서 가능한 조합을 비교하기</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">예산6 안에서 가능한 조합을 비교하기</text><text x="45" y="200" font-size="25" fill="#edf4ff">0+2: 가능</text><rect x="300" y="160" width="160" height="65" fill="#467e97"/><text x="316" y="202" font-size="24" fill="#edf4ff">2</text><rect x="460" y="160" width="320" height="65" fill="#3d8b78"/><text x="476" y="202" font-size="24" fill="#edf4ff">4</text><text x="45" y="340" font-size="25" fill="#edf4ff">1+1: 가능</text><rect x="300" y="300" width="240" height="65" fill="#467e97"/><text x="316" y="342" font-size="24" fill="#edf4ff">3</text><rect x="540" y="300" width="240" height="65" fill="#3d8b78"/><text x="556" y="342" font-size="24" fill="#edf4ff">3</text><text x="45" y="480" font-size="25" fill="#edf4ff">1+2: 거부</text><rect x="300" y="440" width="240" height="65" fill="#467e97"/><text x="316" y="482" font-size="24" fill="#edf4ff">3</text><rect x="540" y="440" width="320" height="65" fill="#3d8b78"/><text x="556" y="482" font-size="24" fill="#edf4ff">4</text><path d="M780 130 V540" stroke="#ffaf8c" stroke-width="4" stroke-dasharray="8 8"/><text x="790" y="125" font-size="24" fill="#ffaf8c">예산6</text><text x="45" y="600" font-size="23" fill="#b5c8df">비용의 합계가 같아도 실제 전투 가치가 같다는 뜻은 아닙니다.</text></g></svg>