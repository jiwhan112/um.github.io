<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>조합은 계획을 바꾸는 선택</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">조합은 계획을 바꾸는 선택</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">0 가벼움 · 비용2</text><text x="72" y="203" font-size="23">이동 중심의 가상 역할</text><text x="72" y="240" font-size="23">실제 효과는 예제 밖</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">1 집중 · 비용3</text><text x="642" y="203" font-size="23">준비 후 공격 중심</text><text x="642" y="240" font-size="23">중복 장착은 허용</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">2 보호 · 비용4</text><text x="72" y="443" font-size="23">실수 회복 중심</text><text x="72" y="480" font-size="23">비용과 가치가 같지는 않음</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">예산6 · 슬롯2</text><text x="642" y="443" font-size="23">0+2 / 1+1 가능</text><text x="642" y="480" font-size="23">1+2는 변경 전체 거부</text><text x="50" y="665" fill="#b5c8df" font-size="23">비용 검증과 전투 밸런스 검증은 다른 단계입니다.</text></g></svg>