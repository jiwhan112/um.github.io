<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">계층형 개요는 서로 다른 질문을 다른 층에 둔다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">목표</text><text x="60" y="195" font-size="22" fill="#e7edf8">어떤 경험을 만들까</text><text x="60" y="240" font-size="22" fill="#e7edf8">누구의 문제인가</text><text x="60" y="285" font-size="22" fill="#e7edf8">완료 조건은 무엇인가</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">규칙</text><text x="415" y="195" font-size="22" fill="#e7edf8">무엇이 가능한가</text><text x="415" y="240" font-size="22" fill="#e7edf8">어떤 조건이 필요한가</text><text x="415" y="285" font-size="22" fill="#e7edf8">예외는 무엇인가</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">검증</text><text x="770" y="195" font-size="22" fill="#e7edf8">무엇을 실행할까</text><text x="770" y="240" font-size="22" fill="#e7edf8">어떤 결과를 기대하나</text><text x="770" y="285" font-size="22" fill="#e7edf8">무엇이 미확인인가</text><text x="40" y="433" font-size="22" fill="#bdcce1">들여쓰기가 아니라 관계와 책임을 정리하는 도구다.</text></g></svg>