<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e7edf8"><text x="40" y="55" font-size="29">가상 회피 사양 — 목표에서 검증까지 연결하기</text><g fill="none" stroke="#8ea7ca" stroke-width="3"><path d="M550 170V210H210V250M550 210V250M550 210H890V250M210 350V420M550 350V420M890 350V420"/></g><rect x="300" y="90" width="500" height="80" rx="12" fill="#1b2b43" stroke="#63d9d0"/><text x="335" y="125" font-size="23">목표: 읽은 위험에서 벗어나는 선택</text><text x="335" y="155" font-size="20">goal.dodge</text><rect x="60" y="250" width="300" height="100" rx="12" fill="#1b2b43" stroke="#91b6ff"/><text x="80" y="288" font-size="23">입력·비용</text><text x="80" y="325" font-size="20">rule.dodge.cost</text><rect x="400" y="250" width="300" height="100" rx="12" fill="#1b2b43" stroke="#91b6ff"/><text x="420" y="288" font-size="23">이동·판정</text><text x="420" y="325" font-size="20">rule.dodge.move</text><rect x="740" y="250" width="300" height="100" rx="12" fill="#1b2b43" stroke="#91b6ff"/><text x="760" y="288" font-size="23">중단·종료</text><text x="760" y="325" font-size="20">rule.dodge.end</text><rect x="60" y="420" width="300" height="100" rx="12" fill="#1b2b43" stroke="#efc879"/><text x="80" y="458" font-size="23">자원이 부족할 때</text><text x="80" y="495" font-size="20">거부·안내·자원 보존</text><rect x="400" y="420" width="300" height="100" rx="12" fill="#1b2b43" stroke="#efc879"/><text x="420" y="458" font-size="23">벽에 닿았을 때</text><text x="420" y="495" font-size="20">위치·판정 일치</text><rect x="740" y="420" width="300" height="100" rx="12" fill="#1b2b43" stroke="#efc879"/><text x="760" y="458" font-size="23">피격과 겹칠 때</text><text x="760" y="495" font-size="20">전환 우선순위 확인</text><text x="40" y="580" font-size="22">화면 번호가 바뀌어도 항목 ID는 유지한다. 모든 상호작용을 다 담은 완성 사양은 아니다.</text></g></svg>