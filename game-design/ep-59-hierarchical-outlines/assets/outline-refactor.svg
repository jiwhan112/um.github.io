<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상 회피 기능 사양 — 중복과 누락을 찾는다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">기능</text><text x="60" y="195" font-size="22" fill="#e7edf8">회피 이동</text><text x="60" y="240" font-size="22" fill="#e7edf8">목적: 위험 회피</text><text x="60" y="285" font-size="22" fill="#e7edf8">범위: 지상만</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">하위 규칙</text><text x="415" y="195" font-size="22" fill="#e7edf8">입력과 자원 비용</text><text x="415" y="240" font-size="22" fill="#e7edf8">이동·무적 구간</text><text x="415" y="285" font-size="22" fill="#e7edf8">중단·종료 조건</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">연결 검사</text><text x="770" y="195" font-size="22" fill="#e7edf8">피격 중 입력</text><text x="770" y="240" font-size="22" fill="#e7edf8">벽과 낭떠러지</text><text x="770" y="285" font-size="22" fill="#e7edf8">저장·재시작 영향</text><text x="40" y="433" font-size="22" fill="#bdcce1">같은 규칙을 여러 위치에 복사하지 말고 기준 항목과 연결한다.</text></g></svg>