<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">숫자로 성격을 표현하되 단위와 관계를 지킨다</text><text x="65" y="110" fill="#e2e8f0" font-size="25">가상 캐릭터 A: 가벼운 정찰</text><text x="610" y="110" fill="#e2e8f0" font-size="25">가상 캐릭터 B: 묵직한 수호</text><text x="65" y="180" fill="#e2e8f0" font-size="22">이동 속도</text><text x="610" y="180" fill="#e2e8f0" font-size="22">이동 속도</text><rect x="65" y="198" width="330" height="35" rx="12" fill="#0e7490"/><text x="420" y="225" fill="#e2e8f0" font-size="20">6m/s</text><rect x="610" y="198" width="165" height="35" rx="12" fill="#6d28d9"/><text x="965" y="225" fill="#e2e8f0" font-size="20">3m/s</text><text x="65" y="290" fill="#e2e8f0" font-size="22">공격 준비</text><text x="610" y="290" fill="#e2e8f0" font-size="22">공격 준비</text><rect x="65" y="308" width="100.0" height="35" rx="12" fill="#0e7490"/><text x="420" y="335" fill="#e2e8f0" font-size="20">0.2s</text><rect x="610" y="308" width="300.0" height="35" rx="12" fill="#6d28d9"/><text x="965" y="335" fill="#e2e8f0" font-size="20">0.6s</text><text x="65" y="400" fill="#e2e8f0" font-size="22">피격 경직</text><text x="610" y="400" fill="#e2e8f0" font-size="22">피격 경직</text><rect x="65" y="418" width="120.0" height="35" rx="12" fill="#0e7490"/><text x="420" y="445" fill="#e2e8f0" font-size="20">0.15s</text><rect x="610" y="418" width="280.0" height="35" rx="12" fill="#6d28d9"/><text x="965" y="445" fill="#e2e8f0" font-size="20">0.35s</text><text x="65" y="540" fill="#a5b4fc" font-size="21">빠름·느림의 느낌은 숫자 하나가 아니라 여러 반응의 일관성에서 나온다.</text><text x="65" y="585" fill="#e2e8f0" font-size="20">막대는 같은 행 안에서만 비교한다. 서로 다른 단위의 행을 합산하지 않는다.</text></g></svg>