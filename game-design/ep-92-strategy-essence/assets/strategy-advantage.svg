<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">전략은 같은 자원을 다른 조건에서 쓰는 선택이다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">자원</text><text x="60" y="195" font-size="22" fill="#e7edf8">병력·시간·위치</text><text x="60" y="240" font-size="22" fill="#e7edf8">정보와 보급</text><text x="60" y="285" font-size="22" fill="#e7edf8">동시에 할 수 없음</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">조건 만들기</text><text x="415" y="195" font-size="22" fill="#e7edf8">집중·분산</text><text x="415" y="240" font-size="22" fill="#e7edf8">유리한 지형</text><text x="415" y="285" font-size="22" fill="#e7edf8">상대 선택 유도</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">교환</text><text x="770" y="195" font-size="22" fill="#e7edf8">한 곳을 얻으면</text><text x="770" y="240" font-size="22" fill="#e7edf8">다른 곳이 비고</text><text x="770" y="285" font-size="22" fill="#e7edf8">미래 선택이 달라짐</text><text x="40" y="433" font-size="22" fill="#bdcce1">전력 수치만 같다고 모든 상황의 결과까지 같지는 않다.</text></g></svg>