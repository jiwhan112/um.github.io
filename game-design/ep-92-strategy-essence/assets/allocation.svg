<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상 두 거점 — 집중과 분산의 교환</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">내 자원 6</text><text x="60" y="195" font-size="22" fill="#e7edf8">거점 A와B에 배분</text><text x="60" y="240" font-size="22" fill="#e7edf8">한 번에 총6만 사용</text><text x="60" y="285" font-size="22" fill="#e7edf8">후속 턴 규칙은 별도</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">상대 배치</text><text x="415" y="195" font-size="22" fill="#e7edf8">A에4, B에2</text><text x="415" y="240" font-size="22" fill="#e7edf8">현재는 공개 정보</text><text x="415" y="285" font-size="22" fill="#e7edf8">지형 효과는 없음</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">선택 예</text><text x="770" y="195" font-size="22" fill="#e7edf8">A에5, B에1</text><text x="770" y="240" font-size="22" fill="#e7edf8">A 승리·B 패배</text><text x="770" y="285" font-size="22" fill="#e7edf8">거점 가치로 판단</text><text x="40" y="433" font-size="22" fill="#bdcce1">숫자는 독창적 교육 모델이다. 실제 장르 전체를 설명하는 공식이 아니다.</text></g></svg>