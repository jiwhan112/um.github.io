<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e7edf8"><text x="40" y="55" font-size="29">총자원은 6 대 6 — 배분한 곳에서 우세와 열세가 갈린다</text><rect x="40" y="100" width="490" height="330" rx="16" fill="#1b2b43" stroke="#91b6ff"/><text x="65" y="145" font-size="27">거점 A</text><text x="65" y="200" font-size="23">내 배치 5</text><rect x="220" y="170" width="36" height="40" fill="#63d9d0"/><rect x="268" y="170" width="36" height="40" fill="#63d9d0"/><rect x="316" y="170" width="36" height="40" fill="#63d9d0"/><rect x="364" y="170" width="36" height="40" fill="#63d9d0"/><rect x="412" y="170" width="36" height="40" fill="#63d9d0"/><text x="65" y="285" font-size="23">상대 배치 4</text><rect x="220" y="255" width="36" height="40" fill="#efc879"/><rect x="268" y="255" width="36" height="40" fill="#efc879"/><rect x="316" y="255" width="36" height="40" fill="#efc879"/><rect x="364" y="255" width="36" height="40" fill="#efc879"/><text x="65" y="385" font-size="25">내가 승리: 5 > 4</text><rect x="570" y="100" width="490" height="330" rx="16" fill="#1b2b43" stroke="#91b6ff"/><text x="595" y="145" font-size="27">거점 B</text><text x="595" y="200" font-size="23">내 배치 1</text><rect x="750" y="170" width="36" height="40" fill="#63d9d0"/><text x="595" y="285" font-size="23">상대 배치 2</text><rect x="750" y="255" width="36" height="40" fill="#efc879"/><rect x="798" y="255" width="36" height="40" fill="#efc879"/><text x="595" y="385" font-size="25">내가 패배: 1 &lt; 2</text><text x="40" y="490" font-size="22">한 거점을 더 강하게 만들면 다른 곳에 쓸 자원이 줄어든다. 거점 가치는 별도 규칙이다.</text></g></svg>