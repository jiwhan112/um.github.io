<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">가상 퍼즐 제안: 지금 보내기 vs 더 모으기</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">상태</text><text x="70" y="173" fill="#e2e8f0" font-size="21">보관함 용량 8 / 현재 블록 4 / 다음 턴 유입 2</text><text x="70" y="202" fill="#cbd5e1" font-size="19">블록 수와 다음 유입을 플레이어가 읽을 수 있게 한다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">안전 선택</text><text x="70" y="308" fill="#e2e8f0" font-size="21">지금 발송: 블록 수만큼 점수, 보관함 비우기</text><text x="70" y="337" fill="#cbd5e1" font-size="19">작은 확정 보상과 여유 공간을 얻는다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">확장 선택</text><text x="70" y="443" fill="#e2e8f0" font-size="21">더 모으기: 6개 이상 발송하면 추가 보상</text><text x="70" y="472" fill="#cbd5e1" font-size="19">더 큰 보상을 노리지만 넘침 전에 처리해야 한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">Meteos 규칙이 아니라 위험·보상을 설명하기 위한 별도 학습 퍼즐이다.</text></g></svg>