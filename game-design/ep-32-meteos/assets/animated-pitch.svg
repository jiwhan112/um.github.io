<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">움직이는 제안서는 시간과 인과를 보여 준다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">장면 A: 선택 전</text><text x="70" y="173" fill="#e2e8f0" font-size="21">보관함4 / 다음 유입2 / 발송 버튼과 기다리기 버튼</text><text x="70" y="202" fill="#cbd5e1" font-size="19">입력 전 화면에서 무엇을 판단하는지 표시한다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">장면 B: 입력과 변화</text><text x="70" y="308" fill="#e2e8f0" font-size="21">기다리기를 누르면 보관함6 / 다음 유입2</text><text x="70" y="337" fill="#cbd5e1" font-size="19">입력 표시와 상태 변화의 순서를 분리한다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">장면 C: 보상과 위험</text><text x="70" y="443" fill="#e2e8f0" font-size="21">6개 발송 시 기본6 + 보너스3 / 계속 모으면 용량 접근</text><text x="70" y="472" fill="#cbd5e1" font-size="19">얻는 것과 잃을 수 있는 것을 같은 흐름으로 설명한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">화려한 영상보다 상태·입력·결과를 정확히 연결하는 것이 먼저다.</text></g></svg>