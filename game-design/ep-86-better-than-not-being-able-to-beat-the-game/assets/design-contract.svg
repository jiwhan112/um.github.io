<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">끝내 못 깨는 것보다는</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">끝내 못 깨는 것보다는</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 막힘의 원인</text><text x="85" y="292" font-size="25" fill="#dceaf6">정보·판단·실행·재시도 비용</text><text x="85" y="334" font-size="25" fill="#dceaf6">실패 횟수만으로 실력 단정 금지</text><text x="85" y="376" font-size="25" fill="#dceaf6">플레이어의 설명도 함께 확인</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 남길 도전</text><text x="775" y="292" font-size="25" fill="#dceaf6">이번 구간이 시험하는 행동</text><text x="775" y="334" font-size="25" fill="#dceaf6">주변 반복과 핵심 과제 구별</text><text x="775" y="376" font-size="25" fill="#dceaf6">도움을 줘도 선택의 의미 유지</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 선택 가능한 도움</text><text x="85" y="552" font-size="25" fill="#dceaf6">예고·시간·피해를 별도 조절</text><text x="85" y="594" font-size="25" fill="#dceaf6">도움의 효과를 쉬운 말로 안내</text><text x="85" y="636" font-size="25" fill="#dceaf6">원치 않는 자동 변경은 신중히</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 결과의 계약</text><text x="775" y="552" font-size="25" fill="#dceaf6">진행과 기록 규칙을 구분</text><text x="775" y="594" font-size="25" fill="#dceaf6">설정 변경의 영향을 미리 알림</text><text x="775" y="636" font-size="25" fill="#dceaf6">도움을 선택한 사람도 존중</text><text x="60" y="790" font-size="26" fill="#e7d4a2">실패를 줄이는 방법은 적을 약하게 만드는 것 하나만이 아니다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">무엇이 막히는지 알아야 무엇을 보존하고 무엇을 도울지 결정할 수 있다.</text></g></svg>