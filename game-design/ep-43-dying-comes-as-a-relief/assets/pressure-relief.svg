<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">승패 결과와 순간의 감정은 같은 축이 아니다</title><desc id="desc">가상 연속 전투의 설계 가설. 원본 연구의 그래프나 측정값이 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">승패 결과와 순간의 감정은 같은 축이 아니다</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상 연속 전투의 설계 가설. 원본 연구의 그래프나 측정값이 아니다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 싸우는 동안</text><text x="85" y="292" font-size="25" fill="#dceaf6">지켜야 할 진행과 보상이 있음</text><text x="85" y="334" font-size="25" fill="#dceaf6">다음 공격을 계속 예측해야 함</text><text x="85" y="376" font-size="25" fill="#dceaf6">긴장·기대·몰입이 함께 가능</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 적을 쓰러뜨린 뒤</text><text x="775" y="292" font-size="25" fill="#dceaf6">이겼어도 다음 위협을 경계</text><text x="775" y="334" font-size="25" fill="#dceaf6">지켜야 할 것이 더 늘 수 있음</text><text x="775" y="376" font-size="25" fill="#dceaf6">승리 = 즉시 완전한 휴식은 아님</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 패배가 확정된 뒤</text><text x="85" y="552" font-size="25" fill="#dceaf6">진행을 지키는 압박은 끝남</text><text x="85" y="594" font-size="25" fill="#dceaf6">손실에 대한 실망은 남을 수 있음</text><text x="85" y="636" font-size="25" fill="#dceaf6">안도 = 패배를 원한다는 뜻은 아님</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 설계 질문</text><text x="775" y="552" font-size="25" fill="#dceaf6">승리 뒤에도 쉴 구간이 있는가?</text><text x="775" y="594" font-size="25" fill="#dceaf6">패배 뒤 재시작은 선택 가능한가?</text><text x="775" y="636" font-size="25" fill="#dceaf6">잠깐의 반응과 전체 만족을 분리</text><text x="60" y="790" font-size="26" fill="#e7d4a2">감정은 시점·상황·측정 방법에 따라 다르게 해석해야 한다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">“죽으면 편하다”를 “많이 죽여야 재미있다”로 바꾸지 않는다.</text></g></svg>