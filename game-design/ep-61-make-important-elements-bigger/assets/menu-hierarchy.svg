<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">중요도는 다르지만 모든 선택은 접근 가능하게</text><text x="55" y="105" fill="#e2e8f0" font-size="25">동일 크기 목록</text><text x="585" y="105" fill="#e2e8f0" font-size="25">역할에 따라 강조한 배치</text><rect x="55" y="135" width="400" height="65" rx="12" fill="#334155"/><text x="80" y="177" fill="#e2e8f0" font-size="23">계속하기</text><rect x="55" y="220" width="400" height="65" rx="12" fill="#334155"/><text x="80" y="262" fill="#e2e8f0" font-size="23">새 게임</text><rect x="55" y="305" width="400" height="65" rx="12" fill="#334155"/><text x="80" y="347" fill="#e2e8f0" font-size="23">설정</text><rect x="55" y="390" width="400" height="65" rx="12" fill="#334155"/><text x="80" y="432" fill="#e2e8f0" font-size="23">도움말</text><rect x="570" y="135" width="470" height="150" rx="12" fill="#0e7490"/><text x="600" y="215" fill="#e2e8f0" font-size="34">계속하기</text><rect x="570" y="310" width="225" height="105" rx="12" fill="#4338ca"/><rect x="815" y="310" width="225" height="105" rx="12" fill="#334155"/><text x="590" y="370" fill="#e2e8f0" font-size="23">새 게임</text><text x="850" y="370" fill="#e2e8f0" font-size="23">설정</text><rect x="570" y="440" width="470" height="65" rx="12" fill="#334155"/><text x="600" y="482" fill="#e2e8f0" font-size="23">도움말</text><text x="50" y="565" fill="#a5b4fc" font-size="21">크기는 우선순위를 드러내되, 위치·라벨·포커스 이동도 일관되어야 한다.</text></g></svg>