<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">알려 주기보다 해 보고 이해하게 만들기</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">맥락</text><text x="60" y="195" font-size="22" fill="#e7edf8">지금 필요한 행동</text><text x="60" y="240" font-size="22" fill="#e7edf8">짧은 목표 제시</text><text x="60" y="285" font-size="22" fill="#e7edf8">실패 비용 낮추기</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">시도</text><text x="415" y="195" font-size="22" fill="#e7edf8">직접 입력</text><text x="415" y="240" font-size="22" fill="#e7edf8">행동 결과 확인</text><text x="415" y="285" font-size="22" fill="#e7edf8">필요할 때 도움</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">이해 확인</text><text x="770" y="195" font-size="22" fill="#e7edf8">다른 상황에 적용</text><text x="770" y="240" font-size="22" fill="#e7edf8">이유를 설명 가능</text><text x="770" y="285" font-size="22" fill="#e7edf8">다시 배울 경로</text><text x="40" y="433" font-size="22" fill="#bdcce1">버튼을 눌렀다는 사실과 규칙을 이해했다는 사실은 다르다.</text></g></svg>