<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상 방어 교육 — 한 번에 하나의 새 관계</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">첫 장면</text><text x="60" y="195" font-size="22" fill="#e7edf8">느린 공격 하나</text><text x="60" y="240" font-size="22" fill="#e7edf8">방어 입력 안내</text><text x="60" y="285" font-size="22" fill="#e7edf8">성공·실패 명확</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">두 번째</text><text x="415" y="195" font-size="22" fill="#e7edf8">같은 규칙 변주</text><text x="415" y="240" font-size="22" fill="#e7edf8">안내를 줄임</text><text x="415" y="285" font-size="22" fill="#e7edf8">결과를 스스로 읽기</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">세 번째</text><text x="770" y="195" font-size="22" fill="#e7edf8">다른 행동과 선택</text><text x="770" y="240" font-size="22" fill="#e7edf8">무조건 방어는 아님</text><text x="770" y="285" font-size="22" fill="#e7edf8">도움말 다시 보기</text><text x="40" y="433" font-size="22" fill="#bdcce1">안내를 없애는 것 자체가 목표가 아니라 스스로 판단할 근거를 남긴다.</text></g></svg>