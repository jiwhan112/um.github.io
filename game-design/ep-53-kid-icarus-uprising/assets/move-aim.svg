<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>이동과 조준이 다른 방향이어도 의도는 하나</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">이동과 조준이 다른 방향이어도 의도는 하나</text><circle cx="550" cy="300" r="55" fill="#8dd7ff"/><text x="510" y="310" font-size="24" fill="#101b2d">대상</text><path d="M620 300 L900 300" stroke="#86ddbc" stroke-width="5" fill="none"/><text x="680" y="260" font-size="28" fill="#86ddbc">이동 +1 →</text><path d="M480 300 L200 200" stroke="#f4a587" stroke-width="5" fill="none"/><text x="100" y="160" font-size="28" fill="#f4a587">← 조준 -2</text><rect x="200" y="430" width="700" height="85" rx="12" fill="#20324a" stroke="#5798b8"/><text x="218" y="475" font-size="24" fill="#edf4ff">Intent { move: +1, aim: -2, fire: true }</text><text x="90" y="590" font-size="23" fill="#b5c8df">교육용명령: 원작조작법·명중·카메라를재현하지않음</text></g></svg>