<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>하나의 프레임, 서로 다른 의도</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">하나의 프레임, 서로 다른 의도</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">이동</text><text x="72" y="203" font-size="23">어디로 피할 것인가</text><text x="72" y="240" font-size="23">위치와 경계</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">조준</text><text x="642" y="203" font-size="23">무엇을 겨냥할 것인가</text><text x="642" y="240" font-size="23">이동 방향과 독립</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">발사</text><text x="72" y="443" font-size="23">언제 실행할 것인가</text><text x="72" y="480" font-size="23">중복 이벤트 방지</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">표현</text><text x="642" y="443" font-size="23">결과를 어떻게 읽을 것인가</text><text x="642" y="480" font-size="23">규칙을 다시 실행하지 않음</text><text x="50" y="665" fill="#b5c8df" font-size="23">원작 입력·공식을 재현하지 않은 자체 제작 모델입니다.</text></g></svg>