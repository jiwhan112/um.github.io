<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>읽기 완료와 플레이 준비는 다르다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">읽기 완료와 플레이 준비는 다르다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">Reading</text><text x="72" y="203" font-size="23">단위0 → 1 → 2 → 3 → 4</text><text x="72" y="240" font-size="23">canPlay = false</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">Preparing</text><text x="642" y="203" font-size="23">후처리 완료 이벤트 대기</text><text x="642" y="240" font-size="23">읽기는 끝났어도 진입 불가</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">Ready</text><text x="72" y="443" font-size="23">필수 준비 조건 충족</text><text x="72" y="480" font-size="23">확인 버튼 정책은 별도</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">Failed</text><text x="642" y="443" font-size="23">계속 기다리게 하지 않기</text><text x="642" y="480" font-size="23">재시도·복귀 경로 설명</text><text x="50" y="665" fill="#b5c8df" font-size="23">측정하지 않은 전체 진행률을 숫자로 꾸미지 않습니다.</text></g></svg>