<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">칭찬은 행동과 결과를 연결할 때 선명하다</title><desc id="desc">가상 회피 액션의 피드백. 실제 영상 속 사례나 효과를 재현하지 않는다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">칭찬은 행동과 결과를 연결할 때 선명하다</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상 회피 액션의 피드백. 실제 영상 속 사례나 효과를 재현하지 않는다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 관찰 가능한 행동</text><text x="85" y="292" font-size="25" fill="#dceaf6">공격 예고를 보고 옆으로 이동</text><text x="85" y="334" font-size="25" fill="#dceaf6">회피 판정과 실제 입력을 구분</text><text x="85" y="376" font-size="25" fill="#dceaf6">무엇을 칭찬할지 먼저 정함</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 규칙의 확인</text><text x="775" y="292" font-size="25" fill="#dceaf6">위험 구역을 벗어났는가?</text><text x="775" y="334" font-size="25" fill="#dceaf6">우연·자동 보조와 구별 가능한가?</text><text x="775" y="376" font-size="25" fill="#dceaf6">성공 이벤트는 한 번만 생성</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 알맞은 피드백</text><text x="85" y="552" font-size="25" fill="#dceaf6">행동 직후 짧고 구체적으로 표시</text><text x="85" y="594" font-size="25" fill="#dceaf6">전투 정보를 가리지 않는다</text><text x="85" y="636" font-size="25" fill="#dceaf6">반복 시 묶기·강도 조절</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 다음 선택</text><text x="775" y="552" font-size="25" fill="#dceaf6">무엇이 통했는지 이해</text><text x="775" y="594" font-size="25" fill="#dceaf6">칭찬을 위해 엉뚱한 반복을 하지 않음</text><text x="775" y="636" font-size="25" fill="#dceaf6">사용자가 효과를 줄일 수 있음</text><text x="60" y="790" font-size="26" fill="#e7d4a2">“잘했어요”를 많이 띄우는 것과 좋은 행동을 이해시키는 것은 다르다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">시스템이 실제로 확인한 사실만 말하고, 성공의 주인은 플레이어로 남긴다.</text></g></svg>