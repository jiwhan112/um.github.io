<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>다음 시도에 무엇이 남는가</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">다음 시도에 무엇이 남는가</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">사라짐</text><text x="72" y="203" font-size="23">이번 체력·소모품</text><text x="72" y="240" font-size="23">손실 규칙을 미리 설명</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">보존</text><text x="642" y="203" font-size="23">지도·해금·설정</text><text x="642" y="240" font-size="23">실제 저장 성공을 확인</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">학습</text><text x="72" y="443" font-size="23">이전 실패에서 바꿀 판단</text><text x="72" y="480" font-size="23">적용할 기회를 제공</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">새 가능성</text><text x="642" y="443" font-size="23">다른 도구·경로·목표</text><text x="642" y="480" font-size="23">숫자만 아닌 행동 변화</text><text x="50" y="665" fill="#b5c8df" font-size="23">반복을 원하게 하는 것과 그만두기 어렵게 하는 것은 다릅니다.</text></g></svg>