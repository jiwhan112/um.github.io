<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>다음 의미 있는 선택까지의 거리를 비교하기</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">다음 의미 있는 선택까지의 거리를 비교하기</text><text x="50" y="155" font-size="27" fill="#edf4ff">A안</text><path d="M160 200 L970 200" stroke="#766196" stroke-width="5" fill="none"/><rect x="710" y="155" width="280" height="85" rx="12" fill="#20324a" stroke="#5798b8"/><text x="728" y="200" font-size="24" fill="#edf4ff">8분 뒤 첫 선택</text><text x="170" y="260" font-size="25" fill="#edf4ff">같은 통로 반복</text><text x="50" y="370" font-size="27" fill="#edf4ff">B안</text><path d="M160 420 L970 420" stroke="#86ddbc" stroke-width="5" fill="none"/><rect x="175" y="375" width="280" height="85" rx="12" fill="#20324a" stroke="#5798b8"/><text x="193" y="420" font-size="24" fill="#edf4ff">1분 뒤 도구 선택</text><text x="500" y="480" font-size="25" fill="#edf4ff">이후 다른 계획을 적용</text><text x="50" y="580" font-size="23" fill="#b5c8df">가상 비교일 뿐 B안의 재미·유지율을 측정한 결과가 아닙니다.</text></g></svg>