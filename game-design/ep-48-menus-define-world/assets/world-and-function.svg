<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">메뉴는 세계를 표현하면서도 명확히 작동해야 한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">세계의 언어</text><text x="60" y="195" font-size="22" fill="#e7edf8">재료·형태·어조</text><text x="60" y="240" font-size="22" fill="#e7edf8">등장인물의 관점</text><text x="60" y="285" font-size="22" fill="#e7edf8">일관된 시각 규칙</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">기능의 언어</text><text x="415" y="195" font-size="22" fill="#e7edf8">선택·초점·확정</text><text x="415" y="240" font-size="22" fill="#e7edf8">뒤로·취소·오류</text><text x="415" y="285" font-size="22" fill="#e7edf8">읽기와 탐색 순서</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">검증</text><text x="770" y="195" font-size="22" fill="#e7edf8">장식 없이도 이해?</text><text x="770" y="240" font-size="22" fill="#e7edf8">작은 화면에서 읽힘?</text><text x="770" y="285" font-size="22" fill="#e7edf8">입력 방식별 일관성?</text><text x="40" y="433" font-size="22" fill="#bdcce1">세계관 표현 때문에 기본 동작의 약속을 숨기지 않는다.</text></g></svg>