<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상 우주선 정비 메뉴 — 의미와 장식의 층</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">필수 의미</text><text x="60" y="195" font-size="22" fill="#e7edf8">부품 이름과 상태</text><text x="60" y="240" font-size="22" fill="#e7edf8">비용·남은 자원</text><text x="60" y="285" font-size="22" fill="#e7edf8">선택 가능 여부</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">탐색 구조</text><text x="415" y="195" font-size="22" fill="#e7edf8">장비 분류</text><text x="415" y="240" font-size="22" fill="#e7edf8">현재 위치·되돌아가기</text><text x="415" y="285" font-size="22" fill="#e7edf8">초점 이동 규칙</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">세계관 장식</text><text x="770" y="195" font-size="22" fill="#e7edf8">정비 패널의 재질</text><text x="770" y="240" font-size="22" fill="#e7edf8">짧은 작업 용어</text><text x="770" y="285" font-size="22" fill="#e7edf8">비필수 배경 효과</text><text x="40" y="433" font-size="22" fill="#bdcce1">핵심 정보와 조작은 장식 효과를 꺼도 남아야 한다.</text></g></svg>