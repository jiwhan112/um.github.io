<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">RPG 의사결정 루프</title><desc id="desc">탐험·적 조우·전투 자원 관리·보상 및 귀환을 연결한 네 단계</desc><defs><marker id="end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z" fill="#89c7fe"/></marker></defs><rect width="1200" height="660" fill="#101a2c"/><text x="600" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#eef6ff" font-weight="600">RPG의 탐험과 전투는 서로 영향을 준다</text><rect x="64" y="130" width="458" height="170" rx="24" fill="#233a50" stroke="#638bac" stroke-width="3"/><text x="293" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#eef6ff" font-weight="600">① 탐험</text><text x="293" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#eef6ff" font-weight="600">길·단서·남은 자원</text><rect x="680" y="130" width="458" height="170" rx="24" fill="#35364d" stroke="#638bac" stroke-width="3"/><text x="909" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#eef6ff" font-weight="600">② 적 조우</text><text x="909" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#eef6ff" font-weight="600">위험 확인 · 교전 여부</text><rect x="680" y="366" width="458" height="170" rx="24" fill="#4e333c" stroke="#638bac" stroke-width="3"/><text x="909" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#eef6ff" font-weight="600">③ 턴제 전투</text><text x="909" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#eef6ff" font-weight="600">공격 · 방어 · HP/MP 소모</text><rect x="64" y="366" width="458" height="170" rx="24" fill="#28453d" stroke="#638bac" stroke-width="3"/><text x="293" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#eef6ff" font-weight="600">④ 보상 또는 귀환</text><text x="293" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#eef6ff" font-weight="600">성장·전리품·안전 회복</text><path d="M 522 214 L 680 214" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 909 300 L 909 366" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 680 448 L 522 448" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 125 366 L 125 315 L 150 315 L 150 300" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><text x="600" y="613" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#c0def2" font-weight="600">진척도와 자원은 다음 선택의 위험도를 바꾼다</text></svg>