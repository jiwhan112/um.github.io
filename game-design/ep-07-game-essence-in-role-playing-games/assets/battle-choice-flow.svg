<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">턴제 전투의 선택과 정산</title><desc id="desc">상태 확인·적의 예고를 거쳐 네 가지 명령과 단일 전투 결과로 합류하는 흐름</desc><defs><marker id="end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z" fill="#89c7fe"/></marker></defs><rect width="1200" height="660" fill="#101a2c"/><text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#eef6ff" font-weight="600">턴제 전투: 정보 → 행동 → 결과 확정</text><rect x="70" y="120" width="345" height="104" rx="24" fill="#233951" stroke="#638bac" stroke-width="3"/><text x="242" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#eef6ff" font-weight="600">진행 중인가?</text><text x="242" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#eef6ff" font-weight="600">턴 상태 검사</text><rect x="473" y="120" width="662" height="104" rx="24" fill="#2c4156" stroke="#638bac" stroke-width="3"/><text x="804" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#eef6ff" font-weight="600">적 행동 예고 + 명령 검증</text><text x="804" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#eef6ff" font-weight="600">비용 부족이면 재선택</text><path d="M 415 172 L 473 172" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><rect x="50" y="315" width="258" height="111" rx="24" fill="#244052" stroke="#638bac" stroke-width="3"/><text x="179" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#eef6ff" font-weight="600">기본 공격</text><text x="179" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#eef6ff" font-weight="600">자원 절약</text><rect x="340" y="315" width="235" height="111" rx="24" fill="#343c59" stroke="#638bac" stroke-width="3"/><text x="458" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#eef6ff" font-weight="600">스킬</text><text x="458" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#eef6ff" font-weight="600">MP 사용</text><rect x="608" y="315" width="255" height="111" rx="24" fill="#234b47" stroke="#638bac" stroke-width="3"/><text x="735" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#eef6ff" font-weight="600">방어</text><text x="735" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#eef6ff" font-weight="600">피해 감소</text><rect x="894" y="315" width="256" height="111" rx="24" fill="#54363d" stroke="#638bac" stroke-width="3"/><text x="1022" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#eef6ff" font-weight="600">철수</text><text x="1022" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#eef6ff" font-weight="600">보상 포기</text><path d="M 665 224 L 179 315" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 740 224 L 458 315" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 871 224 L 735 315" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 970 224 L 1022 315" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><rect x="264" y="497" width="675" height="95" rx="24" fill="#345068" stroke="#638bac" stroke-width="3"/><text x="600" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#eef6ff" font-weight="600">피해와 상태를 1회 확정</text><text x="600" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#eef6ff" font-weight="600">승리·패배·철수 → 보상 단일 정산</text><path d="M 179 426 L 388 497" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 458 426 L 506 497" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 735 426 L 710 497" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 1022 426 L 831 497" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><text x="600" y="639" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#9db6ce" font-weight="600">학습용 상태도 · 실제 게임 엔진 구현도 아님</text></svg>