<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">안전한 길과 위험한 우회</title><desc id="desc">시작 지점과 갈림길, 안전한 회복 경로와 위험 경고가 있는 보상 경로 비교</desc><defs><marker id="end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z" fill="#89c7fe"/></marker></defs><rect width="1200" height="660" fill="#101a2c"/><text x="600" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" fill="#eef6ff" font-weight="600">탐험의 리스크와 리턴</text><text x="600" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#b5cede" font-weight="600">안전과 보상 사이의 선택</text><rect x="45" y="240" width="260" height="155" rx="24" fill="#203249" stroke="#638bac" stroke-width="3"/><text x="175" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#eef6ff" font-weight="600">시작 지점</text><text x="175" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#eef6ff" font-weight="600">HP 20 · MP 5</text><rect x="401" y="240" width="253" height="155" rx="24" fill="#24415a" stroke="#638bac" stroke-width="3"/><text x="527" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#eef6ff" font-weight="600">갈림길</text><text x="527" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#eef6ff" font-weight="600">돌아갈 수 있음</text><rect x="780" y="130" width="370" height="160" rx="24" fill="#1b4640" stroke="#638bac" stroke-width="3"/><text x="965" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#eef6ff" font-weight="600">안전한 직진</text><text x="965" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#eef6ff" font-weight="600">회복 지점 · 작은 보상</text><rect x="780" y="365" width="370" height="160" rx="24" fill="#583338" stroke="#638bac" stroke-width="3"/><text x="965" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#eef6ff" font-weight="600">위험한 우회</text><text x="965" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#eef6ff" font-weight="600">강적 경고 · 자원 소모</text><text x="965" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#eef6ff" font-weight="600">추가 보상</text><path d="M 305 320 L 401 320" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 654 290 L 780 212" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><path d="M 654 355 L 780 442" fill="none" stroke="#89c7fe" stroke-width="5" marker-end="url(#end)"/><text x="600" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#c0def2" font-weight="600">핵심: 위험 단서 + 비교 가능한 보상 + 귀환 가능성</text><text x="600" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#9db6ce" font-weight="600">가상 설계 사례 · 원본 게임 화면 아님</text></svg>