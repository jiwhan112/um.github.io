<text x="78" y="469" fill="#a0e3f0" font-size="26" font-weight="700">DX9 표현 · 사운드</text>
<text x="78" y="509" fill="#e0ebf8" font-size="21">문 열림 · 클리어 이펙트 · 효과음</text>
