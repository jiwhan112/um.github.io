<text x="671" y="469" fill="#bfcffb" font-size="26" font-weight="700">진행 저장 · 로그</text>
<text x="671" y="509" fill="#e0ebf8" font-size="21">보상 지급 기록 · 실패 원인 · 재도전</text>
<text x="671" y="544" fill="#b7cde0" font-size="19">상태와 보상은 원자적으로 보존</text></g>
<text x="52" y="616" fill="#a9bdce" font-size="19" font-family="sans-serif">개념 설계도 · 실제 게임 엔진 구현과 영상의 원본 다이어그램이 아니다</text>
