<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-labelledby="title desc">
<title id="title">좋은 도전과 나쁜 마찰, 빈 보상의 차이</title><desc id="desc">학습 가능한 긴장, 입력 지연과 불명확한 판정, 결과가 없는 클리어를 비교하는 세 개의 큰 카드</desc>
<rect width="1240" height="570" rx="20" fill="#0f1b2e"/>
<text x="52" y="55" fill="#f4f8ff" font-size="34" font-family="sans-serif" font-weight="700">어떤 압박을 설계해야 할까?</text>
<text x="54" y="91" fill="#9fb6d0" font-size="21" font-family="sans-serif">모두 가상의 게임 상황 · 세 경우의 차이는 ‘극복 가능성’과 ‘해소 전달’</text>
<rect x="48" y="119" width="368" height="383" rx="17" fill="#133543" stroke="#56c7ae" stroke-width="3"/>
<rect x="436" y="119" width="368" height="383" rx="17" fill="#352435" stroke="#f195a5" stroke-width="3"/>
<rect x="824" y="119" width="368" height="383" rx="17" fill="#332c27" stroke="#f5c56f" stroke-width="3"/>
<g font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">
<text x="232" y="165" fill="#a0ffdb">좋은 긴장</text><text x="620" y="165" fill="#ffafbd">나쁜 마찰</text><text x="1008" y="165" fill="#ffda9e">빈 보상</text></g>
<g font-family="sans-serif" font-size="21" fill="#f3f7fd">
<text x="79" y="224">위협을 미리 읽는다</text><text x="79" y="268">→ 회피·공략을 선택</text><text x="79" y="312">→ 장애물이 사라진다</text>
<text x="467" y="224">입력이 늦게 반응</text><text x="467" y="268">→ 판정 이유도 모른다</text><text x="467" y="312">→ 실패만 반복한다</text>
<text x="855" y="224">어렵게 문을 열었다</text><text x="855" y="268">→ 변화가 표시 안 됨</text><text x="855" y="312">→ 다음 목표를 모른다</text>
</g>
<g font-family="sans-serif" font-size="21" font-weight="700">
<text x="79" y="378" fill="#a0ffdb">조절할 것</text><text x="467" y="378" fill="#ffafbd">먼저 고칠 것</text><text x="855" y="378" fill="#ffda9e">보완할 것</text></g>
<g font-family="sans-serif" font-size="20" fill="#dae5f3">
<text x="79" y="420">예고 시간 · 해결 경로</text><text x="79" y="452">실패 원인 · 재도전</text>
<text x="467" y="420">입력 지연 · 불일치 판정</text><text x="467" y="452">불필요한 대기 시간</text>
<text x="855" y="420">클리어 이펙트 · 길 개방</text><text x="855" y="452">성장 효과 · 목표 표시</text></g>
<rect x="48" y="524" width="1144" height="30" rx="10" fill="#1b2c44"/>
<text x="73" y="546" fill="#d7e9f9" font-size="19" font-family="sans-serif">불편함을 일부러 남기는 것이 기획이 아니다. 플레이어가 배울 수 있는 문제를 남기는 것이 기획이다.</text>
</svg>
