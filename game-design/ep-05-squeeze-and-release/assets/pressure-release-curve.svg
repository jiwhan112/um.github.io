<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="550" viewBox="0 0 1240 550" role="img" aria-labelledby="title desc">
<title id="title">극복 가능한 압박과 성공 후 해방의 게임 플레이 시간 곡선</title>
<desc id="desc">발견, 해결 시도, 해결 확정, 보상, 새 도전까지 압박이 상승한 뒤 낮아지는 교육용 개념 곡선과 실패 시 빠른 재시도 안내</desc>
<rect width="1240" height="550" rx="20" fill="#0f1b2e"/>
<text x="56" y="57" fill="#f5f9ff" font-size="34" font-weight="700" font-family="sans-serif">압박 → 해소 → 성장: 플레이어의 경험 흐름</text>
<text x="56" y="89" fill="#9eb2cc" font-size="20" font-family="sans-serif">세로축은 실제 심리 점수가 아닌 개념적 ‘체감 압박’</text>
<g stroke="#30435e" stroke-width="2"><line x1="160" y1="132" x2="160" y2="405"/><line x1="160" y1="405" x2="1156" y2="405"/><line x1="160" y1="270" x2="1156" y2="270" stroke-dasharray="8 8"/></g>
<text x="53" y="150" fill="#9db7d2" font-size="20" font-family="sans-serif">높음</text><text x="53" y="404" fill="#9db7d2" font-size="20" font-family="sans-serif">낮음</text>
<path d="M175 388 C280 365 318 260 424 183 S570 151 614 177 C656 205 669 337 751 379 S859 383 916 350 C1000 337 1058 232 1138 211 L1138 405 L175 405 Z" fill="#173e56" opacity=".56"/>
<path d="M175 388 C280 365 318 260 424 183 S570 151 614 177 C656 205 669 337 751 379 S859 383 916 350 C1000 337 1058 232 1138 211" fill="none" stroke="#63d4d6" stroke-width="8" stroke-linecap="round"/>
<g fill="#ffd186" stroke="#0f1b2e" stroke-width="5"><circle cx="248" cy="346" r="11"/><circle cx="492" cy="159" r="11"/><circle cx="750" cy="379" r="11"/><circle cx="875" cy="374" r="11"/><circle cx="1090" cy="239" r="11"/></g>
<g font-family="sans-serif" font-size="21" font-weight="700" text-anchor="middle">
<text x="248" y="448" fill="#e9f3ff">① 발견</text><text x="462" y="448" fill="#e9f3ff">② 해결 시도</text>
<text x="705" y="448" fill="#9bf6c0">③ 해결·해방</text><text x="887" y="448" fill="#ffe39e">④ 보상</text><text x="1094" y="448" fill="#e9f3ff">⑤ 새 도전</text></g>
<g font-family="sans-serif" font-size="19" fill="#dae7f5">
<text x="370" y="140">판단 · 조작 · 위험 관리</text><text x="663" y="235" fill="#95ffbd" font-weight="700">성공 확정!</text><text x="855" y="324" fill="#ffe19c">성장·길 개방</text></g>
<path d="M490 200 L490 239 Q490 260 520 260 L595 260" fill="none" stroke="#ffa9b4" stroke-width="2.5" stroke-dasharray="7 7"/>
<text x="408" y="284" fill="#ffb8c2" font-size="19" font-family="sans-serif">실패 시 이유 → 재시도</text>
<rect x="53" y="481" width="1134" height="44" rx="9" fill="#1a2b43"/>
<text x="75" y="510" fill="#d7e7f9" font-size="20" font-family="sans-serif">설계 포인트  |  압박의 높이보다 ‘이해 가능한 해결’ · ‘해소의 선명함’ · ‘다음 선택의 존재’</text>
</svg>
