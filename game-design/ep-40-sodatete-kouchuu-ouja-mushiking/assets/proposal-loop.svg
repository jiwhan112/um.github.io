<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">작은 기기의 제안서는 무엇을 증명해야 할까?</title><desc id="desc">가상의 곤충 돌보기 기기. 원작의 기능이나 당시 제안서를 재현한 것이 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">작은 기기의 제안서는 무엇을 증명해야 할까?</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상의 곤충 돌보기 기기. 원작의 기능이나 당시 제안서를 재현한 것이 아니다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 사용자 행동</text><text x="85" y="292" font-size="25" fill="#dceaf6">짧게 확인하고 한 가지 돌봄을 고름</text><text x="85" y="334" font-size="25" fill="#dceaf6">누르는 버튼과 입력 순서를 표시</text><text x="85" y="376" font-size="25" fill="#dceaf6">실수·취소도 같은 흐름에 포함</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 상태 변화</text><text x="775" y="292" font-size="25" fill="#dceaf6">입력 전과 후의 상태를 구분</text><text x="775" y="334" font-size="25" fill="#dceaf6">피드백이 왜 나오는지 설명</text><text x="775" y="376" font-size="25" fill="#dceaf6">기다리는 동안의 규칙을 명시</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 시간과 재방문</text><text x="85" y="552" font-size="25" fill="#dceaf6">지금 할 일과 나중에 할 일을 분리</text><text x="85" y="594" font-size="25" fill="#dceaf6">시간이 지나면 무엇이 바뀌는가?</text><text x="85" y="636" font-size="25" fill="#dceaf6">오래 못 왔을 때의 경험도 설계</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 제안의 증거</text><text x="775" y="552" font-size="25" fill="#dceaf6">영상만으로는 분기 검증이 어렵다</text><text x="775" y="594" font-size="25" fill="#dceaf6">누를 수 있는 목업으로 반례 확인</text><text x="775" y="636" font-size="25" fill="#dceaf6">연출과 실제 구현을 구별해 기록</text><text x="60" y="790" font-size="26" fill="#e7d4a2">움직이는 제안서는 장식보다 행동 → 변화 → 이해를 보여 주는 데 쓴다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">보기 좋은 시연과 실행 가능한 제품 계약은 서로를 보완한다.</text></g></svg>