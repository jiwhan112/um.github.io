<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상 재료 화면 — 색을 빼도 의미가 남는가</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">사용 가능</text><text x="60" y="195" font-size="22" fill="#e7edf8">청록색 강조</text><text x="60" y="240" font-size="22" fill="#e7edf8">체크 기호</text><text x="60" y="285" font-size="22" fill="#e7edf8">사용 가능 텍스트</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">재료 부족</text><text x="415" y="195" font-size="22" fill="#e7edf8">노란색 강조</text><text x="415" y="240" font-size="22" fill="#e7edf8">경고 삼각형</text><text x="415" y="285" font-size="22" fill="#e7edf8">필요2 / 보유1</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">선택됨</text><text x="770" y="195" font-size="22" fill="#e7edf8">테두리와 초점</text><text x="770" y="240" font-size="22" fill="#e7edf8">항목명 유지</text><text x="770" y="285" font-size="22" fill="#e7edf8">확정 전 결과 안내</text><text x="40" y="433" font-size="22" fill="#bdcce1">색은 정보를 보강하고 모양·문구는 의미를 함께 전달한다.</text></g></svg>