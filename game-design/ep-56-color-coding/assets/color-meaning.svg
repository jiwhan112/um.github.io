<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">색은 분위기·분류·상태라는 다른 역할을 가진다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">분위기</text><text x="60" y="195" font-size="22" fill="#e7edf8">세계의 인상</text><text x="60" y="240" font-size="22" fill="#e7edf8">배경과 재질</text><text x="60" y="285" font-size="22" fill="#e7edf8">전체 색조</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">분류</text><text x="415" y="195" font-size="22" fill="#e7edf8">팀·속성·지역</text><text x="415" y="240" font-size="22" fill="#e7edf8">일관된 범례</text><text x="415" y="285" font-size="22" fill="#e7edf8">이름·기호 병행</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">상태</text><text x="770" y="195" font-size="22" fill="#e7edf8">선택·위험·불가</text><text x="770" y="240" font-size="22" fill="#e7edf8">변화 이유 안내</text><text x="770" y="285" font-size="22" fill="#e7edf8">색만으로 전달 금지</text><text x="40" y="433" font-size="22" fill="#bdcce1">같은 색을 여러 뜻에 사용할 때 충돌하는 장면을 찾아본다.</text></g></svg>