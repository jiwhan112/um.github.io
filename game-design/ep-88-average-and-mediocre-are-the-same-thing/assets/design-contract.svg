<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">평균과 평범함</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">평균과 평범함</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 강점</text><text x="85" y="292" font-size="25" fill="#dceaf6">어떤 순간에 고르고 싶은가?</text><text x="85" y="334" font-size="25" fill="#dceaf6">행동의 차이로 설명</text><text x="85" y="376" font-size="25" fill="#dceaf6">숫자만 크게 만드는 것과 구별</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 약점</text><text x="775" y="292" font-size="25" fill="#dceaf6">무엇을 포기하고 얻는가?</text><text x="775" y="334" font-size="25" fill="#dceaf6">실수의 이유와 대응을 읽을 수 있음</text><text x="775" y="376" font-size="25" fill="#dceaf6">불편함을 개성이라 포장하지 않음</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 상황</text><text x="85" y="552" font-size="25" fill="#dceaf6">거리·공간·상대·목표를 나눔</text><text x="85" y="594" font-size="25" fill="#dceaf6">상황별 결과를 따로 확인</text><text x="85" y="636" font-size="25" fill="#dceaf6">단위 다른 수치를 무작정 합치지 않음</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 조정</text><text x="775" y="552" font-size="25" fill="#dceaf6">특징을 남긴 채 과도한 우세 수정</text><text x="775" y="594" font-size="25" fill="#dceaf6">이용률과 승률만으로 결론 금지</text><text x="775" y="636" font-size="25" fill="#dceaf6">변경 후 선택 이유를 다시 관찰</text><text x="60" y="790" font-size="26" fill="#e7d4a2">균형을 맞추는 일과 모든 특징을 평균으로 깎는 일은 다르다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">차이가 의미 있으려면 장점·대가·대응법을 플레이어가 읽을 수 있어야 한다.</text></g></svg>