<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">큰 작품의 기획을 기능 목록 대신 경험의 축으로</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">경험 목표</text><text x="60" y="195" font-size="22" fill="#e7edf8">누가 함께 즐기는가</text><text x="60" y="240" font-size="22" fill="#e7edf8">어떤 순간을 기억하나</text><text x="60" y="285" font-size="22" fill="#e7edf8">무엇을 반복하나</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">기능 후보</text><text x="415" y="195" font-size="22" fill="#e7edf8">목표에 연결되는가</text><text x="415" y="240" font-size="22" fill="#e7edf8">다른 기능과 충돌하나</text><text x="415" y="285" font-size="22" fill="#e7edf8">학습 비용은 얼마인가</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">검증 순서</text><text x="770" y="195" font-size="22" fill="#e7edf8">가장 큰 불확실성</text><text x="770" y="240" font-size="22" fill="#e7edf8">작은 시제품 비교</text><text x="770" y="285" font-size="22" fill="#e7edf8">유지·수정·제외</text><text x="40" y="433" font-size="22" fill="#bdcce1">이 도식은 원작 개발 기록이 아니라 독창적인 기획 검토 도구다.</text></g></svg>