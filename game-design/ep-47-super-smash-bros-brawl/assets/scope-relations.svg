<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">기능 하나의 비용은 코드 한 파일로 끝나지 않는다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">새 이동 기능</text><text x="60" y="195" font-size="22" fill="#e7edf8">입력과 애니메이션</text><text x="60" y="240" font-size="22" fill="#e7edf8">판정·상태 전환</text><text x="60" y="285" font-size="22" fill="#e7edf8">실패·복귀 규칙</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">연결 시스템</text><text x="415" y="195" font-size="22" fill="#e7edf8">모든 맵의 경계</text><text x="415" y="240" font-size="22" fill="#e7edf8">상대 캐릭터 반응</text><text x="415" y="285" font-size="22" fill="#e7edf8">카메라·효과음</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">제품 검증</text><text x="770" y="195" font-size="22" fill="#e7edf8">튜토리얼·접근성</text><text x="770" y="240" font-size="22" fill="#e7edf8">저장·리플레이</text><text x="770" y="285" font-size="22" fill="#e7edf8">네트워크 일관성</text><text x="40" y="433" font-size="22" fill="#bdcce1">기능 수보다 연결 관계를 세어 구현·검증 범위를 판단한다.</text></g></svg>