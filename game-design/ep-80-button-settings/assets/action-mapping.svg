<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">버튼 이름이 아니라 행동을 기준으로 연결하기</text><text x="70" y="110" fill="#e2e8f0" font-size="26">물리 입력</text><text x="430" y="110" fill="#e2e8f0" font-size="26">의미 있는 행동</text><text x="800" y="110" fill="#e2e8f0" font-size="26">화면 안내</text><rect x="55" y="160" width="260" height="80" rx="12" fill="#164e63"/><rect x="410" y="160" width="280" height="80" rx="12" fill="#3730a3"/><rect x="785" y="160" width="270" height="80" rx="12" fill="#334155"/><text x="80" y="210" fill="#e2e8f0" font-size="23">키 A</text><text x="435" y="210" fill="#e2e8f0" font-size="23">점프</text><text x="800" y="210" fill="#e2e8f0" font-size="21">현재 점프 키 표시</text><text x="345" y="210" fill="#e2e8f0" font-size="23">→</text><text x="720" y="210" fill="#e2e8f0" font-size="23">→</text><rect x="55" y="290" width="260" height="80" rx="12" fill="#164e63"/><rect x="410" y="290" width="280" height="80" rx="12" fill="#3730a3"/><rect x="785" y="290" width="270" height="80" rx="12" fill="#334155"/><text x="80" y="340" fill="#e2e8f0" font-size="23">키 B</text><text x="435" y="340" fill="#e2e8f0" font-size="23">공격</text><text x="800" y="340" fill="#e2e8f0" font-size="21">현재 공격 키 표시</text><text x="345" y="340" fill="#e2e8f0" font-size="23">→</text><text x="720" y="340" fill="#e2e8f0" font-size="23">→</text><rect x="55" y="420" width="260" height="80" rx="12" fill="#164e63"/><rect x="410" y="420" width="280" height="80" rx="12" fill="#3730a3"/><rect x="785" y="420" width="270" height="80" rx="12" fill="#334155"/><text x="80" y="470" fill="#e2e8f0" font-size="23">키 C</text><text x="435" y="470" fill="#e2e8f0" font-size="23">회피</text><text x="800" y="470" fill="#e2e8f0" font-size="21">현재 회피 키 표시</text><text x="345" y="470" fill="#e2e8f0" font-size="23">→</text><text x="720" y="470" fill="#e2e8f0" font-size="23">→</text><text x="55" y="565" fill="#a5b4fc" font-size="21">설정 변경은 입력 매핑과 도움말·튜토리얼 표시를 함께 바꿔야 한다.</text></g></svg>