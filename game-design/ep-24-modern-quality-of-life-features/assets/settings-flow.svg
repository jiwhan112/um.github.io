<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>설정은 발견부터 복구까지 이어진다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">설정은 발견부터 복구까지 이어진다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">발견·이해</text><text x="72" y="203" font-size="23">첫 진입 경로와 명확한 이름</text><text x="72" y="240" font-size="23">효과와 적용 범위를 설명</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">미리보기</text><text x="642" y="203" font-size="23">편집본으로 결과를 확인</text><text x="642" y="240" font-size="23">저장본은 아직 바꾸지 않음</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">적용</text><text x="72" y="443" font-size="23">편집본 → 저장본</text><text x="72" y="480" font-size="23">실패했으면 성공 표시 금지</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">취소·복구</text><text x="642" y="443" font-size="23">저장본 → 편집본</text><text x="642" y="480" font-size="23">기본값 복원과 구분</text><text x="50" y="665" fill="#b5c8df" font-size="23">UI·영속 저장·접근성 실사용 검증은 별도로 필요합니다.</text></g></svg>