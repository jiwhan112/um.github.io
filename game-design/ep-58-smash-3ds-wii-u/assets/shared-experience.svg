<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">두 기종에서 같아야 할 경험과 달라도 되는 표현</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">공통 계약</text><text x="60" y="195" font-size="22" fill="#e7edf8">핵심 규칙</text><text x="60" y="240" font-size="22" fill="#e7edf8">입력 의미</text><text x="60" y="285" font-size="22" fill="#e7edf8">결과의 설명 가능성</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">환경 차이</text><text x="415" y="195" font-size="22" fill="#e7edf8">화면 크기·비율</text><text x="415" y="240" font-size="22" fill="#e7edf8">성능·메모리</text><text x="415" y="285" font-size="22" fill="#e7edf8">입력·이용 상황</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">기종별 표현</text><text x="770" y="195" font-size="22" fill="#e7edf8">배치·정보 밀도</text><text x="770" y="240" font-size="22" fill="#e7edf8">효과 품질</text><text x="770" y="285" font-size="22" fill="#e7edf8">확인 가능한 성능</text><text x="40" y="433" font-size="22" fill="#bdcce1">소스가 같다는 사실만으로 같은 경험이 보장되지는 않는다.</text></g></svg>