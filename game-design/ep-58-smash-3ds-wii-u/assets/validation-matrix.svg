<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">기종별 검증은 끝에서 한 번 붙이는 절차가 아니다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">기획 단계</text><text x="60" y="195" font-size="22" fill="#e7edf8">최소 표현 조건</text><text x="60" y="240" font-size="22" fill="#e7edf8">규칙과 장식 구분</text><text x="60" y="285" font-size="22" fill="#e7edf8">기종별 위험 기록</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">구현 단계</text><text x="415" y="195" font-size="22" fill="#e7edf8">공통 데이터 계약</text><text x="415" y="240" font-size="22" fill="#e7edf8">기능 플래그 관리</text><text x="415" y="285" font-size="22" fill="#e7edf8">지원 불가 조건 명시</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">검증 단계</text><text x="770" y="195" font-size="22" fill="#e7edf8">동일 입력 비교</text><text x="770" y="240" font-size="22" fill="#e7edf8">각 화면에서 가독성</text><text x="770" y="285" font-size="22" fill="#e7edf8">저장·재개·성능</text><text x="40" y="433" font-size="22" fill="#bdcce1">실제 원작의 구현 방식이 아닌 독창적인 다중 환경 검토 모형이다.</text></g></svg>