<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>설명 완료보다 행동의 전이를 본다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">설명 완료보다 행동의 전이를 본다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">Approach</text><text x="72" y="203" font-size="23">목표와 연습 공간 발견</text><text x="72" y="240" font-size="23">성공 이벤트는 아직 무효</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">Act</text><text x="642" y="203" font-size="23">안전한 첫 수행</text><text x="642" y="240" font-size="23">행동과 결과 연결</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">Apply</text><text x="72" y="443" font-size="23">새 맥락에서 같은 원리</text><text x="72" y="480" font-size="23">이전 성공 중복은 무효</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">Done</text><text x="642" y="443" font-size="23">정해 둔 수행 조건 충족</text><text x="642" y="480" font-size="23">사람의 이해 확정은 아님</text><text x="50" y="665" fill="#b5c8df" font-size="23">진행 플래그와 실제 학습 증거를 구분합니다.</text></g></svg>