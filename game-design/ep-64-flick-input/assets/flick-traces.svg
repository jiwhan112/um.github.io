<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">위치가 같아도 도달 속도가 다르면 다른 입력</text><text x="45" y="90" fill="#e2e8f0" font-size="23">중립 마지막 표본 → 바깥 문턱 도달까지의 시간</text><line x1="100" y1="460" x2="1000" y2="460" stroke="#475569"/><text x="45" y="468" fill="#e2e8f0" font-size="20">0</text><line x1="100" y1="390" x2="1000" y2="390" stroke="#475569"/><text x="45" y="398" fill="#e2e8f0" font-size="20">0.2</text><line x1="100" y1="180" x2="1000" y2="180" stroke="#475569"/><text x="45" y="188" fill="#e2e8f0" font-size="20">0.8</text><line x1="100" y1="110" x2="1000" y2="110" stroke="#475569"/><text x="45" y="118" fill="#e2e8f0" font-size="20">1.0</text><line x1="100" y1="110" x2="100" y2="460" stroke="#334155"/><text x="88" y="495" fill="#e2e8f0" font-size="20">0</text><line x1="325.0" y1="110" x2="325.0" y2="460" stroke="#334155"/><text x="313.0" y="495" fill="#e2e8f0" font-size="20">0.04</text><line x1="550.0" y1="110" x2="550.0" y2="460" stroke="#334155"/><text x="538.0" y="495" fill="#e2e8f0" font-size="20">0.08</text><line x1="775.0" y1="110" x2="775.0" y2="460" stroke="#334155"/><text x="763.0" y="495" fill="#e2e8f0" font-size="20">0.12</text><line x1="1000.0" y1="110" x2="1000.0" y2="460" stroke="#334155"/><text x="988.0" y="495" fill="#e2e8f0" font-size="20">0.16</text><polyline points="100,460 325,145 550,145 775,145 1000,145" fill="none" stroke="#67e8f9" stroke-width="5"/><polyline points="100,460 325,372.5 550,285 775,197.5 1000,145" fill="none" stroke="#fbbf24" stroke-width="5"/><text x="120" y="545" fill="#67e8f9" font-size="22">빠른 입력: 0.04s에0.9 → 발동</text><text x="580" y="545" fill="#fbbf24" font-size="22">느린 입력: 0.16s에0.9 → 미발동</text><text x="45" y="590" fill="#e2e8f0" font-size="20">가상 기준: 중립 |x|≤0.2, 바깥 |x|≥0.8, 제한0.08s. 실제 장치 측정 아님.</text></g></svg>