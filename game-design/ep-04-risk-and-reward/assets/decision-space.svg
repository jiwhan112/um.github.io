<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">리스크와 보상의 선택 공간</title><desc id="desc">네 가지 행동을 위험 노출과 성과 두 축에서 비교한 추상 개념 지도</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#87a7de"/></marker></defs><rect width="1280" height="720" rx="26" fill="#0c1525"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" fill="#eaf1ff"><text x="66" y="70" font-size="36" fill="#f0f6ff" font-weight="750" text-anchor="start">같은 위험에서도 선택이 바뀌면 결과가 바뀐다</text><text x="66" y="115" font-size="21" fill="#a9bed9" font-weight="500" text-anchor="start">위험과 리턴은 게임 디자인의 선택 변수 · 실제 측정값이 아닌 개념도</text><rect x="185" y="175" width="850" height="415" rx="22" fill="#15253c" stroke="#36506e" stroke-width="2"/><path d="M610 175 V590 M185 382 H1035" stroke="#324c66" stroke-width="2" stroke-dasharray="9 10"/><path d="M185 590 H1070 M185 590 V157" stroke="#a3b9d4" stroke-width="4" marker-end="url(#arr)"/><path d="M1035 590 L1073 590" stroke="#a3b9d4" stroke-width="4" marker-end="url(#arr)"/><text x="620" y="656" font-size="25" fill="#b8ceea" font-weight="650" text-anchor="middle">위험 노출  →</text><text x="110" y="378" font-size="26" fill="#b8ceea" font-weight="650" text-anchor="middle">보상</text><text x="235" y="219" font-size="22" fill="#b3c6dd" font-weight="500" text-anchor="start">안전하나 성과가 작음</text><text x="660" y="219" font-size="22" fill="#b3c6dd" font-weight="500" text-anchor="start">성과의 기회가 커짐</text><circle cx="330" cy="504" r="15" fill="#8ba5bc"/><circle cx="698" cy="493" r="15" fill="#ffb573"/><circle cx="721" cy="288" r="18" fill="#63dfc0"/><circle cx="944" cy="237" r="16" fill="#fc858e"/><path d="M698 493 Q695 360 721 288" stroke="#63dfc0" stroke-width="6" fill="none" stroke-dasharray="9 12" marker-end="url(#arr)"/><text x="370" y="510" font-size="24" fill="#ccdae8" font-weight="650" text-anchor="start">① 안전 대기</text><text x="746" y="505" font-size="23" fill="#ffcd9e" font-weight="650" text-anchor="start">② 무작정 추격</text><text x="750" y="294" font-size="24" fill="#8dfbe0" font-weight="700" text-anchor="start">③ 위치 선점</text><text x="751" y="330" font-size="20" fill="#badbd3" font-weight="500" text-anchor="start">같은 위험, 더 나은 성과</text><text x="948" y="205" font-size="22" fill="#ffb6bd" font-weight="700" text-anchor="middle">④ 막판 도박</text><rect x="100" y="670" width="1080" height="1" fill="#354860"/><text x="120" y="696" font-size="19" fill="#b4c4d9" font-weight="500" text-anchor="start">핵심: 위험의 크기를 무조건 키우지 말고, 예측과 숙련으로 선택의 결과를 달라지게 한다.</text></g></svg>
