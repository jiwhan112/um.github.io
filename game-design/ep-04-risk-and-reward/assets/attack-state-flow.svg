<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">공격 상태와 보상 확정</title><desc id="desc">Idle에서 Startup, Active, Recovery를 거쳐 복귀하는 공격 상태와 성공 및 실패 분기</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#87a7de"/></marker></defs><rect width="1280" height="720" rx="26" fill="#0c1525"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" fill="#eaf1ff"><text x="65" y="74" font-size="36" fill="#f4f8ff" font-weight="760" text-anchor="start">위험 시간은 상태로, 보상은 확정 이벤트로</text><text x="65" y="113" font-size="21" fill="#b1c7e0" font-weight="500" text-anchor="start">공격 한 번의 생명주기 · C++11 상태 머신 개념도</text><rect x="70" y="182" width="210" height="116" rx="18" fill="#2a3649" stroke="#8298b9" stroke-width="2"/><rect x="347" y="182" width="210" height="116" rx="18" fill="#4a3543" stroke="#e9a8bb" stroke-width="2"/><rect x="624" y="182" width="210" height="116" rx="18" fill="#254c49" stroke="#77e4cf" stroke-width="2"/><rect x="901" y="182" width="210" height="116" rx="18" fill="#4d3e37" stroke="#f4c48e" stroke-width="2"/><text x="175" y="233" font-size="30" fill="#eaf1ff" font-weight="750" text-anchor="middle">대기</text><text x="175" y="266" font-size="21" fill="#b0c4de" font-weight="500" text-anchor="middle">Idle</text><text x="452" y="230" font-size="30" fill="#ffd7e0" font-weight="750" text-anchor="middle">준비</text><text x="452" y="266" font-size="21" fill="#e9b8c4" font-weight="500" text-anchor="middle">Startup</text><text x="729" y="230" font-size="29" fill="#b3fbe9" font-weight="750" text-anchor="middle">공격 판정</text><text x="729" y="266" font-size="21" fill="#91dfd0" font-weight="500" text-anchor="middle">Active</text><text x="1006" y="230" font-size="30" fill="#ffe5bd" font-weight="750" text-anchor="middle">후딜</text><text x="1006" y="266" font-size="21" fill="#efd0ac" font-weight="500" text-anchor="middle">Recovery</text><path d="M280 238 H347 M557 238 H624 M834 238 H901" stroke="#90b6db" stroke-width="5" marker-end="url(#arr)"/><path d="M1006 298 V350 H175 V298" fill="none" stroke="#7187a7" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arr)"/><text x="452" y="158" font-size="20" fill="#ffb2c1" font-weight="600" text-anchor="middle">피격 가능</text><text x="1006" y="158" font-size="20" fill="#ffdaaa" font-weight="600" text-anchor="middle">반격에 취약</text><path d="M728 298 V424 M728 424 H419 V470 M728 424 H995 V470" fill="none" stroke="#82d7c8" stroke-width="4" marker-end="url(#arr)"/><rect x="252" y="468" width="330" height="136" rx="19" fill="#155246" stroke="#66dbb8" stroke-width="2"/><rect x="828" y="468" width="330" height="136" rx="19" fill="#433342" stroke="#e6a8b8" stroke-width="2"/><text x="417" y="512" font-size="28" fill="#b7fff0" font-weight="730" text-anchor="middle">타격 성공 확정</text><text x="417" y="553" font-size="20" fill="#a4d9d1" font-weight="520" text-anchor="middle">피해 · 점수 · 효과 이벤트</text><text x="993" y="512" font-size="28" fill="#ffd0db" font-weight="730" text-anchor="middle">실패 / 빗나감</text><text x="993" y="553" font-size="20" fill="#eab7c5" font-weight="520" text-anchor="middle">빈틈 · 위치 위험 유지</text><text x="72" y="667" font-size="22" fill="#c2d0e2" font-weight="500" text-anchor="start">정책: 공격당/대상당 보상 횟수를 명세하고, 이벤트 ID로 중복 지급을 막는다.</text></g></svg>
