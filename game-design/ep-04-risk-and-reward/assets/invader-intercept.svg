<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">추격 사격과 예측 요격</title><desc id="desc">추상 도형으로 표현한 우측 이동 적의 과거 위치 추격과 미래 위치에서의 요격 비교</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#87a7de"/></marker></defs><rect width="1280" height="720" rx="26" fill="#0c1525"/><g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" fill="#eaf1ff"><text x="68" y="76" font-size="36" fill="#f1f6ff" font-weight="750" text-anchor="start">적의 현재 위치가 아니라, 탄이 도달할 위치를 읽는다</text><rect x="55" y="124" width="563" height="510" rx="24" fill="#15243a" stroke="#47566d" stroke-width="2"/><rect x="662" y="124" width="563" height="510" rx="24" fill="#162c36" stroke="#316359" stroke-width="2"/><text x="337" y="174" font-size="29" fill="#ffb989" font-weight="650" text-anchor="middle">A · 지나간 위치 추격</text><text x="943" y="174" font-size="29" fill="#82eccd" font-weight="650" text-anchor="middle">B · 이동 경로 예측</text><path d="M130 280 H537" stroke="#7485a3" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#arr)"/><path d="M737 280 H1142" stroke="#81ccb8" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#arr)"/><rect x="410" y="245" width="59" height="47" rx="10" fill="#ffb775"/><rect x="1010" y="245" width="59" height="47" rx="10" fill="#7de9ce"/><text x="128" y="256" font-size="20" fill="#b2c4d8" font-weight="500" text-anchor="start">이전 적 위치</text><text x="738" y="256" font-size="20" fill="#b2c4d8" font-weight="500" text-anchor="start">현재 적 위치</text><rect x="145" y="261" width="58" height="24" rx="7" fill="none" stroke="#ffb775" stroke-width="2" stroke-dasharray="7 5"/><rect x="750" y="261" width="58" height="24" rx="7" fill="none" stroke="#7de9ce" stroke-width="2" stroke-dasharray="7 5"/><path d="M192 570 L210 529 L245 529 L263 570 Z" fill="#b4bdd9"/><path d="M835 570 L853 529 L888 529 L906 570 Z" fill="#b4bdd9"/><path d="M227 529 V335" stroke="#ffbc8a" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arr)"/><path d="M870 529 L1035 303" stroke="#7decce" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arr)"/><circle cx="227" cy="318" r="12" fill="#ffbc8a"/><circle cx="1035" cy="304" r="12" fill="#7decce"/><text x="325" y="406" font-size="22" fill="#e1cbac" font-weight="500" text-anchor="start">도착했지만</text><text x="325" y="440" font-size="22" fill="#e1cbac" font-weight="500" text-anchor="start">적은 이미 이동</text><text x="940" y="404" font-size="21" fill="#b0ebd6" font-weight="500" text-anchor="start">탄 도착 시점의</text><text x="940" y="438" font-size="21" fill="#b0ebd6" font-weight="500" text-anchor="start">적 위치를 예상</text><path d="M467 320 L467 365" stroke="#b2c4d8" stroke-width="3" stroke-dasharray="6 8"/><path d="M1069 320 L1069 365" stroke="#b2c4d8" stroke-width="3" stroke-dasharray="6 8"/><text x="336" y="599" font-size="23" fill="#ffc79c" font-weight="700" text-anchor="middle">추격</text><text x="946" y="599" font-size="23" fill="#8df5da" font-weight="700" text-anchor="middle">요격</text><text x="70" y="678" font-size="20" fill="#b3c6dc" font-weight="500" text-anchor="start">교육용 원리도: 간격과 탄도는 추상화한 예시이며 원작의 실제 게임 화면·물리·판정이 아니다.</text></g></svg>
