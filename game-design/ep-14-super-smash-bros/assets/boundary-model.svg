<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>정수 실험: 경계 안은 생존, 밖은 이탈</title><rect width="1200" height="680" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="60" y="70" font-size="34" font-weight="700">정수 실험: 경계 안은 생존, 밖은 이탈</text><text x="60" y="120" font-size="25" fill="#b5c8df">교육용 규칙: 피해 +10 → 거리 1 + 피해 / 20 → 이동</text><rect x="145" y="215" width="830" height="150" rx="12" fill="#23443f"/><path d="M100 290 H1100" stroke="#b5c8df" stroke-width="4"/><path d="M145 270 V310" stroke="#edf4ff" stroke-width="3"/><text x="130" y="345" font-size="24" fill="#edf4ff">-10</text><path d="M560 270 V310" stroke="#edf4ff" stroke-width="3"/><text x="545" y="345" font-size="24" fill="#edf4ff">0</text><path d="M975 270 V310" stroke="#edf4ff" stroke-width="3"/><text x="960" y="345" font-size="24" fill="#edf4ff">10</text><path d="M1016 270 V310" stroke="#edf4ff" stroke-width="3"/><text x="1001" y="345" font-size="24" fill="#edf4ff">11</text><text x="390" y="245" font-size="26" fill="#91e0bf">안전 구간 [-10, 10]</text><circle cx="601.5" cy="290" r="9" fill="#8dd7ff"/><text x="65" y="410" font-size="24" fill="#edf4ff">1회: 위치 1</text><circle cx="684.5" cy="290" r="9" fill="#8dd7ff"/><text x="65" y="450" font-size="24" fill="#edf4ff">2회: 위치 3</text><circle cx="767.5" cy="290" r="9" fill="#8dd7ff"/><text x="65" y="490" font-size="24" fill="#edf4ff">3회: 위치 5</text><circle cx="892.0" cy="290" r="9" fill="#8dd7ff"/><text x="65" y="530" font-size="24" fill="#edf4ff">4회: 위치 8</text><circle cx="1016.5" cy="290" r="9" fill="#ffae92"/><text x="65" y="570" font-size="24" fill="#edf4ff">5회: 위치 11 → 이탈, 위치·피해 초기화</text><text x="650" y="430" font-size="24" fill="#8dd7ff">오른쪽 연속 공격 예</text><text x="650" y="470" font-size="26" fill="#edf4ff">1 → 3 → 5 → 8 → 11</text><text x="650" y="535" font-size="25" fill="#ffae92">10은 안전, 11은 이탈</text><text x="60" y="630" font-size="23" fill="#b5c8df">원작의 물리·넉백 공식을 재현한 도식이 아닙니다.</text></g></svg>