<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>최소 프로토타입은 질문을 작게 드러낸다</title><rect width="1200" height="680" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="60" y="70" font-size="34" font-weight="700">최소 프로토타입은 질문을 작게 드러낸다</text><rect x="60" y="130" width="500" height="175" rx="16" fill="#20324a" stroke="#5da9d6"/><text x="84" y="170" font-size="27" fill="#8dd7ff">1. 가설</text><text x="84" y="215" font-size="23" fill="#edf4ff">위치와 피해를 함께 읽으면</text><text x="84" y="251" font-size="23" fill="#edf4ff">방향을 고민하게 될까?</text><rect x="640" y="130" width="500" height="175" rx="16" fill="#20324a" stroke="#5da9d6"/><text x="664" y="170" font-size="27" fill="#8dd7ff">2. 최소 규칙</text><text x="664" y="215" font-size="23" fill="#edf4ff">방향 선택 → 피해 증가</text><text x="664" y="251" font-size="23" fill="#edf4ff">이동 → 경계 판정</text><rect x="640" y="370" width="500" height="175" rx="16" fill="#20324a" stroke="#5da9d6"/><text x="664" y="410" font-size="27" fill="#8dd7ff">3. 관찰</text><text x="664" y="455" font-size="23" fill="#edf4ff">예측과 결과가 일치하는가?</text><text x="664" y="491" font-size="23" fill="#edf4ff">선택 이유는 무엇인가?</text><rect x="60" y="370" width="500" height="175" rx="16" fill="#20324a" stroke="#5da9d6"/><text x="84" y="410" font-size="27" fill="#8dd7ff">4. 유지 또는 수정</text><text x="84" y="455" font-size="23" fill="#edf4ff">설명을 고칠까, 규칙을 고칠까?</text><text x="84" y="491" font-size="23" fill="#edf4ff">다음 질문 하나를 고른다.</text><g stroke="#79d5bc" stroke-width="5" fill="none"><path d="M570 220 H620 l-12 -10 m12 10 l-12 10"/><path d="M890 318 V355 l-10 -12 m10 12 l10 -12"/><path d="M625 455 H580 l12 -10 m-12 10 l12 10"/><path d="M310 355 V320 l-10 12 m10 -12 l10 12"/></g><text x="60" y="615" font-size="25" fill="#b5c8df">코드 통과 = 규칙 검증 / 재미 확인 = 별도의 경험 검증</text></g></svg>