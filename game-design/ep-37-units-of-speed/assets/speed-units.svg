<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>같은1초, 다른 tick 수</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">같은1초, 다른 tick 수</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">30Hz</text><text x="72" y="203" font-size="23">1 tick ≈ 83.3333mm</text><text x="72" y="240" font-size="23">30회 합계2500mm</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">60Hz</text><text x="642" y="203" font-size="23">1 tick ≈ 41.6667mm</text><text x="642" y="240" font-size="23">60회 합계2500mm</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">120Hz</text><text x="72" y="443" font-size="23">1 tick ≈ 20.8333mm</text><text x="72" y="480" font-size="23">120회 합계2500mm</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">나머지 보존</text><text x="642" y="443" font-size="23">몫은 위치에, 나머지는 다음에</text><text x="642" y="480" font-size="23">매번 버리지 않는다.</text><text x="50" y="665" fill="#b5c8df" font-size="23">일정 속도2500mm/초의 교육용 계산입니다.</text></g></svg>