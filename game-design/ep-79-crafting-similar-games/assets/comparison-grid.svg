<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>규칙 변경의 효과를 나누어 비교하기</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">규칙 변경의 효과를 나누어 비교하기</text><text x="310" y="140" font-size="25" fill="#edf4ff">시간 제한 유지</text><text x="730" y="140" font-size="25" fill="#edf4ff">시간 제한 제거</text><text x="45" y="275" font-size="23" fill="#edf4ff">소음 없음</text><text x="45" y="465" font-size="23" fill="#edf4ff">소음 추가</text><rect x="240" y="195" width="360" height="130" rx="12" fill="#20324a" stroke="#5798b8"/><text x="258" y="240" font-size="24" fill="#edf4ff">A: 가상 원형</text><rect x="650" y="195" width="360" height="130" rx="12" fill="#20324a" stroke="#5798b8"/><text x="668" y="240" font-size="24" fill="#edf4ff">C: 시간만 변경</text><rect x="240" y="385" width="360" height="130" rx="12" fill="#20324a" stroke="#5798b8"/><text x="258" y="430" font-size="24" fill="#edf4ff">B: 소음만 변경</text><rect x="650" y="385" width="360" height="130" rx="12" fill="#20324a" stroke="#5798b8"/><text x="668" y="430" font-size="24" fill="#edf4ff">D: 둘 다 변경</text><text x="45" y="595" font-size="23" fill="#b5c8df">B와 C의 효과가 D에서 단순히 더해진다는 보장은 없습니다.</text></g></svg>