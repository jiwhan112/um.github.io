<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>비슷함을 관계로 분해하고 목적을 바꾼다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">비슷함을 관계로 분해하고 목적을 바꾼다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">목표</text><text x="72" y="203" font-size="23">무엇을 이루려는가</text><text x="72" y="240" font-size="23">외형보다 행동의 이유</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">정보</text><text x="642" y="203" font-size="23">무엇을 알고 선택하는가</text><text x="642" y="240" font-size="23">새 규칙에는 새 단서 필요</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">비용</text><text x="72" y="443" font-size="23">무엇을 감수하는가</text><text x="72" y="480" font-size="23">시간·위험·자원 분리</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">피드백</text><text x="642" y="443" font-size="23">결과를 어떻게 읽는가</text><text x="642" y="480" font-size="23">비교 실험의 조건 통제</text><text x="50" y="665" fill="#b5c8df" font-size="23">가상 설계 비교이며 특정 작품의 복제나 권리 판단이 아닙니다.</text></g></svg>