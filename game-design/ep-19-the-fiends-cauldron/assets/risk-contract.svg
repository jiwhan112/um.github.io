<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">도전 전에 이해할 수 있는 위험 계약</title><desc id="desc">가상 탐험 게임의 예시. 원작의 수치·환급 공식이 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">도전 전에 이해할 수 있는 위험 계약</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상 탐험 게임의 예시. 원작의 수치·환급 공식이 아니다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 고르기</text><text x="85" y="292" font-size="25" fill="#dceaf6">낮은 위험 / 높은 위험을 비교</text><text x="85" y="334" font-size="25" fill="#dceaf6">참가 비용과 가능한 손실을 표시</text><text x="85" y="376" font-size="25" fill="#dceaf6">도전하지 않을 선택도 유지</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 확정하기</text><text x="775" y="292" font-size="25" fill="#dceaf6">버튼 한 번으로 비용 한 번 차감</text><text x="775" y="334" font-size="25" fill="#dceaf6">실행 중 중복 참가 요청 거절</text><text x="775" y="376" font-size="25" fill="#dceaf6">확정한 규칙 버전과 비용 보존</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 결과 정산</text><text x="85" y="552" font-size="25" fill="#dceaf6">성공: 예치금 반환 + 보상</text><text x="85" y="594" font-size="25" fill="#dceaf6">실패: 예치금 손실</text><text x="85" y="636" font-size="25" fill="#dceaf6">같은 결과를 두 번 지급하지 않음</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 다시 선택</text><text x="775" y="552" font-size="25" fill="#dceaf6">잔액과 정산 이유를 보여 준다</text><text x="775" y="594" font-size="25" fill="#dceaf6">쉬운 선택으로 돌아갈 길을 둔다</text><text x="775" y="636" font-size="25" fill="#dceaf6">실패 직후 더 큰 위험을 강요하지 않음</text><text x="60" y="790" font-size="26" fill="#e7d4a2">의도: 스스로 정한 도전의 긴장감을 만든다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">구현: 선택·비용·정산을 구분하고, 취소와 저장 실패도 계약에 적는다.</text></g></svg>