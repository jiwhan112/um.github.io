<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">캐릭터 위치와 카메라 목표를 분리한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">플레이 상태</text><text x="60" y="195" font-size="22" fill="#e7edf8">위치 x</text><text x="60" y="240" font-size="22" fill="#e7edf8">이동 의도 방향</text><text x="60" y="285" font-size="22" fill="#e7edf8">장면 경계</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">목표 계산</text><text x="415" y="195" font-size="22" fill="#e7edf8">진행 방향 선행</text><text x="415" y="240" font-size="22" fill="#e7edf8">목표를 경계로 제한</text><text x="415" y="285" font-size="22" fill="#e7edf8">특수 장면 정책</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">화면 추적</text><text x="770" y="195" font-size="22" fill="#e7edf8">즉시 추적 또는 완화</text><text x="770" y="240" font-size="22" fill="#e7edf8">큰 이동은 재설정</text><text x="770" y="285" font-size="22" fill="#e7edf8">흔들림은 별도 층</text><text x="40" y="433" font-size="22" fill="#bdcce1">카메라는 위치 복사가 아니라 다음 행동에 필요한 정보를 배치하는 시스템이다.</text></g></svg>