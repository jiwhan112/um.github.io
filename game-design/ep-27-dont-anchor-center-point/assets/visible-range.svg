<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="1100" height="600" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#e7edf8"><text x="40" y="55" font-size="29">같은 캐릭터 위치 50, 다른 가시 범위</text><text x="40" y="105" font-size="22">화면 폭은 월드 20단위 · 오른쪽 이동 · 장애물은 65에 있음</text><text x="40" y="160" font-size="23">중심 50: 보이는 범위 [40, 60]</text><rect x="100" y="180" width="800" height="120" fill="#1b2b43" stroke="#91b6ff"/><path d="M500 190V290" stroke="#91b6ff" stroke-dasharray="6 5"/><circle cx="500" cy="245" r="20" fill="#63d9d0"/><text x="460" y="280" font-size="20">캐릭터</text><text x="106" y="210" font-size="20">40</text><text x="865" y="210" font-size="20">60</text><text x="920" y="240" font-size="21">65의 장애물</text><text x="920" y="270" font-size="21">아직 안 보임</text><text x="40" y="355" font-size="23">선행 중심 58: 보이는 범위 [48, 68]</text><rect x="100" y="375" width="800" height="120" fill="#1b2b43" stroke="#efc879"/><path d="M500 385V485" stroke="#efc879" stroke-dasharray="6 5"/><circle cx="180" cy="440" r="20" fill="#63d9d0"/><text x="140" y="475" font-size="20">캐릭터</text><path d="M780 410L805 460H755Z" fill="#efc879"/><text x="725" y="480" font-size="20">장애물 65</text><text x="106" y="405" font-size="20">48</text><text x="865" y="405" font-size="20">68</text><text x="40" y="550" font-size="22">앞의 정보를 얻는 대신 뒤쪽 시야가 줄어든다. 선행량 8은 비교용 가정이다.</text></g></svg>