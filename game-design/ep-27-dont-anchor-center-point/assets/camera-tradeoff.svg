<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">안정감과 앞을 보는 공간 사이의 균형</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">고정 중심</text><text x="60" y="195" font-size="22" fill="#e7edf8">위치 관계가 일정</text><text x="60" y="240" font-size="22" fill="#e7edf8">앞 공간은 절반</text><text x="60" y="285" font-size="22" fill="#e7edf8">작은 움직임도 전달</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">선행 중심</text><text x="415" y="195" font-size="22" fill="#e7edf8">진행 방향 더 보임</text><text x="415" y="240" font-size="22" fill="#e7edf8">반전 시 변화 발생</text><text x="415" y="285" font-size="22" fill="#e7edf8">의도 판정이 중요</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">완만한 추적</text><text x="770" y="195" font-size="22" fill="#e7edf8">작은 변화를 완화</text><text x="770" y="240" font-size="22" fill="#e7edf8">추적 지연 발생</text><text x="770" y="285" font-size="22" fill="#e7edf8">텔레포트 예외 필요</text><text x="40" y="433" font-size="22" fill="#bdcce1">어떤 정책도 항상 우월하지 않다. 속도·위협·조준 과제에 맞춰 비교한다.</text></g></svg>