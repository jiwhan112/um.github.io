<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">예상 밖의 결과를 바로 원인으로 단정하지 않는다</text><text x="80" y="112" fill="#e2e8f0" font-size="25">발생 전 조건</text><text x="430" y="112" fill="#e2e8f0" font-size="25">관찰한 결과</text><text x="780" y="112" fill="#e2e8f0" font-size="25">확인할 가설</text><rect x="45" y="155" width="290" height="90" rx="12" fill="#164e63"/><rect x="395" y="155" width="290" height="90" rx="12" fill="#312e81"/><rect x="745" y="155" width="310" height="90" rx="12" fill="#3f3f46"/><text x="65" y="208" fill="#e2e8f0" font-size="23">작은 화면</text><text x="415" y="208" fill="#e2e8f0" font-size="23">안내가 화면 밖</text><text x="765" y="208" fill="#e2e8f0" font-size="23">레이아웃 제약</text><text x="350" y="208" fill="#e2e8f0" font-size="23">→</text><text x="700" y="208" fill="#e2e8f0" font-size="23">→</text><rect x="45" y="285" width="290" height="90" rx="12" fill="#164e63"/><rect x="395" y="285" width="290" height="90" rx="12" fill="#312e81"/><rect x="745" y="285" width="310" height="90" rx="12" fill="#3f3f46"/><text x="65" y="338" fill="#e2e8f0" font-size="23">재시작 중 입력</text><text x="415" y="338" fill="#e2e8f0" font-size="23">즉시 행동 발동</text><text x="765" y="338" fill="#e2e8f0" font-size="23">입력 상태 수명</text><text x="350" y="338" fill="#e2e8f0" font-size="23">→</text><text x="700" y="338" fill="#e2e8f0" font-size="23">→</text><rect x="45" y="415" width="290" height="90" rx="12" fill="#164e63"/><rect x="395" y="415" width="290" height="90" rx="12" fill="#312e81"/><rect x="745" y="415" width="310" height="90" rx="12" fill="#3f3f46"/><text x="65" y="468" fill="#e2e8f0" font-size="23">긴 플레이 후</text><text x="415" y="468" fill="#e2e8f0" font-size="23">보상 중복 표시</text><text x="765" y="468" fill="#e2e8f0" font-size="23">이벤트 중복 처리</text><text x="350" y="468" fill="#e2e8f0" font-size="23">→</text><text x="700" y="468" fill="#e2e8f0" font-size="23">→</text><text x="50" y="570" fill="#a5b4fc" font-size="22">관찰은 사실로, 원인은 재현·검사 전까지 가설로 기록한다.</text></g></svg>