<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">빨리 고르고 싶다</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">빨리 고르고 싶다</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 이동 의도</text><text x="85" y="292" font-size="25" fill="#dceaf6">짧은 입력은 정밀한 한 칸</text><text x="85" y="334" font-size="25" fill="#dceaf6">유지는 반복 정책으로 해석</text><text x="85" y="376" font-size="25" fill="#dceaf6">장치 중복 이벤트를 정리</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 경계 정책</text><text x="775" y="292" font-size="25" fill="#dceaf6">끝에서 멈춤 또는 순환</text><text x="775" y="334" font-size="25" fill="#dceaf6">목록 길이와 배치에 맞춰 선택</text><text x="775" y="376" font-size="25" fill="#dceaf6">현재 위치를 분명하게 표시</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 안전한 확정</text><text x="85" y="552" font-size="25" fill="#dceaf6">이동과 실행 명령을 분리</text><text x="85" y="594" font-size="25" fill="#dceaf6">화면 전환 뒤 입력 승계 검사</text><text x="85" y="636" font-size="25" fill="#dceaf6">실수 비용에 맞는 취소 경로</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 검증</text><text x="775" y="552" font-size="25" fill="#dceaf6">빈 목록·한 항목·긴 목록</text><text x="775" y="594" font-size="25" fill="#dceaf6">큰 이동량·음수 이동·중단</text><text x="775" y="636" font-size="25" fill="#dceaf6">실제 읽기와 조작도 관찰</text><text x="60" y="790" font-size="26" fill="#e7d4a2">빠른 탐색을 제공하되, 누르고 있던 입력이 중요한 실행으로 새지 않게 한다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">계산의 정확성과 사용감의 검증은 서로 다른 통과 조건이다.</text></g></svg>