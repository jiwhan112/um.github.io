<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">목록 끝에서 같은 입력이 만드는 다른 결과</title><desc id="desc">8개 항목에서 7번을 선택한 뒤 한 칸 앞으로 이동하면 멈춤은 7번 유지, 순환은 0번으로 이동한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#69d7ca"/></marker></defs><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#e5edf6"><text x="65" y="85" font-size="38" font-weight="700">끝에서 한 칸 앞으로: 멈춤과 순환</text><text x="65" y="140" font-size="26">가상 목록 · 항목 8개 · 시작 인덱스 7 · 이동량 +1</text><text x="65" y="230" font-size="30">멈춤: 마지막 항목에 그대로 남는다</text><rect x="70" y="285" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="118" y="347" font-size="40">0</text><rect x="230" y="285" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="278" y="347" font-size="40">1</text><rect x="390" y="285" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="438" y="347" font-size="40">2</text><rect x="550" y="285" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="598" y="347" font-size="40">3</text><rect x="710" y="285" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="758" y="347" font-size="40">4</text><rect x="870" y="285" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="918" y="347" font-size="40">5</text><rect x="1030" y="285" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="1078" y="347" font-size="40">6</text><rect x="1190" y="285" width="125" height="95" rx="12" fill="#286b64" stroke="#69d7ca" stroke-width="3"/><text x="1238" y="347" font-size="40">7</text><rect x="70" y="535" width="125" height="95" rx="12" fill="#286b64" stroke="#69d7ca" stroke-width="3"/><text x="118" y="597" font-size="40">0</text><rect x="230" y="535" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="278" y="597" font-size="40">1</text><rect x="390" y="535" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="438" y="597" font-size="40">2</text><rect x="550" y="535" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="598" y="597" font-size="40">3</text><rect x="710" y="535" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="758" y="597" font-size="40">4</text><rect x="870" y="535" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="918" y="597" font-size="40">5</text><rect x="1030" y="535" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="1078" y="597" font-size="40">6</text><rect x="1190" y="535" width="125" height="95" rx="12" fill="#28394f" stroke="#566881" stroke-width="3"/><text x="1238" y="597" font-size="40">7</text><path d="M1315 320 H1370 V365 H1330" stroke="#e7c37d" stroke-width="5" fill="none"/><text x="870" y="430" font-size="25" fill="#e7c37d">결과 7 · 초과 이동량은 남기지 않음</text><text x="65" y="490" font-size="30">순환: 첫 항목으로 되돌아간다</text><path d="M1255 645 V700 H132 V645" stroke="#69d7ca" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="480" y="750" font-size="26" fill="#69d7ca">결과 0 · (7 + 1) mod 8 = 0</text><text x="65" y="840" font-size="26">경계 정책은 이동만 결정한다. 선택 항목의 실행·구매·삭제를 뜻하지 않는다.</text></g></svg>