<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">같은 자원 제한, 다른 선택 — 구조를 바꾸는 실험</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">원형 A</text><text x="60" y="195" font-size="22" fill="#e7edf8">가방 용량 3칸</text><text x="60" y="240" font-size="22" fill="#e7edf8">재료마다 1칸</text><text x="60" y="285" font-size="22" fill="#e7edf8">가치만 비교</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">변형 B</text><text x="415" y="195" font-size="22" fill="#e7edf8">가방 용량 3칸</text><text x="415" y="240" font-size="22" fill="#e7edf8">큰 재료는 2칸</text><text x="415" y="285" font-size="22" fill="#e7edf8">공간 대비 가치 비교</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">변형 C</text><text x="770" y="195" font-size="22" fill="#e7edf8">가방 용량 3칸</text><text x="770" y="240" font-size="22" fill="#e7edf8">재료끼리 반응</text><text x="770" y="285" font-size="22" fill="#e7edf8">조합과 미래를 비교</text><text x="40" y="433" font-size="22" fill="#bdcce1">세 모델의 우열을 미리 정하지 말고 선택 이유가 달라지는지 본다.</text></g></svg>