<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">표면 기능을 복제하지 않고 행동의 원인을 재조합하기</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">분해</text><text x="60" y="195" font-size="22" fill="#e7edf8">플레이어의 선택</text><text x="60" y="240" font-size="22" fill="#e7edf8">제약과 정보</text><text x="60" y="285" font-size="22" fill="#e7edf8">피드백과 결과</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">분석</text><text x="415" y="195" font-size="22" fill="#e7edf8">왜 이 선택을 하나?</text><text x="415" y="240" font-size="22" fill="#e7edf8">무엇과 충돌하는가?</text><text x="415" y="285" font-size="22" fill="#e7edf8">다른 원인은 없는가?</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">재구성</text><text x="770" y="195" font-size="22" fill="#e7edf8">변수 하나를 변경</text><text x="770" y="240" font-size="22" fill="#e7edf8">반대 가설도 기록</text><text x="770" y="285" font-size="22" fill="#e7edf8">작은 실험으로 비교</text><text x="40" y="433" font-size="22" fill="#bdcce1">기능 이름이 아니라 선택이 생기는 관계를 기록한다.</text></g></svg>