<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>관용도 명확한 계약이 필요하다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">관용도 명확한 계약이 필요하다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">시간 경계</text><text x="72" y="203" font-size="23">잔여2 → 1 → 0 → -1</text><text x="72" y="240" font-size="23">0은 허용, -1은 거부</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">소모</text><text x="642" y="203" font-size="23">성공한 입력은 한 번만</text><text x="642" y="240" font-size="23">시간이 남아도 재사용 금지</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">회복</text><text x="72" y="443" font-size="23">실제 착지 때만 재충전</text><text x="72" y="480" font-size="23">허위 이벤트는 별도 방어</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">공정성</text><text x="642" y="443" font-size="23">승인된 규칙을 일관되게</text><text x="642" y="480" font-size="23">경쟁 부정행위와 구분</text><text x="50" y="665" fill="#b5c8df" font-size="23">2 tick은 교육용 수치이며 제품 권장값이 아닙니다.</text></g></svg>