<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">낭떠러지에서 무엇을 허용할 것인가?</title><desc id="desc">가상 발 위치 모델. 원작의 물리 엔진이나 특정 게임의 구현이 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">낭떠러지에서 무엇을 허용할 것인가?</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상 발 위치 모델. 원작의 물리 엔진이나 특정 게임의 구현이 아니다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 그대로 떨어지기</text><text x="85" y="292" font-size="25" fill="#dceaf6">이동 결과가 지지 구간 밖이면 낙하</text><text x="85" y="334" font-size="25" fill="#dceaf6">위험과 이동 입력의 관계가 직접적</text><text x="85" y="376" font-size="25" fill="#dceaf6">작은 오입력의 비용이 커질 수 있음</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 가장자리에서 멈추기</text><text x="775" y="292" font-size="25" fill="#dceaf6">예상 이동 위치를 경계로 제한</text><text x="775" y="334" font-size="25" fill="#dceaf6">의도하지 않은 추락을 줄임</text><text x="775" y="376" font-size="25" fill="#dceaf6">공중으로 나가려는 의도를 막을 수 있음</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 별도 행동으로 나가기</text><text x="85" y="552" font-size="25" fill="#dceaf6">점프·특정 입력 때만 경계 통과</text><text x="85" y="594" font-size="25" fill="#dceaf6">안전과 의도적 이동을 구분</text><text x="85" y="636" font-size="25" fill="#dceaf6">예외 규칙을 읽기 쉽게 알려야 함</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 짧은 관용 구간</text><text x="775" y="552" font-size="25" fill="#dceaf6">지지를 잃은 뒤 점프 기회 유지</text><text x="775" y="594" font-size="25" fill="#dceaf6">조작 오차를 흡수하는 정책</text><text x="775" y="636" font-size="25" fill="#dceaf6">이미 낙하한 상태와 혼동하지 않음</text><text x="60" y="790" font-size="26" fill="#e7d4a2">충돌 검사가 끝나야 정책을 고르는 것이 아니라, 먼저 정책을 정한다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">정확한 경계 포함 여부·고속 이동·뒤로 밀림·이동 발판을 따로 시험한다.</text></g></svg>