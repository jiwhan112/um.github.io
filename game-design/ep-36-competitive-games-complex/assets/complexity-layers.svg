<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>어떤 복잡함을 줄일 것인가</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">어떤 복잡함을 줄일 것인가</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">실행 부담</text><text x="72" y="203" font-size="23">입력 순서·속도·정확도</text><text x="72" y="240" font-size="23">의도한 기술인가 점검</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">기억 부담</text><text x="642" y="203" font-size="23">예외·수치·숨은 조건</text><text x="642" y="240" font-size="23">일관성과 정보 접근 개선</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">판단의 깊이</text><text x="72" y="443" font-size="23">상대·상황에 따른 선택</text><text x="72" y="480" font-size="23">단순화 뒤에도 남는가</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">학습 피드백</text><text x="642" y="443" font-size="23">왜 졌고 무엇을 바꿀까</text><text x="642" y="480" font-size="23">첫 경기와 장기 경험 연결</text><text x="50" y="665" fill="#b5c8df" font-size="23">행동 수가 많다는 사실만으로 깊이가 증명되지는 않습니다.</text></g></svg>