<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>3:2의 의미를 승리 조건과 연결하기</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">3:2의 의미를 승리 조건과 연결하기</text><rect x="100" y="160" width="370" height="160" rx="12" fill="#20324a" stroke="#5798b8"/><text x="118" y="205" font-size="24" fill="#edf4ff">팀 A: 3점</text><rect x="630" y="160" width="370" height="160" rx="12" fill="#20324a" stroke="#5798b8"/><text x="648" y="205" font-size="24" fill="#edf4ff">팀 B: 2점</text><circle cx="130" cy="270" r="22" fill="#8dd7ff"/><circle cx="205" cy="270" r="22" fill="#8dd7ff"/><circle cx="280" cy="270" r="22" fill="#8dd7ff"/><circle cx="355" cy="270" r="22" fill="#435469"/><circle cx="660" cy="270" r="22" fill="#8dd7ff"/><circle cx="735" cy="270" r="22" fill="#8dd7ff"/><circle cx="810" cy="270" r="22" fill="#435469"/><circle cx="885" cy="270" r="22" fill="#435469"/><text x="100" y="390" font-size="28" fill="#8dd7ff">1점 더 얻으면 승리</text><text x="630" y="390" font-size="28" fill="#8dd7ff">2점 더 얻으면 승리</text><text x="100" y="500" font-size="26" fill="#edf4ff">가상 규칙: 먼저4점 / 연장·시간 제한 없음</text><text x="100" y="570" font-size="25" fill="#b5c8df">남은 조건의 계산 ≠ 승률 예측</text></g></svg>