<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>결과의 의미를 읽게 하는 정보</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">결과의 의미를 읽게 하는 정보</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">누가</text><text x="72" y="203" font-size="23">팀 이름·형태·색을 함께</text><text x="72" y="240" font-size="23">중립 관전도 지원</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">무엇을</text><text x="642" y="203" font-size="23">현재 목표와 가능한 대응</text><text x="642" y="240" font-size="23">사실과 추측을 구분</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">얼마나 중요한가</text><text x="72" y="443" font-size="23">3:2, 먼저4점이면 승리</text><text x="72" y="480" font-size="23">필요 점수1과2를 설명</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">무엇이 달라졌나</text><text x="642" y="443" font-size="23">최근 사건과 상태 변화</text><text x="642" y="480" font-size="23">과장 대신 정확한 맥락</text><text x="50" y="665" fill="#b5c8df" font-size="23">응원 선택은 강제 조건이 아니라 선택 가능한 관전 방식입니다.</text></g></svg>