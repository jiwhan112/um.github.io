<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">필수 전략과 전략의 균형</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">필수 전략과 전략의 균형</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 경험의 약속</text><text x="85" y="292" font-size="25" fill="#dceaf6">해법을 배우는가, 방법을 고르는가?</text><text x="85" y="334" font-size="25" fill="#dceaf6">퍼즐·전투·모드별 목표를 명시</text><text x="85" y="376" font-size="25" fill="#dceaf6">정답 하나를 무조건 악으로 보지 않음</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 유효한 선택</text><text x="775" y="292" font-size="25" fill="#dceaf6">보상·비용·실행 부담을 비교</text><text x="775" y="334" font-size="25" fill="#dceaf6">메뉴 항목 수와 전략 수는 다름</text><text x="775" y="376" font-size="25" fill="#dceaf6">모든 조건에서 우세한지 확인</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 단서와 대응</text><text x="85" y="552" font-size="25" fill="#dceaf6">필수 행동을 알 수 있는가?</text><text x="85" y="594" font-size="25" fill="#dceaf6">필요한 도구를 얻을 수 있는가?</text><text x="85" y="636" font-size="25" fill="#dceaf6">실패 뒤 다른 시도를 할 수 있는가?</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 검증과 조정</text><text x="775" y="552" font-size="25" fill="#dceaf6">상황별 성과와 선택 이유를 기록</text><text x="775" y="594" font-size="25" fill="#dceaf6">숨은 비용·상황 누락을 점검</text><text x="775" y="636" font-size="25" fill="#dceaf6">원하는 경험에 맞춰 수정</text><text x="60" y="790" font-size="26" fill="#e7d4a2">정답을 요구하는 설계와 다양한 답을 허용하는 설계는 서로 다른 약속이다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">어느 쪽이든 플레이어가 배울 정보와 유효한 행동 기회를 제공해야 한다.</text></g></svg>