<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">독창적 연습 곡선 — 부담과 성취의 리듬</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">도전</text><text x="60" y="195" font-size="22" fill="#e7edf8">새 위협을 읽기</text><text x="60" y="240" font-size="22" fill="#e7edf8">실패 원인 배우기</text><text x="60" y="285" font-size="22" fill="#e7edf8">작은 목표 설정</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">숙련</text><text x="415" y="195" font-size="22" fill="#e7edf8">같은 상황을 개선</text><text x="415" y="240" font-size="22" fill="#e7edf8">성장 효과 확인</text><text x="415" y="285" font-size="22" fill="#e7edf8">선택의 폭 확대</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">변주</text><text x="770" y="195" font-size="22" fill="#e7edf8">다른 조건 제시</text><text x="770" y="240" font-size="22" fill="#e7edf8">익힌 것을 재사용</text><text x="770" y="285" font-size="22" fill="#e7edf8">모든 성취 초기화 금지</text><text x="40" y="433" font-size="22" fill="#bdcce1">매 구간을 같은 난도로 맞추기보다 무엇을 느끼게 할지 정한다.</text></g></svg>