<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">항상 같은 비율로 강해지면 성장이 느껴질까</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">동일 비율 성장</text><text x="60" y="195" font-size="22" fill="#e7edf8">내 공격력 ×2</text><text x="60" y="240" font-size="22" fill="#e7edf8">적 체력 ×2</text><text x="60" y="285" font-size="22" fill="#e7edf8">필요 타격 수 유지</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">성장 체감 구간</text><text x="415" y="195" font-size="22" fill="#e7edf8">예전 적은 빨리 처리</text><text x="415" y="240" font-size="22" fill="#e7edf8">익힌 기술을 활용</text><text x="415" y="285" font-size="22" fill="#e7edf8">지난 어려움 재해석</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">새 도전 구간</text><text x="770" y="195" font-size="22" fill="#e7edf8">새 패턴·조합</text><text x="770" y="240" font-size="22" fill="#e7edf8">새로운 판단 요구</text><text x="770" y="285" font-size="22" fill="#e7edf8">기존 성취도 보존</text><text x="40" y="433" font-size="22" fill="#bdcce1">수치 균형과 경험의 리듬은 같은 목표가 아니다.</text></g></svg>