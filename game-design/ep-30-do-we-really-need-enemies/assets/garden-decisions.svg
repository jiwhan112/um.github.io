<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">가상 정원: 공격하지 않아도 생기는 선택</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">상태</text><text x="70" y="173" fill="#e2e8f0" font-size="21">화분 A: 물 1 / 화분 B: 물 3 / 보유 물 2</text><text x="70" y="202" fill="#cbd5e1" font-size="19">각 화분은 하루에 물 1을 쓰고 물 0이면 성장이 멈춘다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">선택</text><text x="70" y="308" fill="#e2e8f0" font-size="21">A에 먼저 주기 / B에 저장하기 / 내일까지 남기기</text><text x="70" y="337" fill="#cbd5e1" font-size="19">이 예제에서는 마르더라도 죽지 않는다. 실패 비용을 낮춘다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">결과</text><text x="70" y="443" fill="#e2e8f0" font-size="21">성장 시점과 다음 날 선택지가 달라진다</text><text x="70" y="472" fill="#cbd5e1" font-size="19">정답 하나를 강요할지, 꾸미는 취향을 허용할지 목적에 맞게 정한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">자체 제작 규칙이다. 원본 영상 속 사례를 재현한 것이 아니다.</text></g></svg>