<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">적을 지우기 전에 적의 역할을 나눠 본다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">판단을 요구한다</text><text x="70" y="173" fill="#e2e8f0" font-size="21">어느 길로 갈까? 무엇을 먼저 처리할까?</text><text x="70" y="202" fill="#cbd5e1" font-size="19">대안: 공간 배치·자원 배분·순서 결정</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">긴장과 변화를 만든다</text><text x="70" y="308" fill="#e2e8f0" font-size="21">다음 상황을 예상하고 행동을 조정한다</text><text x="70" y="337" fill="#cbd5e1" font-size="19">대안: 날씨·시간대·성장 단계·불확실한 정보</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">행동에 반응한다</text><text x="70" y="443" fill="#e2e8f0" font-size="21">내 선택이 세계를 바꿨다는 신호를 준다</text><text x="70" y="472" fill="#cbd5e1" font-size="19">대안: 식물 성장·시설 완성·소리·관계 변화</text><text x="50" y="590" fill="#a5b4fc" font-size="20">적이 없는 것과 선택·피드백이 없는 것은 다르다.</text></g></svg>