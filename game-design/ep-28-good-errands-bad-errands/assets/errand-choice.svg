<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">이동 거리 대신 과제 속의 판단을 설계한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">단순 전달</text><text x="60" y="195" font-size="22" fill="#e7edf8">표시를 따라 이동</text><text x="60" y="240" font-size="22" fill="#e7edf8">버튼으로 수령</text><text x="60" y="285" font-size="22" fill="#e7edf8">같은 길로 귀환</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">의미 있는 변화</text><text x="415" y="195" font-size="22" fill="#e7edf8">경로마다 다른 위험</text><text x="415" y="240" font-size="22" fill="#e7edf8">운반 중 상태 변화</text><text x="415" y="285" font-size="22" fill="#e7edf8">대상에 따라 결과 변화</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">피드백</text><text x="770" y="195" font-size="22" fill="#e7edf8">선택 이유가 보임</text><text x="770" y="240" font-size="22" fill="#e7edf8">세계 변화가 남음</text><text x="770" y="285" font-size="22" fill="#e7edf8">반복 비용은 관리</text><text x="40" y="433" font-size="22" fill="#bdcce1">목적지를 늘리는 것보다 행동의 이유가 바뀌는지 살펴본다.</text></g></svg>