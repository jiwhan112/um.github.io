<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">보상 중복을 막는 과제 상태 흐름</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">수락 전</text><text x="60" y="195" font-size="22" fill="#e7edf8">과제 ID 확인</text><text x="60" y="240" font-size="22" fill="#e7edf8">조건과 보상 안내</text><text x="60" y="285" font-size="22" fill="#e7edf8">중복 수락 방지</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">진행 중</text><text x="415" y="195" font-size="22" fill="#e7edf8">아이템·대상 검사</text><text x="415" y="240" font-size="22" fill="#e7edf8">진도는 저장 가능</text><text x="415" y="285" font-size="22" fill="#e7edf8">실패·취소 규칙</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">완료 처리</text><text x="770" y="195" font-size="22" fill="#e7edf8">조건 재검증</text><text x="770" y="240" font-size="22" fill="#e7edf8">보상 1회 지급</text><text x="770" y="285" font-size="22" fill="#e7edf8">완료 상태 보존</text><text x="40" y="433" font-size="22" fill="#bdcce1">다시 접속하거나 버튼을 두 번 눌러도 결과가 한 번만 적용되어야 한다.</text></g></svg>