<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>빠른 전환에도 소유권은 명확하게</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">빠른 전환에도 소유권은 명확하게</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">준비</text><text x="72" y="203" font-size="23">필수 상태·자원 확보</text><text x="72" y="240" font-size="23">아직 현재 화면은 유지</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">Ready</text><text x="642" y="203" font-size="23">현재 요청의 완료만 수락</text><text x="642" y="240" font-size="23">오래된 요청은 거부</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">표시</text><text x="72" y="443" font-size="23">commit에서 화면 변경</text><text x="72" y="480" font-size="23">준비 전 표시 금지</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">취소</text><text x="642" y="443" font-size="23">세대 번호 갱신</text><text x="642" y="480" font-size="23">늦은 완료가 돌아오지 않게</text><text x="50" y="665" fill="#b5c8df" font-size="23">요청 토큰은 보안 인증이 아닌 수명 구분용 번호입니다.</text></g></svg>