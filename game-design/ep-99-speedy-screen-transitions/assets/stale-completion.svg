<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>늦게 끝난 A가 최신 요청 B를 덮지 않게</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">늦게 끝난 A가 최신 요청 B를 덮지 않게</text><text x="80" y="140" font-size="24" fill="#edf4ff">시간 ↓</text><rect x="220" y="190" width="780" height="75" rx="12" fill="#20324a" stroke="#5798b8"/><text x="238" y="235" font-size="24" fill="#edf4ff">A 요청: token1</text><rect x="220" y="290" width="780" height="75" rx="12" fill="#245448" stroke="#5798b8"/><text x="238" y="335" font-size="24" fill="#edf4ff">B 요청: token2 (최신)</text><rect x="220" y="390" width="780" height="75" rx="12" fill="#634844" stroke="#5798b8"/><text x="238" y="435" font-size="24" fill="#edf4ff">A 완료: token1 ≠ 2 → 거부</text><rect x="220" y="490" width="780" height="75" rx="12" fill="#245448" stroke="#5798b8"/><text x="238" y="535" font-size="24" fill="#edf4ff">B 완료: token2 = 2 → Ready → 표시</text><path d="M140 180 L140 560" stroke="#86ddbc" stroke-width="4" fill="none"/><text x="60" y="610" font-size="23" fill="#b5c8df">현재 토큰과 단계가 맞는 완료만 수락합니다.</text></g></svg>