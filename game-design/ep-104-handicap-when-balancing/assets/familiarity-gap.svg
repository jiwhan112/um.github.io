<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">개발자의 익숙함을 사용자의 정보로 바꾸기</text><text x="65" y="110" fill="#e2e8f0" font-size="27">개발자가 이미 아는 것</text><text x="610" y="110" fill="#e2e8f0" font-size="27">처음 사용자가 확인해야 할 것</text><rect x="55" y="155" width="430" height="65" rx="12" fill="#3730a3"/><text x="75" y="197" fill="#e2e8f0" font-size="22">위험이 나올 위치</text><rect x="600" y="155" width="450" height="65" rx="12" fill="#164e63"/><text x="620" y="197" fill="#e2e8f0" font-size="22">위험을 미리 읽을 신호</text><text x="520" y="197" fill="#e2e8f0" font-size="26">→</text><rect x="55" y="245" width="430" height="65" rx="12" fill="#3730a3"/><text x="75" y="287" fill="#e2e8f0" font-size="22">정답 입력과 타이밍</text><rect x="600" y="245" width="450" height="65" rx="12" fill="#164e63"/><text x="620" y="287" fill="#e2e8f0" font-size="22">행동 가능한 시점과 이유</text><text x="520" y="287" fill="#e2e8f0" font-size="26">→</text><rect x="55" y="335" width="430" height="65" rx="12" fill="#3730a3"/><text x="75" y="377" fill="#e2e8f0" font-size="22">실패 후 복구 경로</text><rect x="600" y="335" width="450" height="65" rx="12" fill="#164e63"/><text x="620" y="377" fill="#e2e8f0" font-size="22">다시 시도하는 방법</text><text x="520" y="377" fill="#e2e8f0" font-size="26">→</text><rect x="55" y="425" width="430" height="65" rx="12" fill="#3730a3"/><text x="75" y="467" fill="#e2e8f0" font-size="22">숨겨진 규칙의 의도</text><rect x="600" y="425" width="450" height="65" rx="12" fill="#164e63"/><text x="620" y="467" fill="#e2e8f0" font-size="22">화면에서 알 수 있는 규칙</text><text x="520" y="467" fill="#e2e8f0" font-size="26">→</text><text x="60" y="565" fill="#a5b4fc" font-size="20">제약을 둔 자체 테스트는 가설 도구다. 실제 처음 사용자 관찰을 대체하지 않는다.</text></g></svg>