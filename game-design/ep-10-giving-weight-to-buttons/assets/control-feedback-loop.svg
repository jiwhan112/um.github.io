<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">손끝에서 화면으로 돌아오는 조작감 고리</title>
<desc id="desc">인지, 의도, 입력, 게임 판정, 피드백이 연결되는 네 단계 순환 구조를 크게 보여준다.</desc>
<rect width="1280" height="660" rx="26" fill="#0e1728"/>
<text x="55" y="75" fill="#f8fafc" font-size="38" font-weight="700" font-family="sans-serif">조작감은 한 번의 버튼 클릭이 아니라 ‘왕복’이다</text>
<text x="56" y="115" fill="#a9b9d4" font-size="21" font-family="sans-serif">게임이 반응하는 방식 전체가 플레이어의 손맛으로 돌아온다</text>
<rect x="60" y="170" width="258" height="218" rx="22" fill="#183a55" stroke="#60c5e6" stroke-width="3"/>
<text x="87" y="218" font-size="28" font-weight="700" fill="#abecfd" font-family="sans-serif">① 눈·귀로 인지</text>
<text x="87" y="267" font-size="23" fill="#f7fbff" font-family="sans-serif">적의 거리와 자세</text>
<text x="87" y="307" font-size="23" fill="#f7fbff" font-family="sans-serif">공격 가능한 기회</text>
<text x="87" y="347" font-size="21" fill="#c8eaf3" font-family="sans-serif">다음 행동을 판단</text>
<rect x="359" y="170" width="258" height="218" rx="22" fill="#183c35" stroke="#68d4a6" stroke-width="3"/>
<text x="386" y="218" font-size="28" font-weight="700" fill="#a5f4cf" font-family="sans-serif">② 손으로 입력</text>
<text x="386" y="267" font-size="23" fill="#f7fbff" font-family="sans-serif">누름 / 유지 / 뗌</text>
<text x="386" y="307" font-size="23" fill="#f7fbff" font-family="sans-serif">스틱 방향·기울기</text>
<text x="386" y="347" font-size="21" fill="#ccecdf" font-family="sans-serif">물리적 조작 의도</text>
<rect x="658" y="170" width="258" height="218" rx="22" fill="#443552" stroke="#cc96f2" stroke-width="3"/>
<text x="685" y="218" font-size="28" font-weight="700" fill="#e7c9ff" font-family="sans-serif">③ 게임 규칙 반영</text>
<text x="685" y="267" font-size="23" fill="#f7fbff" font-family="sans-serif">이동 속도·공격 상태</text>
<text x="685" y="307" font-size="23" fill="#f7fbff" font-family="sans-serif">충전·피격·회복</text>
<text x="685" y="347" font-size="21" fill="#ead9f3" font-family="sans-serif">판정의 일관성</text>
<rect x="957" y="170" width="263" height="218" rx="22" fill="#49351e" stroke="#ffcb78" stroke-width="3"/>
<text x="984" y="218" font-size="28" font-weight="700" fill="#ffe2aa" font-family="sans-serif">④ 피드백 표시</text>
<text x="984" y="267" font-size="23" fill="#f7fbff" font-family="sans-serif">애니메이션·음향</text>
<text x="984" y="307" font-size="23" fill="#f7fbff" font-family="sans-serif">진동·이펙트</text>
<text x="984" y="347" font-size="21" fill="#f5e5cc" font-family="sans-serif">‘반응했다’는 확신</text>
<g stroke="#d1def4" stroke-width="5" fill="none" stroke-linecap="round"><path d="M320 280 H347 M339 272 L347 280 L339 288"/><path d="M619 280 H646 M638 272 L646 280 L638 288"/><path d="M918 280 H945 M937 272 L945 280 L937 288"/><path d="M1086 402 V463 H193 V402"/><path d="M185 415 L193 402 L201 415"/></g>
<text x="495" y="449" font-size="26" font-weight="700" fill="#f9fafb" font-family="sans-serif">다음 판단으로 돌아오는 감각</text>
<rect x="67" y="518" width="1146" height="99" rx="18" fill="#202c43"/>
<text x="100" y="558" font-size="23" fill="#b4f7dd" font-family="sans-serif">접수 피드백</text>
<text x="295" y="558" font-size="23" fill="#d7e2f3" font-family="sans-serif">→</text>
<text x="349" y="558" font-size="23" fill="#ffd897" font-family="sans-serif">의도된 준비 동작</text>
<text x="601" y="558" font-size="23" fill="#d7e2f3" font-family="sans-serif">→</text>
<text x="655" y="558" font-size="23" fill="#d9baff" font-family="sans-serif">행동 판정</text>
<text x="839" y="558" font-size="23" fill="#d7e2f3" font-family="sans-serif">→</text>
<text x="891" y="558" font-size="23" fill="#ffe3a1" font-family="sans-serif">시청각 결과</text>
<text x="100" y="593" font-size="18" fill="#a9b9d4" font-family="sans-serif">직접 제작한 교육용 순환 모델 · 실제 영상의 장면 캡처가 아님</text>
</svg>