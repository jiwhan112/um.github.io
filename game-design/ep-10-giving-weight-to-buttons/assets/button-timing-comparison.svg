<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">가벼운 공격과 무거운 공격의 시간선 비교</title>
<desc id="desc">누름 피드백은 모두 즉시 보여주되 무거운 공격만 300밀리초 충전과 발동을 거치는 예시이다.</desc>
<rect width="1280" height="650" rx="22" fill="#101827"/>
<text x="50" y="66" fill="#f1f5f9" font-size="38" font-weight="700" font-family="sans-serif">가벼움과 무게감: ‘지연’의 종류부터 구별하자</text>
<text x="52" y="112" fill="#acbbd2" font-size="21" font-family="sans-serif">아래 시간은 교육용 가상 설정 · 영상에 나온 실제 프레임이나 수치가 아님</text>
<g font-family="sans-serif" font-size="22" fill="#ccd8e8">
<text x="286" y="164">0ms</text><text x="483" y="164">100ms</text><text x="686" y="164">200ms</text><text x="891" y="164">300ms</text><text x="1090" y="164">400ms</text></g>
<g stroke="#32435a" stroke-width="2"><path d="M301 185 V491 M502 185 V491 M704 185 V491 M906 185 V491 M1106 185 V491"/></g>
<text x="55" y="246" fill="#86e8cc" font-size="30" font-weight="700" font-family="sans-serif">경공격</text>
<text x="55" y="285" fill="#b4c1d3" font-size="20" font-family="sans-serif">짧게 누른 후 뗌</text>
<rect x="301" y="213" width="51" height="81" rx="10" fill="#14b8a6"/>
<rect x="352" y="213" width="174" height="81" rx="10" fill="#236c71"/>
<rect x="526" y="213" width="170" height="81" rx="10" fill="#284a5e"/>
<text x="315" y="260" fill="#062d2c" font-size="19" font-weight="700" font-family="sans-serif">접수</text>
<text x="371" y="260" fill="#e9fefa" font-size="21" font-family="sans-serif">빠른 발동</text>
<text x="548" y="260" fill="#e1f4ff" font-size="21" font-family="sans-serif">짧은 회복</text>
<text x="55" y="403" fill="#ffd38b" font-size="30" font-weight="700" font-family="sans-serif">강공격</text>
<text x="55" y="441" fill="#b4c1d3" font-size="20" font-family="sans-serif">길게 누른 후 뗌</text>
<rect x="301" y="368" width="51" height="82" rx="10" fill="#14b8a6"/>
<rect x="352" y="368" width="554" height="82" rx="10" fill="#b67835"/>
<rect x="906" y="368" width="67" height="82" rx="10" fill="#e8b35e"/>
<rect x="973" y="368" width="217" height="82" rx="10" fill="#66513d"/>
<text x="315" y="416" fill="#062d2c" font-size="19" font-weight="700" font-family="sans-serif">접수</text>
<text x="566" y="416" fill="#fff5e4" font-size="25" font-weight="700" font-family="sans-serif">충전·준비</text>
<text x="911" y="417" fill="#3a270a" font-size="18" font-weight="700" font-family="sans-serif">발사</text>
<text x="1020" y="417" fill="#f8e9d0" font-size="22" font-family="sans-serif">회복</text>
<path d="M906 352 V461" stroke="#f9d186" stroke-width="3" stroke-dasharray="6 5"/>
<text x="803" y="345" fill="#fff3cf" font-size="23" font-weight="700" font-family="sans-serif">300ms 충전 기준</text>
<rect x="52" y="514" width="1173" height="101" rx="18" fill="#26344a"/>
<text x="85" y="556" font-size="26" font-weight="700" fill="#a5ffe3" font-family="sans-serif">공통:</text>
<text x="175" y="556" font-size="24" fill="#ecf3fa" font-family="sans-serif">버튼 입력을 받았다는 표시는 바로 발생</text>
<text x="85" y="592" font-size="22" fill="#d0dcee" font-family="sans-serif">차이: 행동이 준비되고 실제 판정되는 시간 — 플레이어가 예측할 수 있어야 한다.</text>
</svg>