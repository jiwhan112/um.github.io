<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">후속작 만들기</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">후속작 만들기</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 보존할 경험</text><text x="85" y="292" font-size="25" fill="#dceaf6">이용자가 믿는 핵심 약속</text><text x="85" y="334" font-size="25" fill="#dceaf6">조작·피드백·규칙의 연속성</text><text x="85" y="376" font-size="25" fill="#dceaf6">파일 보존과 경험 보존은 다름</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 활용할 기반</text><text x="775" y="292" font-size="25" fill="#dceaf6">코드·도구·테스트·팀의 지식</text><text x="775" y="334" font-size="25" fill="#dceaf6">새 조건에서도 맞는지 확인</text><text x="775" y="376" font-size="25" fill="#dceaf6">예전 통과가 새 통과는 아님</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 바꿀 부분</text><text x="85" y="552" font-size="25" fill="#dceaf6">새 선택을 만드는 변화</text><text x="85" y="594" font-size="25" fill="#dceaf6">학습 비용과 기술 비용 기록</text><text x="85" y="636" font-size="25" fill="#dceaf6">전면 교체와 무조건 유지 사이</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 호환 계약</text><text x="775" y="552" font-size="25" fill="#dceaf6">저장·설정·식별자를 구분</text><text x="775" y="594" font-size="25" fill="#dceaf6">이전하지 않을 항목도 명시</text><text x="775" y="636" font-size="25" fill="#dceaf6">실패 시 원본을 보존</text><text x="60" y="790" font-size="26" fill="#e7d4a2">후속작의 장점은 기반을 활용하는 데 있다. 검증을 생략하는 데 있지 않다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">보존·개선·교체를 나누고, 각각의 판단 근거와 되돌릴 방법을 적는다.</text></g></svg>