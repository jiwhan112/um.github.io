<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>같은 목표, 다른 화면의 역할</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">같은 목표, 다른 화면의 역할</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">전체 지도</text><text x="72" y="203" font-size="23">A-B-D는 짧지만 다리 닫힘</text><text x="72" y="240" font-size="23">A-C-D는 길지만 통과 가능</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">세계 화면</text><text x="642" y="203" font-size="23">다리·숲·탑이 실제로 보임</text><text x="642" y="240" font-size="23">계획을 현장 단서로 확인</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">상태 원본</text><text x="72" y="443" font-size="23">목표 ID와 통과 조건 공유</text><text x="72" y="480" font-size="23">화면별 복제 상태 피하기</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">정보 공개</text><text x="642" y="443" font-size="23">닫힘과 미탐험을 구분</text><text x="642" y="480" font-size="23">발견의 즐거움도 설계</text><text x="50" y="665" fill="#b5c8df" font-size="23">지도 시간과 실제 시선 측정은 서로 다른 증거입니다.</text></g></svg>