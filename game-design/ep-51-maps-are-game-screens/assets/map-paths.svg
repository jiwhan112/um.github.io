<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>짧은 경로와 가능한 경로는 다르다</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">짧은 경로와 가능한 경로는 다르다</text><rect x="120" y="300" width="180" height="75" rx="12" fill="#20324a" stroke="#5798b8"/><text x="138" y="345" font-size="24" fill="#edf4ff">A 마을</text><rect x="470" y="160" width="180" height="75" rx="12" fill="#20324a" stroke="#5798b8"/><text x="488" y="205" font-size="24" fill="#edf4ff">B 다리</text><rect x="470" y="450" width="180" height="75" rx="12" fill="#20324a" stroke="#5798b8"/><text x="488" y="495" font-size="24" fill="#edf4ff">C 숲</text><rect x="850" y="300" width="180" height="75" rx="12" fill="#20324a" stroke="#5798b8"/><text x="868" y="345" font-size="24" fill="#edf4ff">D 탑</text><path d="M300 325 L470 200" stroke="#f4a587" stroke-width="5" fill="none"/><path d="M650 200 L850 325" stroke="#f4a587" stroke-width="5" fill="none"/><path d="M300 350 L470 490" stroke="#86ddbc" stroke-width="5" fill="none"/><path d="M650 490 L850 350" stroke="#86ddbc" stroke-width="5" fill="none"/><text x="380" y="120" font-size="24" fill="#f4a587">짧지만 현재 통과 불가</text><text x="360" y="580" font-size="24" fill="#86ddbc">길지만 통과 가능 · 조건을 거리와 분리</text></g></svg>