<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>한 공격의 시간과 판정을 맞춘다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">한 공격의 시간과 판정을 맞춘다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">tick 0·1: 예고</text><text x="72" y="203" font-size="23">Tell /명중 불가</text><text x="72" y="240" font-size="23">회피 단서를 전달</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">tick 2: 공격</text><text x="642" y="203" font-size="23">Active /접촉 시 1회</text><text x="642" y="240" font-size="23">중복 조회는 거부</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">tick 3·4: 회복</text><text x="72" y="443" font-size="23">Recovery /명중 불가</text><text x="72" y="480" font-size="23">다음 선택의 틈</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">다음 주기</text><text x="642" y="443" font-size="23">tick 0 / 명중 기록 초기화</text><text x="642" y="480" font-size="23">표현과 모델 동기화</text><text x="50" y="665" fill="#b5c8df" font-size="23">2·1·2 tick은 교육용 수치이며 난도 권장값이 아닙니다.</text></g></svg>