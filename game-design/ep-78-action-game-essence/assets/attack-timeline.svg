<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>공격 한 주기의 유효 시간 창</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">공격 한 주기의 유효 시간 창</text><rect x="60" y="200" width="180" height="110" rx="12" fill="#406b85" stroke="#5798b8"/><text x="78" y="245" font-size="24" fill="#edf4ff">0: 예고</text><rect x="255" y="200" width="180" height="110" rx="12" fill="#406b85" stroke="#5798b8"/><text x="273" y="245" font-size="24" fill="#edf4ff">1: 예고</text><rect x="450" y="200" width="180" height="110" rx="12" fill="#9b5948" stroke="#5798b8"/><text x="468" y="245" font-size="24" fill="#edf4ff">2: 공격</text><rect x="645" y="200" width="180" height="110" rx="12" fill="#356f62" stroke="#5798b8"/><text x="663" y="245" font-size="24" fill="#edf4ff">3: 회복</text><rect x="840" y="200" width="180" height="110" rx="12" fill="#356f62" stroke="#5798b8"/><text x="858" y="245" font-size="24" fill="#edf4ff">4: 회복</text><text x="60" y="390" font-size="27" fill="#edf4ff">명중 불가</text><text x="450" y="390" font-size="27" fill="#ffaf8c">1회 가능</text><text x="650" y="390" font-size="27" fill="#edf4ff">명중 불가</text><text x="60" y="480" font-size="27" fill="#edf4ff">0 → 1 → 2 → 3 → 4 → 0 (다음 주기)</text><text x="60" y="570" font-size="23" fill="#b5c8df">다음 주기에서 명중 기록 초기화 · 여러 대상 처리는 별도</text></g></svg>