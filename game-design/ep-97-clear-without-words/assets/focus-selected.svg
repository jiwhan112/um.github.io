<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>포커스와 적용된 선택은 다르다</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">포커스와 적용된 선택은 다르다</text><rect x="80" y="170" width="400" height="110" rx="12" fill="#20324a" stroke="#5798b8"/><text x="98" y="215" font-size="24" fill="#edf4ff">작은 글자  [현재 적용]</text><rect x="620" y="170" width="400" height="110" rx="12" fill="#20324a" stroke="#5798b8"/><text x="638" y="215" font-size="24" fill="#edf4ff">큰 글자  [포커스]</text><rect x="610" y="160" width="420" height="130" rx="16" fill="none" stroke="#86ddbc" stroke-width="5"/><text x="80" y="380" font-size="27" fill="#8dd7ff">체크: 이미 선택된 값</text><text x="620" y="380" font-size="27" fill="#86ddbc">테두리: 확정하면 바뀔 값</text><text x="80" y="490" font-size="25" fill="#edf4ff">확정 전에는 현재 적용값을 조용히 바꾸지 않는다.</text><text x="80" y="580" font-size="23" fill="#b5c8df">텍스트를 줄여도 상태의 의미는 구별 가능해야 합니다.</text><path d="M430 235 l10 10 l22 -25" fill="none" stroke="#8dd7ff" stroke-width="5"/></g></svg>