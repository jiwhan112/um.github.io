<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>메뉴는 여러 단서로 의미를 전한다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">메뉴는 여러 단서로 의미를 전한다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">형태·배치</text><text x="72" y="203" font-size="23">보관과 삭제를 구분</text><text x="72" y="240" font-size="23">작은 크기에서도 읽히는가</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">포커스</text><text x="642" y="203" font-size="23">지금 실행할 항목</text><text x="642" y="240" font-size="23">현재 적용값과 다름</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">선택</text><text x="72" y="443" font-size="23">현재 적용된 값</text><text x="72" y="480" font-size="23">체크·형태로 별도 표시</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">결과·복구</text><text x="642" y="443" font-size="23">무엇이 바뀌었는가</text><text x="642" y="480" font-size="23">실수 후 돌아갈 수 있는가</text><text x="50" y="665" fill="#b5c8df" font-size="23">아이콘만으로 이해된다고 가정하지 않고 과제로 검증합니다.</text></g></svg>