<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">같은 설명도 언제 어디에 보이느냐가 중요하다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">초점 이동</text><text x="60" y="195" font-size="22" fill="#e7edf8">현재 항목과 연결</text><text x="60" y="240" font-size="22" fill="#e7edf8">낡은 설명 제거</text><text x="60" y="285" font-size="22" fill="#e7edf8">장치별 탐색 지원</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">값 변경</text><text x="415" y="195" font-size="22" fill="#e7edf8">적용 시점 안내</text><text x="415" y="240" font-size="22" fill="#e7edf8">현재 값 확인</text><text x="415" y="285" font-size="22" fill="#e7edf8">확정·취소 구분</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">화면 이탈</text><text x="770" y="195" font-size="22" fill="#e7edf8">미저장 변경 처리</text><text x="770" y="240" font-size="22" fill="#e7edf8">되돌아올 위치</text><text x="770" y="285" font-size="22" fill="#e7edf8">설명 다시 찾기</text><text x="40" y="433" font-size="22" fill="#bdcce1">문구·값·초점이 서로 다른 항목을 가리키지 않게 한다.</text></g></svg>