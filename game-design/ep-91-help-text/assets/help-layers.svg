<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">도움말은 이름을 반복하지 않고 결과를 설명한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">항목 이름</text><text x="60" y="195" font-size="22" fill="#e7edf8">무엇을 바꾸는가</text><text x="60" y="240" font-size="22" fill="#e7edf8">짧고 구분 가능</text><text x="60" y="285" font-size="22" fill="#e7edf8">전문용어 최소화</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">핵심 설명</text><text x="415" y="195" font-size="22" fill="#e7edf8">켜면 무엇이 달라짐</text><text x="415" y="240" font-size="22" fill="#e7edf8">범위와 조건</text><text x="415" y="285" font-size="22" fill="#e7edf8">중요한 부작용</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">추가 정보</text><text x="770" y="195" font-size="22" fill="#e7edf8">자세히 보기</text><text x="770" y="240" font-size="22" fill="#e7edf8">미리보기·예시</text><text x="770" y="285" font-size="22" fill="#e7edf8">기본값·복원</text><text x="40" y="433" font-size="22" fill="#bdcce1">짧음은 중요한 결과를 생략하는 것이 아니라 우선순위를 정하는 것이다.</text></g></svg>