<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">같은 반응도 사실과 일치해야 한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">허용된 행동</text><text x="60" y="195" font-size="22" fill="#e7edf8">즉시 눌림 피드백</text><text x="60" y="240" font-size="22" fill="#e7edf8">결과 전에는 대기</text><text x="60" y="285" font-size="22" fill="#e7edf8">확정 후 상태 변경</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">불가능한 행동</text><text x="415" y="195" font-size="22" fill="#e7edf8">왜 안 되는지 설명</text><text x="415" y="240" font-size="22" fill="#e7edf8">조건 해결 안내</text><text x="415" y="285" font-size="22" fill="#e7edf8">가짜 성공은 금지</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">늦은 응답</text><text x="770" y="195" font-size="22" fill="#e7edf8">요청 ID 확인</text><text x="770" y="240" font-size="22" fill="#e7edf8">오래된 결과 분리</text><text x="770" y="285" font-size="22" fill="#e7edf8">현재 화면을 보호</text><text x="40" y="433" font-size="22" fill="#bdcce1">애니메이션으로 기술적 성공을 가장하지 않는다.</text></g></svg>