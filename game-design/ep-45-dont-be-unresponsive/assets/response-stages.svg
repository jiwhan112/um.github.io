<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">버튼에 응답하는 것과 작업이 성공하는 것은 다르다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">입력 수신</text><text x="60" y="195" font-size="22" fill="#e7edf8">누름을 인식</text><text x="60" y="240" font-size="22" fill="#e7edf8">현재 상태 검사</text><text x="60" y="285" font-size="22" fill="#e7edf8">중복 입력 분류</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">처리 중</text><text x="415" y="195" font-size="22" fill="#e7edf8">진행 상태 표시</text><text x="415" y="240" font-size="22" fill="#e7edf8">취소 가능성 안내</text><text x="415" y="285" font-size="22" fill="#e7edf8">추측 성공은 금지</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">결과</text><text x="770" y="195" font-size="22" fill="#e7edf8">성공을 반영</text><text x="770" y="240" font-size="22" fill="#e7edf8">실패 이유 설명</text><text x="770" y="285" font-size="22" fill="#e7edf8">다음 행동 제공</text><text x="40" y="433" font-size="22" fill="#bdcce1">입력이 무시된 것인지 처리 중인지 사용자가 구분할 수 있어야 한다.</text></g></svg>