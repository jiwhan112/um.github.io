<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#0e1b30"/><g font-family="Noto Sans CJK KR,sans-serif"><text x="60" y="78" fill="#f1f7ff" font-size="38" font-weight="700">교육용 비행 모델 — 한 틱의 상태 변화</text><text x="60" y="128" fill="#b7cbde" font-size="26">실제 물리가 아닌 정수 기반 비교 실험이다. 높이 0~12, 에너지 0~6.</text><rect x="60" y="185" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="230" fill="#9ce3cc" font-size="29">추진 가능한 틱</text><text x="440" y="230" fill="#fff" font-size="27">에너지 2 사용 → 높이 +3 → 중력 -1</text><text x="440" y="275" fill="#d0e0ed" font-size="25">상한 미도달 시 높이 +2, 에너지 -2</text><rect x="60" y="335" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="380" fill="#9ce3cc" font-size="29">활공·에너지 부족</text><text x="440" y="380" fill="#fff" font-size="27">에너지 +1(최대6) → 중력 -1</text><text x="440" y="425" fill="#d0e0ed" font-size="25">에너지가 부족한 추진 입력도 이 규칙을 따른다.</text><rect x="60" y="485" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="530" fill="#9ce3cc" font-size="29">높이 제한</text><text x="440" y="530" fill="#fff" font-size="27">계산 후 0~12 범위로 제한</text><text x="440" y="575" fill="#d0e0ed" font-size="25">0은 착지 상태다. 생명 차감·게임오버는 없다.</text><rect x="60" y="635" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="680" fill="#9ce3cc" font-size="29">검증의 경계</text><text x="440" y="680" fill="#fff" font-size="27">모든 16틱 입력열 65,536개 검사</text><text x="440" y="725" fill="#d0e0ed" font-size="25">수치 불변식 검증이며 비행의 재미를 증명하지 않는다.</text></g></svg>