<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#0e1b30"/><g font-family="Noto Sans CJK KR,sans-serif"><text x="60" y="78" fill="#f1f7ff" font-size="38" font-weight="700">추락을 늘리기보다 대비를 설계한다</text><text x="60" y="128" fill="#b7cbde" font-size="26">비행의 즐거움을 강조하는 비용은 읽을 수 있고 회복 가능해야 한다.</text><rect x="60" y="185" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="230" fill="#9ce3cc" font-size="29">목표 경험</text><text x="440" y="230" fill="#fff" font-size="27">상승·회복을 내가 선택했다는 감각</text><text x="440" y="275" fill="#d0e0ed" font-size="25">벌을 주는 횟수 자체는 성공 지표가 아니다.</text><rect x="60" y="335" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="380" fill="#9ce3cc" font-size="29">읽을 수 있는 전조</text><text x="440" y="380" fill="#fff" font-size="27">높이·에너지·하강 속도를 이해한다</text><text x="440" y="425" fill="#d0e0ed" font-size="25">소리나 화면 흔들림 하나에만 의존하지 않는다.</text><rect x="60" y="485" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="530" fill="#9ce3cc" font-size="29">대응할 선택</text><text x="440" y="530" fill="#fff" font-size="27">언제 추진하고 언제 활공할지 고른다</text><text x="440" y="575" fill="#d0e0ed" font-size="25">실패 직전에도 유효한 대응 수단이 남아 있는가?</text><rect x="60" y="635" width="1320" height="125" rx="18" fill="#23465c"/><text x="85" y="680" fill="#9ce3cc" font-size="29">다시 시도할 여유</text><text x="440" y="680" fill="#fff" font-size="27">착지·체크포인트·보조 모드로 복귀한다</text><text x="440" y="725" fill="#d0e0ed" font-size="25">반복 실패가 학습인지 피로인지 따로 관찰한다.</text></g></svg>