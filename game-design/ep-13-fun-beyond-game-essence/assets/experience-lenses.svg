<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">실패 위험을 없애도 무엇이 남는가?</title><desc id="desc">가상의 방 꾸미기 게임을 두 개의 관찰 렌즈로 읽는다. 우열이나 장르 등급이 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" fill="#f1f7ff" font-size="38" font-weight="700">실패 위험을 없애도 무엇이 남는가?</text><text x="60" y="130" fill="#b7cbde" font-size="26">가상의 방 꾸미기 게임을 두 개의 관찰 렌즈로 읽는다. 우열이나 장르 등급이 아니다.</text><rect x="60" y="195" width="630" height="230" rx="18" fill="#23465c" stroke="#7098b0" stroke-width="2"/><text x="85" y="247" fill="#fff" font-size="31" font-weight="700">렌즈 A · 위험과 보상</text><text x="85" y="300" fill="#e3eff8" font-size="26">제한된 예산으로 무엇을 살까?</text><text x="85" y="343" fill="#e3eff8" font-size="26">실패 비용 · 선택의 긴장 · 공략</text><text x="85" y="386" fill="#e3eff8" font-size="26">예산 제약을 없애면 긴장이 줄어든다.</text><rect x="750" y="195" width="630" height="230" rx="18" fill="#22524f" stroke="#7098b0" stroke-width="2"/><text x="775" y="247" fill="#fff" font-size="31" font-weight="700">렌즈 B · 표현하는 즐거움</text><text x="775" y="300" fill="#e3eff8" font-size="26">내가 원하는 색과 배치를 만들기</text><text x="775" y="343" fill="#e3eff8" font-size="26">조작 반응 · 조합 · 결과 감상</text><text x="775" y="386" fill="#e3eff8" font-size="26">실패가 없어도 창작 경험은 남는다.</text><rect x="60" y="475" width="630" height="230" rx="18" fill="#453c58" stroke="#7098b0" stroke-width="2"/><text x="85" y="527" fill="#fff" font-size="31" font-weight="700">혼동하지 말 것</text><text x="85" y="580" fill="#e3eff8" font-size="26">점수가 없으면 재미도 없다? → 아니다</text><text x="85" y="623" fill="#e3eff8" font-size="26">반대로 실패만 없애면 재미있다? → 아니다</text><text x="85" y="666" fill="#e3eff8" font-size="26">반응과 표현 가능성은 여전히 설계해야 한다.</text><rect x="750" y="475" width="630" height="230" rx="18" fill="#4c4931" stroke="#7098b0" stroke-width="2"/><text x="775" y="527" fill="#fff" font-size="31" font-weight="700">기획 판단</text><text x="775" y="580" fill="#e3eff8" font-size="26">먼저 약속할 경험을 정한다.</text><text x="775" y="623" fill="#e3eff8" font-size="26">그 경험에 필요한 제약만 선택한다.</text><text x="775" y="666" fill="#e3eff8" font-size="26">측정 지표도 경험에 맞춰 고른다.</text><text x="60" y="790" fill="#e7d4a2" font-size="28">그림의 예산·방 꾸미기 사례는 교재의 독창적 예시다.</text><text x="60" y="833" fill="#e7d4a2" font-size="28">위험·보상과 표현·서사·감각의 재미는 한 작품 안에서도 함께 존재할 수 있다.</text></g></svg>