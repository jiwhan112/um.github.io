<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">같은 편집 모델, 다른 규칙 모드</title><desc id="desc">무료 창작과 3회 예산 제한을 비교한다. 경쟁 게임 보안이나 영속 저장 구현이 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" fill="#f1f7ff" font-size="38" font-weight="700">같은 편집 모델, 다른 규칙 모드</text><text x="60" y="130" fill="#b7cbde" font-size="26">무료 창작과 3회 예산 제한을 비교한다. 경쟁 게임 보안이나 영속 저장 구현이 아니다.</text><rect x="60" y="195" width="400" height="230" rx="18" fill="#23465c" stroke="#7098b0" stroke-width="2"/><text x="85" y="247" fill="#fff" font-size="31" font-weight="700">입력 명령</text><text x="85" y="300" fill="#e3eff8" font-size="26">Paint(칸, 색상) / Undo</text><text x="85" y="343" fill="#e3eff8" font-size="26">범위 오류는 거절</text><text x="85" y="386" fill="#e3eff8" font-size="26">같은 값은 NoChange</text><rect x="520" y="195" width="400" height="230" rx="18" fill="#22524f" stroke="#7098b0" stroke-width="2"/><text x="545" y="247" fill="#fff" font-size="31" font-weight="700">규칙 + 상태</text><text x="545" y="300" fill="#e3eff8" font-size="26">Free / Budget 모드</text><text x="545" y="343" fill="#e3eff8" font-size="26">검증 → 이전 상태 저장</text><text x="545" y="386" fill="#e3eff8" font-size="26">배치 확정 → 예산 차감</text><rect x="980" y="195" width="400" height="230" rx="18" fill="#453c58" stroke="#7098b0" stroke-width="2"/><text x="1005" y="247" fill="#fff" font-size="31" font-weight="700">읽기 전용 표현</text><text x="1005" y="300" fill="#e3eff8" font-size="26">확정 배치와 결과 코드</text><text x="1005" y="343" fill="#e3eff8" font-size="26">DX9는 결과를 그린다.</text><text x="1005" y="386" fill="#e3eff8" font-size="26">렌더링 횟수 ≠ 편집 횟수</text><rect x="60" y="475" width="630" height="230" rx="18" fill="#23465c" stroke="#7098b0" stroke-width="2"/><text x="85" y="527" fill="#fff" font-size="31" font-weight="700">성공한 편집만 이력에 추가</text><text x="85" y="580" fill="#e3eff8" font-size="26">실패·무변경은 비용과 이력 유지</text><text x="85" y="623" fill="#e3eff8" font-size="26">Undo는 배치와 예산을 함께 복원</text><text x="85" y="666" fill="#e3eff8" font-size="26">모델은 재미 점수를 계산하지 않는다.</text><rect x="750" y="475" width="630" height="230" rx="18" fill="#4c4931" stroke="#7098b0" stroke-width="2"/><text x="775" y="527" fill="#fff" font-size="31" font-weight="700">관찰과 안전 경계</text><text x="775" y="580" fill="#e3eff8" font-size="26">플레이테스트는 별도 수행</text><text x="775" y="623" fill="#e3eff8" font-size="26">실패 없는 모드도 사용성 검증 필요</text><text x="775" y="666" fill="#e3eff8" font-size="26">저장·네트워크·GPU는 별도 과제</text><text x="60" y="790" fill="#e7d4a2" font-size="28">순서: 명령 입력 → 규칙 검사 → 상태 변경 → 피드백 → 다음 의도</text><text x="60" y="833" fill="#e7d4a2" font-size="28">화면 효과 실패가 게임 상태나 비용을 한 번 더 변경하게 만들지 않는다.</text></g></svg>