<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">점수 없이도 이어지는 표현의 루프</title><desc id="desc">직접 만든 가상 프로토타입. 각 단계의 사용성은 관찰할 수 있지만 재미를 단일 숫자로 증명하지는 못한다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" fill="#f1f7ff" font-size="38" font-weight="700">점수 없이도 이어지는 표현의 루프</text><text x="60" y="130" fill="#b7cbde" font-size="26">직접 만든 가상 프로토타입. 각 단계의 사용성은 관찰할 수 있지만 재미를 단일 숫자로 증명하지는 못한다.</text><rect x="60" y="195" width="400" height="230" rx="18" fill="#23465c" stroke="#7098b0" stroke-width="2"/><text x="85" y="247" fill="#fff" font-size="31" font-weight="700">① 의도</text><text x="85" y="300" fill="#e3eff8" font-size="26">파란 벽 옆에 노란 블록</text><text x="85" y="343" fill="#e3eff8" font-size="26">내가 만들고 싶은 모습</text><text x="85" y="386" fill="#e3eff8" font-size="26">색상·위치 선택</text><rect x="520" y="195" width="400" height="230" rx="18" fill="#22524f" stroke="#7098b0" stroke-width="2"/><text x="545" y="247" fill="#fff" font-size="31" font-weight="700">② 조작 → 즉시 반응</text><text x="545" y="300" fill="#e3eff8" font-size="26">입력 접수와 미리보기</text><text x="545" y="343" fill="#e3eff8" font-size="26">확정 상태는 규칙에서 변경</text><text x="545" y="386" fill="#e3eff8" font-size="26">오류와 무변경을 구분</text><rect x="980" y="195" width="400" height="230" rx="18" fill="#453c58" stroke="#7098b0" stroke-width="2"/><text x="1005" y="247" fill="#fff" font-size="31" font-weight="700">③ 결과 감상</text><text x="1005" y="300" fill="#e3eff8" font-size="26">배치한 전체 모습을 보기</text><text x="1005" y="343" fill="#e3eff8" font-size="26">UI를 잠시 숨겨 감상</text><text x="1005" y="386" fill="#e3eff8" font-size="26">내 의도와 비교하기</text><rect x="290" y="475" width="860" height="230" rx="18" fill="#4c4931" stroke="#7098b0" stroke-width="2"/><text x="315" y="527" fill="#fff" font-size="31" font-weight="700">④ 다시 시도 → ① 의도로 돌아가기</text><text x="315" y="580" fill="#e3eff8" font-size="26">Undo가 상태와 비용을 함께 복원한다.</text><text x="315" y="623" fill="#e3eff8" font-size="26">원하지 않은 결과를 낮은 비용으로 수정한다.</text><text x="315" y="666" fill="#e3eff8" font-size="26">외부 보상 없이도 조합과 수정 자체가 다음 행동을 만든다.</text><text x="60" y="790" fill="#e7d4a2" font-size="28">관찰: 원하는 배치를 만들었는가? 수정은 쉬웠는가? 왜 다시 놓았는가?</text><text x="60" y="833" fill="#e7d4a2" font-size="28">주의: 반복 클릭 수나 체류 시간만으로 창작 만족을 판정하지 않는다.</text></g></svg>