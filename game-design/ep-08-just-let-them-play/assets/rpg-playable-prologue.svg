<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-label="한국어 게임 기획 학습 도식"><rect width="1440" height="800" fill="#0c1526"/>
<text x="64" y="73" font-size="44" font-family="sans-serif" font-weight="bold" fill="#f4f8ff">RPG 서사를 살리면서 먼저 플레이하게 하는 흐름</text>
<text x="64" y="116" font-size="24" font-family="sans-serif" fill="#b9cbe3">가상 프로토타입 · 실제 작품의 스크린샷이나 영상 순서가 아님</text>
<g font-family="sans-serif">
<rect x="64" y="172" width="285" height="224" rx="20" fill="#26385c" stroke="#6393d9" stroke-width="3"/>
<rect x="408" y="172" width="285" height="224" rx="20" fill="#204c56" stroke="#47bfae" stroke-width="3"/>
<rect x="752" y="172" width="285" height="224" rx="20" fill="#303f67" stroke="#80a3f0" stroke-width="3"/>
<rect x="1096" y="172" width="285" height="224" rx="20" fill="#53405f" stroke="#cb97d9" stroke-width="3"/>
<text x="88" y="226" font-size="29" fill="#f3f7ff" font-weight="bold">① 짧은 상황 제시</text>
<text x="88" y="282" font-size="25" fill="#d8e5f8">지금 무엇을</text><text x="88" y="317" font-size="25" fill="#d8e5f8">해야 하는지 알림</text>
<text x="432" y="226" font-size="29" fill="#f3f7ff" font-weight="bold">② 전투 직접 조작</text>
<text x="432" y="282" font-size="25" fill="#d8e5f8">임시 캐릭터로</text><text x="432" y="317" font-size="25" fill="#d8e5f8">핵심 재미 체험</text>
<text x="776" y="226" font-size="29" fill="#f3f7ff" font-weight="bold">③ 상황형 힌트</text>
<text x="776" y="282" font-size="25" fill="#d8e5f8">행동은 계속</text><text x="776" y="317" font-size="25" fill="#d8e5f8">설명은 짧게</text>
<text x="1120" y="226" font-size="29" fill="#f3f7ff" font-weight="bold">④ 본편에 연결</text>
<text x="1120" y="282" font-size="25" fill="#d8e5f8">세계관·성장·서사</text><text x="1120" y="317" font-size="25" fill="#d8e5f8">차례로 확장</text>
<g stroke="#a7d3ff" stroke-width="7" stroke-linecap="round">
<path d="M355 284 H399"/><path d="M392 272 L405 284 L392 296" fill="none"/>
<path d="M699 284 H743"/><path d="M736 272 L749 284 L736 296" fill="none"/>
<path d="M1043 284 H1087"/><path d="M1080 272 L1093 284 L1080 296" fill="none"/>
</g>
<rect x="64" y="448" width="1317" height="252" rx="20" fill="#1a2940" stroke="#425d7d" stroke-width="2"/>
<text x="95" y="507" font-size="34" font-weight="bold" fill="#f4f8ff">설계할 때 반드시 확인할 비용</text>
<circle cx="112" cy="557" r="9" fill="#ffc37d"/><text x="145" y="566" font-size="27" fill="#dce7fa">나중에 사용할 능력을 먼저 보여 주면 본편 초반이 싱거워지지 않는가?</text>
<circle cx="112" cy="610" r="9" fill="#ffc37d"/><text x="145" y="619" font-size="27" fill="#dce7fa">강한 인물로 시작해도 초심자가 입력과 전투를 이해할 수 있는가?</text>
<circle cx="112" cy="663" r="9" fill="#ffc37d"/><text x="145" y="672" font-size="27" fill="#dce7fa">서사 몰입을 돕는 장면은 보존하면서 스포일러를 피하는가?</text>
</g>
</svg>
