<text x="78" y="419" font-size="31" font-family="sans-serif" font-weight="bold" fill="#a5f0d6">B  플레이 경험 우선</text>
<text x="78" y="246" font-size="23" font-family="sans-serif" fill="#d6e1f3">참여는 늦게 시작</text>
<text x="78" y="468" font-size="23" font-family="sans-serif" fill="#d6e1f3">행동과 피드백을 먼저</text>
<rect x="400" y="190" width="495" height="94" rx="13" fill="#985058"/>
<rect x="895" y="190" width="262" height="94" fill="#b68945"/>
<rect x="1157" y="190" width="185" height="94" rx="13" fill="#227b86"/>
