<text x="1026" y="245" font-size="26" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#111b30">조작 안내</text>
<text x="1248" y="245" font-size="26" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#fff">첫 행동</text>
<rect x="400" y="412" width="66" height="94" rx="13" fill="#985058"/>
<rect x="466" y="412" width="370" height="94" fill="#177f7c"/>
