<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 710" role="img" aria-label="한국어 게임 기획 학습 도식"><rect width="1440" height="710" fill="#0c1526"/>
<text x="70" y="68" font-family="sans-serif" font-size="43" font-weight="bold" fill="#f5f8ff">초반 3분: 첫 입력과 첫 재미는 다르다</text>
<text x="70" y="111" font-family="sans-serif" font-size="24" fill="#bdcbe2">아래는 비교를 위한 가상 예시이며 실제 게임의 측정값이 아니다.</text>
<rect x="52" y="143" width="1336" height="209" rx="22" fill="#18243b" stroke="#31435e" stroke-width="2"/>
<rect x="52" y="365" width="1336" height="209" rx="22" fill="#18243b" stroke="#31435e" stroke-width="2"/>
