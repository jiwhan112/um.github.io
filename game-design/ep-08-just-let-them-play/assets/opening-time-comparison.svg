<text x="650" y="465" font-size="27" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#fff">이동·회피</text>
<text x="970" y="465" font-size="26" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#fff">행동 중 힌트</text>
<text x="1223" y="465" font-size="26" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#fff">선택·보상</text>
