<text x="400" y="315">0초</text><text x="714" y="315">60초</text><text x="1028" y="315">120초</text><text x="1342" y="315">180초</text>
<text x="400" y="537">0초</text><text x="714" y="537">60초</text><text x="1028" y="537">120초</text><text x="1342" y="537">180초</text>
</g>
<rect x="63" y="598" width="1314" height="78" rx="15" fill="#263958"/>
<text x="89" y="647" font-family="sans-serif" font-size="27" fill="#fff">점검 질문: 첫 번째 유효 입력 뒤 플레이어가 스스로 만든 변화는 무엇인가?</text>
</svg>
