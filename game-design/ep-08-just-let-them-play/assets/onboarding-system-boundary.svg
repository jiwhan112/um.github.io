<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-label="한국어 게임 기획 학습 도식"><rect width="1440" height="850" fill="#0c1526"/>
<text x="65" y="75" font-family="sans-serif" font-size="44" font-weight="bold" fill="#f4f8ff">게임 규칙과 첫 플레이 UX의 소유권 분리</text>
<text x="65" y="117" font-family="sans-serif" font-size="24" fill="#bdcde5">C++11 로직 · DX9 렌더링 · 비차단 힌트 · 사용자 계측</text>
<g font-family="sans-serif">
<rect x="65" y="158" width="1310" height="115" rx="21" fill="#273959" stroke="#709ce1" stroke-width="2"/>
<text x="92" y="211" font-size="32" font-weight="bold" fill="#f1f7ff">입력 수집</text>
<text x="92" y="249" font-size="26" fill="#d9e5f8">키보드 · 패드 · 접근성 매핑 → 이동 / 공격 / 조사 명령</text>
<path d="M720 276 V318" stroke="#a9cfff" stroke-width="7" stroke-linecap="round"/>
<path d="M706 306 L720 322 L734 306" fill="none" stroke="#a9cfff" stroke-width="6"/>
<rect x="65" y="332" width="1310" height="133" rx="21" fill="#20535a" stroke="#56c8b9" stroke-width="3"/>
<text x="92" y="390" font-size="34" font-weight="bold" fill="#f1f7ff">게임 규칙과 도입 상태 머신 (진실의 원천)</text>
<text x="92" y="431" font-size="26" fill="#d8f0f0">Loading → PlayableIntro → MainGame · 상태 변경 · 힌트 조건 1회 확정</text>
<path d="M414 466 V513" stroke="#a9cfff" stroke-width="7" stroke-linecap="round"/>
