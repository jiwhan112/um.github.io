<rect x="65" y="534" width="630" height="174" rx="21" fill="#2b416c" stroke="#7da6e8" stroke-width="3"/>
<rect x="745" y="534" width="630" height="174" rx="21" fill="#4c3b67" stroke="#ae8dce" stroke-width="3"/>
<text x="92" y="586" font-size="31" font-weight="bold" fill="#f3f7ff">표시 이벤트 → DX9 UI</text>
<text x="92" y="633" font-size="26" fill="#e1e9f7">타격 연출 · 힌트 · 출구 열림</text>
<text x="92" y="673" font-size="25" fill="#e1e9f7">화면은 결과를 보여 줄 뿐</text>
<text x="772" y="586" font-size="31" font-weight="bold" fill="#f3f7ff">계측 이벤트 → 분석</text>
<text x="772" y="633" font-size="26" fill="#e1e9f7">첫 유효 조작 시각 · 첫 결과</text>
<text x="772" y="673" font-size="25" fill="#e1e9f7">개인정보 최소 수집</text>
<rect x="65" y="741" width="1310" height="79" rx="16" fill="#203147"/>
<text x="92" y="793" font-size="27" fill="#f7e0a4">원칙: UI 닫힘 콜백이나 렌더 프레임이 게임 보상·전투 판정을 실행하지 않는다.</text>
