<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">강한 CPU와 납득할 수 있는 CPU는 다른 목표다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">관찰</text><text x="60" y="195" font-size="22" fill="#e7edf8">볼 수 있는 정보</text><text x="60" y="240" font-size="22" fill="#e7edf8">기억한 이전 상태</text><text x="60" y="285" font-size="22" fill="#e7edf8">알 수 없는 정보</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">판단</text><text x="415" y="195" font-size="22" fill="#e7edf8">목표와 우선순위</text><text x="415" y="240" font-size="22" fill="#e7edf8">반응 시점</text><text x="415" y="285" font-size="22" fill="#e7edf8">행동 가능한 조건</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">실행과 표현</text><text x="770" y="195" font-size="22" fill="#e7edf8">실제 입력 제약</text><text x="770" y="240" font-size="22" fill="#e7edf8">예고·실수·복구</text><text x="770" y="285" font-size="22" fill="#e7edf8">결과를 읽을 단서</text><text x="40" y="433" font-size="22" fill="#bdcce1">내부 정답을 바로 실행하기보다 게임이 약속한 정보와 제약을 정의한다.</text></g></svg>