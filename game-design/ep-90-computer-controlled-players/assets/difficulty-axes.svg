<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">난도는 한 개의 반응 속도만으로 정하지 않는다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">정보 범위</text><text x="60" y="195" font-size="22" fill="#e7edf8">보이는 대상만</text><text x="60" y="240" font-size="22" fill="#e7edf8">기억의 지속시간</text><text x="60" y="285" font-size="22" fill="#e7edf8">숨은 정보 사용 여부</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">판단 품질</text><text x="415" y="195" font-size="22" fill="#e7edf8">목표 선택</text><text x="415" y="240" font-size="22" fill="#e7edf8">자원 사용 시점</text><text x="415" y="285" font-size="22" fill="#e7edf8">패턴 예측 정도</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">실행 제약</text><text x="770" y="195" font-size="22" fill="#e7edf8">반응 지연</text><text x="770" y="240" font-size="22" fill="#e7edf8">입력 빈도</text><text x="770" y="285" font-size="22" fill="#e7edf8">행동 실패 가능성</text><text x="40" y="433" font-size="22" fill="#bdcce1">각 축을 바꾸면 이용자가 경험하는 상대의 성격도 달라진다.</text></g></svg>