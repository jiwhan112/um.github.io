<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">가상 재시도 한 번: 기다리는 시간을 분해한다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">기존 흐름</text><text x="70" y="173" fill="#e2e8f0" font-size="21">패배 연출 2s + 결과 3s + 확인 1s + 로딩 4s = 10s</text><text x="70" y="202" fill="#cbd5e1" font-size="19">20회 재시도라면 200초. 수치는 자체 제작 비교 사례다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">개선 후보</text><text x="70" y="308" fill="#e2e8f0" font-size="21">첫 연출 이후 생략 0s + 즉시 재시도 1s + 로딩 2s = 3s</text><text x="70" y="337" fill="#cbd5e1" font-size="19">20회라면 60초. 필요 안내와 데이터 정합성은 유지한다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">확인할 비용</text><text x="70" y="443" fill="#e2e8f0" font-size="21">오입력·결과 놓침·재시작 중 상태 잔존</text><text x="70" y="472" fill="#cbd5e1" font-size="19">빨라졌다는 이유로 안전한 저장과 중요한 정보까지 없애지 않는다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">줄일 대상은 의도 없는 마찰이다. 의미 있는 쉼까지 없애지 않는다.</text></g></svg>