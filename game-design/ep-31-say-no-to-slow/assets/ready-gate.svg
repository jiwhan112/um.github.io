<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">애니메이션이 끝났다고 준비가 끝난 것은 아니다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">요청</text><text x="70" y="173" fill="#e2e8f0" font-size="21">플레이어가 재시도를 누름</text><text x="70" y="202" fill="#cbd5e1" font-size="19">중복 입력을 막고 요청 식별자를 만든다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">준비</text><text x="70" y="308" fill="#e2e8f0" font-size="21">필수 데이터·상태 초기화·입력 소유권 확인</text><text x="70" y="337" fill="#cbd5e1" font-size="19">독립된 준비만 병렬화한다. 실패하면 복구 경로를 표시한다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">입장</text><text x="70" y="443" fill="#e2e8f0" font-size="21">준비 완료 후 조작을 넘김</text><text x="70" y="472" fill="#cbd5e1" font-size="19">새 장면에서 오래된 입력과 타이머가 살아 있지 않은지 확인한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">보이는 대기와 실제 작업을 구분해야 시간을 안전하게 줄일 수 있다.</text></g></svg>