<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="568" viewBox="0 0 1080 568" role="img" aria-label="고정 시뮬레이션과 변동 렌더링을 분리한 게임 루프"><title>고정 시뮬레이션과 변동 렌더링을 분리한 게임 루프</title><desc>실제 시간 수집, 입력 수집, 누적 시간, 일정한 틱 실행, 이전과 현재 상태 보간, Draw와 Present로 연결되는 단계</desc><rect width="1080" height="568" rx="20" fill="#0d1524"/><text x="43" y="60" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="34" fill="#f4f4ff" font-weight="700">게임 루프의 시계는 하나가 아니다</text><text x="44" y="101" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" fill="#98afd0" font-weight="500">60Hz 게임 규칙을 유지하고, 화면은 각자의 속도로 출력</text><rect x="42" y="154" width="210" height="120" rx="13" fill="#1b3049" stroke="#3e6d95" stroke-width="1.5"/><text x="59" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" fill="#f5f8ff" font-weight="700">실제 경과 시간</text><text x="59" y="239" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#b0c7d8" font-weight="500">steady_clock</text><rect x="312" y="154" width="210" height="120" rx="13" fill="#1b3049" stroke="#3e6d95" stroke-width="1.5"/><text x="329" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" fill="#f5f8ff" font-weight="700">입력 수집</text><text x="329" y="239" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#b0c7d8" font-weight="500">버튼·축 버퍼</text><rect x="582" y="154" width="210" height="120" rx="13" fill="#1d3b43" stroke="#448a91" stroke-width="1.5"/><text x="599" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" fill="#f5f8ff" font-weight="700">누적 시간</text><text x="599" y="239" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#b0c7d8" font-weight="500">accumulator</text><rect x="852" y="154" width="187" height="120" rx="13" fill="#23464b" stroke="#5dc2b5" stroke-width="1.5"/><text x="869" y="200" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" fill="#f5f8ff" font-weight="700">고정 틱 0~N회</text><text x="869" y="239" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#b0c7d8" font-weight="500">dt = 1/60초</text><path d="M 256 214 L 297 214" stroke="#79a5c9" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 297 214 l -10 -7 v 14 z" fill="#79a5c9"/><path d="M 526 214 L 567 214" stroke="#79a5c9" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 567 214 l -10 -7 v 14 z" fill="#79a5c9"/><path d="M 796 214 L 837 214" stroke="#79a5c9" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 837 214 l -10 -7 v 14 z" fill="#79a5c9"/><path d="M 945 274 L 945 320" stroke="#62cebd" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 945 320 l -7 -11 h 14 z" fill="#62cebd"/><rect x="42" y="349" width="350" height="120" rx="13" fill="#25344d" stroke="#5172a1" stroke-width="1.5"/><text x="63" y="394" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" fill="#e3efff" font-weight="700">이전 상태  ·  현재 상태</text><text x="64" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#b0c4e2" font-weight="500">previous / current</text><rect x="454" y="349" width="258" height="120" rx="13" fill="#2e2949" stroke="#8775c2" stroke-width="1.5"/><text x="475" y="394" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" fill="#f1e5ff" font-weight="700">렌더 위치 보간</text><text x="475" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" fill="#cebfeb" font-weight="500">alpha = 남은 시간 / dt</text><rect x="775" y="349" width="264" height="120" rx="13" fill="#322744" stroke="#916cbd" stroke-width="1.5"/><text x="800" y="394" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#f7eeff" font-weight="700">Draw + Present</text><text x="802" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#cbbfe5" font-weight="500">렌더 주기는 독립</text><path d="M 395 408 L 446 408" stroke="#a89bdf" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 446 408 l -10 -7 v 14 z" fill="#a89bdf"/><path d="M 715 408 L 766 408" stroke="#a89bdf" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 766 408 l -10 -7 v 14 z" fill="#a89bdf"/><path d="M 945 320 L 200 320" stroke="#5a8c96" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M 200 320 L 200 341" stroke="#5a8c96" stroke-width="2" fill="none" stroke-linecap="round"/><text x="45" y="529" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#a2b3d0" font-weight="500">입력 이벤트는 별도 버퍼에 저장 · 과부하 시 틱 드롭은 명시적으로 계측</text></svg>