<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">독창적 연습 모델 — 달리기와 충전의 교환</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">달리기</text><text x="60" y="195" font-size="22" fill="#e7edf8">매 틱 거리 +2</text><text x="60" y="240" font-size="22" fill="#e7edf8">누르면 충전 시작</text><text x="60" y="285" font-size="22" fill="#e7edf8">충전 틱은 정지</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">충전</text><text x="415" y="195" font-size="22" fill="#e7edf8">최대 3틱 축적</text><text x="415" y="240" font-size="22" fill="#e7edf8">누르는 동안 대기</text><text x="415" y="285" font-size="22" fill="#e7edf8">놓으면 방출</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">방출</text><text x="770" y="195" font-size="22" fill="#e7edf8">저장량 × 3 이동</text><text x="770" y="240" font-size="22" fill="#e7edf8">즉시 달리기로 복귀</text><text x="770" y="285" font-size="22" fill="#e7edf8">연속 반복은 재측정</text><text x="40" y="433" font-size="22" fill="#bdcce1">이 숫자는 원작 사양이 아니라 선택의 비용을 비교하기 위한 가정이다.</text></g></svg>