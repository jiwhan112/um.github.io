<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">조작을 줄이는 대신 상태와 피드백을 설계한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">적은 입력</text><text x="60" y="195" font-size="22" fill="#e7edf8">이동 방향 선택</text><text x="60" y="240" font-size="22" fill="#e7edf8">한 버튼 누르기</text><text x="60" y="285" font-size="22" fill="#e7edf8">버튼 놓기</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">상태 해석</text><text x="415" y="195" font-size="22" fill="#e7edf8">달리는 중인가?</text><text x="415" y="240" font-size="22" fill="#e7edf8">정지·충전 중인가?</text><text x="415" y="285" font-size="22" fill="#e7edf8">전환 가능한가?</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">피드백</text><text x="770" y="195" font-size="22" fill="#e7edf8">현재 상태 표시</text><text x="770" y="240" font-size="22" fill="#e7edf8">전환 이유 전달</text><text x="770" y="285" font-size="22" fill="#e7edf8">실수에서 복구</text><text x="40" y="433" font-size="22" fill="#bdcce1">버튼 수가 적어도 상태를 읽기 어렵다면 쉬운 조작이 아니다.</text></g></svg>