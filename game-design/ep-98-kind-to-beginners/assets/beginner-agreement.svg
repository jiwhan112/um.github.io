<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>도움보다 먼저 함께할 목적을 맞춘다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">도움보다 먼저 함께할 목적을 맞춘다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">체험</text><text x="72" y="203" font-size="23">기본 조작과 재미</text><text x="72" y="240" font-size="23">실수해도 다시 시도</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">협력</text><text x="642" y="203" font-size="23">실제 기여하는 역할</text><text x="642" y="240" font-size="23">교대와 확장 기회</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">연습</text><text x="72" y="443" font-size="23">배울 기술을 합의</text><text x="72" y="480" font-size="23">도움의 범위 조절</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">정식 경쟁</text><text x="642" y="443" font-size="23">정해진 규칙 준수</text><text x="642" y="480" font-size="23">몰래 조건 변경하지 않기</text><text x="50" y="665" fill="#b5c8df" font-size="23">참가자의 선택을 존중하고 도움을 강요하지 않습니다.</text></g></svg>