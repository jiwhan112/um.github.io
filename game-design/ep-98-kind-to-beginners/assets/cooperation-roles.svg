<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>협력 역할은 실제 결과에 연결한다</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">협력 역할은 실제 결과에 연결한다</text><rect x="70" y="150" width="400" height="100" rx="12" fill="#20324a" stroke="#5798b8"/><text x="88" y="195" font-size="24" fill="#edf4ff">역할 A: 발판 유지</text><rect x="630" y="150" width="400" height="100" rx="12" fill="#20324a" stroke="#5798b8"/><text x="648" y="195" font-size="24" fill="#edf4ff">역할 B: 물체 이동</text><path d="M270 250 L470 375" stroke="#86ddbc" stroke-width="4" fill="none"/><path d="M830 250 L630 375" stroke="#86ddbc" stroke-width="4" fill="none"/><rect x="360" y="375" width="380" height="100" rx="12" fill="#20324a" stroke="#5798b8"/><text x="378" y="420" font-size="24" fill="#edf4ff">둘 다 충족 → 문 열림</text><text x="70" y="540" font-size="27" fill="#86ddbc">다음 시도: 역할 교대 또는 새 행동 선택</text><text x="70" y="600" font-size="23" fill="#b5c8df">가상 협동 퍼즐 · 형식적 참여가 아닌 실제 기여</text></g></svg>