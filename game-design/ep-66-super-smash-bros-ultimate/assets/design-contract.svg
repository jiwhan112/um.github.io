<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">《Super Smash Bros. Ultimate》</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">《Super Smash Bros. Ultimate》</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 중심 약속</text><text x="85" y="292" font-size="25" fill="#dceaf6">누구에게 어떤 경험을 주는가?</text><text x="85" y="334" font-size="25" fill="#dceaf6">기능 목록보다 행동으로 표현</text><text x="85" y="376" font-size="25" fill="#dceaf6">좋은 기능도 충돌하면 재검토</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 콘텐츠 축</text><text x="775" y="292" font-size="25" fill="#dceaf6">캐릭터·장소·규칙을 구분</text><text x="775" y="334" font-size="25" fill="#dceaf6">수량과 상호작용 비용을 계산</text><text x="775" y="376" font-size="25" fill="#dceaf6">전체 조합과 표본을 혼동하지 않음</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 공통 계약</text><text x="85" y="552" font-size="25" fill="#dceaf6">참가·시작·종료의 흐름 통일</text><text x="85" y="594" font-size="25" fill="#dceaf6">예외는 이유와 범위를 명시</text><text x="85" y="636" font-size="25" fill="#dceaf6">기본값도 컨셉의 일부</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 검증 증거</text><text x="775" y="552" font-size="25" fill="#dceaf6">처음 합류하는 과정을 관찰</text><text x="775" y="594" font-size="25" fill="#dceaf6">고위험 조합을 우선 확인</text><text x="775" y="636" font-size="25" fill="#dceaf6">미검증 영역을 남김없이 표시</text><text x="60" y="790" font-size="26" fill="#e7d4a2">많은 기능을 약속하기 전에, 반드시 지켜야 할 경험을 한 문장으로 쓴다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">작품의 명성이나 규모를 내부 설계 의도의 증거로 대신하지 않는다.</text></g></svg>