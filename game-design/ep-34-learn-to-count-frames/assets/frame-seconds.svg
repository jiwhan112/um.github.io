<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">같은 6프레임도 기준 속도에 따라 다르다</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">30fps 기준</text><text x="70" y="173" fill="#e2e8f0" font-size="21">6 ÷ 30 = 0.2초 = 200ms</text><text x="70" y="202" fill="#cbd5e1" font-size="19">프레임 번호만 전달하면 어떤 시간인지 알 수 없다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">60fps 기준</text><text x="70" y="308" fill="#e2e8f0" font-size="21">6 ÷ 60 = 0.1초 = 100ms</text><text x="70" y="337" fill="#cbd5e1" font-size="19">시간을 프레임으로 말할 때 기준 fps를 함께 적는다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">120fps 기준</text><text x="70" y="443" fill="#e2e8f0" font-size="21">6 ÷ 120 = 0.05초 = 50ms</text><text x="70" y="472" fill="#cbd5e1" font-size="19">렌더 프레임과 고정 시뮬레이션 틱은 같은 개념이 아닐 수 있다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">눈으로 센 근삿값과 기록으로 측정한 값은 구분한다.</text></g></svg>