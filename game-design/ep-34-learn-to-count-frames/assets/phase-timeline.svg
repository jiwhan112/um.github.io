<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><rect width="1100" height="420" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="45" y="60" fill="#f8fafc" font-size="30" font-weight="bold">0부터 세는 동작: 경계 틱은 다음 상태에 속한다</text><rect x="60" y="140" width="282" height="100" fill="#0e7490"/><text x="70" y="198" fill="#fff" font-size="23">준비 6틱</text><rect x="342" y="140" width="141" height="100" fill="#b45309"/><text x="352" y="198" fill="#fff" font-size="23">활성 3틱</text><rect x="483" y="140" width="517" height="100" fill="#6d28d9"/><text x="493" y="198" fill="#fff" font-size="23">회복 11틱</text><line x1="60" y1="125" x2="60" y2="260" stroke="#f8fafc"/><text x="52" y="292" fill="#e2e8f0" font-size="23">0</text><line x1="342" y1="125" x2="342" y2="260" stroke="#f8fafc"/><text x="334" y="292" fill="#e2e8f0" font-size="23">6</text><line x1="483" y1="125" x2="483" y2="260" stroke="#f8fafc"/><text x="475" y="292" fill="#e2e8f0" font-size="23">9</text><line x1="1000" y1="125" x2="1000" y2="260" stroke="#f8fafc"/><text x="992" y="292" fill="#e2e8f0" font-size="23">20</text><text x="60" y="350" fill="#a5b4fc" font-size="23">[0,6) → [6,9) → [9,20) → 20부터 다음 행동 가능</text><text x="60" y="390" fill="#cbd5e1" font-size="20">고정 60Hz 학습 모델. 실제 게임 화면 측정 결과가 아니다.</text></g></svg>