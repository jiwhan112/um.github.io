<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>재시도5초를 구간별로 다시 생각하기</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">재시도5초를 구간별로 다시 생각하기</text><text x="45" y="150" font-size="26" fill="#edf4ff">원안</text><rect x="170" y="180" width="75.0" height="70" fill="#587b97"/><text x="178" y="225" font-size="20" fill="#edf4ff">0.5초</text><rect x="245.0" y="180" width="300" height="70" fill="#406d87"/><text x="253.0" y="225" font-size="20" fill="#edf4ff">2초</text><rect x="545.0" y="180" width="150" height="70" fill="#367a72"/><text x="553.0" y="225" font-size="20" fill="#edf4ff">1초</text><rect x="695.0" y="180" width="225.0" height="70" fill="#766196"/><text x="703.0" y="225" font-size="20" fill="#edf4ff">1.5초</text><text x="940.0" y="225" font-size="25" fill="#8dd7ff">5.0초</text><text x="45" y="340" font-size="26" fill="#edf4ff">개선 가정</text><rect x="170" y="370" width="75.0" height="70" fill="#587b97"/><text x="178" y="415" font-size="20" fill="#edf4ff">0.5초</text><rect x="245.0" y="370" width="75.0" height="70" fill="#406d87"/><text x="253.0" y="415" font-size="20" fill="#edf4ff">0.5초</text><rect x="320.0" y="370" width="150" height="70" fill="#367a72"/><text x="328.0" y="415" font-size="20" fill="#edf4ff">1초</text><rect x="470.0" y="370" width="75.0" height="70" fill="#766196"/><text x="478.0" y="415" font-size="20" fill="#edf4ff">0.5초</text><text x="565.0" y="415" font-size="25" fill="#8dd7ff">2.5초</text><text x="45" y="520" font-size="25" fill="#edf4ff">순서: 실패 인식 → 확인 → 복원 → 조작 잠금</text><text x="45" y="580" font-size="23" fill="#b5c8df">상태 복원을 생략하지 않고 불필요한 대기를 줄이는 계산 예시</text></g></svg>