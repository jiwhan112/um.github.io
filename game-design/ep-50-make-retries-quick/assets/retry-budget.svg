<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>재시도 대기의 목적을 분해한다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">재시도 대기의 목적을 분해한다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">실패 피드백</text><text x="72" y="203" font-size="23">무슨 일이 일어났는가</text><text x="72" y="240" font-size="23">짧아도 읽힐 시간 필요</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">메뉴·확인</text><text x="642" y="203" font-size="23">같은 결정을 두 번 묻는가</text><text x="642" y="240" font-size="23">재시도·설정·종료 선택</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">상태 복원</text><text x="72" y="443" font-size="23">시도 상태만 초기화</text><text x="72" y="480" font-size="23">장기 기록과 구분</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">조작 복귀</text><text x="642" y="443" font-size="23">준비 후 불필요한 잠금 제거</text><text x="642" y="480" font-size="23">이전 입력의 유입 방지</text><text x="50" y="665" fill="#b5c8df" font-size="23">가상 시간표와 실제 측정값을 혼동하지 않습니다.</text></g></svg>