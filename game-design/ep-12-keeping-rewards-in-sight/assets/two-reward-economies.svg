<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">두 가지 보상의 리듬</title><desc id="desc">이스 경험치 성장의 작은 누적 보상과 파자나두 화폐를 모아서 장비를 사는 희소 보상을 수치 없이 추상화한 원본이 아닌 개념도</desc><rect width="1440" height="820" fill="#0e1b30"/><g font-family="'Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><text x="58" y="88" fill="#fff" font-size="44" font-weight="700">보상의 리듬: 빠른 성장과 어렵게 얻는 성취</text><text x="58" y="134" fill="#b5ccde" font-size="27" font-weight="500">2022-10-10 동시대 보도에서 사례 확인 · 그림은 자체 추상화</text><rect x="54" y="179" width="646" height="539" rx="18" fill="#1a3655" stroke="#5584b4" stroke-width="3"/><rect x="742" y="179" width="646" height="539" rx="18" fill="#393747" stroke="#bf9c68" stroke-width="3"/><text x="91" y="251" fill="#edfbff" font-size="39" font-weight="700">《Ys I》 · 경험치</text><text x="780" y="251" fill="#fff3df" font-size="36" font-weight="700">《파자나두》 · 돈과 장비</text><text x="91" y="320" fill="#afd9f2" font-size="31" font-weight="500">전투 → 경험치 → 성장</text><text x="780" y="320" fill="#f2dcb6" font-size="31" font-weight="500">탐색 → 화폐 축적 → 장비</text><rect x="90" y="363" width="556" height="153" rx="18" fill="#1f5270" stroke="#507b9d" stroke-width="3"/><rect x="780" y="363" width="556" height="153" rx="18" fill="#5c4a45" stroke="#d0a271" stroke-width="3"/><text x="117" y="408" fill="#edf6ff" font-size="30" font-weight="500">작은 보상들이 자주 쌓임</text><text x="117" y="469" fill="#66e1cc" font-size="39" font-weight="700">● ─ ● ─ ● ─ ● → ◆</text><text x="803" y="408" fill="#edf6ff" font-size="30" font-weight="500">모으기 어려우나 구매가 큼</text><text x="803" y="469" fill="#ffd890" font-size="38" font-weight="700">● ─ ─ ● ─ ─ ● → ◆</text><text x="96" y="584" fill="#c5eafd" font-size="29" font-weight="500">보여 줄 것: 다음 성장까지의 거리</text><text x="96" y="649" fill="#b6d4e4" font-size="27" font-weight="500">위험: 숫자만 커지고 체감은 없음</text><text x="788" y="584" fill="#fbe1b7" font-size="29" font-weight="500">보여 줄 것: 장비 가격과 남은 돈</text><text x="788" y="649" fill="#ebcaa7" font-size="27" font-weight="500">위험: 목표가 너무 멀면 포기</text><text x="60" y="779" fill="#dbe7f6" font-size="29" font-weight="500">※ 원작의 UI·실제 수급률·장비 가격·레벨업 시간은 재현하지 않았다.</text></g></svg>
