<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">보상 목표가 보이는가</title><desc id="desc">같은 +10코인 보상이라도 단독 숫자와 100코인 장비 목표를 연결한 UI는 다르게 이해될 수 있음을 나타낸 가상 비교도</desc><rect width="1440" height="820" fill="#0e1b30"/><g font-family="'Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><text x="58" y="86" fill="#fff" font-size="45" font-weight="700">보상을 받는 것 vs 보상까지의 거리를 아는 것</text><text x="58" y="132" fill="#b8cadf" font-size="27" font-weight="500">가상의 액션 RPG · 수치는 실제 게임 데이터가 아닌 학습 예시</text><rect x="55" y="177" width="642" height="531" rx="18" fill="#162f4d" stroke="#507b9d" stroke-width="3"/><rect x="743" y="177" width="642" height="531" rx="18" fill="#154149" stroke="#4aac9a" stroke-width="3"/><text x="90" y="245" fill="#fff" font-size="38" font-weight="700">A · +10코인만 표시</text><text x="786" y="245" fill="#fff" font-size="38" font-weight="700">B · 목표와 진행을 표시</text><rect x="96" y="302" width="562" height="154" rx="18" fill="#29405e" stroke="#507b9d" stroke-width="3"/><text x="155" y="375" fill="#f1d47d" font-size="37" font-weight="700">적 처치!   +10코인</text><text x="155" y="424" fill="#bbcede" font-size="27" font-weight="500">다음 목표가 보이지 않음</text><rect x="789" y="291" width="554" height="324" rx="18" fill="#20525b" stroke="#6bcbb5" stroke-width="3"/><text x="833" y="349" fill="#f7ffff" font-size="36" font-weight="700">다음 목표: 강화 검</text><text x="833" y="406" fill="#b6eadd" font-size="31" font-weight="500">가격 100코인</text><rect x="833" y="438" width="438" height="30" rx="18" fill="#3d6372" stroke="#507b9d" stroke-width="3"/><rect x="833" y="438" width="350" height="30" rx="18" fill="#54d3bc" stroke="#54d3bc" stroke-width="3"/><text x="833" y="532" fill="#ffe6a0" font-size="32" font-weight="700">80 / 100코인   ·   남은 20</text><text x="104" y="533" fill="#d6e1f0" font-size="31" font-weight="500">보상 → 숫자 증가</text><text x="104" y="588" fill="#bfd2de" font-size="27" font-weight="500">목표 연결은 플레이어 몫</text><text x="783" y="671" fill="#80e7d5" font-size="30" font-weight="500">보상 → 진척 인지 → 기대</text><text x="56" y="769" fill="#e4ecf7" font-size="31" font-weight="700">기획 질문: 얼마나 주는가?  그리고 플레이어가 무엇에 가까워졌다고 느끼는가?</text></g></svg>
