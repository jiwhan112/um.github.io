<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">보상 모델과 렌더링 분리</title><desc id="desc">전투 이벤트가 보상 모델에서 중복 ID와 값 검증을 거쳐 확정된 잔액만 DirectX9 HUD에 전달되고 저장과 테스트는 별도로 수행되는 개념도</desc><rect width="1440" height="820" fill="#0e1b30"/><g font-family="'Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><text x="58" y="84" fill="#fff" font-size="41" font-weight="700">보상은 규칙 계층에서 확정하고, DX9는 읽어서 그린다</text><text x="58" y="128" fill="#b4cede" font-size="27" font-weight="500">C++11 모델·상점·상태 표시의 책임 분리 — 교육용 아키텍처</text><rect x="53" y="205" width="352" height="165" rx="18" fill="#1c3a58" stroke="#507b9d" stroke-width="3"/><rect x="543" y="205" width="359" height="165" rx="18" fill="#1e5658" stroke="#67c7bb" stroke-width="3"/><rect x="1042" y="205" width="350" height="165" rx="18" fill="#3b3e60" stroke="#9c99cf" stroke-width="3"/><text x="83" y="269" fill="#eff8ff" font-size="32" font-weight="700">전투 / 퀘스트 이벤트</text><text x="83" y="328" fill="#edf6ff" font-size="28" font-weight="500">고유 ID · 지급량</text><text x="580" y="269" fill="#eefffb" font-size="35" font-weight="700">RewardModel</text><text x="580" y="328" fill="#edf6ff" font-size="28" font-weight="500">중복 검증 · 금액 확정</text><text x="1074" y="269" fill="#f9f7ff" font-size="33" font-weight="700">목표 표시 · DX9</text><text x="1074" y="328" fill="#edf6ff" font-size="28" font-weight="500">확정 값만 렌더링</text><path d="M411 286 L533 286" fill="none" stroke="#55d1bd" stroke-width="5" stroke-linecap="round"/><path d="M909 286 L1031 286" fill="none" stroke="#55d1bd" stroke-width="5" stroke-linecap="round"/><rect x="544" y="441" width="359" height="155" rx="18" fill="#2b4354" stroke="#507b9d" stroke-width="3"/><rect x="53" y="441" width="352" height="155" rx="18" fill="#4a454a" stroke="#b5a186" stroke-width="3"/><rect x="1042" y="441" width="350" height="155" rx="18" fill="#2b4756" stroke="#507b9d" stroke-width="3"/><text x="576" y="510" fill="#e9f5ff" font-size="29" font-weight="700">보상·구매 이벤트 로그</text><text x="576" y="558" fill="#edf6ff" font-size="26" font-weight="500">ID · 승인 결과 · 잔액</text><text x="85" y="507" fill="#fce7ce" font-size="29" font-weight="700">영속 저장 / 서버 권위</text><text x="85" y="557" fill="#edf6ff" font-size="27" font-weight="500">별도 트랜잭션 계약</text><text x="1073" y="509" fill="#e7f7ff" font-size="31" font-weight="700">테스트·지표 수집</text><text x="1073" y="558" fill="#edf6ff" font-size="26" font-weight="500">경계값 · 중복 · 이탈</text><path d="M720 372 L720 431" fill="none" stroke="#f1cd86" stroke-width="5" stroke-linecap="round"/><path d="M530 525 L411 525" fill="none" stroke="#e5c58d" stroke-width="5" stroke-linecap="round"/><path d="M914 525 L1030 525" fill="none" stroke="#92bfdc" stroke-width="5" stroke-linecap="round"/><text x="62" y="671" fill="#f1e1a3" font-size="31" font-weight="700">순서 ① 판정 → ② 보상 검증 → ③ 상태 확정 → ④ 화면 업데이트</text><text x="62" y="748" fill="#bce4de" font-size="29" font-weight="500">렌더링 횟수나 효과 재생 실패가 보상의 지급 횟수를 바꿔서는 안 된다.</text></g></svg>
