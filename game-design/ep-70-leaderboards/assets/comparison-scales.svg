<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">누구와 비교하느냐에 따라 순위의 의미가 달라진다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">전체 순위</text><text x="60" y="195" font-size="22" fill="#e7edf8">큰 목표를 보여 줌</text><text x="60" y="240" font-size="22" fill="#e7edf8">상위권과 격차 큼</text><text x="60" y="285" font-size="22" fill="#e7edf8">참여 규모 영향</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">가까운 비교</text><text x="415" y="195" font-size="22" fill="#e7edf8">친구·비슷한 기록</text><text x="415" y="240" font-size="22" fill="#e7edf8">다음 목표가 구체적</text><text x="415" y="285" font-size="22" fill="#e7edf8">비교 집단을 명시</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">자기 기록</text><text x="770" y="195" font-size="22" fill="#e7edf8">이전보다 개선</text><text x="770" y="240" font-size="22" fill="#e7edf8">타인 공개 불필요</text><text x="770" y="285" font-size="22" fill="#e7edf8">성장 이유를 설명</text><text x="40" y="433" font-size="22" fill="#bdcce1">한 종류의 순위표가 모든 이용자의 동기를 대신하지 않는다.</text></g></svg>