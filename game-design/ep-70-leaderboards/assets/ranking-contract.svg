<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">순위표는 표시 이전에 비교 규칙이 필요하다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">유효한 기록</text><text x="60" y="195" font-size="22" fill="#e7edf8">같은 모드·버전</text><text x="60" y="240" font-size="22" fill="#e7edf8">완주·검증 조건</text><text x="60" y="285" font-size="22" fill="#e7edf8">중복 제출 처리</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">정렬 규칙</text><text x="415" y="195" font-size="22" fill="#e7edf8">점수 방향</text><text x="415" y="240" font-size="22" fill="#e7edf8">동점 처리</text><text x="415" y="285" font-size="22" fill="#e7edf8">집계 기간</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">표시와 선택</text><text x="770" y="195" font-size="22" fill="#e7edf8">누구에게 공개하나</text><text x="770" y="240" font-size="22" fill="#e7edf8">갱신 시각 안내</text><text x="770" y="285" font-size="22" fill="#e7edf8">숨기기·개인 목표</text><text x="40" y="433" font-size="22" fill="#bdcce1">비교 기준이 다르면 같은 숫자를 나란히 놓아도 공정한 순위가 아니다.</text></g></svg>