<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">놀이를 하나의 점수로 설명하지 않기</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">선택과 도전</text><text x="60" y="195" font-size="22" fill="#e7edf8">목표를 정하기</text><text x="60" y="240" font-size="22" fill="#e7edf8">위험을 받아들이기</text><text x="60" y="285" font-size="22" fill="#e7edf8">능력을 시험하기</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">탐색과 표현</text><text x="415" y="195" font-size="22" fill="#e7edf8">가능성을 시험하기</text><text x="415" y="240" font-size="22" fill="#e7edf8">자기 방식 만들기</text><text x="415" y="285" font-size="22" fill="#e7edf8">결과를 감상하기</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">관계와 의미</text><text x="770" y="195" font-size="22" fill="#e7edf8">함께 규칙 만들기</text><text x="770" y="240" font-size="22" fill="#e7edf8">역할을 경험하기</text><text x="770" y="285" font-size="22" fill="#e7edf8">이야기를 공유하기</text><text x="40" y="433" font-size="22" fill="#bdcce1">이 세 묶음은 교재의 독창적인 관찰 틀이며 원본 도서의 분류가 아니다.</text></g></svg>