<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">가상 블록 놀이 — 같은 행동, 다른 이유</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">같은 관찰</text><text x="60" y="195" font-size="22" fill="#e7edf8">블록을 계속 옮김</text><text x="60" y="240" font-size="22" fill="#e7edf8">실패 뒤 다시 시도</text><text x="60" y="285" font-size="22" fill="#e7edf8">오래 머무름</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">다른 가설</text><text x="415" y="195" font-size="22" fill="#e7edf8">높이 기록에 도전</text><text x="415" y="240" font-size="22" fill="#e7edf8">색 조합을 실험</text><text x="415" y="285" font-size="22" fill="#e7edf8">친구와 역할 놀이</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">확인 질문</text><text x="770" y="195" font-size="22" fill="#e7edf8">무엇을 하려 했나</text><text x="770" y="240" font-size="22" fill="#e7edf8">무엇을 바꾸고 싶나</text><text x="770" y="285" font-size="22" fill="#e7edf8">다음엔 왜 다시 하나</text><text x="40" y="433" font-size="22" fill="#bdcce1">행동 로그만으로 놀이의 의미를 확정하지 않는다.</text></g></svg>