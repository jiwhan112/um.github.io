<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>어느 구간에서 무엇을 보장하는가</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">어느 구간에서 무엇을 보장하는가</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">독립 추첨</text><text x="72" y="203" font-size="23">AAA도 가능: 1/27</text><text x="72" y="240" font-size="23">이전 결과와 독립이라는 가정</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">가방 내부</text><text x="642" y="203" font-size="23">A·B·C 각 한 번</text><text x="642" y="240" font-size="23">순서만 섞기</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">가방 경계</text><text x="72" y="443" font-size="23">ABC | CAB → CC 가능</text><text x="72" y="480" font-size="23">연속 중복 금지 아님</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">검증</text><text x="642" y="443" font-size="23">구성 불변식과 통계 품질 구분</text><text x="642" y="480" font-size="23">시드 재현 범위 명시</text><text x="50" y="665" fill="#b5c8df" font-size="23">실제 플레이어 체감이나 보안 추첨을 검증한 모델이 아닙니다.</text></g></svg>