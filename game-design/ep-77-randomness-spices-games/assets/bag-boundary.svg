<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>가방 안의 보장과 가방 경계의 반례</title><rect width="1100" height="650" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="31" fill="#edf4ff">가방 안의 보장과 가방 경계의 반례</text><rect x="100" y="210" width="110" height="100" rx="12" fill="#20324a" stroke="#5798b8"/><text x="118" y="255" font-size="24" fill="#edf4ff">A</text><rect x="240" y="210" width="110" height="100" rx="12" fill="#20324a" stroke="#5798b8"/><text x="258" y="255" font-size="24" fill="#edf4ff">B</text><rect x="380" y="210" width="110" height="100" rx="12" fill="#73594c" stroke="#5798b8"/><text x="398" y="255" font-size="24" fill="#edf4ff">C</text><rect x="600" y="210" width="110" height="100" rx="12" fill="#73594c" stroke="#5798b8"/><text x="618" y="255" font-size="24" fill="#edf4ff">C</text><rect x="740" y="210" width="110" height="100" rx="12" fill="#20324a" stroke="#5798b8"/><text x="758" y="255" font-size="24" fill="#edf4ff">A</text><rect x="880" y="210" width="110" height="100" rx="12" fill="#20324a" stroke="#5798b8"/><text x="898" y="255" font-size="24" fill="#edf4ff">B</text><text x="140" y="170" font-size="27" fill="#edf4ff">첫 가방</text><text x="670" y="170" font-size="27" fill="#edf4ff">다음 가방</text><path d="M540 180 V350" stroke="#8dd7ff" stroke-width="4" stroke-dasharray="8 8"/><text x="300" y="410" font-size="27" fill="#ffaf8c">ABC | CAB → 경계에서 C가 두 번 연속</text><text x="90" y="510" font-size="25" fill="#edf4ff">각 가방에는 A·B·C가 정확히 한 번씩 있습니다.</text><text x="90" y="580" font-size="23" fill="#b5c8df">연속 중복 금지와 가방 구성 보장은 다른 규칙입니다.</text></g></svg>