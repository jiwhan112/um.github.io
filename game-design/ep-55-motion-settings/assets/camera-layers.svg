<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">카메라 효과를 분리하면 선택권을 제공하기 쉽다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">기본 시점</text><text x="60" y="195" font-size="22" fill="#e7edf8">플레이어 입력</text><text x="60" y="240" font-size="22" fill="#e7edf8">목표 추적</text><text x="60" y="285" font-size="22" fill="#e7edf8">월드 경계</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">추가 효과</text><text x="415" y="195" font-size="22" fill="#e7edf8">걷기 흔들림</text><text x="415" y="240" font-size="22" fill="#e7edf8">피격 화면 진동</text><text x="415" y="285" font-size="22" fill="#e7edf8">자동 시선 전환</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">사용자 선택</text><text x="770" y="195" font-size="22" fill="#e7edf8">효과별 끄기·강도</text><text x="770" y="240" font-size="22" fill="#e7edf8">민감도 조정</text><text x="770" y="285" font-size="22" fill="#e7edf8">저장·복원·미리보기</text><text x="40" y="433" font-size="22" fill="#bdcce1">설정은 치료 보장이 아니라 이용자가 경험을 조정하는 수단이다.</text></g></svg>