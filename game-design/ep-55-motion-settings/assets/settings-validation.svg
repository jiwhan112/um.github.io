<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><rect width="1100" height="480" rx="20" fill="#101c30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="60" font-size="29" fill="#ffffff">설정이 실제로 모든 장면에 적용되는지 확인한다</text><rect x="40" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#63d9d0" stroke-width="2"/><text x="60" y="143" font-size="25" fill="#63d9d0">변경</text><text x="60" y="195" font-size="22" fill="#e7edf8">현재 값 안내</text><text x="60" y="240" font-size="22" fill="#e7edf8">효과 즉시 확인</text><text x="60" y="285" font-size="22" fill="#e7edf8">취소·초기화 구분</text><path d="M 358 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="395" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#91b6ff" stroke-width="2"/><text x="415" y="143" font-size="25" fill="#91b6ff">장면 전환</text><text x="415" y="195" font-size="22" fill="#e7edf8">전투·탐험·메뉴</text><text x="415" y="240" font-size="22" fill="#e7edf8">부활·재접속</text><text x="415" y="285" font-size="22" fill="#e7edf8">특수 연출 점검</text><path d="M 713 240 h 28 l -9 -7 m 9 7 l -9 7" stroke="#91b6ff" stroke-width="3" fill="none"/><rect x="750" y="100" width="310" height="280" rx="16" fill="#1b2b43" stroke="#efc879" stroke-width="2"/><text x="770" y="143" font-size="25" fill="#efc879">재사용</text><text x="770" y="195" font-size="22" fill="#e7edf8">계정·기기 범위</text><text x="770" y="240" font-size="22" fill="#e7edf8">오래된 저장값 처리</text><text x="770" y="285" font-size="22" fill="#e7edf8">기본값 강제 덮기 금지</text><text x="40" y="433" font-size="22" fill="#bdcce1">슬라이더를 만들었다는 사실과 효과가 꺼졌다는 검증을 구분한다.</text></g></svg>