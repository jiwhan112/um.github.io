<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">작은 과제를 완성하는 범위 사다리</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">필수: 한 가지 경험</text><text x="70" y="173" fill="#e2e8f0" font-size="21">작은 전투 공간에서 공격 예고를 보고 피하기</text><text x="70" y="202" fill="#cbd5e1" font-size="19">이동·예고·판정·결과 표시를 끝까지 연결한다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">검증: 한 가지 질문</text><text x="70" y="308" fill="#e2e8f0" font-size="21">예고 길이를 바꾸면 피할 수 있는 이유를 이해하는가?</text><text x="70" y="337" fill="#cbd5e1" font-size="19">관찰 방법과 기록 양식을 먼저 만든다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">보류: 완성을 방해하는 확장</text><text x="70" y="443" fill="#e2e8f0" font-size="21">장비 파밍·온라인 매칭·장편 스토리·상점</text><text x="70" y="472" fill="#cbd5e1" font-size="19">핵심 질문이 확인되기 전에는 추가하지 않는다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">완료 = 실행 가능 + 설명 가능 + 검증 한계 공개</text></g></svg>