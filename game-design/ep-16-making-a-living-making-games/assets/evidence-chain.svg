<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="625" viewBox="0 0 1100 625"><rect width="1100" height="625" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="50" y="65" fill="#f8fafc" font-size="30" font-weight="bold">“만들 수 있다”를 검토 가능한 증거로 바꾸기</text><rect x="45" y="105" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="140" fill="#67e8f9" font-size="23" font-weight="bold">문제와 역할</text><text x="70" y="173" fill="#e2e8f0" font-size="21">플레이어가 겪는 문제 한 가지 + 내가 맡은 책임</text><text x="70" y="202" fill="#cbd5e1" font-size="19">팀 전체 결과를 내 단독 성과처럼 적지 않는다.</text><rect x="45" y="240" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="275" fill="#67e8f9" font-size="23" font-weight="bold">결정과 구현</text><text x="70" y="308" fill="#e2e8f0" font-size="21">대안을 비교한 이유 + 재현 가능한 작은 구현</text><text x="70" y="337" fill="#cbd5e1" font-size="19">기능 수보다 왜 그렇게 만들었는지 드러낸다.</text><rect x="45" y="375" width="1010" height="110" rx="16" fill="#1e293b" stroke="#475569"/><text x="70" y="410" fill="#67e8f9" font-size="23" font-weight="bold">검증과 전달</text><text x="70" y="443" fill="#e2e8f0" font-size="21">테스트 조건 + 남은 한계 + 실행 방법</text><text x="70" y="472" fill="#cbd5e1" font-size="19">다른 사람이 실행하고 결과를 판단할 수 있어야 한다.</text><text x="50" y="590" fill="#a5b4fc" font-size="20">이 도식은 독립 포트폴리오 학습 모형이며 채용 결과를 보장하지 않는다.</text></g></svg>