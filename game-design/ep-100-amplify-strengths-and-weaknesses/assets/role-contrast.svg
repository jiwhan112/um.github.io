<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">평균에 맞추는 것과 재미있는 차이를 남기는 것</text><text x="65" y="110" fill="#e2e8f0" font-size="27">균일하게 깎기</text><text x="610" y="110" fill="#e2e8f0" font-size="27">역할과 대가를 선명하게</text><text x="65" y="180" fill="#e2e8f0" font-size="22">원거리 압박</text><rect x="65" y="200" width="200" height="30" rx="12" fill="#475569"/><text x="610" y="180" fill="#e2e8f0" font-size="22">원거리 압박</text><rect x="610" y="200" width="350" height="30" rx="12" fill="#0e7490"/><text x="65" y="300" fill="#e2e8f0" font-size="22">근거리 대응</text><rect x="65" y="320" width="200" height="30" rx="12" fill="#475569"/><text x="610" y="300" fill="#e2e8f0" font-size="22">근거리 대응</text><rect x="610" y="320" width="100" height="30" rx="12" fill="#0e7490"/><text x="65" y="420" fill="#e2e8f0" font-size="22">안전한 회복</text><rect x="65" y="440" width="200" height="30" rx="12" fill="#475569"/><text x="610" y="420" fill="#e2e8f0" font-size="22">안전한 회복</text><rect x="610" y="440" width="150" height="30" rx="12" fill="#0e7490"/><text x="65" y="550" fill="#a5b4fc" font-size="21">오른쪽은 가상의 역할 대비다. 막대는 설명용이며 실측 능력치가 아니다.</text><text x="65" y="590" fill="#e2e8f0" font-size="21">강점의 대응 수단과 약점의 회복 가능성을 함께 검토한다.</text></g></svg>