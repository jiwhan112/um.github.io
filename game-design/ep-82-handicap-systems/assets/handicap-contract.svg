<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">핸디캡은 수치뿐 아니라 공개·동의·기록의 계약</text><text x="70" y="110" fill="#e2e8f0" font-size="26">공통 경기 규칙</text><rect x="70" y="140" width="950" height="80" rx="12" fill="#334155"/><text x="100" y="190" fill="#e2e8f0" font-size="23">같은 코스 · 같은 목표 · 공개된 보조 설정</text><rect x="70" y="270" width="280" height="230" rx="12" fill="#164e63"/><text x="85" y="325" fill="#e2e8f0" font-size="24">시작 조건 조정</text><text x="85" y="390" fill="#e2e8f0" font-size="21">출발 위치·초기 자원</text><text x="85" y="445" fill="#e2e8f0" font-size="21">경기 전에 함께 확인</text><rect x="410" y="270" width="280" height="230" rx="12" fill="#3730a3"/><text x="425" y="325" fill="#e2e8f0" font-size="24">진행 중 보조</text><text x="425" y="390" fill="#e2e8f0" font-size="21">입력 여유·실수 복구</text><text x="425" y="445" fill="#e2e8f0" font-size="21">언제 적용되는지 표시</text><rect x="750" y="270" width="280" height="230" rx="12" fill="#065f46"/><text x="765" y="325" fill="#e2e8f0" font-size="24">결과와 동의</text><text x="765" y="390" fill="#e2e8f0" font-size="21">모드·설정 기록</text><text x="765" y="445" fill="#e2e8f0" font-size="21">다음 판에 변경 가능</text><text x="70" y="565" fill="#a5b4fc" font-size="21">목표는 실력을 숨기는 것이 아니라 함께 즐길 조건을 합의하는 것이다.</text></g></svg>