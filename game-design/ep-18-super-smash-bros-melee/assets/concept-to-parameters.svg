<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">컨셉은 원인, 빠른 전개는 결과</title><desc id="desc">가상 대전 게임의 기획 가설. 실제 Melee의 내부 사양이나 제작 문서가 아니다.</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">컨셉은 원인, 빠른 전개는 결과</text><text x="60" y="132" font-size="24" fill="#dceaf6">가상 대전 게임의 기획 가설. 실제 Melee의 내부 사양이나 제작 문서가 아니다.</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 경험 약속</text><text x="85" y="292" font-size="25" fill="#dceaf6">짧은 시간에 선택과 응답을 주고받기</text><text x="85" y="334" font-size="25" fill="#dceaf6">빠르다는 형용사만으로는 부족하다</text><text x="85" y="376" font-size="25" fill="#dceaf6">무엇을 기다리지 않게 할 것인가?</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 규칙으로 번역</text><text x="775" y="292" font-size="25" fill="#dceaf6">입력 접수 → 행동 전환 → 결과 확인</text><text x="775" y="334" font-size="25" fill="#dceaf6">대기·이동·판단 시간을 나누어 본다</text><text x="775" y="376" font-size="25" fill="#dceaf6">한 축만 바꾸어 가설을 검증한다</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 보호할 가치</text><text x="85" y="552" font-size="25" fill="#dceaf6">상대 행동을 읽을 시간은 남긴다</text><text x="85" y="594" font-size="25" fill="#dceaf6">새 플레이어도 다음 행동을 이해한다</text><text x="85" y="636" font-size="25" fill="#dceaf6">성능 저하를 난도로 착각하지 않는다</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 관찰로 반증</text><text x="775" y="552" font-size="25" fill="#dceaf6">실수가 늘어난 이유를 묻는다</text><text x="775" y="594" font-size="25" fill="#dceaf6">활동 증가와 이해도 증가를 구분한다</text><text x="775" y="636" font-size="25" fill="#dceaf6">약속을 해치면 수치를 되돌린다</text><text x="60" y="790" font-size="26" fill="#e7d4a2">빠르게 만들기 ≠ 모든 시간 값을 같은 비율로 줄이기</text><text x="60" y="835" font-size="26" fill="#e7d4a2">의도 → 규칙 → 파라미터 → 관찰을 같은 문서에서 연결한다.</text></g></svg>