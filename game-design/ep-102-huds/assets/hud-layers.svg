<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">HUD는 플레이 공간 위의 정보 계약이다</text><rect x="55" y="115" width="990" height="390" rx="12" fill="#1e293b"/><rect x="80" y="140" width="240" height="55" rx="12" fill="#7f1d1d"/><text x="100" y="177" fill="#e2e8f0" font-size="23">체력 75 / 100</text><rect x="750" y="140" width="260" height="55" rx="12" fill="#164e63"/><text x="770" y="177" fill="#e2e8f0" font-size="21">목표: 출구 찾기</text><rect x="80" y="425" width="260" height="55" rx="12" fill="#3730a3"/><text x="100" y="462" fill="#e2e8f0" font-size="21">회피 준비 완료</text><rect x="790" y="370" width="220" height="110" rx="12" fill="#334155"/><text x="825" y="435" fill="#e2e8f0" font-size="22">작은 지도</text><text x="390" y="310" fill="#e2e8f0" font-size="38">플레이 공간</text><text x="340" y="355" fill="#e2e8f0" font-size="21">중요한 행동과 위험을 가리지 않는다</text><text x="55" y="560" fill="#a5b4fc" font-size="21">항상 필요한 정보 / 상황별 정보 / 상세 화면으로 보낼 정보를 구분한다.</text></g></svg>