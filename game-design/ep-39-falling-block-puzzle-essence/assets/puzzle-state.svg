<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>배치 뒤 상태를 한 단계씩 확정한다</title><rect width="1200" height="720" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="50" y="65" font-size="32" font-weight="700">배치 뒤 상태를 한 단계씩 확정한다</text><rect x="50" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="157" fill="#8dd7ff" font-size="26">1. 고정</text><text x="72" y="203" font-size="23">조작 가능한 조각을 보드에 반영</text><text x="72" y="240" font-size="23">충돌·범위 검사는 별도</text><rect x="620" y="115" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="157" fill="#8dd7ff" font-size="26">2. 완성 줄 찾기</text><text x="642" y="203" font-size="23">이번 예제는 mask = 15</text><text x="642" y="240" font-size="23">여러 줄을 함께 판정</text><rect x="50" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="72" y="397" fill="#8dd7ff" font-size="26">3. 생존 줄 압축</text><text x="72" y="443" font-size="23">바닥→위 상대 순서 유지</text><text x="72" y="480" font-size="23">칸별 중력과 다른 규칙</text><rect x="620" y="355" width="530" height="210" rx="16" fill="#20324a" stroke="#5798b8"/><text x="642" y="397" fill="#8dd7ff" font-size="26">4. 다음 선택</text><text x="642" y="443" font-size="23">보상·위험·남은 공간 표시</text><text x="642" y="480" font-size="23">연출과 입력 재개를 구분</text><text x="50" y="665" fill="#b5c8df" font-size="23">4×4 자체 제작 모델이며 특정 작품의 규칙 복제가 아닙니다.</text></g></svg>