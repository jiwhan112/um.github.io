<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img"><title>두 줄을 동시에 지우고 생존 줄의 순서를 보존하기</title><rect width="1100" height="680" rx="24" fill="#101b2d"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#edf4ff"><text x="45" y="65" font-size="30">완성 줄은 지우고, 생존 줄은 순서대로</text><text x="80" y="130" font-size="23">삭제 전: 바닥부터 [15, 5, 15, 8]</text><rect x="80" y="175" width="68" height="68" rx="5" fill="#7cc6ea"/><rect x="155" y="175" width="68" height="68" rx="5" fill="#26384e"/><rect x="230" y="175" width="68" height="68" rx="5" fill="#26384e"/><rect x="305" y="175" width="68" height="68" rx="5" fill="#26384e"/><rect x="80" y="250" width="68" height="68" rx="5" fill="#f7a67d"/><rect x="155" y="250" width="68" height="68" rx="5" fill="#f7a67d"/><rect x="230" y="250" width="68" height="68" rx="5" fill="#f7a67d"/><rect x="305" y="250" width="68" height="68" rx="5" fill="#f7a67d"/><rect x="80" y="325" width="68" height="68" rx="5" fill="#26384e"/><rect x="155" y="325" width="68" height="68" rx="5" fill="#7cc6ea"/><rect x="230" y="325" width="68" height="68" rx="5" fill="#26384e"/><rect x="305" y="325" width="68" height="68" rx="5" fill="#7cc6ea"/><rect x="80" y="400" width="68" height="68" rx="5" fill="#f7a67d"/><rect x="155" y="400" width="68" height="68" rx="5" fill="#f7a67d"/><rect x="230" y="400" width="68" height="68" rx="5" fill="#f7a67d"/><rect x="305" y="400" width="68" height="68" rx="5" fill="#f7a67d"/><text x="80" y="520" font-size="23">위가 상단, 아래가 바닥</text><text x="650" y="130" font-size="23">삭제 후: 바닥부터 [5, 8, 0, 0]</text><rect x="650" y="175" width="68" height="68" rx="5" fill="#26384e"/><rect x="725" y="175" width="68" height="68" rx="5" fill="#26384e"/><rect x="800" y="175" width="68" height="68" rx="5" fill="#26384e"/><rect x="875" y="175" width="68" height="68" rx="5" fill="#26384e"/><rect x="650" y="250" width="68" height="68" rx="5" fill="#26384e"/><rect x="725" y="250" width="68" height="68" rx="5" fill="#2638