<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-label="한국어로 직접 만든 게임 UI 학습 도식"><rect width="1440" height="720" fill="#0b1829"/><text x="50" y="68" font-family="sans-serif" font-size="43" font-weight="bold" fill="#f5fbff">서랍처럼 구성하는 메뉴의 정보 우선순위</text><text x="52" y="112" font-family="sans-serif" font-size="23" fill="#afc8df">직접 만든 가상 화면·실제 게임 스크린샷 아님</text><rect x="49" y="154" width="1341" height="468" rx="16" fill="#1e304a" stroke="#465f80" stroke-width="3"/><text x="84" y="218" font-family="sans-serif" font-size="31" fill="#ecf7ff" font-weight="bold">가장 중요한 행동은 빠르게, 그 외 기능은 찾기 쉽게</text><rect x="91" y="257" width="785" height="143" rx="16" fill="#227e8a" stroke="#95eaf5" stroke-width="3"/><text x="123" y="320" font-family="sans-serif" font-size="44" fill="#fff" font-weight="bold">바로 플레이</text><text x="123" y="370" font-family="sans-serif" font-size="27" fill="#fff">자주 사용하는 핵심 행동</text><rect x="904" y="257" width="440" height="143" rx="16" fill="#31577b" stroke="#465f80" stroke-width="3"/><text x="940" y="320" font-family="sans-serif" font-size="38" fill="#fff" font-weight="bold">이어하기</text><rect x="91" y="432" width="610" height="134" rx="16" fill="#345071" stroke="#465f80" stroke-width="3"/><text x="124" y="490" font-family="sans-serif" font-size="35" fill="#fff" font-weight="bold">모드 · 콘텐츠</text><rect x="733" y="432" width="611" height="134" rx="16" fill="#413d5a" stroke="#465f80" stroke-width="3"/><text x="771" y="490" font-family="sans-serif" font-size="34" fill="#fff" font-weight="bold">옵션 · 도움말</text><rect x="48" y="650" width="1342" height="51" rx="16" fill="#2a415e" stroke="#2a415e" stroke-width="3"/><text x="78" y="684" font-family="sans-serif" font-size="26" fill="#fff">버튼의 크기가 달라지면 패드 이동과 번역 길이도 다시 설계한다.</text></svg>