<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">점수를 읽는 방식: 합계와 행동의 연결</text><rect x="50" y="130" width="440" height="340" rx="12" fill="#1e293b"/><text x="80" y="180" fill="#e2e8f0" font-size="26">합계만 보여 주기</text><text x="150" y="325" fill="#e2e8f0" font-size="64">1,250</text><rect x="550" y="130" width="500" height="340" rx="12" fill="#1e293b"/><text x="580" y="180" fill="#e2e8f0" font-size="26">이유를 함께 보여 주기</text><text x="580" y="245" fill="#e2e8f0" font-size="23">목표 달성</text><text x="930" y="245" fill="#67e8f9" font-size="23">800</text><text x="580" y="310" fill="#e2e8f0" font-size="23">구조 보너스</text><text x="930" y="310" fill="#a5b4fc" font-size="23">300</text><text x="580" y="375" fill="#e2e8f0" font-size="23">시간 보너스</text><text x="930" y="375" fill="#fbbf24" font-size="23">150</text><text x="55" y="550" fill="#a5b4fc" font-size="23">같은 합계라도 “무엇을 잘했는가”를 알 수 있는지는 다르다.</text><text x="55" y="590" fill="#e2e8f0" font-size="20">점수·항목·수치는 가상 예시이며 실제 게임 결과가 아니다.</text></g></svg>