<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="녹색 기본 진행 경로와 주황색 선택 능력 보상 경로가 마지막 출구에 합류하는 추상 지도"><rect width="1200" height="680" rx="26" fill="#121b2f"/><text x="56" y="75" text-anchor="start" font-size="36" font-weight="700" fill="#fff" font-family="sans-serif">스테이지를 두 방식으로 설계하기</text><rect x="60" y="146" width="1080" height="425" rx="18" fill="#1d2e47" stroke="#526788" stroke-width="3"/><rect x="88" y="372" width="1024" height="164" rx="18" fill="#18483f" stroke="#245c53" stroke-width="3"/><rect x="88" y="196" width="1024" height="138" rx="18" fill="#53412d" stroke="#725d3d" stroke-width="3"/><path d="M170 455 H975" stroke="#91f0bf" stroke-width="13" stroke-linecap="round"/><path d="M170 455 V263 H965 V455" stroke="#ffd08d" stroke-width="10" stroke-dasharray="15 11" fill="none"/><circle cx="171" cy="455" r="39" fill="#96c3ff" stroke="#f1fbff" stroke-width="3"/><text x="171" y="462" text-anchor="middle" font-size="24" font-weight="700" fill="#152947" font-family="sans-serif">시작</text><rect x="403" y="422" width="88" height="68" rx="18" fill="#fb8f92" stroke="#ffd3d0" stroke-width="3"/><text x="447" y="463" text-anchor="middle" font-size="28" font-weight="700" fill="#47171c" font-family="sans-serif">적</text><rect x="682" y="421" width="100" height="71" rx="18" fill="#eeb38c" stroke="#fddcb6" stroke-width="3"/><text x="732" y="464" text-anchor="middle" font-size="25" font-weight="700" fill="#562919" font-family="sans-serif">장애</text><rect x="505" y="231" width="158" height="66" rx="18" fill="#dcac62" stroke="#ffe0a6" stroke-width="3"/><text x="584" y="272" text-anchor="middle" font-size="25" font-weight="700" fill="#3c2711" font-family="sans-serif">능력 활용</text><text x="820" y="280" text-anchor="middle" font-size="27" font-weight="700" fill="#fff1af" font-family="sans-serif">★ 추가 보상</text><rect x="983" y="417" width="108" height="76" rx="18" fill="#9d8dec" stroke="#d4c6ff" stroke-width="3"/><text x="1037" y="465" text-anchor="middle" font-size="27" font-weight="700" fill="#191337" font-family="sans-serif">출구</text><text x="322" y="519" text-anchor="middle" font-size="23" font-weight="400" fill="#e0ffec" font-family="sans-serif">기본 행동으로 진행</text><text x="288" y="184" text-anchor="middle" font-size="23" font-weight="400" fill="#ffe3b1" font-family="sans-serif">선택 능력 지름길</text><rect x="60" y="594" width="1080" height="62" rx="18" fill="#22344d" stroke="none" stroke-width="3"/><text x="599" y="633" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf3ff" font-family="sans-serif">원칙: 주 경로가 막히지 않도록, 카피 능력은 선택의 깊이를 추가한다.</text></svg>
