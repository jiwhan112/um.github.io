<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="기본 동작만으로 진행하는 경로와 카피를 탐구하는 선택 경로가 공통 목표에서 만나는 그림"><rect width="1200" height="680" rx="26" fill="#121b2f"/><text x="56" y="75" text-anchor="start" font-size="36" font-weight="700" fill="#fff" font-family="sans-serif">기본 완주와 선택적 숙련의 두 층</text><rect x="60" y="182" width="255" height="125" rx="18" fill="#244c62" stroke="#80dbef" stroke-width="3"/><text x="187" y="229" text-anchor="middle" font-size="29" font-weight="700" fill="#fff" font-family="sans-serif">같은 시작점</text><text x="187" y="269" text-anchor="middle" font-size="23" font-weight="400" fill="#eaf3ff" font-family="sans-serif">이동 · 적 흡입</text><path d="M315 235 L378 235" stroke="#9cc8ff" stroke-width="6" /><path d="M363 224 L378 235 L363 246" stroke="#9cc8ff" stroke-width="5" fill="none"/><rect x="380" y="178" width="395" height="125" rx="18" fill="#1c554b" stroke="#8dedbe" stroke-width="3"/><text x="577" y="225" text-anchor="middle" font-size="29" font-weight="700" fill="#fff" font-family="sans-serif">기본 경로</text><text x="577" y="267" text-anchor="middle" font-size="23" font-weight="400" fill="#eaf3ff" font-family="sans-serif">흡입 → 발사 → 진행</text><path d="M775 235 L907 235" stroke="#9cc8ff" stroke-width="6" /><path d="M892 224 L907 235 L892 246" stroke="#9cc8ff" stroke-width="5" fill="none"/><rect x="913" y="173" width="225" height="140" rx="18" fill="#51416d" stroke="#d7b2ff" stroke-width="3"/><text x="1025" y="229" text-anchor="middle" font-size="29" font-weight="700" fill="#fff" font-family="sans-serif">공통 목표</text><text x="1025" y="267" text-anchor="middle" font-size="22" font-weight="400" fill="#eaf3ff" font-family="sans-serif">스테이지 완료</text><path d="M187 307 V452 H369" stroke="#ffd28d" stroke-width="6" fill="none" stroke-dasharray="12 10"/><rect x="380" y="386" width="395" height="130" rx="18" fill="#634826" stroke="#ffd28d" stroke-width="3"/><text x="577" y="436" text-anchor="middle" font-size="29" font-weight="700" fill="#fff" font-family="sans-serif">선택적 숙련</text><text x="577" y="476" text-anchor="middle" font-size="23" font-weight="400" fill="#eaf3ff" font-family="sans-serif">카피 획득 → 능력 활용</text><path d="M775 452 H855 V325 H1025 V313" stroke="#ffd28d" stroke-width="6" fill="none" stroke-dasharray="12 10"/><rect x="60" y="563" width="1078" height="78" rx="18" fill="#1d2d48" stroke="none" stroke-width="3"/><text x="599" y="609" text-anchor="middle" font-size="23" font-weight="400" fill="#eaf3ff" font-family="sans-serif">핵심: 누구나 같은 목표에 도달하고, 원하면 더 깊게 탐구할 수 있다.</text></svg>
