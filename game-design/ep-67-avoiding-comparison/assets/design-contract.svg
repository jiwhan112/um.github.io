<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">비교를 피하기</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">비교를 피하기</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 익숙한 기준</text><text x="85" y="292" font-size="25" fill="#dceaf6">무엇을 빠르게 이해시키는가?</text><text x="85" y="334" font-size="25" fill="#dceaf6">비유가 가져오는 기대를 적음</text><text x="85" y="376" font-size="25" fill="#dceaf6">장르 이름만으로 명세하지 않음</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 다른 행동</text><text x="775" y="292" font-size="25" fill="#dceaf6">목표·역할·선택 중 무엇이 다른가?</text><text x="775" y="334" font-size="25" fill="#dceaf6">새 기능이 만든 결정을 관찰</text><text x="775" y="376" font-size="25" fill="#dceaf6">겉모습의 차이와 구별</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 작은 증거</text><text x="85" y="552" font-size="25" fill="#dceaf6">핵심 차이 하나만 구현</text><text x="85" y="594" font-size="25" fill="#dceaf6">설명 전후의 이해를 비교</text><text x="85" y="636" font-size="25" fill="#dceaf6">완성품 품질과 가설을 분리</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 정직한 평가</text><text x="775" y="552" font-size="25" fill="#dceaf6">내 약속에 맞는 질문을 사용</text><text x="775" y="594" font-size="25" fill="#dceaf6">비교 대상의 장점도 인정</text><text x="775" y="636" font-size="25" fill="#dceaf6">검증 회피를 독창성이라 부르지 않음</text><text x="60" y="790" font-size="26" fill="#e7d4a2">익숙한 비유는 다리다. 목적지의 규칙까지 대신 정하게 두지 않는다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">“처음 보는가?”와 “의미 있는 선택이 생기는가?”를 함께 묻는다.</text></g></svg>