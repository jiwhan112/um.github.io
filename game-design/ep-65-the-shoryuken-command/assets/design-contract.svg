<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">승룡권 커맨드</title><desc id="desc">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</desc><rect width="1440" height="900" fill="#0e1b30"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="60" y="80" font-size="38" fill="#dceaf6" font-weight="700">승룡권 커맨드</text><text x="60" y="132" font-size="24" fill="#dceaf6">직접 만든 학습 도식 · 원본 영상의 장면이나 규칙을 재현하지 않음</text><rect x="60" y="190" width="630" height="230" rx="18" fill="#23465c"/><text x="85" y="242" font-size="30" fill="#dceaf6" font-weight="700">① 의도</text><text x="85" y="292" font-size="25" fill="#dceaf6">어떤 상황에서 기술을 고르는가?</text><text x="85" y="334" font-size="25" fill="#dceaf6">준비 중 다른 선택은 가능한가?</text><text x="85" y="376" font-size="25" fill="#dceaf6">위력만으로 가치를 판단하지 않음</text><rect x="750" y="190" width="630" height="230" rx="18" fill="#22524f"/><text x="775" y="242" font-size="30" fill="#dceaf6" font-weight="700">② 인식</text><text x="775" y="292" font-size="25" fill="#dceaf6">방향 순서와 시간 창을 명시</text><text x="775" y="334" font-size="25" fill="#dceaf6">누적 입력과 동시 입력을 구별</text><text x="775" y="376" font-size="25" fill="#dceaf6">오입력과 오발동을 따로 관찰</text><rect x="60" y="450" width="630" height="230" rx="18" fill="#453c58"/><text x="85" y="502" font-size="30" fill="#dceaf6" font-weight="700">③ 실행</text><text x="85" y="552" font-size="25" fill="#dceaf6">인식 성공과 발동 허용은 다름</text><text x="85" y="594" font-size="25" fill="#dceaf6">상태·자원·우선순위를 검사</text><text x="85" y="636" font-size="25" fill="#dceaf6">한 입력을 중복 소비하지 않음</text><rect x="750" y="450" width="630" height="230" rx="18" fill="#4c4931"/><text x="775" y="502" font-size="30" fill="#dceaf6" font-weight="700">④ 피드백</text><text x="775" y="552" font-size="25" fill="#dceaf6">어떤 단계에서 실패했는가?</text><text x="775" y="594" font-size="25" fill="#dceaf6">연습에서는 입력 기록을 제공</text><text x="775" y="636" font-size="25" fill="#dceaf6">실전 화면은 필요한 정보만</text><text x="60" y="790" font-size="26" fill="#e7d4a2">입력 난도는 조절 축 하나다. 곧바로 깊이나 공정성을 뜻하지 않는다.</text><text x="60" y="835" font-size="26" fill="#e7d4a2">관대함의 효과는 성공률과 의도치 않은 발동을 함께 보며 평가한다.</text></g></svg>