<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#111827"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="40" y="55" fill="#f8fafc" font-size="29" font-weight="bold">수치 성장 없이도 설계할 수 있는 보상</text><rect x="370" y="245" width="360" height="100" rx="12" fill="#0e7490"/><text x="400" y="305" fill="#e2e8f0" font-size="27">핵심 대전 규칙 유지</text><rect x="55" y="110" width="300" height="100" rx="12" fill="#3730a3"/><text x="75" y="168" fill="#e2e8f0" font-size="23">표현: 꾸미기·연출</text><rect x="745" y="110" width="300" height="100" rx="12" fill="#164e63"/><text x="765" y="168" fill="#e2e8f0" font-size="23">기록: 성장의 흔적</text><rect x="55" y="410" width="300" height="100" rx="12" fill="#164e63"/><text x="75" y="468" fill="#e2e8f0" font-size="23">탐색: 새 관점·정보</text><rect x="745" y="410" width="300" height="100" rx="12" fill="#3730a3"/><text x="765" y="468" fill="#e2e8f0" font-size="23">목표: 선택 도전</text><line x1="355" y1="185" x2="400" y2="245" stroke="#a5b4fc" stroke-width="4"/><line x1="745" y1="185" x2="700" y2="245" stroke="#a5b4fc" stroke-width="4"/><line x1="355" y1="435" x2="400" y2="345" stroke="#a5b4fc" stroke-width="4"/><line x1="745" y1="435" x2="700" y2="345" stroke="#a5b4fc" stroke-width="4"/><text x="55" y="575" fill="#a5b4fc" font-size="21">보상이 핵심 규칙을 바꾸는지, 다른 만족을 주는지 분리해 검토한다.</text></g></svg>